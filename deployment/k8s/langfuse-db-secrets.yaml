# ── langfuse-db-secrets ────────────────────────────────────────────────────────
# Kubernetes Secret holding database connection strings for Langfuse web and
# worker pods.  Previously these were hardcoded plaintext values in the
# Deployment manifests (C-5 remediation).
#
# IMPORTANT: This file is a TEMPLATE.  The base64-encoded values below are
# placeholders.  Before applying, populate real values using one of:
#
#   Option A — kubectl create secret (recommended for CI/CD):
#     kubectl create secret generic langfuse-db-secrets \
#       --namespace=governance-stack \
#       --from-literal=database-url="postgresql://langfuse:<PG_PASSWORD>@postgresql.governance-stack.svc.cluster.local:5432/langfuse" \
#       --from-literal=clickhouse-password="<CLICKHOUSE_PASSWORD>" \
#       --from-literal=clickhouse-migration-url="clickhouse://default:<CLICKHOUSE_PASSWORD>@clickhouse.governance-stack.svc.cluster.local:9000" \
#       --from-literal=redis-connection-string="redis://:<REDIS_PASSWORD>@redis.governance-stack.svc.cluster.local:6379"
#
#   Option B — Terraform app_secrets module (already wires these values from
#     module.postgres.connection_string, module.clickhouse.password, and
#     module.redis.password at plan time).
#
# The Terraform gcp-gke target creates this secret via the app_secrets module.
# This manifest is provided for manual / agnostic-target deployments only.
# ──────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Secret
metadata:
  name: langfuse-db-secrets
  namespace: governance-stack
  labels:
    app: langfuse
    managed-by: cage
    # IA-5(1): sensitivity classification required by lula-validation-ia5.yaml
    cage.io/sensitivity-level: high
  annotations:
    # IA-5(1): rotation schedule required by lula-validation-ia5.yaml
    cage.io/rotation-schedule: "90d"
    cage.io/rotation-owner: "platform-team"
type: Opaque
# stringData accepts plaintext — kubectl will base64-encode on apply.
# Replace all <PLACEHOLDER> values before applying.
stringData:
  # PostgreSQL connection string for Langfuse metadata store
  database-url: "postgresql://langfuse:<PG_PASSWORD>@postgresql.governance-stack.svc.cluster.local:5432/langfuse"

  # ClickHouse OLAP password (used by both web and worker)
  clickhouse-password: "<CLICKHOUSE_PASSWORD>"

  # ClickHouse migration URL (used by langfuse-web for schema migrations)
  clickhouse-migration-url: "clickhouse://default:<CLICKHOUSE_PASSWORD>@clickhouse.governance-stack.svc.cluster.local:9000"

  # Redis connection string (used by both web and worker for queuing)
  redis-connection-string: "redis://:<REDIS_PASSWORD>@redis.governance-stack.svc.cluster.local:6379"
