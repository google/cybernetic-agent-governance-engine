apiVersion: v1
kind: ConfigMap
metadata:
  name: cage-redis-config
  namespace: governance-stack
  labels:
    app: redis
    tier: control-plane
    cage.governance/component: evidence-state-store
data:
  redis.conf: |
    # ── Networking & Security ─────────────────────────────────────────────
    bind 0.0.0.0
    protected-mode yes
    port 6379

    # Authentication — sourced from advisor-secrets/REDIS_PASSWORD
    # Password is injected via the container command override below;
    # redis.conf requirepass is set at runtime by the entrypoint.

    # ── Memory Management ─────────────────────────────────────────────────
    # Hard cap at 4GB — adjust based on node pool memory profiling.
    # The existing redis-stack-server defaults to no maxmemory (unlimited),
    # which is dangerous in a shared GKE node pool.
    maxmemory 4gb

    # CRITICAL CAGE INVARIANT: Hard-fail writes when maxmemory is hit.
    # Never evict active, frozen agent transaction states in db=1.
    # This guarantees that deferred gating tokens survive memory pressure.
    maxmemory-policy noeviction

    # ── Persistence (AOF for durability) ──────────────────────────────────
    # AOF provides write durability without blocking the hot-path.
    # fsync every second balances durability vs throughput.
    appendonly yes
    appendfsync everysec
    no-appendfsync-on-rewrite yes
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb

    # ── Database Namespace Separation ─────────────────────────────────────
    # db 0 = LangGraph checkpoints (volatile, recoverable)
    # db 1 = Evidence stream + deferred gating tokens (high-assurance)
    databases 16

    # ── Dangerous Command Lockdown ────────────────────────────────────────
    # Disable runtime reconfiguration that could break the security envelope.
    # These commands are renamed to empty strings, making them unavailable.
    rename-command FLUSHDB ""
    rename-command FLUSHALL ""
    rename-command CONFIG ""

    # ── Logging ───────────────────────────────────────────────────────────
    loglevel notice
    logfile ""
