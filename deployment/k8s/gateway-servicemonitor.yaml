apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: stera-gateway-monitor
  namespace: governance-stack
  labels:
    release: prometheus
    app: gateway
spec:
  selector:
    matchLabels:
      app: gateway
  endpoints:
  - port: metrics
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
---
# GKE Managed Service for Prometheus (GMP) native scrape resource.
# GMP is enabled on the cluster via monitoring_config.managed_prometheus in
# infra/modules/gcp_gke_cluster/main.tf. Targets the dedicated out-of-band
# Prometheus WSGI HTTP server on port 9090 (named 'metrics'), which bypasses
# the Linkerd inbound proxy (config.linkerd.io/skip-inbound-ports: "9090") and
# runs on its own thread so scrapes succeed even when the asyncio loop blocks.
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: gateway-metrics
  namespace: governance-stack
  labels:
    app: gateway
spec:
  selector:
    matchLabels:
      app: gateway
  endpoints:
  - port: metrics
    path: /metrics
    interval: 15s
    timeout: 10s
