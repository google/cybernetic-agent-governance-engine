apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: governance-stack
  labels:
    app: redis
    cage.governance/component: evidence-state-store
    # IA-5(1): sensitivity classification required by lula-validation-ia5.yaml
    cage.io/sensitivity-level: high
  annotations:
    compliance.nist.gov/control: "IA-5,SC-28"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    # IA-5(1): rotation schedule required by lula-validation-ia5.yaml
    # (renamed from cage.io/secret-rotation to match the canonical annotation key)
    cage.io/rotation-schedule: "90d"
    cage.io/rotation-owner: "platform-team"
    cage.io/managed-by: "gcp-secret-manager"
type: Opaque
stringData:
  # PLACEHOLDER — replace with actual secret before applying.
  # In production, use External Secrets Operator or kubectl create secret.
  redis-password: "REPLACE_WITH_STRONG_RANDOM_PASSWORD_MIN_32_CHARS"
