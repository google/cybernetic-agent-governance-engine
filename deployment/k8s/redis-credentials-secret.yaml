# =============================================================================
# H-13: Redis requirepass — Kubernetes Secret
# =============================================================================
#
# This Secret holds the Redis authentication password.  The StatefulSet mounts
# it as an environment variable; the redis.conf ConfigMap references it via
# the $(REDIS_PASSWORD) substitution in the container command args.
#
# IMPORTANT: Do NOT commit a real password here.  This file is a template.
# Populate the secret before applying:
#
#   kubectl create secret generic redis-credentials \
#     --namespace governance-stack \
#     --from-literal=redis-password="$(openssl rand -base64 48)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Or use External Secrets Operator to sync from GCP Secret Manager:
#   gcloud secrets create redis-password --replication-policy=automatic
#   gcloud secrets versions add redis-password --data-file=<(openssl rand -base64 48)
#
# NIST SP 800-53: IA-5 (Authenticator Management), SC-28 (Protection at Rest)
# ISO 42001: A.8.4 (AI System Operation)
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: governance-stack
  labels:
    app: redis
    cage.governance/component: evidence-state-store
  annotations:
    compliance.nist.gov/control: "IA-5,SC-28"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    cage.io/secret-rotation: "90d"
    cage.io/managed-by: "gcp-secret-manager"
type: Opaque
stringData:
  # PLACEHOLDER — replace with actual secret before applying.
  # In production, use External Secrets Operator or kubectl create secret.
  redis-password: "REPLACE_WITH_STRONG_RANDOM_PASSWORD_MIN_32_CHARS"
