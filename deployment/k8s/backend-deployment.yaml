apiVersion: apps/v1
kind: Deployment
metadata:
  name: governed-financial-advisor
  namespace: governance-stack
  labels:
    app: governed-financial-advisor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: governed-financial-advisor
  template:
    metadata:
      labels:
        app: governed-financial-advisor
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: cage-advisor-sa
      containers:
        # Main Agent Container
        - name: governed-financial-advisor
          # Set IMAGE_REGISTRY to your container registry prefix (e.g. gcr.io/your-project, ghcr.io/your-org)
          # Override with: kubectl set image deployment/governed-financial-advisor governed-financial-advisor=<your-registry>/governed-financial-advisor:latest
          # Or use kustomize: kustomize edit set image gcr.io/YOUR_PROJECT_ID/governed-financial-advisor=<your-registry>/governed-financial-advisor:latest
          # IMAGE_REGISTRY can be overridden via kustomize or helm values (default: gcr.io)
          image: gcr.io/YOUR_PROJECT_ID/governed-financial-advisor:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
          env:
            - name: CAGE_DOMAIN
              value: "finance"
            - name: USE_MOCK_LLM
              value: "false"
            - name: PORT
              value: "8080"
            - name: GATEWAY_URL
              value: "http://gateway.governance-stack.svc.cluster.local:8080"
            - name: LANGCHAIN_TRACING_V2
              value: "false"
            - name: LANGSMITH_TRACING
              value: "false"
            - name: GOOGLE_CLOUD_PROJECT
              value: ""  # Set to your GCP project ID
            - name: GOOGLE_CLOUD_LOCATION
              value: "us-central1"
            - name: VLLM_BASE_URL
              value: "http://vllm-service.governance-stack.svc.cluster.local:8000/v1"
            - name: OPENAI_API_BASE
              value: "http://vllm-service.governance-stack.svc.cluster.local:8000/v1"
            - name: OPENAI_API_KEY
              value: "EMPTY"
            - name: VLLM_API_KEY
              value: "EMPTY"
            - name: VLLM_REASONING_API_BASE
              value: "http://vllm-reasoning.governance-stack.svc.cluster.local:8000/v1"
            - name: OPA_URL
              value: "http://opa-service.governance-stack.svc.cluster.local:8181"
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_URL

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: governed-financial-advisor
  namespace: governance-stack
spec:
  type: ClusterIP
  selector:
    app: governed-financial-advisor
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
