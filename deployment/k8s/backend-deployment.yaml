apiVersion: apps/v1
kind: Deployment
metadata:
  name: governed-financial-advisor
  namespace: governance-stack
  labels:
    app: governed-financial-advisor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: governed-financial-advisor
  template:
    metadata:
      labels:
        app: governed-financial-advisor
    spec:
      serviceAccountName: financial-advisor-sa
      volumes:
        - name: policy-volume
          secret:
            secretName: finance-policy-rego
        - name: opa-config-volume
          secret:
            secretName: opa-configuration
      containers:
        # Main Agent Container
        - name: governed-financial-advisor
          # Set IMAGE_REGISTRY to your container registry prefix (e.g. gcr.io/your-project, ghcr.io/your-org)
          # Override with: kubectl set image deployment/governed-financial-advisor governed-financial-advisor=<your-registry>/governed-financial-advisor:latest
          # Or use kustomize: kustomize edit set image gcr.io/YOUR_PROJECT_ID/governed-financial-advisor=<your-registry>/governed-financial-advisor:latest
          # IMAGE_REGISTRY can be overridden via kustomize or helm values (default: gcr.io)
          image: gcr.io/YOUR_PROJECT_ID/governed-financial-advisor:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: USE_MOCK_LLM
              value: "false"
            - name: PORT
              value: "8080"
            - name: GOOGLE_CLOUD_PROJECT
              value: ""  # Set to your GCP project ID
            - name: GOOGLE_CLOUD_LOCATION
              value: "us-central1"
            - name: VLLM_BASE_URL
              value: "http://vllm-service.governance-stack.svc.cluster.local:8000/v1"
            - name: OPENAI_API_BASE
              value: "http://vllm-service.governance-stack.svc.cluster.local:8000/v1"
            - name: OPENAI_API_KEY
              value: "EMPTY"
            - name: VLLM_API_KEY
              value: "EMPTY"
            - name: VLLM_REASONING_API_BASE
              value: "http://vllm-reasoning.governance-stack.svc.cluster.local:8000/v1"
            - name: OPA_URL
              value: "http://opa-service:8181/v1/data/trade/governance"
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_URL

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"



        # OPA Sidecar
        - name: opa
          image: openpolicyagent/opa:0.68.0-static
          ports:
            - containerPort: 8181
          args:
            - "run"
            - "--server"
            - "--addr=localhost:8181"
            - "--config-file=/config/opa_config.yaml"
            - "/policies/finance_policy.rego"
          volumeMounts:
            - name: policy-volume
              mountPath: /policies
              readOnly: true
            - name: opa-config-volume
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: governed-financial-advisor
  namespace: governance-stack
spec:
  type: ClusterIP
  selector:
    app: governed-financial-advisor
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
