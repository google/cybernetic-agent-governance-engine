apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: governance-stack
  labels:
    app: clickhouse
spec:
  ports:
  - port: 8123
    name: http
  - port: 9000
    name: tcp
  clusterIP: None
  selector:
    app: clickhouse
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: governance-stack
spec:
  serviceName: "clickhouse"
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      # §3, §7: ClickHouse runs on the dedicated local-SSD clickhouse node pool
      # (tainted workload=clickhouse:NoSchedule) and NEVER on general or Spot nodes.
      tolerations:
      - key: workload
        operator: Equal
        value: clickhouse
        effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: workload
                operator: In
                values:
                - clickhouse
              - key: cloud.google.com/gke-spot
                operator: NotIn
                values:
                - "true"
      # PSA restricted compliance: pod-level security context

      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:24.3
        # PSA restricted compliance: container-level security context
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          runAsUser: 101
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: advisor-secrets
              key: CLICKHOUSE_PASSWORD
        - name: CLICKHOUSE_EVIDENCE_SINK_PASSWORD
          valueFrom:
            secretKeyRef:
              name: clickhouse-evidence-sink
              key: CLICKHOUSE_PASSWORD
        ports:
        - containerPort: 8123
          name: http
        - containerPort: 9000
          name: tcp
        livenessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: clickhouse-storage
          mountPath: /var/lib/clickhouse
        - name: clickhouse-users-config
          mountPath: /etc/clickhouse-server/users.d/networks.xml
          subPath: networks.xml
        - name: clickhouse-users-config
          mountPath: /etc/clickhouse-server/users.d/evidence_sink_user.xml
          subPath: evidence_sink_user.xml
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "3000m"
            memory: "6Gi"
      volumes:
      - name: clickhouse-users-config
        configMap:
          name: clickhouse-users-config
  volumeClaimTemplates:
  - metadata:
      name: clickhouse-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 20Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clickhouse-pdb
  namespace: governance-stack
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: clickhouse
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-users-config
  namespace: governance-stack
data:
  networks.xml: |
    <clickhouse>
      <users>
        <default>
          <networks>
            <ip>0.0.0.0/0</ip>
            <ip>::/0</ip>
          </networks>
        </default>
      </users>
    </clickhouse>
  # §7.2 / §7.3: least-privilege writer for src/compliance_bridge/clickhouse_sink.py.
  # INSERT on cage_evidence.evidence_stream only; DDL forbidden by a CONST
  # constraint. MV pushes run under the view DEFINER. Password from pod env.
  evidence_sink_user.xml: |
    <clickhouse>
      <profiles>
        <evidence_writer_profile>
          <readonly>0</readonly>
          <allow_ddl>0</allow_ddl>
          <mutations_sync>0</mutations_sync>
          <max_partitions_per_insert_block>8</max_partitions_per_insert_block>
          <max_execution_time>30</max_execution_time>
          <constraints>
            <allow_ddl><const/></allow_ddl>
            <mutations_sync><const/></mutations_sync>
          </constraints>
        </evidence_writer_profile>
      </profiles>
      <users>
        <cage_evidence_sink>
          <password from_env="CLICKHOUSE_EVIDENCE_SINK_PASSWORD"/>
          <profile>evidence_writer_profile</profile>
          <quota>default</quota>
          <access_management>0</access_management>
          <networks>
            <ip>::/0</ip>
          </networks>
          <grants>
            <query>GRANT INSERT ON cage_evidence.evidence_stream</query>
          </grants>
        </cage_evidence_sink>
      </users>
    </clickhouse>

