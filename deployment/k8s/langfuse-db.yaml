apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: governance-stack
  labels:
    app: clickhouse
spec:
  ports:
  - port: 8123
    name: http
  - port: 9000
    name: tcp
  clusterIP: None
  selector:
    app: clickhouse
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: governance-stack
spec:
  serviceName: "clickhouse"
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      # Persistence Safeguard: Use On-Demand nodes (NOT Spot)
      # Persistence Safeguard: Use On-Demand nodes (NOT Spot)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: cloud.google.com/gke-spot
                operator: NotIn
                values:
                - "true"
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:24.3
        env:
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: advisor-secrets
              key: CLICKHOUSE_PASSWORD
        ports:
        - containerPort: 8123
          name: http
        - containerPort: 9000
          name: tcp
        livenessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: clickhouse-storage
          mountPath: /var/lib/clickhouse
        - name: clickhouse-users-config
          mountPath: /etc/clickhouse-server/users.d/networks.xml
          subPath: networks.xml
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "3000m"
            memory: "6Gi"
      volumes:
      - name: clickhouse-users-config
        configMap:
          name: clickhouse-users-config
  volumeClaimTemplates:
  - metadata:
      name: clickhouse-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 20Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clickhouse-pdb
  namespace: governance-stack
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: clickhouse
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-users-config
  namespace: governance-stack
data:
  networks.xml: |
    <clickhouse>
      <users>
        <default>
          <networks>
            <ip>0.0.0.0/0</ip>
            <ip>::/0</ip>
          </networks>
        </default>
      </users>
    </clickhouse>

