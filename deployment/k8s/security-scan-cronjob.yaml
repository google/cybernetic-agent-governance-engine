# D-06: PSA-compliant Trivy security-scan CronJob
# Runs weekly (Sunday 03:00 UTC) to scan the CAGE gateway image for CVEs.
# Complies with RA-5 (Vulnerability Scanning) control.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: security-scanner-cronjob
  namespace: governance-stack
  labels:
    app: security-scanner
    compliance: ra-5
spec:
  schedule: "0 3 * * 0"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: security-scanner
            compliance: ra-5
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trivy-scanner
              image: aquasec/trivy:0.51.4
              command:
                - trivy
                - image
                - "--format"
                - json
                - "--output"
                - /tmp/scan-results.json
                - gcr.io/laah-cybernetics/gateway:latest
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp-dir
                  mountPath: /tmp
                - name: cache-dir
                  mountPath: /.cache
          volumes:
            - name: tmp-dir
              emptyDir: {}
            - name: cache-dir
              emptyDir: {}
