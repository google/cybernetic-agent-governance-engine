apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: governance-stack
  labels:
    app: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    # Scale on event-loop saturation exported via GKE Managed Prometheus (GMP)
    # on port 9090 (see gateway-servicemonitor.yaml), never on CPU utilization
    # (which remains low when an asyncio loop is blocked on I/O or GIL stalls).
    - type: Pods
      pods:
        metric:
          name: prometheus.googleapis.com|cage_event_loop_lag_seconds|gauge
        target:
          type: AverageValue
          averageValue: 50m
---
# PodDisruptionBudget applies only when running >= 2 replicas (coupled to the
# minReplicas: 2 HPA above; in Terraform, gated by `count = var.replicas >= 2 ? 1 : 0`).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
  namespace: governance-stack
  labels:
    app: gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway
