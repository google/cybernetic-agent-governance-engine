# ============================================================================
# Redis Stack StatefulSet — CAGE v2.0.0 LangGraph Checkpoint Store
# ============================================================================
#
# Standalone redis/redis-stack-server Deployment used for fresh-state
# caching (LangGraph checkpoints, evidence stream).
#
# PodSecurity "restricted:latest" compliance:
#   1. allowPrivilegeEscalation=false  — container securityContext
#   2. capabilities.drop=["ALL"]       — container securityContext
#   3. runAsNonRoot=true               — pod + container securityContext
#   4. seccompProfile.type=RuntimeDefault — pod + container securityContext
#
# Redis Stack Server runs as UID 999 (redis) when launched as non-root.
# The image supports non-root operation; runAsUser/runAsGroup are set
# explicitly to UID 999 to satisfy the restricted policy.
#
# Related:
#   - deployment/k8s/redis-config.yaml (cage-redis-config ConfigMap)
#   - deployment/k8s/redis-credentials-secret.yaml (redis-credentials Secret)
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-stack-fresh
  namespace: governance-stack
  labels:
    app: redis-stack-fresh
    tier: control-plane
    cage.governance/component: redis-stack-fresh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-stack-fresh
  template:
    metadata:
      labels:
        app: redis-stack-fresh
        tier: control-plane
        cage.governance/component: redis-stack-fresh
    spec:
      # ── Pod-level security context ────────────────────────────────────────
      # Satisfies PodSecurity "restricted:latest":
      #   • runAsNonRoot=true  (violation 3)
      #   • seccompProfile     (violation 4)
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis-stack
          image: redis/redis-stack-server:latest
          args:
            - "redis-server"
            - "/usr/local/etc/redis/redis.conf"
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            - "--loadmodule"
            - "/opt/redis-stack/lib/rejson.so"
            - "--loadmodule"
            - "/opt/redis-stack/lib/redisearch.so"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: redis-password
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # ── Container-level security context ───────────────────────────────
          # Satisfies PodSecurity "restricted:latest":
          #   • allowPrivilegeEscalation=false  (violation 1)
          #   • capabilities.drop=["ALL"]       (violation 2)
          #   • runAsNonRoot=true               (violation 3)
          #   • seccompProfile.type=RuntimeDefault (violation 4)
          # runAsUser/runAsGroup set to 999 (redis) because redis-stack-server
          # defaults to root; explicit UID forces non-root execution.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/redis
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: cage-redis-config
            items:
              - key: redis.conf
                path: redis.conf
---
apiVersion: v1
kind: Service
metadata:
  name: redis-stack-fresh
  namespace: governance-stack
  labels:
    app: redis-stack-fresh
    tier: control-plane
    cage.governance/component: redis-stack-fresh
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: redis-stack-fresh
