# -----------------------------------------------------------------------------
# Requires the Linkerd control plane and CRDs. Terraform installs them
# (infra/modules/service_mesh, trust anchor in Google CAS); nothing in
# deployment/k8s/ does. The identity strings below are the l5d-client-id
# format: <sa>.<namespace>.serviceaccount.identity.linkerd.cluster.local.
#
# Workload ServiceAccounts (cage-gateway-sa, cage-compliance-bridge-sa, ...)
# are defined once, with their Workload Identity annotations, in
# deployment/k8s/service-account.yaml (POAM-2026-079). The gateway and the
# compliance bridge pods run as those KSAs, so the SPIFFE identities below
# are the identities the pods actually present.
# -----------------------------------------------------------------------------

---
# -----------------------------------------------------------------------------
# ServiceAccount: cage-opa-sa
# OPA pods run under this SA for SPIFFE identity.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cage-opa-sa
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-identity
  annotations:
    compliance.nist.gov/control: "IA-3,SC-8"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    compliance.nist.gov/last-reviewed: "2026-05-17"
    cage.io/poam: "POAM-007,POAM-011"

---
# -----------------------------------------------------------------------------
# ServiceAccount: cage-nemo-sa
# NeMo Guardrails pods.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cage-nemo-sa
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-identity
  annotations:
    compliance.nist.gov/control: "IA-3,SC-8"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    compliance.nist.gov/last-reviewed: "2026-05-17"
    cage.io/poam: "POAM-007,POAM-011"

---
# =============================================================================
# LINKERD SERVER — OPA Policy Engine (port 8181)
#
# Declares the OPA pod as a named Linkerd Server resource. Only connections
# that satisfy an attached AuthorizationPolicy are permitted; all others are
# dropped at the proxy level before reaching the application port.
#
# API: policy.linkerd.io/v1beta3 (storage version in Linkerd edge-26.9.3)
# =============================================================================
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: opa-server-8181
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-mtls
  annotations:
    compliance.nist.gov/control: "SC-8,IA-3,AC-4"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    compliance.nist.gov/last-reviewed: "2026-05-17"
    cage.io/poam: "POAM-007,POAM-011"
    cage.io/evidence: "linkerd viz authz deployment/opa-service -n governance-stack"
spec:
  podSelector:
    matchLabels:
      app: opa
  port: 8181
  # HTTP/1.1 — OPA REST API. Change to gRPC if OPA is moved behind a gRPC proxy.
  proxyProtocol: HTTP/1

---
# =============================================================================
# LINKERD SERVER — NeMo Guardrails (port 8000)
# =============================================================================
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: nemo-server-8000
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-mtls
  annotations:
    compliance.nist.gov/control: "SC-8,IA-3,AC-4"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    compliance.nist.gov/last-reviewed: "2026-05-17"
    cage.io/poam: "POAM-007"
spec:
  podSelector:
    matchLabels:
      app: nemo-guardrails
  port: 8000
  proxyProtocol: gRPC

---
# =============================================================================
# LINKERD MESHTLS AUTHENTICATION — Gateway → OPA
#
# Specifies which SPIFFE identities are trusted to reach the OPA Server.
# The identity string is derived deterministically from the ServiceAccount:
#   <sa-name>.<namespace>.serviceaccount.identity.linkerd.cluster.local
#
# API: policy.linkerd.io/v1alpha1
# =============================================================================
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: gateway-to-opa-authn
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-mtls
  annotations:
    compliance.nist.gov/control: "SC-8,IA-3"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    compliance.nist.gov/last-reviewed: "2026-05-17"
    cage.io/poam: "POAM-007,POAM-011"
spec:
  identities:
    # CAGE Gateway service account — only authorized caller to OPA
    - "cage-gateway-sa.governance-stack.serviceaccount.identity.linkerd.cluster.local"
    # Compliance Bridge — requires OPA for policy health checks (CA-7 evidence)
    - "cage-compliance-bridge-sa.governance-stack.serviceaccount.identity.linkerd.cluster.local"

---
# =============================================================================
# LINKERD MESHTLS AUTHENTICATION — Gateway → NeMo
# =============================================================================
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: gateway-to-nemo-authn
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-mtls
  annotations:
    compliance.nist.gov/control: "SC-8,IA-3"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    compliance.nist.gov/last-reviewed: "2026-05-17"
spec:
  identities:
    - "cage-gateway-sa.governance-stack.serviceaccount.identity.linkerd.cluster.local"

---
# =============================================================================
# LINKERD AUTHORIZATION POLICY — Authorize gateway → OPA
#
# Binds the MeshTLSAuthentication to the OPA Server resource.
# Effect: Any pod NOT presenting a valid SPIFFE certificate for one of the
# identities listed in gateway-to-opa-authn will have its connection rejected
# at the Linkerd proxy sidecar — before any byte reaches port 8181.
#
# This is the cryptographic enforcement of the Zero-Trust "never trust,
# always verify" principle at the transport layer.
#
# API: policy.linkerd.io/v1alpha1 (the only served AuthorizationPolicy version)
# =============================================================================
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: authorize-gateway-to-opa
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-mtls
  annotations:
    compliance.nist.gov/control: "SC-8,IA-3,AC-3,AC-4"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    compliance.nist.gov/last-reviewed: "2026-05-17"
    cage.io/poam: "POAM-007,POAM-011"
    cage.io/evidence: "linkerd viz authz deployment/opa-service -n governance-stack"
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: opa-server-8181
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: gateway-to-opa-authn

---
# =============================================================================
# LINKERD AUTHORIZATION POLICY — Authorize gateway → NeMo
# =============================================================================
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: authorize-gateway-to-nemo
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-mtls
  annotations:
    compliance.nist.gov/control: "SC-8,IA-3,AC-4"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    compliance.nist.gov/last-reviewed: "2026-05-17"
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: nemo-server-8000
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: gateway-to-nemo-authn

---
# =============================================================================
# GATEWAY (port 8080) — deny by default (POAM-2026-080)
#
# Mirrors infra/modules/gateway/mesh-policy (the Terraform path). Once a
# Server has HTTPRoutes, Linkerd refuses requests that match no route, and a
# route without an AuthorizationPolicy admits nobody:
#   gateway-open   exact open paths                   → any client (probes, scrapers, JWKS readers)
#   gateway-gated  PathPrefix "/" (everything else)   → cage-advisor-sa only
# The gateway repeats this check on l5d-client-id (WorkloadIdentityMiddleware,
# CAGE_TRUSTED_CLIENT_IDENTITIES in gateway.yaml), so deleting these objects
# does not open it. tests/test_gateway_mesh_policy.py keeps the open paths in
# sync with src/gateway/server/workload_identity.py.
# =============================================================================
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: gateway-http
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-mtls
  annotations:
    compliance.nist.gov/control: "SC-8,IA-3,IA-9,AC-3,AC-4"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    cage.io/poam: "POAM-2026-080"
spec:
  podSelector:
    matchLabels:
      app: gateway
  port: http

---
apiVersion: policy.linkerd.io/v1beta3
kind: HTTPRoute
metadata:
  name: gateway-open
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-mtls
spec:
  parentRefs:
    - group: policy.linkerd.io
      kind: Server
      name: gateway-http
  rules:
    - matches:
        - path:
            type: Exact
            value: "/health"
        - path:
            type: Exact
            value: "/healthz"
        - path:
            type: Exact
            value: "/metrics"
        - path:
            type: Exact
            value: "/governance/jwks"
        - path:
            type: Exact
            value: "/governance/.well-known/jwks.json"

---
apiVersion: policy.linkerd.io/v1beta3
kind: HTTPRoute
metadata:
  name: gateway-gated
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-mtls
spec:
  parentRefs:
    - group: policy.linkerd.io
      kind: Server
      name: gateway-http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"

---
apiVersion: policy.linkerd.io/v1alpha1
kind: NetworkAuthentication
metadata:
  name: gateway-any-network
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-mtls
spec:
  networks:
    - cidr: 0.0.0.0/0
    - cidr: ::/0

---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: gateway-open
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-mtls
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: gateway-open
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: NetworkAuthentication
      name: gateway-any-network

---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: gateway-trusted-clients
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-mtls
spec:
  identities:
    # The advisor is the only client of the gated routes. The gateway does
    # not call itself, so its own identity is deliberately absent.
    - "cage-advisor-sa.governance-stack.serviceaccount.identity.linkerd.cluster.local"

---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: gateway-gated
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-mtls
  annotations:
    compliance.nist.gov/control: "SC-8,IA-3,IA-9,AC-3,AC-4"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    cage.io/poam: "POAM-2026-080"
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: gateway-gated
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: gateway-trusted-clients
