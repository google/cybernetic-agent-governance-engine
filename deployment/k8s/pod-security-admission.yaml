---
# Governance Stack Namespace — Restricted Security Profile
# SC-39: All CAGE workloads must run under the restricted PSS profile.
# This blocks: privileged containers, host namespaces, host paths, root users,
# privilege escalation, and requires RuntimeDefault or Localhost seccomp profiles.
apiVersion: v1
kind: Namespace
metadata:
  name: governance-stack
  labels:
    # Pod Security Standards labels — SC-39
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    # Compliance labels
    compliance.nist.gov/control: "SC-39"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    # Existing operational labels preserved
    app.kubernetes.io/managed-by: cage
---
# Langfuse Namespace — Baseline Security Profile
# Langfuse is a third-party observability tool that may run processes as root
# or require capabilities incompatible with the restricted profile.
# Audit and warn at restricted level to surface violations for remediation.
apiVersion: v1
kind: Namespace
metadata:
  name: langfuse
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    compliance.nist.gov/control: "SC-39"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    app.kubernetes.io/managed-by: cage
---
# vLLM Namespace — Baseline Security Profile
# GPU workloads using CUDA drivers may require host-level device access
# (e.g., /dev/nvidia*) and elevated UID. Restricted profile would break CUDA.
# POAM exception: track remediation to restrict further when CUDA operator
# supports non-root GPU access (target: Q3 2026).
apiVersion: v1
kind: Namespace
metadata:
  name: vllm
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    compliance.nist.gov/control: "SC-39"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    app.kubernetes.io/managed-by: cage
