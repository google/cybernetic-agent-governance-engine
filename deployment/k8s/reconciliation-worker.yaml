---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reconciliation-worker
  namespace: governance-stack
  labels:
    app: reconciliation-worker
    app.kubernetes.io/component: compliance-bridge
    app.kubernetes.io/version: "2.1.0"
    cage.io/account-purpose: "ledger-reconciliation"
spec:
  # Run every 5 minutes.  The worker completes a single reconciliation cycle
  # per invocation (run_loop is not used in CronJob mode — see entrypoint).
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid   # Never overlap runs; fail closed on contention.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Fail the job after 4 minutes to avoid overlapping the next 5-minute window.
      activeDeadlineSeconds: 240
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: reconciliation-worker
            cage.io/account-purpose: "ledger-reconciliation"
        spec:
          restartPolicy: OnFailure
          serviceAccountName: financial-advisor-sa
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconciliation-worker
              # Reuse the compliance-bridge image; it ships src/gateway on
              # PYTHONPATH=/app, which contains the GroundTruthReconciler.
              image: ${REGISTRY_URL}/compliance-bridge:latest
              imagePullPolicy: Always
              command:
                - python
                - -m
                - src.gateway.governance.reconciliation.daemon
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
              env:
                # --- Provider ---
                # Label only: GroundTruthReconciler.from_env() always builds the
                # simulated Tier 2 provider (the ledger providers were removed).
                # The value tags reconciliation spans and failure records.
                - name: RECONCILIATION_PROVIDER
                  value: "simulated"

                # --- KMS signing (G8) ---
                # The reconciler signs ground-truth snapshots with its own key,
                # separate from the gateway's KMS_GOVERNANCE_KEY. The gateway
                # trusts only this key (by kid) for ground truth.
                - name: RECONCILER_KMS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: reconciliation-worker-secrets
                      key: reconciler-kms-key

                # --- Redis ---
                - name: REDIS_URL
                  valueFrom:
                    secretKeyRef:
                      name: redis-credentials
                      key: REDIS_URL
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: redis-credentials
                      key: REDIS_PASSWORD

                # --- CAGE deployment region ---
                - name: CAGE_DEPLOYMENT_REGION
                  value: "US_FED"

                # --- OpenTelemetry ---
                - name: OTEL_TRACES_EXPORTER
                  value: "otlp"
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://langfuse-web.governance-stack.svc.cluster.local:3000/api/public/otel/v1/traces"
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: "http/protobuf"
                - name: OTEL_EXPORTER_OTLP_HEADERS
                  valueFrom:
                    secretKeyRef:
                      name: advisor-secrets
                      key: OTEL_EXPORTER_OTLP_HEADERS
                      optional: true

                # --- Reconciliation tuning ---
                - name: RECONCILIATION_POLL_INTERVAL_SECONDS
                  value: "60"
                - name: RECONCILIATION_TTL_SECONDS
                  value: "300"
                # Single-shot mode: exit after one cycle (CronJob invocation)
                - name: RECONCILIATION_SINGLE_SHOT
                  value: "true"

              resources:
                requests:
                  cpu: "25m"
                  memory: "128Mi"
                limits:
                  cpu: "100m"
                  memory: "256Mi"

              # Writable tmp volume required for read-only root filesystem.
              volumeMounts:
                - name: tmp-dir
                  mountPath: /tmp

          volumes:
            - name: tmp-dir
              emptyDir: {}

---
# reconciliation-worker-secrets
#
# Secret template — do NOT commit real values. Populate with
# deployment/scripts/setup_reconciliation_secret.sh or directly:
#
#   kubectl create secret generic reconciliation-worker-secrets \
#     --namespace=governance-stack \
#     --from-literal=reconciler-kms-key=projects/<PROJECT>/locations/<REGION>/keyRings/<RING>/cryptoKeys/<KEY>/cryptoKeyVersions/<N>
apiVersion: v1
kind: Secret
metadata:
  name: reconciliation-worker-secrets
  namespace: governance-stack
  labels:
    app: reconciliation-worker
    cage.io/account-purpose: "ledger-reconciliation"
type: Opaque
# stringData is intentionally absent — all values must be populated out-of-band.
# stringData:
#   reconciler-kms-key: ""              # REQUIRED

# L7 FQDN overlay for this worker lives in deployment/k8s/cilium/reconciliation-worker-egress.yaml
# Apply that file separately on GKE Dataplane V2 clusters.
# On non-Cilium clusters the networking.k8s.io/v1 NetworkPolicies above provide L3/L4 isolation.
