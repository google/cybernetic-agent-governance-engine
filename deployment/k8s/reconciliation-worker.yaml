---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reconciliation-worker
  namespace: governance-stack
  labels:
    app: reconciliation-worker
    app.kubernetes.io/component: compliance-bridge
    app.kubernetes.io/version: "2.1.0"
    cage.io/account-purpose: "ledger-reconciliation"
spec:
  # Run every 5 minutes.  The worker completes a single reconciliation cycle
  # per invocation (run_loop is not used in CronJob mode — see entrypoint).
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid   # Never overlap runs; fail closed on contention.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Fail the job after 4 minutes to avoid overlapping the next 5-minute window.
      activeDeadlineSeconds: 240
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: reconciliation-worker
            cage.io/account-purpose: "ledger-reconciliation"
        spec:
          restartPolicy: OnFailure
          serviceAccountName: financial-advisor-sa
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconciliation-worker
              # Reuse the compliance-bridge image; the reconciliation_worker module
              # ships inside it.  Override IMAGE_REGISTRY at deploy time.
              image: ${REGISTRY_URL}/compliance-bridge:latest
              imagePullPolicy: Always
              command:
                - python
                - -m
                - compliance_bridge.reconciliation_worker
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
              env:
                # --- Provider ---
                # Set to "gcs", "s3" / "object-store", "plaid", "anchorage", or "stub".
                # "s3" works with AWS S3, GCS S3 Interoperability API, MinIO, or Ceph.
                # BLOCKER-06: must be "gcs" for GKE-on-GCP deployments — matches gateway.yaml.
                - name: RECONCILIATION_PROVIDER
                  value: "gcs"

                # --- GCS ledger snapshot (RECONCILIATION_PROVIDER=gcs) ---
                - name: GCS_RECONCILIATION_BUCKET
                  valueFrom:
                    # Populate this Secret key before deploying: see deployment/scripts/setup_reconciliation_secret.sh
                    secretKeyRef:
                      name: reconciliation-worker-secrets
                      key: gcs-reconciliation-bucket
                      optional: true  # only required when provider=gcs
                - name: GCS_RECONCILIATION_OBJECT
                  valueFrom:
                    secretKeyRef:
                      name: reconciliation-worker-secrets
                      key: gcs-reconciliation-object
                      optional: true  # defaults to "reconciliation/latest.json"

                # --- S3-compatible object store (RECONCILIATION_PROVIDER=s3) ---
                # Supports AWS S3, GCS S3 Interop, MinIO, Ceph.
                - name: S3_RECONCILIATION_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: reconciliation-worker-secrets
                      key: s3-reconciliation-bucket
                      optional: true  # only required when provider=s3
                - name: S3_RECONCILIATION_OBJECT
                  valueFrom:
                    secretKeyRef:
                      name: reconciliation-worker-secrets
                      key: s3-reconciliation-object
                      optional: true  # defaults to "reconciliation/latest.json"
                - name: S3_ENDPOINT_URL
                  valueFrom:
                    secretKeyRef:
                      name: reconciliation-worker-secrets
                      key: s3-endpoint-url
                      optional: true  # omit for standard AWS S3
                - name: S3_REGION_NAME
                  valueFrom:
                    secretKeyRef:
                      name: reconciliation-worker-secrets
                      key: s3-region-name
                      optional: true  # defaults to "us-east-1"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: reconciliation-worker-secrets
                      key: aws-access-key-id
                      optional: true  # use IRSA / Workload Identity on managed K8s
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: reconciliation-worker-secrets
                      key: aws-secret-access-key
                      optional: true  # use IRSA / Workload Identity on managed K8s

                # --- KMS signing ---
                - name: KMS_GOVERNANCE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: reconciliation-worker-secrets
                      key: kms-governance-key

                # --- Redis ---
                - name: REDIS_URL
                  valueFrom:
                    secretKeyRef:
                      name: redis-credentials
                      key: REDIS_URL
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: redis-credentials
                      key: REDIS_PASSWORD

                # --- CAGE deployment region ---
                - name: CAGE_DEPLOYMENT_REGION
                  value: "US_FED"

                # --- OpenTelemetry ---
                - name: OTEL_TRACES_EXPORTER
                  value: "otlp"
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://langfuse-web.governance-stack.svc.cluster.local:3000/api/public/otel/v1/traces"
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: "http/protobuf"
                - name: OTEL_EXPORTER_OTLP_HEADERS
                  valueFrom:
                    secretKeyRef:
                      name: advisor-secrets
                      key: OTEL_EXPORTER_OTLP_HEADERS
                      optional: true

                # --- Reconciliation tuning ---
                - name: RECONCILIATION_INTERVAL_S
                  value: "60"
                - name: RECONCILIATION_TTL_S
                  value: "300"
                # Single-shot mode: exit after one cycle (CronJob invocation)
                - name: RECONCILIATION_SINGLE_SHOT
                  value: "true"

              resources:
                requests:
                  cpu: "25m"
                  memory: "128Mi"
                limits:
                  cpu: "100m"
                  memory: "256Mi"

              # Writable tmp volume required for read-only root filesystem.
              volumeMounts:
                - name: tmp-dir
                  mountPath: /tmp

          volumes:
            - name: tmp-dir
              emptyDir: {}

---
# reconciliation-worker-secrets
#
# Secret template — do NOT commit real values.  Populate via kubectl or Terraform.
#
# For provider=s3 (recommended — cloud-agnostic):
#   kubectl create secret generic reconciliation-worker-secrets \
#     --namespace=governance-stack \
#     --from-literal=s3-reconciliation-bucket=<YOUR_BUCKET> \
#     --from-literal=s3-reconciliation-object=reconciliation/latest.json \
#     --from-literal=s3-endpoint-url=https://storage.googleapis.com \  # GCS S3 Interop
#     --from-literal=s3-region-name=us-east-1 \
#     --from-literal=aws-access-key-id=<HMAC_OR_IAM_KEY> \
#     --from-literal=aws-secret-access-key=<HMAC_OR_IAM_SECRET> \
#     --from-literal=kms-governance-key=projects/<PROJECT>/locations/<REGION>/keyRings/<RING>/cryptoKeys/<KEY>
#
# For provider=gcs (GCP-native):
#   kubectl create secret generic reconciliation-worker-secrets \
#     --namespace=governance-stack \
#     --from-literal=gcs-reconciliation-bucket=<YOUR_BUCKET> \
#     --from-literal=gcs-reconciliation-object=reconciliation/latest.json \
#     --from-literal=kms-governance-key=projects/<PROJECT>/locations/<REGION>/keyRings/<RING>/cryptoKeys/<KEY>
#
# For MinIO hermetic testing:
#   kubectl create secret generic reconciliation-worker-secrets \
#     --namespace=governance-stack \
#     --from-literal=s3-reconciliation-bucket=cage-ledger \
#     --from-literal=s3-endpoint-url=http://minio:9000 \
#     --from-literal=aws-access-key-id=minioadmin \
#     --from-literal=aws-secret-access-key=minioadmin \
#     --from-literal=kms-governance-key=...
#
# Or use Terraform (infra/modules/gateway/main.tf) — never commit secret values.
apiVersion: v1
kind: Secret
metadata:
  name: reconciliation-worker-secrets
  namespace: governance-stack
  labels:
    app: reconciliation-worker
    cage.io/account-purpose: "ledger-reconciliation"
type: Opaque
# stringData is intentionally absent — all values must be populated out-of-band.
# stringData:
#   # S3-compatible (provider=s3):
#   s3-reconciliation-bucket: ""        # REQUIRED for provider=s3
#   s3-reconciliation-object: ""        # OPTIONAL (default: reconciliation/latest.json)
#   s3-endpoint-url: ""                 # OPTIONAL (omit for standard AWS S3)
#   s3-region-name: ""                  # OPTIONAL (default: us-east-1)
#   aws-access-key-id: ""               # OPTIONAL (use IRSA/Workload Identity if omitted)
#   aws-secret-access-key: ""           # OPTIONAL (use IRSA/Workload Identity if omitted)
#   # GCS-native (provider=gcs):
#   gcs-reconciliation-bucket: ""       # REQUIRED for provider=gcs
#   gcs-reconciliation-object: ""       # OPTIONAL (default: reconciliation/latest.json)
#   # Common:
#   kms-governance-key: ""              # REQUIRED

---
# CiliumNetworkPolicy — reconciliation-worker egress isolation
#
# Allows only the traffic required for a single reconciliation cycle:
#   1. Object storage (port 443) — ledger snapshot download (GCS, S3, MinIO TLS)
#   2. Cloud KMS (port 443) — HMAC signing
#   3. Redis (port 6379) — signed balance write
#   4. DNS (port 53 UDP/TCP) — name resolution
#
# All other ingress and egress is denied by the default-deny posture established
# in deployment/k8s/cilium-egress-lockdown.yaml.
#
# CAGE_DEPLOYMENT_REGION guard: this policy applies universally because GCS,
# KMS, and Redis are used in all three postures (US_FED, EU_ECB, APAC_MAS).
# Regional data residency is enforced by the KMS key location and GCS bucket
# region configured in reconciliation-worker-secrets, not by this policy.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: reconciliation-worker-egress
  namespace: governance-stack
  labels:
    app: reconciliation-worker
spec:
  endpointSelector:
    matchLabels:
      app: reconciliation-worker
      cage.io/account-purpose: "ledger-reconciliation"

  # No ingress permitted — worker is write-only.
  ingress: []

  egress:
    # DNS resolution (required for GCS / KMS FQDN lookup)
    - toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # Object storage + Cloud KMS — port 443
    # Covers: GCS (*.googleapis.com), AWS S3 (*.amazonaws.com), any custom endpoint.
    # For MinIO / on-premise S3: add a toEndpoints rule for the MinIO pod instead.
    - toFQDNs:
        - matchPattern: "*.googleapis.com"
        - matchPattern: "storage.googleapis.com"
        - matchPattern: "cloudkms.googleapis.com"
        - matchPattern: "*.amazonaws.com"
        - matchPattern: "*.s3.amazonaws.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # Redis in-cluster — governance-stack namespace only
    - toEndpoints:
        - matchLabels:
            app: redis-stack
            k8s:io.kubernetes.pod.namespace: governance-stack
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP

    # Langfuse OTLP trace export (audit trail for reconciliation spans)
    - toEndpoints:
        - matchLabels:
            app: langfuse-web
            k8s:io.kubernetes.pod.namespace: governance-stack
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
