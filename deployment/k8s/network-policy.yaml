---
# Policy 1: Default deny all ingress to governance-stack pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: network-security
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Policy 2: Default deny all egress from governance-stack pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: network-security
spec:
  podSelector: {}
  policyTypes:
    - Egress

---
# Policy 3: Allow inbound traffic to the CAGE gateway (port 8080)
# only from pods in the same namespace with the orchestrator label,
# or from the ingress controller namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: network-security
spec:
  podSelector:
    matchLabels:
      app: governed-financial-advisor
  policyTypes:
    - Ingress
  ingress:
    # Trusted internal orchestrators (must carry the orchestrator role label)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: governance-stack
          podSelector:
            matchLabels:
              cage.io/role: orchestrator
      ports:
        - protocol: TCP
          port: 8080
    # Kubernetes Ingress Controller (e.g. nginx-ingress in ingress-nginx namespace)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080

---
# Policy 4: Allow pods in governance-stack to reach OPA on port 8181
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-opa-egress
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: network-security
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: governance-stack
          podSelector:
            matchLabels:
              app: opa
        # OPA also deployed in default namespace (legacy — see NAMESPACE-GUIDE.md)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app: opa
      ports:
        - protocol: TCP
          port: 8181

---
# Policy 5: Allow pods in governance-stack to reach Redis on port 6379
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-egress
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: network-security
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: governance-stack
          podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379

---
# Policy 6: Allow pods in governance-stack to reach Langfuse OTLP endpoint
# (Langfuse v3 native OTLP ingestion — no separate OTel Collector deployed)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otlp-egress
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: network-security
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: governance-stack
          podSelector:
            matchLabels:
              app: langfuse-web
      ports:
        - protocol: TCP
          port: 3000 # Langfuse OTLP HTTP (/api/public/otel/v1/traces)

---
# Policy 7: Allow DNS egress (required for all cluster DNS resolution)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: network-security
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Policy 8: Allow pods in governance-stack to reach vLLM inference on port 8000
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vllm-egress
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: network-security
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: governance-stack
          podSelector:
            matchLabels:
              app: vllm-service
      ports:
        - protocol: TCP
          port: 8000

---
# Policy 9: Allow inbound traffic to OPA from governance-stack pods (health checks)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-opa-ingress-from-governance
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: network-security
spec:
  podSelector:
    matchLabels:
      app: opa
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: governance-stack
      ports:
        - protocol: TCP
          port: 8181

---
# Policy 10: Allow inbound inference traffic to vllm-inference from governed-financial-advisor,
# gateway, and nemo-guardrails pods on port 8000.
# Required because default-deny-ingress blocks all inbound traffic; without this policy
# the advisor pod gets ConnectTimeout when calling the thinker_node reasoner LLM.
# NIST SP 800-53: SC-7, AC-4
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vllm-inference-ingress
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: network-security
spec:
  podSelector:
    matchLabels:
      app: vllm-inference
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: governance-stack
          podSelector:
            matchLabels:
              app: governed-financial-advisor
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: governance-stack
          podSelector:
            matchLabels:
              app: gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: governance-stack
          podSelector:
            matchLabels:
              app: nemo-guardrails
      ports:
        - protocol: TCP
          port: 8000

---
# Policy 11: Allow inbound inference traffic to vllm-reasoning from governed-financial-advisor,
# gateway, and nemo-guardrails pods on port 8000.
# Mirrors Policy 10 for the reasoning (DeepSeek R1) model pod.
# NIST SP 800-53: SC-7, AC-4
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vllm-reasoning-ingress
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: network-security
spec:
  podSelector:
    matchLabels:
      app: vllm-reasoning
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: governance-stack
          podSelector:
            matchLabels:
              app: governed-financial-advisor
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: governance-stack
          podSelector:
            matchLabels:
              app: gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: governance-stack
          podSelector:
            matchLabels:
              app: nemo-guardrails
      ports:
        - protocol: TCP
          port: 8000
