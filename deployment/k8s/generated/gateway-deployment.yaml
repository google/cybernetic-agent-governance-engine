apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: governance-stack
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      serviceAccountName: financial-advisor-sa
      containers:
        - name: gateway
          image: gcr.io/YOUR_GCP_PROJECT_ID/gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 50051
              name: grpc
          envFrom:
            - secretRef:
                name: advisor-secrets
          env:
            - name: PORT
              value: "8080"
            - name: GATEWAY_GRPC_PORT
              value: "50051"
            - name: GOOGLE_CLOUD_PROJECT
              value: "YOUR_GCP_PROJECT_ID"
            - name: GOOGLE_CLOUD_LOCATION
              value: "us-central1"
            - name: ENABLE_LOGGING
              value: "true"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              # Langfuse v3 native OTLP ingestion — no collector needed.
              value: "http://langfuse-web.governance-stack.svc.cluster.local:3000/api/public/otel/v1/traces"
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: "Authorization=Basic cGstbGYtNTRmNTBlMmUtOGNjYi00N2I0LWJlYzEtMzdiMmY5N2Q1NTgyOnNrLWxmLWU3YmEzNWQ3LWE5YjctNDc1Zi1hNTdlLWFlMzRlMzk3MDlhMg=="
            - name: LANGFUSE_HOST
              value: "http://langfuse-web.governance-stack.svc.cluster.local:3000"
            - name: LANGFUSE_PUBLIC_KEY
              value: "REDACTED_LANGFUSE_PK"
            - name: LANGFUSE_SECRET_KEY
              value: "REDACTED_LANGFUSE_SK"
            - name: OTEL_PYTHON_INSTRUMENTATION_HTTPX_CAPTURE_REQUEST_BODY
              value: "true"
            - name: OTEL_PYTHON_INSTRUMENTATION_HTTPX_CAPTURE_RESPONSE_BODY
              value: "true"
            - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
              value: "true"
            - name: OTEL_PYTHON_EXCLUDED_URLS
              value: "healthz,readiness,liveness,metrics,huggingface.co/api/resolve"
            - name: OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SERVER_REQUEST
              value: "content-type,accept,user-agent,x-request-id,x-goog-authenticated-user-email"
            - name: OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SERVER_RESPONSE
              value: "content-type,content-length"
            - name: OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SANITIZE_FIELDS
              value: ".*session.*,.*token.*,authorization,set-cookie,cookie,x-api-key,proxy-authorization"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_HOST
              value: "redis.governance-stack.svc.cluster.local"
            - name: REDIS_URL
              value: "redis://redis.governance-stack.svc.cluster.local:6379"
            - name: VLLM_BASE_URL
              value: "http://vllm-service.governance-stack.svc.cluster.local:8000/v1"
            - name: VLLM_GATEWAY_URL
              value: ""
            - name: VLLM_REASONING_API_BASE
              value: "http://vllm-reasoning.governance-stack.svc.cluster.local:8000/v1"
            - name: VLLM_FAST_API_BASE
              value: "http://vllm-service.governance-stack.svc.cluster.local:8000/v1"
            - name: GUARDRAILS_MODEL_NAME
              value: "Qwen/Qwen2.5-7B-Instruct"
            - name: SERVICE_NAME
              value: "hybrid-gateway"
            # Dev-mode bypass: disables CAGE_ROUTING_SEAL_SECRET enforcement (POAM-012)
            # In production, set CAGE_ENV=production and provide a 32+ char secret.
            - name: CAGE_ENV
              value: "development"
            - name: ENVIRONMENT
              value: "development"
            # v2.0.0 REQUIRED: ControlRegistry regional compliance profile selector.
            # Must be set explicitly — no silent fallback to US_FED is acceptable in
            # production. Override at deploy time via `kubectl set env` or a ConfigMap.
            # Supported values: US_FED | EU_ECB | APAC_MAS
            - name: CAGE_DEPLOYMENT_REGION
              value: "US_FED"
            # OPA Configuration — talks to the shared opa-service (not localhost sidecar)
            - name: OPA_URL
              value: "http://opa-service:8181/v1/data/trade/governance"
            # Routing Seal — HMAC key must match GFA deployment
            - name: GOVERNANCE_SALT
              value: "REDACTED_SALT"
            # Seal TTL=120s covers OPA cold-start (up to 20s) with safe margin.
            # Warm steady-state OPA: ~30-80ms; 120s is not a security risk
            # because the seal is single-use (transaction_id in canonical payload).
            - name: GOVERNANCE_SEAL_TTL_S
              value: "120"
            # Observability: 1% sampling in production; raise to 1.0 for load tests
            - name: TRACE_SAMPLING_RATE
              value: "0.1"
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"

        # OPA sidecar removed — gateway talks to the standalone opa-service
        # Deployment (OPA_URL=http://opa-service:8181/v1/data/trade/governance).
        # The sidecar listened on localhost:8181 which was unreachable from the
        # main container, caused pod CrashLoopBackOff when its secrets were
        # missing, and duplicated policy evaluation work already done by the
        # shared opa-service. See: deployment/k8s/opa.yaml.
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: governance-stack
spec:
  selector:
    app: gateway
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: grpc
      protocol: TCP
      port: 50051
      targetPort: 50051
  type: ClusterIP
