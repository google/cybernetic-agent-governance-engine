apiVersion: apps/v1
kind: Deployment
metadata:
  name: governed-financial-advisor
  namespace: governance-stack
  labels:
    app: governed-financial-advisor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: governed-financial-advisor
  template:
    metadata:
      labels:
        app: governed-financial-advisor
    spec:
      serviceAccountName: financial-advisor-sa
      volumes:
        # policy-volume and opa-config-volume removed — OPA sidecar removed.
        # governed-financial-advisor uses OPA_URL env var to reach the shared
        # opa-service Deployment (see deployment/k8s/opa.yaml).
      containers:
        # Main Agent Container
        - name: ingress-agent
          image: gcr.io/YOUR_GCP_PROJECT_ID/governed-financial-advisor:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: gfa-http
          envFrom:
            - secretRef:
                name: advisor-secrets
          env:
            - name: USE_MOCK_LLM
              value: "true"
            - name: USE_MOCK_BROKER
              value: "true"
            # --- Service Configuration ---
            - name: PORT
              value: "8080"
            - name: SERVICE_NAME
              value: "governed-financial-advisor"
            - name: OTEL_SERVICE_NAME
              value: "governed-financial-advisor"
            - name: DEPLOY_TIMESTAMP
              value: "2026-05-30T16:13:00Z"

            # --- Infrastructure ---
            - name: GOOGLE_CLOUD_PROJECT
              value: "YOUR_GCP_PROJECT_ID"
            - name: GOOGLE_CLOUD_LOCATION
              value: "us-central1"
            - name: ENABLE_LOGGING
              value: "true"

            # --- Redis Session Management ---
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_URL

            # --- Model Configuration (Tiered) ---
            - name: MODEL_FAST
              value: "Qwen/Qwen2.5-1.5B-Instruct"
            - name: MODEL_REASONING
              value: "casperhansen/deepseek-r1-distill-qwen-14b-awq"
            - name: MODEL_CONSENSUS
              value: "casperhansen/deepseek-r1-distill-qwen-14b-awq"

            # --- vLLM Inference Endpoints ---
            - name: VLLM_BASE_URL
              value: "http://vllm-service.governance-stack.svc.cluster.local:8000/v1"
            - name: VLLM_API_KEY
              value: "EMPTY"
            - name: OPENAI_API_BASE
              value: "http://vllm-service.governance-stack.svc.cluster.local:8000/v1"
            - name: OPENAI_API_KEY
              value: "EMPTY"
            - name: VLLM_FAST_API_BASE
              value: "http://vllm-service.governance-stack.svc.cluster.local:8000/v1"
            - name: VLLM_REASONING_API_BASE
              value: "http://vllm-reasoning.governance-stack.svc.cluster.local:8000/v1"
            - name: VLLM_GATEWAY_URL
              value: ""

            # --- Policy Engine ---
            - name: OPA_URL
              value: "http://opa:8181/v1/data/trade/governance"

            # --- Observability: Langfuse (hot tier) — LangSmith/LangChain tracing disabled ---
            - name: LANGCHAIN_TRACING_V2
              value: "false"
            - name: LANGSMITH_TRACING
              value: "false"
            - name: LANGFUSE_HOST
              value: "http://langfuse-web.governance-stack.svc.cluster.local:3000"

            # --- OpenTelemetry (Cold Tier) ---
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              # Langfuse v3 native OTLP ingestion — no separate collector needed.
              # Format: <langfuse-host>/api/public/otel/v1/traces
              value: "http://langfuse-web.governance-stack.svc.cluster.local:3000/api/public/otel/v1/traces"
            - name: OTEL_EXPORTER_OTLP_HEADERS
              # Basic auth: base64(LANGFUSE_PUBLIC_KEY:LANGFUSE_SECRET_KEY)
              value: "Authorization=Basic cGstbGYtNTRmNTBlMmUtOGNjYi00N2I0LWJlYzEtMzdiMmY5N2Q1NTgyOnNrLWxmLWU3YmEzNWQ3LWE5YjctNDc1Zi1hNTdlLWFlMzRlMzk3MDlhMg=="
            - name: TRACE_SAMPLING_RATE
              value: "0.1"
            # OPA decision cache active in production (Redis always available in GKE).
            # Set to false in unit tests via conftest.py to prevent cross-test pollution.
            - name: OPA_CACHE_ENABLED
              value: "true"
            - name: OTEL_PYTHON_INSTRUMENTATION_HTTPX_CAPTURE_REQUEST_BODY
              value: "true"
            - name: OTEL_PYTHON_INSTRUMENTATION_HTTPX_CAPTURE_RESPONSE_BODY
              value: "true"
            - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
              value: "true"
            - name: OTEL_PYTHON_EXCLUDED_URLS
              value: "healthz,readiness,liveness,metrics,huggingface.co/api/resolve"
            - name: OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SERVER_REQUEST
              value: "content-type,accept,user-agent,x-request-id,x-goog-authenticated-user-email"
            - name: OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SERVER_RESPONSE
              value: "content-type,content-length"
            - name: OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SANITIZE_FIELDS
              value: ".*session.*,.*token.*,authorization,set-cookie,cookie,x-api-key,proxy-authorization"

            # --- Cold Tier Storage ---
            - name: COLD_TIER_GCS_BUCKET
              value: ""
            - name: COLD_TIER_GCS_PREFIX
              value: "cold_tier"

            # --- Gateway Configuration ---
            - name: GATEWAY_HOST
              value: "gateway.governance-stack.svc.cluster.local"
            - name: GATEWAY_GRPC_PORT
              value: "50051"
            - name: GATEWAY_URL
              value: "http://gateway.governance-stack.svc.cluster.local:8080"
            - name: MCP_SERVER_SSE_URL
              value: "http://gateway:8080/mcp/sse"
            - name: GOVERNANCE_SALT
              value: "REDACTED_SALT"
            - name: GOVERNANCE_SEAL_TTL_S
              value: "120"





            # --- MCP Configuration ---
            - name: MCP_MODE
              value: "stdio"
            - name: ALPHAVANTAGE_API_KEY
              value: ""

            # --- Secrets (from K8s Secrets) ---
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token

          resources:
            requests:
              cpu: "100m"
              memory: "1Gi"
            limits:
              cpu: "500m"
              memory: "2Gi"



        # OPA sidecar removed — governed-financial-advisor uses OPA_URL env var
        # (http://opa-service:8181) to reach the shared opa-service Deployment.
        # The sidecar listened on localhost:8181, which was unreachable from the
        # main container, and required finance-policy-rego / opa-configuration
        # secrets that cause CreateContainerConfigError when absent.
---
apiVersion: v1
kind: Service
metadata:
  name: governed-financial-advisor
  namespace: governance-stack
spec:
  type: ClusterIP
  selector:
    app: governed-financial-advisor
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
