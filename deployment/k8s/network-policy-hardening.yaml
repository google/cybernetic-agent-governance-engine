---
# Gateway: allow egress to NeMo Guardrails (not covered in network-policy.yaml)
# DEP-16: Replaced NIST-specific annotations with jurisdiction-neutral cage.io labels.
# ISO 42001 A.8.4 (boundary protection) is the universal control; NIST SC-7/AC-4/SC-23
# are US_FED-specific citations mapped in the compliance bridge, not in K8s manifests.
# R-2, R-8: NIST control references must not appear on universal K8s resources.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-egress-to-nemo
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: network-security
  annotations:
    cage.io/control: "boundary-protection,session-authenticity,information-flow"
    cage.io/iso42001-control: "A.8.4"
    cage.io/last-reviewed: "2026-06-15"
    cage.io/jurisdiction-note: "US_FED maps to NIST SC-7,AC-4,SC-23; EU_ECB maps to DORA Art.10; APAC_MAS maps to MAS TRM §6.3"
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Egress
  egress:
    # NeMo Guardrails colosseum (SC-23: session authenticity via controlled channel)
    - to:
        - podSelector:
            matchLabels:
              app: nemo-guardrails
      ports:
        - port: 8000
          protocol: TCP

---
# Gateway: allow egress cross-namespace to vLLM inference namespace
# DEP-16: Replaced NIST-specific annotations with jurisdiction-neutral cage.io labels.
# ISO 42001 A.8.4 (boundary protection) is the universal control.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-egress-to-vllm-namespace
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: network-security
  annotations:
    cage.io/control: "boundary-protection,information-flow"
    cage.io/iso42001-control: "A.8.4"
    cage.io/last-reviewed: "2026-06-15"
    cage.io/jurisdiction-note: "US_FED maps to NIST SC-7,AC-4; EU_ECB maps to DORA Art.10; APAC_MAS maps to MAS TRM §6.3"
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Egress
  egress:
    # vLLM inference namespace (production GPU workloads)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vllm
      ports:
        - port: 8000
          protocol: TCP

---
# Compliance Bridge: allow egress to Langfuse (cross-namespace) and Minio
# DEP-16: Replaced NIST-specific annotations with jurisdiction-neutral cage.io labels.
# ISO 42001 A.9.2 (continuous monitoring) and A.8.4 (boundary protection) are universal.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: compliance-bridge-egress-allowlist
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: network-security
  annotations:
    cage.io/control: "boundary-protection,information-flow,continuous-monitoring"
    cage.io/iso42001-control: "A.8.4,A.9.2"
    cage.io/last-reviewed: "2026-06-15"
    cage.io/jurisdiction-note: "US_FED maps to NIST SC-7,AC-4,CA-7; EU_ECB maps to DORA Art.10; APAC_MAS maps to MAS TRM §6.3"
spec:
  podSelector:
    matchLabels:
      app: compliance-bridge
  policyTypes:
    - Egress
  egress:
    # Langfuse observability (cross-namespace — CA-7 evidence collection)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: langfuse
      ports:
        - port: 3000
          protocol: TCP
    # OPA (policy evaluation for compliance checks)
    - to:
        - podSelector:
            matchLabels:
              app: opa
      ports:
        - port: 8181
          protocol: TCP
    # Minio (OSCAL artifact storage — GCS S3-compatible endpoint via in-cluster Minio)
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - port: 9000
          protocol: TCP

---
# Lula CronJob: allow egress to Kubernetes API server and Minio only
# DEP-16: Replaced NIST-specific annotations with jurisdiction-neutral cage.io labels.
# ISO 42001 A.9.2 (continuous monitoring) and A.8.4 (boundary protection) are universal.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lula-egress-allowlist
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: network-security
  annotations:
    cage.io/control: "boundary-protection,continuous-monitoring"
    cage.io/iso42001-control: "A.8.4,A.9.2"
    cage.io/last-reviewed: "2026-06-15"
    cage.io/jurisdiction-note: "US_FED maps to NIST SC-7,CA-7; EU_ECB maps to DORA Art.10; APAC_MAS maps to MAS TRM §6.3"
spec:
  podSelector:
    matchLabels:
      app: lula
  policyTypes:
    - Egress
  egress:
    # Kubernetes API server (standard HTTPS port 443 and internal 6443)
    # Required for Lula cluster assessment domain queries
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # Minio for OSCAL assessment result storage (CA-7 continuous monitoring evidence)
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - port: 9000
          protocol: TCP

---
# Gateway: allow inbound gRPC (port 50051) from orchestrator pods and ingress controller
# DEP-16: Replaced NIST-specific annotations with jurisdiction-neutral cage.io labels.
# ISO 42001 A.8.4 (boundary protection) is the universal control.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-grpc-ingress
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: network-security
  annotations:
    cage.io/control: "boundary-protection,information-flow"
    cage.io/iso42001-control: "A.8.4"
    cage.io/last-reviewed: "2026-06-15"
    cage.io/jurisdiction-note: "US_FED maps to NIST SC-7,AC-4; EU_ECB maps to DORA Art.10; APAC_MAS maps to MAS TRM §6.3"
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Ingress
  ingress:
    # Internal orchestrators via gRPC
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: governance-stack
          podSelector:
            matchLabels:
              cage.io/role: orchestrator
      ports:
        - protocol: TCP
          port: 50051
    # Ingress controller for external gRPC traffic (e.g. Envoy/nginx grpc_pass)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 50051

---
# Compliance Bridge: allow inbound HTTP from governance-stack pods (Lula health checks, internal)
# DEP-16: Replaced NIST-specific annotations with jurisdiction-neutral cage.io labels.
# ISO 42001 A.8.4 (boundary protection) is the universal control.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-compliance-bridge-ingress
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: network-security
  annotations:
    cage.io/control: "boundary-protection,information-flow"
    cage.io/iso42001-control: "A.8.4"
    cage.io/last-reviewed: "2026-06-15"
    cage.io/jurisdiction-note: "US_FED maps to NIST SC-7,AC-4; EU_ECB maps to DORA Art.10; APAC_MAS maps to MAS TRM §6.3"
spec:
  podSelector:
    matchLabels:
      app: compliance-bridge
  policyTypes:
    - Ingress
  ingress:
    # Internal governance-stack pods (Lula, gateway health checks, observability scraper)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: governance-stack
      ports:
        - protocol: TCP
          port: 3001
