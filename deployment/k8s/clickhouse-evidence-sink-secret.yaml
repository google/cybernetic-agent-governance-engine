# Credential for the least-privilege ClickHouse evidence writer
# (users.d/evidence_sink_user.xml in langfuse-db.yaml). Mounted by the ClickHouse
# server (CLICKHOUSE_EVIDENCE_SINK_PASSWORD) and the compliance bridge
# (CLICKHOUSE_PASSWORD) only. The gcp-gke Terraform target generates this Secret;
# this template is for the raw-manifest path.
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-evidence-sink
  namespace: governance-stack
  labels:
    app: clickhouse
    managed-by: cage
    # IA-5(1): sensitivity classification required by lula-validation-ia5.yaml
    cage.io/sensitivity-level: high
  annotations:
    # IA-5(1): rotation schedule required by lula-validation-ia5.yaml
    cage.io/rotation-schedule: "90d"
    cage.io/rotation-owner: "platform-team"
type: Opaque
# stringData accepts plaintext — kubectl will base64-encode on apply.
# Replace all <PLACEHOLDER> values before applying.
stringData:
  CLICKHOUSE_PASSWORD: "<CLICKHOUSE_EVIDENCE_SINK_PASSWORD>"
