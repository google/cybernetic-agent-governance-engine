apiVersion: apps/v1
kind: Deployment
metadata:
  name: governed-financial-advisor
  namespace: governance-stack
  labels:
    app: governed-financial-advisor
spec:
  replicas: 1
  # minReadySeconds gives the pod time to stabilise after the readiness probe
  # first passes before the Deployment considers it "available". Without this,
  # a pod that passes /health once but then crashes is counted as available,
  # causing "Does not have minimum availability" in the GCP Console.
  minReadySeconds: 10
  selector:
    matchLabels:
      app: governed-financial-advisor
  template:
    metadata:
      labels:
        app: governed-financial-advisor
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: financial-advisor-sa
      containers:
        - name: governed-financial-advisor
          # Set IMAGE_REGISTRY to your container registry prefix (e.g. gcr.io/your-project, ghcr.io/your-org)
          # Override with: kubectl set image deployment/governed-financial-advisor governed-financial-advisor=<your-registry>/governed-financial-advisor:latest
          # Or use kustomize: kustomize edit set image gcr.io/YOUR_PROJECT_ID/governed-financial-advisor=<your-registry>/governed-financial-advisor:latest
          # IMAGE_REGISTRY can be overridden via kustomize or helm values (default: gcr.io)
          image: gcr.io/YOUR_PROJECT_ID/governed-financial-advisor:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: advisor-secrets
                optional: false
          env:
            # CAGE_ENV identifies the deployment tier. "development" enables the
            # auth bypass when CAGE_API_KEY / COMPLIANCE_BRIDGE_INTERNAL_TOKEN are
            # absent (dev cluster only). Must be "production" in prod.
            - name: CAGE_ENV
              value: "development"
            # CAGE_DEPLOYMENT_REGION activates the correct jurisdictional control
            # set: US_FED → NIST SP 800-53 / FedRAMP; EU_ECB → EU AI Act;
            # APAC_MAS → MAS FEAT. Without this only universal ISO 42001 controls load.
            - name: CAGE_DEPLOYMENT_REGION
              value: "US_FED"
            - name: PORT
              value: "8080"
            - name: GATEWAY_URL
              value: "http://gateway.governance-stack.svc.cluster.local:8080"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_URL
            # vLLM endpoints — required at module load time by NeMo guardrails (vllm_client.py)
            - name: VLLM_BASE_URL
              value: "http://vllm-service.governance-stack.svc.cluster.local:8000/v1"
            - name: VLLM_FAST_API_BASE
              value: "http://vllm-service.governance-stack.svc.cluster.local:8000/v1"
            - name: VLLM_REASONING_API_BASE
              value: "http://vllm-reasoning.governance-stack.svc.cluster.local:8000/v1"
            - name: VLLM_API_KEY
              value: "EMPTY"
            - name: OPENAI_API_BASE
              value: "http://vllm-service.governance-stack.svc.cluster.local:8000/v1"
            - name: OPENAI_API_KEY
              value: "EMPTY"
            # Model paths (GCS-backed via RunAI streamer)
            # Set MODEL_FAST to your model artifact path, e.g. gs://your-bucket/models--Qwen--Qwen2.5-7B-Instruct/snapshots/<sha>
            - name: MODEL_FAST
              value: ""  # Set to your model artifact path, e.g. gs://your-bucket/models--Qwen--Qwen2.5-7B-Instruct/snapshots/<sha>
            - name: MODEL_REASONING
              value: ""  # Set to your model artifact path, e.g. gs://your-bucket/deepseek-ai/DeepSeek-R1-Distill-Llama-8B/
            - name: MODEL_CONSENSUS
              value: ""  # Set to your model artifact path, e.g. gs://your-bucket/deepseek-ai/DeepSeek-R1-Distill-Llama-8B/
            # GCP project/location for ADC and telemetry
            - name: GOOGLE_CLOUD_PROJECT
              value: ""  # Set to your GCP project ID
            # DEP-05: GOOGLE_CLOUD_LOCATION must not be hardcoded to us-central1.
            # Sourced from advisor-secrets so deploy_all.sh / Terraform can inject
            # the correct region per CAGE_DEPLOYMENT_REGION:
            # US_FED → us-central1 | EU_ECB → europe-west1 | APAC_MAS → asia-southeast1
            - name: GOOGLE_CLOUD_LOCATION
              valueFrom:
                secretKeyRef:
                  name: advisor-secrets
                  key: GOOGLE_CLOUD_LOCATION
                  optional: true
            # OPA policy engine
            - name: OPA_URL
              value: "http://opa-service.governance-stack.svc.cluster.local:8181"
            # Tracing
            - name: ENABLE_TRACING
              value: "true"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://langfuse-web.governance-stack.svc.cluster.local:3000/api/public/otel/v1/traces"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: TRACE_SAMPLING_RATE
              value: "0.01"
            # CTRL_KMS_001: KMS asymmetric governance signer (H-05).
            # assert_kms_active_in_production() raises RuntimeError at startup
            # if this env var is absent when CAGE_ENV=production.
            # Also present via envFrom: advisor-secrets, but declared explicitly
            # here for auditability and to match the gateway pattern.
            - name: KMS_GOVERNANCE_KEY
              valueFrom:
                secretKeyRef:
                  name: advisor-secrets
                  key: KMS_GOVERNANCE_KEY
                  optional: true
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: governed-financial-advisor
  namespace: governance-stack
  annotations:
    # NEG annotation: required for GKE Ingress (gce class) to route traffic to
    # ClusterIP services. The NEG controller creates Network Endpoint Groups
    # that the GCE load balancer uses directly instead of kube-proxy NodePort.
    # Without this, governance-ingress cannot create a valid backend service.
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector:
    app: governed-financial-advisor
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  type: ClusterIP
