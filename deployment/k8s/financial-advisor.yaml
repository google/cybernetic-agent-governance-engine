apiVersion: apps/v1
kind: Deployment
metadata:
  name: governed-financial-advisor
  namespace: governance-stack
  labels:
    app: governed-financial-advisor
spec:
  replicas: 1
  # minReadySeconds gives the pod time to stabilise after the readiness probe
  # first passes before the Deployment considers it "available". Without this,
  # a pod that passes /health once but then crashes is counted as available,
  # causing "Does not have minimum availability" in the GCP Console.
  minReadySeconds: 10
  selector:
    matchLabels:
      app: governed-financial-advisor
  template:
    metadata:
      labels:
        app: governed-financial-advisor
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: financial-advisor-sa
      containers:
        - name: advisor
          image: gcr.io/YOUR_GCP_PROJECT_ID/governed-financial-advisor:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: advisor-secrets
                optional: false
          env:
            - name: PORT
              value: "8080"
            - name: GATEWAY_URL
              value: "http://gateway.governance-stack.svc.cluster.local:8080"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_URL
            # vLLM endpoints — required at module load time by NeMo guardrails (vllm_client.py)
            - name: VLLM_BASE_URL
              value: "http://vllm-service.governance-stack.svc.cluster.local:8000/v1"
            - name: VLLM_FAST_API_BASE
              value: "http://vllm-service.governance-stack.svc.cluster.local:8000/v1"
            - name: VLLM_REASONING_API_BASE
              value: "http://vllm-reasoning.governance-stack.svc.cluster.local:8000/v1"
            - name: VLLM_API_KEY
              value: "EMPTY"
            - name: OPENAI_API_BASE
              value: "http://vllm-service.governance-stack.svc.cluster.local:8000/v1"
            - name: OPENAI_API_KEY
              value: "EMPTY"
            # Model paths (GCS-backed via RunAI streamer)
            - name: MODEL_FAST
              value: "gs://YOUR_GCP_PROJECT_ID-models/models--Qwen--Qwen2.5-7B-Instruct/snapshots/a09a35458c702b33eeacc393d103063234e8bc28"
            - name: MODEL_REASONING
              value: "gs://YOUR_GCP_PROJECT_ID-models/deepseek-ai/DeepSeek-R1-Distill-Llama-8B/"
            - name: MODEL_CONSENSUS
              value: "gs://YOUR_GCP_PROJECT_ID-models/deepseek-ai/DeepSeek-R1-Distill-Llama-8B/"
            # GCP project/location for ADC and telemetry
            - name: GOOGLE_CLOUD_PROJECT
              value: "YOUR_GCP_PROJECT_ID"
            # DEP-05: GOOGLE_CLOUD_LOCATION must not be hardcoded to us-central1.
            # Sourced from advisor-secrets so deploy_all.sh / Terraform can inject
            # the correct region per CAGE_DEPLOYMENT_REGION:
            # US_FED → us-central1 | EU_ECB → europe-west1 | APAC_MAS → asia-southeast1
            - name: GOOGLE_CLOUD_LOCATION
              valueFrom:
                secretKeyRef:
                  name: advisor-secrets
                  key: GOOGLE_CLOUD_LOCATION
                  optional: true
            # OPA policy engine
            - name: OPA_URL
              value: "http://opa-service.governance-stack.svc.cluster.local:8181"
            # Tracing
            - name: ENABLE_TRACING
              value: "true"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://langfuse-web.governance-stack.svc.cluster.local:3000/api/public/otel/v1/traces"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: TRACE_SAMPLING_RATE
              value: "0.01"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: governed-financial-advisor
  namespace: governance-stack
spec:
  selector:
    app: governed-financial-advisor
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
