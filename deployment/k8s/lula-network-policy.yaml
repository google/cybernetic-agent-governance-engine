# ============================================================================
# NetworkPolicies for lula-audit CronJob
#
# The governance-stack namespace has default-deny-egress and default-deny-ingress
# policies. These two policies open the minimum required paths for the lula-audit
# CronJob pods (app=lula) to reach the compliance-bridge Service.
#
# Root cause of ipBlock requirement:
#   Standard Kubernetes NetworkPolicy egress `podSelector` matches direct
#   pod-to-pod traffic only. When traffic is sent to a Service ClusterIP,
#   kube-proxy performs DNAT before the NetworkPolicy egress evaluation, so
#   the destination appears as the ClusterIP address (10.96.0.0/12 range),
#   not the backing pod IP. An ipBlock covering the Service CIDR is required
#   to permit this traffic.
#
# GKE cage-dev Service CIDR: 10.96.0.0/12 (covers 10.96.0.0–10.111.255.255)
# compliance-bridge ClusterIP: 10.104.13.240
# ============================================================================

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lula-egress-to-compliance-bridge
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: network-security
spec:
  podSelector:
    matchLabels:
      app: lula
  policyTypes:
    - Egress
  egress:
    # Allow egress to the compliance-bridge Service ClusterIP (10.104.13.240)
    # via the Service CIDR ipBlock. podSelector alone does not match ClusterIP
    # traffic due to kube-proxy DNAT ordering.
    - ports:
        - port: 80
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.96.0.0/12
    # Also allow direct pod-to-pod egress (for future use without Service VIP)
    - ports:
        - port: 80
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app: compliance-bridge

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-compliance-bridge-ingress-from-lula
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: network-security
spec:
  podSelector:
    matchLabels:
      app: compliance-bridge
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 80
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              app: lula
