apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-governance
  namespace: governance-stack
  labels:
    app: vllm-governance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-governance
  template:
    metadata:
      labels:
        app: vllm-governance
    spec:
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "present"
        effect: "NoSchedule"
      - key: "cloud.google.com/gke-spot"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      # Use workload-type=gpu label set by Terraform on the GPU node pool.
      # cloud.google.com/gke-gpu is not a standard GKE label and is not
      # applied by the cluster autoscaler at scale-from-zero time.
      nodeSelector:
        workload-type: "gpu"
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
        - "--model"
        - "Qwen/Qwen2.5-7B-Instruct"
        - "--guided-decoding-backend"
        - "outlines"
        - "--trust-remote-code"
        - "--port"
        - "8000"
        env:
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: token
        - name: OTEL_SERVICE_NAME
          value: "vllm-governance"
        # Langfuse v3 native OTLP ingestion — no separate collector needed.
        # vLLM --otlp-traces-endpoint only supports gRPC; use env vars for HTTP.
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://langfuse-web.governance-stack.svc.cluster.local:3000/api/public/otel/v1/traces"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: advisor-secrets
              key: LANGFUSE_BASIC_AUTH_HEADER
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 15
          failureThreshold: 5
          timeoutSeconds: 10
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: "16Gi"
            cpu: "4"
          requests:
            nvidia.com/gpu: 1
            memory: "16Gi"
            cpu: "4"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-governance
  namespace: governance-stack
spec:
  selector:
    app: vllm-governance
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  type: ClusterIP
