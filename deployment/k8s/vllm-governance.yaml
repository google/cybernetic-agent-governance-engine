# =============================================================================
# vllm-governance — NOT CURRENTLY DEPLOYED (orphaned/aspirational)
# =============================================================================
# This manifest defines a dedicated "fast/governance" vLLM inference backend
# intended for use with the GKE Inference Gateway (deployment/k8s/inference-gateway/).
#
# WHY IT IS NOT DEPLOYED:
#   - No live consumers: gateway.yaml routes VLLM_FAST_API_BASE → vllm-service
#     (which selects vllm-inference), not this service.
#   - Same model as vllm-inference (Qwen/Qwen2.5-7B-Instruct); only difference
#     is guided-decoding backend (outlines vs xgrammar).
#   - Requires a 3rd NVIDIA L4 GPU (cluster has 2, both allocated to
#     vllm-inference and vllm-reasoning).
#
# WHEN TO DEPLOY:
#   - Activate the GKE Inference Gateway by setting VLLM_GATEWAY_URL in gateway.yaml
#   - Apply deployment/k8s/inference-gateway/ manifests
#   - Ensure a 3rd GPU is available (quota increase or GPU time-slicing)
#
# See deployment/k8s/GPU_QUOTA_NOTES.md for GPU quota details.
# =============================================================================

