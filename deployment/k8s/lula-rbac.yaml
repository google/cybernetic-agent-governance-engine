---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lula-auditor
  namespace: governance-stack
  labels:
    app: lula
    compliance.iso42001/component: "audit-runner"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lula-reader
  namespace: governance-stack
  labels:
    app: lula
rules:
  - apiGroups: [""]
    resources: ["configmaps", "pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
# Also needs read access to the default namespace for the opa-compliance-status ConfigMap
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lula-default-ns-reader
  labels:
    app: lula
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
    resourceNames: ["opa-compliance-status", "opa-policies"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lula-default-ns-reader-binding
  labels:
    app: lula
subjects:
  - kind: ServiceAccount
    name: lula-auditor
    namespace: governance-stack
roleRef:
  kind: ClusterRole
  name: lula-default-ns-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lula-reader-binding
  namespace: governance-stack
  labels:
    app: lula
subjects:
  - kind: ServiceAccount
    name: lula-auditor
    namespace: governance-stack
roleRef:
  kind: Role
  name: lula-reader
  apiGroup: rbac.authorization.k8s.io
