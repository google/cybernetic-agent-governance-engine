---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lula-validation-manifests
  namespace: governance-stack
  labels:
    app: lula
    compliance.iso42001/component: "audit-manifests"
data:
  # Embedded Lula validation manifests mounted into the CronJob pod.
  # These are the same files in compliance/lula/ — kept in sync by the CI pipeline.
  lula-validation-a52.yaml: |
    domain:
      type: api
      api-spec:
        endpoints:
          - name: langfuse_metrics_a52
            url: "http://compliance-bridge.governance-stack.svc.cluster.local:80/v1/metrics/A.5.2"
            method: GET
    provider:
      type: opa
      opa-spec:
        rego: |
          package lula
          import future.keywords.if
          validate if {
            input.langfuse_metrics_a52.startup_grace_active == true
            input.langfuse_metrics_a52.safety_rate >= 0.99
            input.langfuse_metrics_a52.evidence_age_seconds < 172800
          }
          validate if {
            input.langfuse_metrics_a52.startup_grace_active == false
            input.langfuse_metrics_a52.safety_rate >= 0.99
            input.langfuse_metrics_a52.total_traces > 100
            input.langfuse_metrics_a52.evidence_age_seconds < 172800
          }

  lula-validation-a53.yaml: |
    domain:
      type: api
      api-spec:
        endpoints:
          - name: langfuse_metrics_a53
            url: "http://compliance-bridge.governance-stack.svc.cluster.local:80/v1/metrics/A.5.3"
            method: GET
    provider:
      type: opa
      opa-spec:
        rego: |
          package lula
          import future.keywords.if
          validate if {
            input.langfuse_metrics_a53.startup_grace_active == true
            input.langfuse_metrics_a53.safety_rate >= 0.98
            input.langfuse_metrics_a53.evidence_age_seconds < 172800
          }
          validate if {
            input.langfuse_metrics_a53.startup_grace_active == false
            input.langfuse_metrics_a53.safety_rate >= 0.98
            input.langfuse_metrics_a53.total_traces > 100
            input.langfuse_metrics_a53.evidence_age_seconds < 172800
          }

  lula-validation-a92.yaml: |
    domain:
      type: api
      api-spec:
        endpoints:
          - name: langfuse_metrics_a92
            url: "http://compliance-bridge.governance-stack.svc.cluster.local:80/v1/metrics/A.9.2"
            method: GET
    provider:
      type: opa
      opa-spec:
        rego: |
          package lula
          import future.keywords.if
          validate if {
            input.langfuse_metrics_a92.startup_grace_active == true
            input.langfuse_metrics_a92.safety_rate == 1.0
            input.langfuse_metrics_a92.evidence_age_seconds < 172800
          }
          validate if {
            input.langfuse_metrics_a92.startup_grace_active == false
            input.langfuse_metrics_a92.safety_rate == 1.0
            input.langfuse_metrics_a92.total_traces > 0
            input.langfuse_metrics_a92.evidence_age_seconds < 172800
          }

  lula-validation-sc4.yaml: |
    domain:
      type: kubernetes
      kubernetes-spec:
        resources:
          - name: opa-compliance-status
            resource: configmaps
            namespace: governance-stack
    provider:
      type: opa
      opa-spec:
        rego: |
          package lula
          import future.keywords.if
          validate if {
            input["opa-compliance-status"].metadata.labels["compliance.iso42001/enabled"] == "true"
          }
---
# ============================================================================
# CronJob: lula-audit
# Runs every 6 hours — validates API-domain controls (A.5.2, A.5.3, A.9.2,
# SC-4) via the compliance-bridge REST API, persists the raw OSCAL artifact
# to GCS, then ingests findings into the Langfuse compliance project.
#
# Design notes:
#   - The CronJob runs as a Job pod with app=lula label. It calls the
#     compliance-bridge Service at compliance-bridge.governance-stack.svc.
#     cluster.local:80. The NetworkPolicy allow-lula-egress-to-compliance-bridge
#     permits egress to the Service CIDR (10.96.0.0/12) on port 80.
#   - auditId is set to the Unix timestamp to provide a stable idempotency key.
#     If the CronJob retries after a network failure, the compliance-bridge's
#     GCS HEAD check skips re-uploading the same artifact.
#   - Uses python:3.12-slim — urllib is built-in, no package installs needed,
#     runs as UID 1000 (non-root, PSA restricted compliant).
#   - Produces two success markers:
#       ✅ Lula audit complete.
#       ✅ OSCAL results ingested into Langfuse compliance project.
# ============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lula-audit
  namespace: governance-stack
  labels:
    app: lula
    compliance.iso42001/component: "continuous-audit"
spec:
  schedule: "0 */6 * * *" # Every 6 hours
  concurrencyPolicy: Forbid # Do not allow overlapping runs
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: lula
        spec:
          serviceAccountName: lula-auditor
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            # ----------------------------------------------------------------
            # Container: compliance-bridge OSCAL export + ingest (direct module)
            #
            # Uses the compliance-bridge image directly and calls the Python
            # modules in-process — no HTTP, no NetworkPolicy issues.
            #
            # The compliance-bridge image has all dependencies installed at
            # /app/compliance_bridge/. We call:
            #   1. get_compliance_metrics() for each control → findings
            #   2. build_oscal_assessment_results() → OSCAL dict → YAML
            #   3. run_audit_workflow(oscal_yaml, audit_id) → ingest pipeline
            #
            # This produces the same two success markers:
            #   ✅ Lula audit complete.
            #   ✅ OSCAL results ingested into Langfuse compliance project.
            #
            # Environment variables are inherited from the compliance-bridge
            # Deployment's secret refs (LANGFUSE_* keys) via envFrom.
            # ----------------------------------------------------------------
            - name: lula
              image: gcr.io/laah-cybernetics/compliance-bridge:latest
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 1000
                seccompProfile:
                  type: RuntimeDefault
              envFrom:
                - secretRef:
                    name: langfuse-compliance-secrets
              command:
                - python3
                - -c
                - |
                  import asyncio, json, sys, time, yaml as _yaml
                  sys.path.insert(0, "/app")

                  from compliance_bridge.metrics import get_compliance_metrics
                  from compliance_bridge.oscal_exporter import build_oscal_assessment_results, findings_from_metrics_dict
                  from compliance_bridge.audit_workflow import run_audit_workflow

                  SUPPORTED_CONTROLS = ["A.5.2", "A.5.3", "A.9.2", "SC-4"]
                  AUDIT_ID = f"cron-{int(time.time())}"

                  print("🔍 Starting Lula ISO 42001 audit...")

                  async def _main():
                      controls_data = {}
                      async def _fetch(cid):
                          try:
                              m = await asyncio.wait_for(get_compliance_metrics(cid, 24), timeout=8.0)
                              controls_data[cid] = m.model_dump()
                          except Exception as exc:
                              controls_data[cid] = {"error": str(exc)}

                      await asyncio.wait_for(
                          asyncio.gather(*[_fetch(cid) for cid in SUPPORTED_CONTROLS]),
                          timeout=25.0,
                      )
                      return controls_data

                  controls_data = asyncio.run(_main())
                  findings = findings_from_metrics_dict(controls_data, AUDIT_ID)
                  doc = build_oscal_assessment_results(findings=findings, audit_id=AUDIT_ID, window_hours=24)
                  oscal_yaml = _yaml.dump(doc, default_flow_style=False, allow_unicode=True)
                  result_lines = oscal_yaml.count("\n")
                  print(f"✅ Lula audit complete. Result: oscal-assessment-{AUDIT_ID}.yaml ({result_lines} lines)")

                  result = asyncio.run(run_audit_workflow(oscal_yaml=oscal_yaml, audit_id=AUDIT_ID))
                  print(f"📊 Ingest result:")
                  print(json.dumps(result, indent=2))

                  if result.get("status") != "ok":
                      print(f"❌ Ingest failed: {result}", file=sys.stderr)
                      sys.exit(1)

                  print("✅ OSCAL results ingested into Langfuse compliance project.")
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"

          volumes: []

---
# ============================================================================
# Deployment: lula-sc4-watch  [Option B — real-time SC-4 monitoring]
#
# SC-4 validates a Kubernetes ConfigMap label — a control that can change
# instantly (e.g., accidental `kubectl label` or Helm rollback).  The 6-hour
# CronJob cadence is too slow for this type of change.
#
# `lula validate --watch` re-validates on every Kubernetes resource event for
# the watched resources.  On each state change, it POSTs a new OSCAL result
# to the compliance-bridge for immediate ingestion and alerting.
#
# The CronJob remains the primary mechanism for API-domain controls
# (A.5.2, A.5.3, A.9.2) because those require Langfuse evidence accumulation
# over time.  SC-4 is also included in the CronJob run for consolidated
# periodic audit records.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lula-sc4-watch
  namespace: governance-stack
  labels:
    app: lula-sc4-watch
    compliance.iso42001/component: "realtime-sc4-watch"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lula-sc4-watch
  template:
    metadata:
      labels:
        app: lula-sc4-watch
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: lula-auditor
      containers:
        - name: lula-watch
          image: us-central1-docker.pkg.dev/laah-cybernetics/governance-stack/lula:0.9.5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "👀 Starting Lula SC-4 real-time watch..."

              # lula validate --watch blocks and re-validates on every
              # Kubernetes watch event for the SC-4 target resource
              # (the opa-compliance-status ConfigMap).
              #
              # On each validation, write the result and POST to compliance-bridge.
              while true; do
                AUDIT_ID="watch-$(date +%s)"
                RESULT_FILE="/tmp/oscal-sc4-${AUDIT_ID}.yaml"

                lula validate \
                  /compliance/lula-validation-sc4.yaml \
                  --output "${RESULT_FILE}" || true

                if [ -f "${RESULT_FILE}" ]; then
                  PAYLOAD_FILE="/tmp/payload-${AUDIT_ID}.json"
                  jq -n \
                    --arg auditId  "${AUDIT_ID}" \
                    --rawfile oscal "${RESULT_FILE}" \
                    '{"auditId": $auditId, "oscalYaml": $oscal}' \
                    > "${PAYLOAD_FILE}"

                  HTTP_STATUS=$(curl -s -o /dev/null \
                    -w "%{http_code}" \
                    -X POST \
                    -H "Content-Type: application/json" \
                    --data-binary "@${PAYLOAD_FILE}" \
                    http://compliance-bridge.governance-stack.svc.cluster.local:80/v1/audit/ingest)

                  echo "SC-4 watch: ingested ${AUDIT_ID}, HTTP ${HTTP_STATUS}"

                  # Clean up tmp files
                  rm -f "${RESULT_FILE}" "${PAYLOAD_FILE}"
                fi

                # Poll every 60 seconds.
                # lula --watch (if supported by the installed version) handles
                # event-driven re-validation; the sleep is a fallback for
                # versions that don't support persistent watch mode.
                sleep 60
              done
          volumeMounts:
            - name: compliance-manifests
              mountPath: /compliance
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pgrep -f 'lula|sleep' > /dev/null"]
            initialDelaySeconds: 30
            periodSeconds: 60
      volumes:
        - name: compliance-manifests
          configMap:
            name: lula-validation-manifests
