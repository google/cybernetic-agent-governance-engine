# -----------------------------------------------------------------------------
# One Kubernetes ServiceAccount per workload (POAM-2026-079 / AC-2 / AC-5 / AC-6)
#
# Each KSA that needs a cloud identity is annotated to its own GSA, created by
# infra/targets/gcp-gke/iam.tf, which also holds the Workload Identity binding.
# KSAs without the annotation have no cloud identity at all.
#
# The KSA name is also the workload's Linkerd SPIFFE identity
# (<sa>.<namespace>.serviceaccount.identity.linkerd.cluster.local), referenced
# by deployment/k8s/linkerd-mtls-policy.yaml.
#
# Replace <your-project-id> with your GCP project ID before applying.
#
#   KSA                        GSA                      KMS (key-level only)
#   -------------------------  -----------------------  -------------------------------
#   cage-gateway-sa            cage-gateway             signer: gateway-seal
#   cage-advisor-sa            cage-advisor             signer: gateway-seal (temporary)
#   cage-reconciler-sa         cage-reconciler          signer: reconciler-snapshot
#   cage-compliance-bridge-sa  cage-compliance-bridge   signer: compliance-evidence
#   cage-vllm-sa               cage-vllm                none
#   langfuse-sa                none                     none
#   cage-frontend-sa           none                     none
#   cage-benchmark-sa          cage-benchmark           signer: benchmark-signing (no verifier trusts it)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cage-gateway-sa
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/account-purpose: "governance-gateway"
  annotations:
    iam.gke.io/gcp-service-account: cage-gateway@<your-project-id>.iam.gserviceaccount.com
    compliance.nist.gov/control: "AC-5,AC-6,IA-3,SC-8"
    cage.io/poam: "POAM-007,POAM-011,POAM-2026-079"
---
