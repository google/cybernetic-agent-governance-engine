            span.set_attribute("nemo.action.outcome", "PASS_THROUGH_OPA_AUTHORITATIVE")
            span.set_attribute("nemo.action.stpa_ref", "SC-1")
            logger.debug(
                "CheckApprovalTokenAction: pass-through (OPA/safety_check_node is authoritative)"
            )
            return True


