---
# Policy: FTRA Egress Lockdown
# Restricts ingress to cage-gateway to only governance-validated sources.
# This is an INTERIM control — see header comment for removal criteria.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ftra-egress-lockdown
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: ftra-interim-control
    cage.io/control-type: compensating
    cage.io/poam: POAM-2026-030
  annotations:
    cage.io/description: "Interim compensating control for R-02/R-03: Trust-Boundary Bypass"
    cage.io/removal-criteria: "Remove when CAGE_FTRA_BOUNDARY_ENABLED=true is default"
    cage.io/reference: "docs/operations/FTRA_COMPENSATING_CONTROLS.md"
spec:
  # Target the cage-gateway pod
  podSelector:
    matchLabels:
      app: cage-gateway
  policyTypes:
    - Ingress
  ingress:
    # Only allow traffic from pods with governance-validated label
    # This label must be applied by the orchestrator/ingress after
    # confirming the request path includes FTRA validation.
    - from:
        - podSelector:
            matchLabels:
              governance-validated: "true"
      ports:
        - protocol: TCP
          port: 8080

---
# Policy: FTRA Gateway Ingress from Validated GFA
# Allows the governed-financial-advisor pod (which has in-graph ftra_node)
# to reach the gateway. GFA is trusted because it includes the ftra_node
# in its LangGraph workflow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ftra-allow-gfa-ingress
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: ftra-interim-control
    cage.io/control-type: compensating
    cage.io/poam: POAM-2026-030
  annotations:
    cage.io/description: "Allow GFA pod (with in-graph ftra_node) to reach gateway"
    cage.io/reference: "docs/operations/FTRA_COMPENSATING_CONTROLS.md"
spec:
  podSelector:
    matchLabels:
      app: cage-gateway
  policyTypes:
    - Ingress
  ingress:
    # GFA pod includes ftra_node in its graph — trusted source
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: governance-stack
          podSelector:
            matchLabels:
              app: governed-financial-advisor
      ports:
        - protocol: TCP
          port: 8080
    # Compliance bridge is also trusted (governance infrastructure)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: governance-stack
          podSelector:
            matchLabels:
              app: compliance-bridge
      ports:
        - protocol: TCP
          port: 8080

---
# Policy: FTRA Ingress Controller Passthrough
# Allows ingress controller to reach gateway for external API access.
# External requests via ingress are subject to FTRA boundary check
# when CAGE_FTRA_BOUNDARY_ENABLED=true.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ftra-allow-ingress-controller
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: ftra-interim-control
    cage.io/control-type: compensating
    cage.io/poam: POAM-2026-030
  annotations:
    cage.io/description: "Allow ingress controller to reach gateway (subject to FTRA boundary check)"
    cage.io/reference: "docs/operations/FTRA_COMPENSATING_CONTROLS.md"
spec:
  podSelector:
    matchLabels:
      app: cage-gateway
  policyTypes:
    - Ingress
  ingress:
    # Kubernetes Ingress Controller (nginx-ingress)
    # External traffic is subject to FTRA boundary check at controller level
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
