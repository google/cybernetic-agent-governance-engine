apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa-service
  namespace: governance-stack
  labels:
    app: opa
    compliance.iso42001/enabled: "true"
    compliance.iso42001/version: "2023"
  annotations:
    compliance.iso42001/controls: "A.5.3,SC-4,A.9.2,A.5.2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
        compliance.iso42001/enabled: "true"
      annotations:
        compliance.iso42001/controls: "A.5.3,SC-4,A.9.2,A.5.2"
        # opa label required by network-policy allow-opa-ingress-from-governance
    spec:
      containers:
        - name: opa
          image: openpolicyagent/opa:0.68.0-static
            - "run"
            - "--server"
            - "--addr=:8181"
            - "--diagnostic-addr=:8282"
            - "--config-file=/config/opa_config.yaml"
            # Kubernetes ConfigMap mounts create hidden symlink dirs (..data/, ..YYYY.../);
            # OPA loads every .rego under /policies recursively and would encounter each
            # file 3× via the live symlink, ..data, and the real path, causing
            # "multiple default rules" parse errors.  --ignore=..* suppresses all
            # hidden Kubernetes ConfigMap bookkeeping directories.
            - "--ignore=..*"
            - "/policies"
          ports:
            - containerPort: 8181
              name: http
            - containerPort: 8282
              name: diagnostics
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: policies
          configMap:
            name: opa-policies
        - name: config
          configMap:
            name: opa-runtime-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policies
  namespace: governance-stack
  labels:
    app: opa
    compliance.iso42001/enabled: "true"
  annotations:
    compliance.iso42001/controls: "A.5.3,SC-4,A.9.2,A.5.2"
    # POLICY ALLOWLIST: Only trade_governance.rego is evaluated.
    # finance_policy.rego, generated_rules.rego, and trade_policy.rego are
    # DEPRECATED and must NOT be added here (see deployment/opa_config.yaml).
data:
  # The trade_governance.rego policy is now part of the cage_finance plugin package
  # and is dynamically mounted by the Terraform deployment modules (e.g. infra/targets/gcp-gke).
  # See src/cage_finance/opa/trade_governance.rego for the authoritative source.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-compliance-status
  namespace: governance-stack
  labels:
    app: opa
    compliance.iso42001/enabled: "true"
  annotations:
    compliance.iso42001/controls: "A.5.3,SC-4,A.9.2,A.5.2"
data:
  policy_version: "v1.4.0"
  controls_enforced: "A.5.3,SC-4,A.9.2,A.5.2"
  standard: "ISO/IEC 42001:2023"
---
apiVersion: v1
kind: Service
metadata:
  name: opa-service
  namespace: governance-stack
spec:
  selector:
    app: opa
  ports:
    - port: 8181
      targetPort: 8181
      protocol: TCP
      name: http
    - port: 8282
      targetPort: 8282
      protocol: TCP
      name: diagnostics
  type: ClusterIP
