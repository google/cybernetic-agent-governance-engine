# H-15: TLS termination added for all paths.
# Langfuse contains compliance evidence, audit traces, and LLM interaction logs
# (which may contain PII and financial data).  Transmitting these over HTTP
# violates SC-8 (Transmission Confidentiality) and GDPR Art. 32.
#
# Prerequisites:
#   1. cert-manager installed in the cluster:
#      kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
#   2. ClusterIssuer configured (see deployment/k8s/cert-manager-issuer.yaml)
#   3. DNS A record pointing governance.example.com to the ingress IP
#
# To obtain the ingress IP after apply:
#   kubectl get ingress governance-ingress -n governance-stack -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
#
# NIST SP 800-53: SC-8 (Transmission Confidentiality and Integrity)
# GDPR Art. 32: Security of processing — encryption in transit
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: governance-ingress
  namespace: governance-stack
  annotations:
    kubernetes.io/ingress.class: "gce"
    # NEG annotation: required for GKE Ingress to route to ClusterIP services.
    # Without this, the GCE ingress controller cannot create backend services
    # for ClusterIP-type services. The NEG controller creates Network Endpoint
    # Groups that the load balancer uses directly.
    # Applied to both governed-financial-advisor and langfuse-web services.
    # H-15: Force HTTPS redirect — HTTP requests are redirected to HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
      more_set_headers "Content-Security-Policy: default-src 'self'; frame-ancestors 'none';";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
    # cert-manager will provision and renew the TLS certificate automatically
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # H-15: TLS termination — cert-manager provisions the certificate
  tls:
    - hosts:
        - governance.example.com   # Replace with actual domain
      secretName: governance-ingress-tls
  rules:
  - host: governance.example.com   # Replace with actual domain
    http:
      paths:
      - path: /agent
        pathType: Prefix
        backend:
          service:
            name: governed-financial-advisor
            port:
              number: 80
      - path: /langfuse
        pathType: Prefix
        backend:
          service:
            name: langfuse-web
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: langfuse-web
            port:
              number: 80
