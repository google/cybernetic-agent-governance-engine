# Standard nginx ingress — compatible with any Kubernetes cluster (GKE, EKS, AKS, OpenShift, vanilla k8s).
# Requires: nginx ingress controller (https://kubernetes.github.io/ingress-nginx/)
# For TLS: use cert-manager (https://cert-manager.io/) or provide a pre-existing Secret named 'cage-tls'.
# For GKE-specific GCE L7 load balancer + ManagedCertificate, see deployment/k8s/gcp/ingress-gke.yaml
#
# POAM-011 / SC-8: TLS termination for the gateway service.
#
# This Ingress terminates TLS at the nginx ingress controller using either:
#   a) cert-manager with a ClusterIssuer (recommended for automated renewal), or
#   b) a manually provisioned Secret named 'cage-tls' in the governance-stack namespace.
#
# TLS certificate provisioning (cert-manager):
#   Annotate with cert-manager.io/cluster-issuer: "letsencrypt-prod" and ensure
#   cert-manager is installed: https://cert-manager.io/docs/installation/
#   The certificate is provisioned automatically once DNS resolves.
#
# Prerequisites:
#   - nginx ingress controller installed (https://kubernetes.github.io/ingress-nginx/)
#   - TLS Secret 'cage-tls' exists in governance-stack namespace, OR cert-manager is configured
#   - DNS record gateway.laah.altostrat.com must resolve to the nginx ingress LoadBalancer IP
#
# To obtain the ingress IP after apply:
#   kubectl get ingress gateway-ingress -n governance-stack \
#     -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
#
# NIST SP 800-53: SC-8 (Transmission Confidentiality and Integrity)
# NIST SP 800-52 Rev. 2: TLS 1.2 minimum for federal information systems
# GDPR Art. 32: Security of processing — encryption in transit
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  namespace: governance-stack
  annotations:
    # Standard nginx ingress class — works on any Kubernetes distribution.
    kubernetes.io/ingress.class: "nginx"
    # H-15: Force HTTPS redirect — HTTP requests are redirected to HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
      more_set_headers "Content-Security-Policy: default-src 'self'; frame-ancestors 'none';";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
    # cert-manager will provision and renew the TLS certificate automatically.
    # Remove this annotation if providing a pre-existing Secret named 'cage-tls'.
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - gateway.laah.altostrat.com
      # cert-manager will create and manage this Secret automatically when the
      # cert-manager.io/cluster-issuer annotation is set above.
      # For manual TLS: create a Secret named 'cage-tls' with tls.crt and tls.key.
      secretName: cage-tls
  rules:
    - host: gateway.laah.altostrat.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
