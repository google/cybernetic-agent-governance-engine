apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-worker
  namespace: governance-stack
  labels:
    app: langfuse-worker
spec:
  replicas: 2 # Managed by HPA but matching the live baseline
  selector:
    matchLabels:
      app: langfuse-worker
  template:
    metadata:
      labels:
        app: langfuse-worker
    spec:
      serviceAccountName: "financial-advisor-sa"
      securityContext:
        fsGroup: 65532
      # Cost Optimization: Prefer Spot nodes (soft affinity allows fallback to on-demand)
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: cloud.google.com/gke-spot
                    operator: In
                    values:
                      - "true"
      # Required for GKE Spot node scheduling
      tolerations:
        - key: "cloud.google.com/gke-spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "present"
          effect: "NoSchedule"
      terminationGracePeriodSeconds: 120 # Time for async traces to finish
      containers:
        - name: worker
          image: langfuse/langfuse-worker:3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 60"]
          env:
            - name: DATABASE_URL
              value: "postgresql://REDACTED:REDACTED@postgresql.governance-stack.svc.cluster.local:5432/langfuse"
            - name: CLICKHOUSE_URL
              value: "http://clickhouse.governance-stack.svc.cluster.local:8123"
            - name: CLICKHOUSE_USER
              value: "default"
            - name: CLICKHOUSE_PASSWORD
              value: "ja8oXQmCBZld6NHkKI0PV09SEkqzMgOX"
            - name: CLICKHOUSE_PORT
              value: "8123"
            - name: LANGFUSE_INGESTION_CLICKHOUSE_WRITE_INTERVAL_MS
              value: "1000"
            - name: LANGFUSE_INGESTION_CLICKHOUSE_WRITE_BATCH_SIZE
              value: "1"
            - name: REDIS_CONNECTION_STRING
              value: "redis://REDACTED@redis-node-0.redis-headless.governance-stack.svc.cluster.local:6379"
            - name: REDIS_URL
              value: "redis://REDACTED@redis-node-0.redis-headless.governance-stack.svc.cluster.local:6379"
            - name: REDIS_HOST
              value: "redis-node-0.redis-headless.governance-stack.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: LOG_LEVEL
              value: "debug"
            - name: LANGFUSE_LOG_LEVEL
              value: "debug"
            - name: CLICKHOUSE_CLUSTER_ENABLED
              value: "false"
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENABLED
              value: "true"
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
              value: "https://storage.googleapis.com"
            - name: AWS_ENDPOINT_URL_S3
              value: "https://storage.googleapis.com"
            - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
              valueFrom:
                secretKeyRef:
                  name: oscal-artifact-secrets
                  key: bucket-name
            - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
              value: "auto"
            - name: AWS_S3_PATH_STYLE_ACCESS
              value: "true"
            - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: oscal-artifact-secrets
                  key: hmac-access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: oscal-artifact-secrets
                  key: hmac-secret-key
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: oscal-artifact-secrets
                  key: hmac-access-key
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: oscal-artifact-secrets
                  key: hmac-secret-key
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: salt
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: encryption-key
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: langfuse-worker-hpa
  namespace: governance-stack
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: langfuse-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
