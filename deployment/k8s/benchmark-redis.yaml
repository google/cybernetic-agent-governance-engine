# Throwaway Redis for the manual paper benchmark (benchmark-job.yaml).
#
# Both measurement scripts write CBF state, the fence epoch and snapshot keys,
# so they must never run against the shared redis-master that the gateway
# uses. scripts/run_gke_benchmark_job.sh applies this file before the job and
# deletes it afterwards; nothing here is persisted.
#
# Topology: one primary and one replica behind separate Services, so a
# CAGE_REDIS_WAIT_REPLICAS=1 commit pays the same replication round trip as
# the shipped posture. Separate pods (not a sidecar) keep the network hop in
# the measured latency. Only benchmark pods may connect (NetworkPolicy); the
# data is synthetic, so no password is configured.
#
# ${BENCHMARK_REDIS_IMAGE} is substituted by the runner. It defaults to the
# Docker Hub pin used by .github/workflows/locust-nightly.yml; a cluster that
# enforces Binary Authorization needs an attested mirror instead.
apiVersion: v1
kind: Service
metadata:
  name: benchmark-redis
  namespace: governance-stack
  labels:
    app.kubernetes.io/name: benchmark-redis
    app.kubernetes.io/part-of: cybernetic-governance-engine
    cage.io/benchmark-purpose: "paper-evaluation"
spec:
  selector:
    app: benchmark-redis
    role: primary
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-redis-primary
  namespace: governance-stack
  labels:
    app.kubernetes.io/name: benchmark-redis
    cage.io/benchmark-purpose: "paper-evaluation"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: benchmark-redis
      role: primary
  template:
    metadata:
      labels:
        app: benchmark-redis
        role: primary
        cage.io/benchmark-purpose: "paper-evaluation"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: ${BENCHMARK_REDIS_IMAGE}
          args: ["--save", "", "--appendonly", "no", "--protected-mode", "no"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-redis-replica
  namespace: governance-stack
  labels:
    app.kubernetes.io/name: benchmark-redis
    cage.io/benchmark-purpose: "paper-evaluation"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: benchmark-redis
      role: replica
  template:
    metadata:
      labels:
        app: benchmark-redis
        role: replica
        cage.io/benchmark-purpose: "paper-evaluation"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: ${BENCHMARK_REDIS_IMAGE}
          args:
            - "--save"
            - ""
            - "--appendonly"
            - "no"
            - "--protected-mode"
            - "no"
            - "--replicaof"
            - "benchmark-redis.governance-stack.svc.cluster.local"
            - "6379"
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "redis-cli info replication | grep -q 'master_link_status:up'"
            periodSeconds: 2
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: benchmark-redis-ingress
  namespace: governance-stack
  labels:
    cage.io/benchmark-purpose: "paper-evaluation"
spec:
  podSelector:
    matchLabels:
      app: benchmark-redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cage-paper-benchmark
        - podSelector:
            matchLabels:
              app: benchmark-redis
      ports:
        - port: 6379
          protocol: TCP
