apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemo-service
  namespace: governance-stack
  labels:
    app: nemo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nemo
  template:
    metadata:
      labels:
        app: nemo
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nemo
          # To use a different registry (e.g., ECR, ACR, Docker Hub), override IMAGE_REGISTRY:
          #   image: ${IMAGE_REGISTRY:-gcr.io}/YOUR_GCP_PROJECT_ID/nemo-guardrails:latest
          # Or use kustomize: kustomize edit set image gcr.io/YOUR_GCP_PROJECT_ID/nemo-guardrails=<your-registry>/nemo-guardrails:latest
          # IMAGE_REGISTRY can be overridden via kustomize or helm values (default: gcr.io)
          image: gcr.io/YOUR_GCP_PROJECT_ID/nemo-guardrails:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: advisor-secrets
                  key: OPENAI_API_KEY
            - name: VLLM_BASE_URL
              value: "http://vllm-service.governance-stack.svc.cluster.local:8000"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              # Langfuse v3 native OTLP ingestion — no separate collector needed.
              value: "http://langfuse-web.governance-stack.svc.cluster.local:3000/api/public/otel/v1/traces"
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: advisor-secrets
                  key: LANGFUSE_BASIC_AUTH_HEADER
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_SERVICE_NAME
              value: "nemo-guardrails"
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: nemo-service
  namespace: governance-stack
spec:
  selector:
    app: nemo
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
