apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: governance-stack
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:RELEASE.2024-01-31T20-20-33Z
        args:
        - server
        - /data
        - --console-address
        - :9001
        env:
        - name: MINIO_ROOT_USER
          value: "minioadmin"
        - name: MINIO_ROOT_PASSWORD
          value: "minioadmin"
        ports:
        - containerPort: 9000
        - containerPort: 9001
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"  # Reduced from 256Mi to fit on standard nodes
          limits:
            cpu: "500m"
            memory: "256Mi"  # Reduced from 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: governance-stack
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
  type: ClusterIP
