apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: llm-gateway
  namespace: default
spec:
  # Cloud-agnostic: use nginx GatewayClass (installed via Helm: kubernetes/ingress-nginx).
  # On GKE, replace with "gke-l7-gxlb" if preferred; on EKS use "nginx" or "alb".
  gatewayClassName: nginx
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      kinds:
      - kind: HTTPRoute
