apiVersion: batch/v1
kind: Job
metadata:
  name: cage-paper-benchmark
  namespace: governance-stack
  labels:
    app.kubernetes.io/name: cage-paper-benchmark
    app.kubernetes.io/part-of: cybernetic-governance-engine
    cage.io/benchmark-purpose: "paper-evaluation"
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400  # Retain pod/logs for 24h
  template:
    metadata:
      labels:
        app: cage-paper-benchmark
        cage.io/benchmark-purpose: "paper-evaluation"
    spec:
      restartPolicy: Never
      serviceAccountName: cage-benchmark-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: benchmark-runner
          # BENCHMARK_IMAGE, GOOGLE_CLOUD_PROJECT and CAGE_ENVIRONMENT are
          # substituted by scripts/run_gke_benchmark_job.sh (those three
          # only). BENCHMARK_IMAGE
          # is <registry>/gateway@sha256:<digest>, resolved
          # from the commit-SHA tag Cloud Build pushed: Binary Authorization
          # admits digest references only. The gateway image, because the
          # benchmark builds the governor in-process: it is the image that
          # installs the project (cage.plugins entry points) and the only one
          # meant to hold governance state.
          image: ${BENCHMARK_IMAGE}
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eo pipefail
              echo "================================================================="
              echo "🚀 [CAGE GKE In-Cluster Benchmark] Initializing..."
              echo "================================================================="
              echo "Host pod: $(hostname)"
              echo "Backend:  ${BACKEND_URL}"
              echo "Redis:    ${REDIS_HOST}:${REDIS_PORT}"
              echo "Date:     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo ""

              # 1. Warm-up inference pipeline to eliminate GPU/KV-cache cold start jitter
              echo "🔥 [Step 1/3] Pre-warming gateway & inference pipeline..."
              python3 -c "import urllib.request; [urllib.request.urlopen('http://gateway.governance-stack.svc.cluster.local:8080/health', timeout=5) for _ in range(3)]" 2>/dev/null || true
              echo "   Warm-up completed."
              echo ""

              # 2. Run Paper Metrics Collection (§6.2, §6.6). --unmocked builds
              #    the governor over the real Redis CBF, OPA and consensus
              #    backends below ("Table 2b: over-the-wire, in-cluster").
              echo "📊 [Step 2/3] Running scripts/measure_paper_metrics.py --unmocked..."
              cd /app || cd /
              python3 scripts/measure_paper_metrics.py --unmocked
              echo ""

              # 3. Run Reconciliation Metrics Collection (§6.3, §6.4, §6.5)
              # Signs snapshots as the reconciler (RECONCILER_KMS_KEY). The
              # gateway key is unset for this step: trust.py refuses a
              # reconciler key equal to the gateway key (G8).
              echo "📊 [Step 3/3] Running scripts/measure_reconciliation_metrics.py..."
              env -u KMS_GOVERNANCE_KEY python3 scripts/measure_reconciliation_metrics.py || {
                echo "⚠️  Reconciliation benchmark completed with warnings/skips (check KMS/Redis availability)."
              }
              echo ""

              echo "================================================================="
              echo "✅ [CAGE GKE In-Cluster Benchmark] Measurement run complete."
              echo "================================================================="
              echo "--- Paper Metrics Summary ---"
              cat /tmp/cage_paper_metrics.txt || true
              echo ""
              echo "--- Reconciliation Summary ---"
              cat /tmp/cage_reconciliation_metrics.txt || true

              # kubectl cp needs a running container. Signal completion and
              # stay up until run_gke_benchmark_job.sh has copied /tmp/*
              # and deleted the Job (or the harvest window expires).
              touch /tmp/cage_benchmark_done
              sleep "${HARVEST_WINDOW_S:-900}"
          env:
            - name: CAGE_DOMAIN  # exactly one domain per process
              value: "finance"
            - name: CAGE_ENV
              value: "development"
            - name: BACKEND_URL
              value: "http://governed-financial-advisor.governance-stack.svc.cluster.local:80"
            - name: GATEWAY_URL
              value: "http://gateway.governance-stack.svc.cluster.local:8080"
            # Throwaway primary+replica from benchmark-redis.yaml. Never the
            # shared redis-master: both scripts write CBF, fence and snapshot
            # keys, and measure_reconciliation_metrics.py refuses a Redis that
            # already holds state unless --force is passed.
            - name: REDIS_HOST
              value: "benchmark-redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_URL
              value: "redis://benchmark-redis.governance-stack.svc.cluster.local:6379/0"
            - name: CAGE_REDIS_WAIT_REPLICAS
              value: "1"
            # Real backends for --unmocked. Both consensus fallbacks point at
            # vllm-reasoning, the only vLLM deployment the runner scales up.
            - name: OPA_URL
              value: "http://opa.governance-stack.svc.cluster.local:8181"
            - name: VLLM_REASONING_API_BASE
              value: "http://vllm-reasoning.governance-stack.svc.cluster.local:8000/v1"
            - name: VLLM_FAST_API_BASE
              value: "http://vllm-reasoning.governance-stack.svc.cluster.local:8000/v1"
            - name: MODEL_REASONING
              value: "deepseek-ai/DeepSeek-R1-Distill-Llama-8B"
            - name: MODEL_FAST
              value: "deepseek-ai/DeepSeek-R1-Distill-Llama-8B"
            - name: LATENCY_RUNS
              value: "200"
            - name: REQUEST_TIMEOUT_S
              value: "180"
            - name: HARVEST_WINDOW_S
              value: "900"
            # Benchmark-only key (terraform output benchmark_signing_key_version).
            # No verifier trusts it, so benchmark signatures carry no authority
            # (POAM-2026-079). Keyring name is cage-signing-<environment>; the runner
            # substitutes CAGE_ENVIRONMENT.
            - name: KMS_GOVERNANCE_KEY
              value: "projects/${GOOGLE_CLOUD_PROJECT}/locations/us-central1/keyRings/cage-signing-${CAGE_ENVIRONMENT}/cryptoKeys/benchmark-signing/cryptoKeyVersions/1"
            # Reconciler identity for measure_reconciliation_metrics.py. Same
            # benchmark-only key: only the benchmark process's own in-process
            # verifier trusts it, never the gateway's CBF.
            - name: RECONCILER_KMS_KEY
              value: "projects/${GOOGLE_CLOUD_PROJECT}/locations/us-central1/keyRings/cage-signing-${CAGE_ENVIRONMENT}/cryptoKeys/benchmark-signing/cryptoKeyVersions/1"
            - name: ADVERSARIAL_JSON
              value: "/app/tests/red_team/adversarial_dataset.json"
            - name: BENIGN_JSON
              value: "/app/tests/red_team/benign_dataset.json"
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: red-team-datasets-vol
              mountPath: /app/tests/red_team
            - name: benchmark-scripts-vol
              mountPath: /app/scripts
      volumes:
        - name: red-team-datasets-vol
          configMap:
            name: red-team-datasets
        - name: benchmark-scripts-vol
          configMap:
            name: benchmark-scripts
