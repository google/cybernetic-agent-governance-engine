apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference-streaming
  namespace: governance-stack
  labels:
    app: vllm-inference-streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-inference-streaming
  template:
    metadata:
      labels:
        app: vllm-inference-streaming
    spec:
      serviceAccountName: financial-advisor-sa
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "16Gi"
      containers:
        - name: vllm
          # NOTE: Image must have `pip install vllm[runai]` installed
          image: ${IMAGE_NAME}
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "64Gi"
              cpu: "16"
            requests:
              nvidia.com/gpu: "1"
              memory: "16Gi"
              cpu: "4"
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
            # vLLM Tensorizer: stream weights from MinIO (S3-compatible, cloud-agnostic)
            # Replaces: Run:ai Streamer (proprietary) + GCS endpoint
            - name: S3_ENDPOINT_URL
              value: "http://minio.governance-stack.svc.cluster.local:9000"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secret-key
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 15
          command:
            - "vllm"
            - "serve"
            - "${MODEL_PATH}"
            - "--load-format"
            - "tensorizer"
            - "--model-loader-extra-config"
            - '{"s3_endpoint": "http://minio.governance-stack.svc.cluster.local:9000", "s3_access_key_id": "$(AWS_ACCESS_KEY_ID)", "s3_secret_access_key": "$(AWS_SECRET_ACCESS_KEY)"}'
            - "--port"
            - "8000"
            - "--trust-remote-code"
      nodeSelector:
        cloud.google.com/gke-gpu: "true"
        cloud.google.com/gke-accelerator: nvidia-l4
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "cloud.google.com/gke-spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
