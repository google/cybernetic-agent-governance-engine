apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: governance-stack
  labels:
    app: vllm-inference
    cage.governance/cross-namespace-proxy: "true"
spec:
  type: ExternalName
  externalName: vllm-service.vllm-inference.svc.cluster.local
  ports:
  - port: 8000
    protocol: TCP
    name: http
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-reasoning
  namespace: governance-stack
  labels:
    app: vllm-reasoning
    cage.governance/cross-namespace-proxy: "true"
spec:
  type: ExternalName
  externalName: vllm-reasoning.vllm-inference.svc.cluster.local
  ports:
  - port: 8000
    protocol: TCP
    name: http
