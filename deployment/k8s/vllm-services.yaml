# ── Cross-namespace ExternalName Services ────────────────────────────────────
# vLLM Deployments run in the vllm-inference namespace (PSA: baseline) to allow
# GPU/root access. These ExternalName Services in governance-stack proxy requests
# to the real Services in vllm-inference, so existing env vars in financial-advisor
# and gateway (e.g. vllm-service.governance-stack.svc.cluster.local) need no changes.
#
# Real ClusterIP Services (with pod selectors) live in vllm-inference namespace:
#   deployment/k8s/vllm-cross-namespace-services.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: governance-stack
  labels:
    app: vllm-inference
    cage.governance/cross-namespace-proxy: "true"
spec:
  type: ExternalName
  externalName: vllm-service.vllm-inference.svc.cluster.local
  ports:
  - port: 8000
    protocol: TCP
    name: http
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-reasoning
  namespace: governance-stack
  labels:
    app: vllm-reasoning
    cage.governance/cross-namespace-proxy: "true"
spec:
  type: ExternalName
  externalName: vllm-reasoning.vllm-inference.svc.cluster.local
  ports:
  - port: 8000
    protocol: TCP
    name: http
