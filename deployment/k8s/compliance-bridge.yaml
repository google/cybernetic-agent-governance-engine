---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-bridge
  namespace: governance-stack
  labels:
    app: compliance-bridge
    compliance.iso42001/component: "evidence-bridge"
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compliance-bridge
  template:
    metadata:
      labels:
        app: compliance-bridge
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: financial-advisor-sa
      containers:
        - name: compliance-bridge
          # Set IMAGE_REGISTRY to your container registry prefix (e.g. gcr.io/your-project, ghcr.io/your-org)
          # Override with: kubectl set image deployment/compliance-bridge compliance-bridge=<your-registry>/compliance-bridge:latest
          # Or use kustomize: kustomize edit set image gcr.io/YOUR_PROJECT_ID/compliance-bridge=<your-registry>/compliance-bridge:latest
          # IMAGE_REGISTRY can be overridden via kustomize or helm values (default: gcr.io)
          image: gcr.io/YOUR_PROJECT_ID/compliance-bridge:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3001
              name: http
          env:
            # Main Langfuse project (application performance metrics)
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: public-key
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: secret-key
            - name: LANGFUSE_HOST
              value: "http://langfuse-web.governance-stack.svc.cluster.local"

            # Dedicated Langfuse compliance project (audit traces isolated from app metrics)
            - name: LANGFUSE_COMPLIANCE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-compliance-secrets
                  key: public-key
            - name: LANGFUSE_COMPLIANCE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-compliance-secrets
                  key: secret-key

            # ---------------------------------------------------------------------------
            # S3-compatible artifact storage (ISO 42001 A.7.5 evidence)
            # Supports any S3-compatible backend: AWS S3, MinIO, Ceph, or GCS via interop.
            # GCS interop: https://cloud.google.com/storage/docs/authentication/hmackeys
            # ---------------------------------------------------------------------------
            - name: OSCAL_S3_ENDPOINT
              value: ""  # Set to your S3-compatible endpoint: https://s3.amazonaws.com, http://minio:9000, or https://storage.googleapis.com (GCS)
            # DEP-07: OSCAL_S3_REGION must not be "auto" — it must reflect the
            # GCS bucket region for the active jurisdiction to satisfy data residency
            # requirements (GDPR Art. 44 / MAS TRM §4.2).
            # Sourced from oscal-artifact-secrets so deploy_all.sh / Terraform can
            # inject the correct region per CAGE_DEPLOYMENT_REGION:
            # US_FED → us-central1 | EU_ECB → europe-west1 | APAC_MAS → asia-southeast1
            - name: OSCAL_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: oscal-artifact-secrets
                  key: gcs-region
                  optional: false
            - name: OSCAL_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: oscal-artifact-secrets
                  key: bucket-name
            - name: OSCAL_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: oscal-artifact-secrets
                  key: hmac-access-key
            - name: OSCAL_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: oscal-artifact-secrets
                  key: hmac-secret-key

            # Critical control failure alerting (Slack or PagerDuty webhook)
            - name: COMPLIANCE_ALERT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: compliance-alert-secrets
                  key: webhook-url
                  optional: true   # Non-blocking if not configured; falls back to ConsoleNotifier

            # Alert channel: "slack" | "console" (default) | "mock"
            # Kept as "console" in dev — no real Slack/PagerDuty endpoint configured.
            # Upgrade to "slack" or "pagerduty" in prod with COMPLIANCE_ALERT_WEBHOOK_URL set.
            - name: ALERT_CHANNEL
              value: "console"

            # Cold-start grace period configuration
            # DEPLOYMENT_START_UTC is patched by the CI pipeline at deploy time
            # DEPLOYMENT_START_UTC is set at deploy time via `kubectl set env` by deploy_sw.py.
            # Leaving it unset here lets the module default to datetime.now() (safe fallback).
            - name: STARTUP_GRACE_HOURS
              value: "6"

            # vLLM remediation model settings (preserved from live deployment)
            - name: REMEDIATION_MODEL
              value: ""  # Set to your model artifact path, e.g. gs://your-bucket/models--Qwen--Qwen2.5-7B-Instruct/snapshots/<sha>
            - name: REMEDIATION_MAX_TOKENS
              value: "2048"
            - name: REMEDIATION_TIMEOUT_MS
              value: "30000"
            - name: VLLM_BASE_URL
              value: "http://vllm-service.governance-stack.svc.cluster.local:8000/v1"
            - name: VLLM_API_KEY
              value: "EMPTY"

            # Redis credentials — sourced from redis-credentials secret (§9 compliance)
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_URL

            # CAGE_DEPLOYMENT_REGION controls which compliance framework controls
            # are active (US_FED → NIST SP 800-53 / FedRAMP; EU_ECB → EU AI Act;
            # APAC_MAS → MAS FEAT). Without this, only universal ISO 42001 controls load.
            - name: CAGE_DEPLOYMENT_REGION
              value: "US_FED"

            - name: PORT
              value: "3001"

          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            # dowhy + matplotlib import takes ~100s on first startup.
            # initialDelaySeconds must exceed that to avoid premature liveness kills.
            initialDelaySeconds: 150
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            # Allow full startup before routing traffic.
            initialDelaySeconds: 150
            periodSeconds: 10
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          # Memory increased from 256Mi to 512Mi to accommodate dowhy + matplotlib
          # (causal gatekeeper Tier 6 — No-Direct-Bind Gap 4 fix).
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: compliance-bridge
  namespace: governance-stack
  labels:
    app: compliance-bridge
spec:
  selector:
    app: compliance-bridge
  ports:
    - port: 80
      targetPort: 3001
      protocol: TCP
      name: http
  type: ClusterIP
