---
apiVersion: v1
kind: Secret
metadata:
  name: oscal-artifact-secrets
  namespace: governance-stack
  labels:
    app: compliance-bridge
    compliance.iso42001/component: "artifact-storage"
  annotations:
    # Populated by CI pipeline or kubectl — env vars / K8s Secrets only (no GSM)
    secrets.managed-by: "kubernetes-secret"
type: Opaque
stringData:
  # GCS bucket name (e.g. my-project-oscal-artifacts)
  bucket-name: "REPLACE_ME"
  # GCS HMAC Access Key ID
  hmac-access-key: "REPLACE_ME"
  # GCS HMAC Secret
  hmac-secret-key: "REPLACE_ME"
