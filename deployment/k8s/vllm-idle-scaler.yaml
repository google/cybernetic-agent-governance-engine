# DEPRECATED: This file is superseded by dev-gpu-schedule.yaml (2026-08-12).
# The Redis-based idle-detection approach has been replaced with a simpler
# nightly schedule. Remove this file once dev-gpu-schedule.yaml is validated.

# ============================================================================
# vLLM Idle-Detection Scale-to-Zero — CAGE Cost Optimisation
# ============================================================================
#
# Motivation
# ----------
# The GKE cluster autoscaler's gpu_node_pool_min_count=0 lets it drain GPU
# nodes when no GPU pod is scheduled. However, the autoscaler only removes a
# node AFTER every pod on it is gone. With replicas=1 the vLLM Deployments
# keep a GPU pod alive indefinitely — even during idle overnight periods.
#
# This file implements a two-CronJob idle-detection loop:
#
#   1. vllm-idle-detector (every 15 min)
#      Polls the vLLM fast model's Prometheus /metrics endpoint for the
#      vllm:request_success_total counter. On each run:
#        • If the counter has increased since the last run → update the
#          last_active timestamp and the stored baseline in the ConfigMap.
#        • If the counter is unchanged AND ≥ 2 hours have elapsed since
#          last_active AND either Deployment has replicas > 0 → scale both
#          Deployments to 0 replicas (triggering GPU node drain ~10 min later).
#        • If both Deployments are already at 0 → log "already scaled down".
#
#   2. vllm-wakeup-checker (every 5 min)
#      Checks whether either Deployment is at 0 replicas AND there are
#      pending inference requests in the gateway's Redis queue
#      (key: vllm:pending_requests). If so, scales both back to 1 replica.
#
# Namespace note
# ---------------
# Both vLLM Deployments live in: vllm-inference
#   • vllm-inference   (fast model, e.g. Qwen/Llama 8B)
#   • vllm-reasoning   (reasoning model, e.g. DeepSeek-R1 distill)
# The vllm-inference Service exposes both models on port 8000.
# Prometheus metrics are available at :8000/metrics per vLLM default.
#
# Image choice
# ------------
# NOTE (2026-08-11, debug finding): gcr.io/google.com/cloudsdktool/cloud-sdk:slim
# does NOT bundle a kubectl binary (verified empirically at runtime:
# "kubectl: command not found"). Each CronJob's main container now uses
# bitnami/kubectl (has kubectl + bash). Any network tool (curl / redis-cli)
# runs in a small initContainer that writes its result to a shared emptyDir,
# which the main container then reads. This avoids fragile static-binary
# copying across distros while keeping every container minimal.
#
# Secrets / RBAC
# ---------------
# The ScalerSA ServiceAccount is granted a namespaced Role (vllm-scaler-role)
# with least-privilege verbs only (no cluster-wide access). Redis password for
# the wake-up checker is sourced from the advisor-secrets Secret via
# secretKeyRef — no credentials are embedded in this manifest.
# ============================================================================

---
# ============================================================================
# ConfigMap: vllm-idle-tracker
# State store for the idle-detection loop. Updated in-place by the CronJob.
# Fields:
#   last_active        — Unix epoch string of the last time active traffic
#                        was observed. Empty string = "never seen traffic;
#                        treat as active (don't scale on first run)".
#   request_baseline   — The vllm:request_success_total counter value
#                        observed at last_active. Used as the reference point
#                        for delta detection on the next run.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-idle-tracker
  namespace: governance-stack
  labels:
    app: vllm-idle-scaler
    cage.io/purpose: cost-optimisation
  annotations:
    cage.io/description: >
      Idle-detection state for vLLM GPU Deployments. Written by the
      vllm-idle-detector CronJob every 15 minutes. Do not edit manually
      while the CronJob is running — the CronJob uses --type=merge patch
      which is not atomic; concurrent edits may be lost.
data:
  # Epoch timestamp of the last observed active request. Empty = bootstrap
  # (treat as "just now active" to avoid scaling on the very first run).
  last_active: ""
  # Last observed value of vllm:request_success_total. "0" = baseline.
  request_baseline: "0"

---
# ============================================================================
# ServiceAccount: vllm-scaler-sa
# Used by all three CronJobs in this file.
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm-scaler-sa
  namespace: governance-stack
  labels:
    app: vllm-idle-scaler
    cage.io/purpose: cost-optimisation

---
# ============================================================================
# Role: vllm-scaler-role
# Namespaced (vllm-inference only) — principle of least privilege.
# Grants:
#   • deployments     get + patch  (for replicas check and kubectl scale)
#   • configmaps      get + create + update (for idle-tracker state)
#   • services        get          (optional: for service existence check)
# ============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vllm-scaler-role
  namespace: governance-stack
  labels:
    app: vllm-idle-scaler
    cage.io/purpose: cost-optimisation
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
    # Note: kubectl scale uses PATCH on the deployments/scale subresource.
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]

---
# ============================================================================
# RoleBinding: vllm-scaler-rolebinding
# Binds vllm-scaler-sa to vllm-scaler-role within vllm-inference namespace.
# ============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vllm-scaler-rolebinding
  namespace: governance-stack
  labels:
    app: vllm-idle-scaler
    cage.io/purpose: cost-optimisation
subjects:
  - kind: ServiceAccount
    name: vllm-scaler-sa
    namespace: governance-stack
roleRef:
  kind: Role
  name: vllm-scaler-role
  apiGroup: rbac.authorization.k8s.io

---
# ============================================================================
# CronJob: vllm-idle-detector
# Schedule: every 15 minutes
# Namespace: vllm-inference
#
# Idle-detection algorithm (2-hour window):
#   1. Fetch vllm:request_success_total from :8000/metrics on vllm-inference.
#   2. Read stored baseline + last_active from the vllm-idle-tracker ConfigMap.
#   3. If current_counter > baseline → ACTIVE: update last_active to now,
#      update baseline to current_counter. Done.
#   4. If current_counter == baseline (no new requests since last run):
#      a. If last_active is empty (bootstrap) → set last_active=now. Done.
#      b. Compute idle_seconds = now - last_active.
#      c. If idle_seconds < 7200 (2 hours) → log "idle X min, not yet". Done.
#      d. If idle_seconds >= 7200:
#         i.  Get replicas for vllm-inference and vllm-reasoning.
#         ii. If both are already 0 → log "already scaled to 0". Done.
#         iii.Scale both Deployments to 0 replicas. Log result.
#
# Note on metric endpoint:
#   The vLLM fast model Service is named "vllm-inference" in namespace
#   "vllm-inference" (matching the Deployment name rendered by
#   vllm-deployment.yaml.tpl with APP_NAME=vllm-inference). Adjust the
#   METRICS_URL env var below if your Service name differs.
# ============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vllm-idle-detector
  namespace: governance-stack
  labels:
    app: vllm-idle-scaler
    cage.io/purpose: cost-optimisation
  annotations:
    cage.io/description: >
      Polls vLLM Prometheus metrics every 15 minutes. Scales both vLLM
      Deployments to 0 replicas when no requests have been served for ≥ 2 hours.
      GPU node drain follows automatically via the GKE cluster autoscaler
      (~10 min after last GPU pod is evicted).
spec:
  schedule: "*/15 * * * *"   # Every 15 minutes
  concurrencyPolicy: Forbid   # Skip run if previous is still active
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120   # Hard kill after 2 min — must be < 15 min interval
      template:
        metadata:
          labels:
            app: vllm-idle-scaler
            cage.io/cronjob: vllm-idle-detector
        spec:
          serviceAccountName: vllm-scaler-sa
          restartPolicy: Never

          # ── Pod-level security context ─────────────────────────────────────
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534    # nobody
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault

          # ── initContainer: scrape vLLM Prometheus metrics ──────────────────
          # curlimages/curl is a minimal, purpose-built image for HTTP calls.
          # Output is written to a shared emptyDir so the main (kubectl) container
          # never needs curl itself — avoids relying on cloud-sdk:slim, which does
          # not bundle kubectl (see "Image choice" note above).
          initContainers:
            - name: metrics-scraper
              image: curlimages/curl:8.10.1
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 65534
                seccompProfile:
                  type: RuntimeDefault
              env:
                - name: METRICS_URL
                  value: "http://vllm-service.governance-stack.svc.cluster.local:8000/metrics"
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  curl -sf --max-time 10 "${METRICS_URL}" > /shared/metrics.txt 2>/dev/null || true
                  echo "metrics-scraper: wrote $(wc -c < /shared/metrics.txt 2>/dev/null || echo 0) bytes"
              volumeMounts:
                - name: shared-data
                  mountPath: /shared
              resources:
                requests:
                  cpu: "25m"
                  memory: "32Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"

          containers:
            - name: idle-detector
              # bitnami/kubectl bundles kubectl + bash. Confirmed empirically
              # (2026-08-11) that gcr.io/google.com/cloudsdktool/cloud-sdk:slim
              # does NOT include a kubectl binary — using bitnami/kubectl instead.
              # NOTE: Bitnami's free-tier Docker Hub images no longer publish
              # versioned tags (e.g. "1.30") — only "latest" is available as a
              # human-readable tag (verified 2026-08-11). Using :latest here;
              # pin to a digest if reproducibility becomes a hard requirement.
              image: bitnami/kubectl:latest

              # ── Container-level security context ──────────────────────────
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 65534
                seccompProfile:
                  type: RuntimeDefault

              env:
                # vLLM fast model Prometheus metrics endpoint.
                # Port 8000 is the standard vLLM HTTP port (see vllm-deployment.yaml.tpl).
                # Adjust METRICS_URL if the Service name or port differs in your cluster.
                - name: METRICS_URL
                  value: "http://vllm-service.governance-stack.svc.cluster.local:8000/metrics"
                # Idle threshold in seconds (2 hours = 7200 s).
                - name: IDLE_THRESHOLD_SECONDS
                  value: "7200"
                # Namespace where both vLLM Deployments live.
                - name: VLLM_NAMESPACE
                  value: "governance-stack"
                # Exact Deployment name for the fast model
                # (APP_NAME rendered from vllm-deployment.yaml.tpl).
                - name: DEPLOY_FAST
                  value: "vllm-inference"
                # Exact Deployment name for the reasoning model
                # (hardcoded in vllm-reasoning.yaml.tpl).
                - name: DEPLOY_REASONING
                  value: "vllm-reasoning"
                # ConfigMap that stores idle-detection state.
                - name: TRACKER_CM
                  value: "vllm-idle-tracker"

              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  echo "=== vLLM Idle Detector — $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="

                  # ── Step 1: Read Prometheus metrics scraped by initContainer ─────
                  echo "[1/4] Reading metrics scraped from: ${METRICS_URL}"
                  METRICS_RAW=$(cat /shared/metrics.txt 2>/dev/null || true)

                  if [ -z "${METRICS_RAW}" ]; then
                    echo "⚠️  Could not reach vLLM metrics endpoint — pod may be scaled to 0 or starting up."
                    echo "    Treating as idle (no active requests). Not updating last_active."
                    # Do not update last_active — let existing idle timer continue.
                    CURRENT_COUNTER=""
                  else
                    # Extract the vllm:request_success_total counter.
                    # vLLM emits lines like:
                    #   vllm:request_success_total{...} 42.0
                    # We sum all label variants with awk.
                    CURRENT_COUNTER=$(echo "${METRICS_RAW}" \
                      | grep -E '^vllm:request_success_total\{' \
                      | awk '{sum += $2} END {printf "%.0f", sum}' 2>/dev/null || echo "0")
                    echo "    vllm:request_success_total = ${CURRENT_COUNTER}"
                  fi

                  # ── Step 2: Read stored state from ConfigMap ─────────────────────
                  echo "[2/4] Reading idle-tracker ConfigMap..."
                  STORED_BASELINE=$(kubectl get configmap "${TRACKER_CM}" \
                    -n "${VLLM_NAMESPACE}" \
                    -o jsonpath='{.data.request_baseline}' 2>/dev/null || echo "0")
                  LAST_ACTIVE=$(kubectl get configmap "${TRACKER_CM}" \
                    -n "${VLLM_NAMESPACE}" \
                    -o jsonpath='{.data.last_active}' 2>/dev/null || echo "")

                  echo "    stored baseline = ${STORED_BASELINE}"
                  echo "    last_active     = ${LAST_ACTIVE:-<not set>}"

                  NOW=$(date +%s)

                  # ── Step 3: Activity check ───────────────────────────────────────
                  echo "[3/4] Evaluating activity..."

                  if [ -n "${CURRENT_COUNTER}" ] && [ "${CURRENT_COUNTER}" -gt "${STORED_BASELINE}" ] 2>/dev/null; then
                    # New requests served since last run → reset idle clock
                    echo "✅ ACTIVE: counter ${STORED_BASELINE} → ${CURRENT_COUNTER}. Resetting idle clock."
                    kubectl patch configmap "${TRACKER_CM}" \
                      -n "${VLLM_NAMESPACE}" \
                      --type merge \
                      -p "{\"data\":{\"last_active\":\"${NOW}\",\"request_baseline\":\"${CURRENT_COUNTER}\"}}"
                    echo "   ConfigMap updated. Exiting — no scale action."
                    exit 0
                  fi

                  # Counter unchanged (or metrics unreachable) — check idle duration
                  if [ -z "${LAST_ACTIVE}" ]; then
                    # First ever run — bootstrap last_active to now so the 2h window starts fresh
                    echo "ℹ️  Bootstrap: setting last_active to now (first run). No scale action."
                    kubectl patch configmap "${TRACKER_CM}" \
                      -n "${VLLM_NAMESPACE}" \
                      --type merge \
                      -p "{\"data\":{\"last_active\":\"${NOW}\",\"request_baseline\":\"${STORED_BASELINE}\"}}"
                    exit 0
                  fi

                  IDLE_SECONDS=$(( NOW - LAST_ACTIVE ))
                  IDLE_MINUTES=$(( IDLE_SECONDS / 60 ))
                  echo "    idle for ${IDLE_MINUTES} minutes (threshold: $(( IDLE_THRESHOLD_SECONDS / 60 )) min)"

                  if [ "${IDLE_SECONDS}" -lt "${IDLE_THRESHOLD_SECONDS}" ]; then
                    echo "ℹ️  IDLE (${IDLE_MINUTES} min) — threshold not reached. No scale action."
                    exit 0
                  fi

                  # ── Step 4: Scale to zero ────────────────────────────────────────
                  echo "[4/4] 2-hour idle threshold exceeded. Checking current replica counts..."

                  REPLICAS_FAST=$(kubectl get deployment "${DEPLOY_FAST}" \
                    -n "${VLLM_NAMESPACE}" \
                    -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "0")
                  REPLICAS_REASONING=$(kubectl get deployment "${DEPLOY_REASONING}" \
                    -n "${VLLM_NAMESPACE}" \
                    -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "0")

                  echo "    ${DEPLOY_FAST} replicas      = ${REPLICAS_FAST}"
                  echo "    ${DEPLOY_REASONING} replicas = ${REPLICAS_REASONING}"

                  if [ "${REPLICAS_FAST}" -eq 0 ] && [ "${REPLICAS_REASONING}" -eq 0 ]; then
                    echo "ℹ️  ALREADY SCALED TO ZERO — both Deployments at 0 replicas. No action."
                    exit 0
                  fi

                  echo "🔻 SCALE TO ZERO: idle ${IDLE_MINUTES} min ≥ $(( IDLE_THRESHOLD_SECONDS / 60 )) min threshold."
                  echo "   Scaling ${DEPLOY_FAST} → 0..."
                  kubectl scale deployment "${DEPLOY_FAST}" \
                    -n "${VLLM_NAMESPACE}" \
                    --replicas=0
                  echo "   Scaling ${DEPLOY_REASONING} → 0..."
                  kubectl scale deployment "${DEPLOY_REASONING}" \
                    -n "${VLLM_NAMESPACE}" \
                    --replicas=0

                  echo "✅ Both vLLM Deployments scaled to 0. GPU node drain will follow in ~10 min."
                  echo "   GKE cluster autoscaler will remove the GPU node once all pods are evicted."

              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"

              volumeMounts:
                # readOnlyRootFilesystem=true requires an emptyDir for any
                # writable scratch space (kubectl may write to /tmp).
                - name: tmp-dir
                  mountPath: /tmp
                # Shared with the metrics-scraper initContainer — contains
                # the scraped Prometheus output at /shared/metrics.txt.
                - name: shared-data
                  mountPath: /shared

          volumes:
            - name: tmp-dir
              emptyDir:
                sizeLimit: "32Mi"
            - name: shared-data
              emptyDir:
                sizeLimit: "1Mi"

---
# ============================================================================
# CronJob: vllm-wakeup-checker
# Schedule: every 5 minutes
# Namespace: vllm-inference
#
# Wake-up algorithm:
#   1. Check if either vLLM Deployment has replicas == 0.
#   2. If neither is at 0 → nothing to do. Exit.
#   3. Query the gateway's Redis queue key (vllm:pending_requests) using
#      redis-cli. If LLEN > 0 → pending requests exist.
#   4. If pending AND either Deployment is at 0 → scale both to 1 replica.
#
# Redis connectivity:
#   Redis lives in governance-stack namespace. Auth password is sourced from
#   redis-credentials/REDIS_PASSWORD via secretKeyRef (no embedded credentials).
#   NOTE (2026-08-11 debug finding): the manifest originally referenced a
#   non-existent advisor-secrets/REDIS_PASSWORD key, causing "NOAUTH
#   Authentication required" at runtime. redis-credentials is the Secret
#   actually used by gateway.yaml, financial-advisor.yaml, and other
#   Redis-consuming CAGE workloads.
#   The key checked is "vllm:pending_requests" (a Redis list maintained by
#   the gateway's inference proxy when vLLM is unavailable).
#
# If your Redis key or auth secret differs, update the env vars below.
# ============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vllm-wakeup-checker
  namespace: governance-stack
  labels:
    app: vllm-idle-scaler
    cage.io/purpose: cost-optimisation
  annotations:
    cage.io/description: >
      Runs every 5 minutes. If either vLLM Deployment is at 0 replicas and
      the gateway Redis queue has pending inference requests, scales both
      Deployments back to 1 replica (reactive wake-up path).
spec:
  schedule: "*/5 * * * *"    # Every 5 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60   # Hard kill after 60s — must finish before next 5-min tick
      template:
        metadata:
          labels:
            app: vllm-idle-scaler
            cage.io/cronjob: vllm-wakeup-checker
        spec:
          serviceAccountName: vllm-scaler-sa
          restartPolicy: Never

          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault

          # ── initContainer: query Redis pending-request queue depth ─────────
          # redis:7-alpine ships redis-cli. LLEN is a cheap, side-effect-free
          # read, so it is safe to always run regardless of replica state —
          # the main (kubectl) container decides whether the result matters.
          initContainers:
            - name: redis-checker
              image: redis:7-alpine
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 65534
                seccompProfile:
                  type: RuntimeDefault
              env:
                - name: REDIS_HOST
                  value: "redis-master.governance-stack.svc.cluster.local"
                - name: REDIS_PORT
                  value: "6379"
                - name: REDIS_QUEUE_KEY
                  value: "vllm:pending_requests"
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: redis-credentials
                      key: REDIS_PASSWORD
                      optional: true
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  if [ -n "${REDIS_PASSWORD:-}" ]; then
                    redis-cli -h "${REDIS_HOST}" -p "${REDIS_PORT}" -a "${REDIS_PASSWORD}" \
                      --no-auth-warning LLEN "${REDIS_QUEUE_KEY}" > /shared/pending.txt 2>/dev/null || echo "0" > /shared/pending.txt
                  else
                    redis-cli -h "${REDIS_HOST}" -p "${REDIS_PORT}" \
                      LLEN "${REDIS_QUEUE_KEY}" > /shared/pending.txt 2>/dev/null || echo "0" > /shared/pending.txt
                  fi
                  echo "redis-checker: pending=$(cat /shared/pending.txt)"
              volumeMounts:
                - name: shared-data
                  mountPath: /shared
              resources:
                requests:
                  cpu: "25m"
                  memory: "32Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"

          containers:
            - name: wakeup-checker
              # bitnami/kubectl bundles kubectl + bash. Confirmed empirically
              # (2026-08-11) that cloud-sdk:slim does NOT include kubectl.
              # NOTE: Bitnami's free-tier Docker Hub images no longer publish
              # versioned tags — only "latest" is available (verified 2026-08-11).
              image: bitnami/kubectl:latest

              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 65534
                seccompProfile:
                  type: RuntimeDefault

              env:
                - name: VLLM_NAMESPACE
                  value: "governance-stack"
                - name: DEPLOY_FAST
                  value: "vllm-inference"
                - name: DEPLOY_REASONING
                  value: "vllm-reasoning"
                # Redis queue key — kept for log-message consistency with the
                # redis-checker initContainer's output.
                - name: REDIS_QUEUE_KEY
                  value: "vllm:pending_requests"

              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  echo "=== vLLM Wake-Up Checker — $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="

                  # ── Step 1: Check replica counts ─────────────────────────────────
                  REPLICAS_FAST=$(kubectl get deployment "${DEPLOY_FAST}" \
                    -n "${VLLM_NAMESPACE}" \
                    -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "1")
                  REPLICAS_REASONING=$(kubectl get deployment "${DEPLOY_REASONING}" \
                    -n "${VLLM_NAMESPACE}" \
                    -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "1")

                  echo "    ${DEPLOY_FAST} replicas      = ${REPLICAS_FAST}"
                  echo "    ${DEPLOY_REASONING} replicas = ${REPLICAS_REASONING}"

                  if [ "${REPLICAS_FAST}" -gt 0 ] && [ "${REPLICAS_REASONING}" -gt 0 ]; then
                    echo "ℹ️  Both Deployments already running. No wake-up needed."
                    exit 0
                  fi

                  echo "    At least one Deployment is at 0 replicas. Checking Redis queue..."

                  # ── Step 2: Read Redis pending queue depth (from initContainer) ──
                  PENDING=$(cat /shared/pending.txt 2>/dev/null || echo "0")

                  # Sanitise: redis-checker may have written an error string — treat non-numeric as 0
                  if ! echo "${PENDING}" | grep -qE '^[0-9]+$'; then
                    echo "⚠️  Redis returned non-numeric value '${PENDING}' — treating as 0."
                    PENDING=0
                  fi

                  echo "    ${REDIS_QUEUE_KEY} queue depth = ${PENDING}"

                  if [ "${PENDING}" -eq 0 ]; then
                    echo "ℹ️  No pending requests in Redis queue. Staying scaled to 0."
                    exit 0
                  fi

                  # ── Step 3: Scale up ─────────────────────────────────────────────
                  echo "🔺 WAKE UP: ${PENDING} pending requests detected. Scaling vLLM Deployments to 1..."

                  kubectl scale deployment "${DEPLOY_FAST}" \
                    -n "${VLLM_NAMESPACE}" \
                    --replicas=1
                  echo "   ✅ ${DEPLOY_FAST} → 1 replica"

                  kubectl scale deployment "${DEPLOY_REASONING}" \
                    -n "${VLLM_NAMESPACE}" \
                    --replicas=1
                  echo "   ✅ ${DEPLOY_REASONING} → 1 replica"

                  echo "✅ Wake-up complete. Allow ~5-10 min for GPU node provision + model load."

              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"

              volumeMounts:
                - name: tmp-dir
                  mountPath: /tmp
                # Shared with the redis-checker initContainer — contains
                # the Redis LLEN result at /shared/pending.txt.
                - name: shared-data
                  mountPath: /shared

          volumes:
            - name: tmp-dir
              emptyDir:
                sizeLimit: "16Mi"
            - name: shared-data
              emptyDir:
                sizeLimit: "1Mi"
