---
# =============================================================================
# Trivy Scanner DNS Egress — kube-dns and Cloud DNS only
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trivy-scanner-dns-egress
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-egress
    app.kubernetes.io/part-of: security-scanning
  annotations:
    compliance.nist.gov/control: "SC-7,AC-4,SI-3,RA-5"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    compliance.nist.gov/last-reviewed: "2026-09-28"
spec:
  podSelector:
    matchLabels:
      app: security-scanner
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# =============================================================================
# Trivy Scanner FQDN Egress — ghcr.io and pkg.dev only
#
# Rewritten from CiliumNetworkPolicy to GKE FQDNNetworkPolicy
# (networking.gke.io/v1alpha1). Uses single-label prefix wildcards (*.ghcr.io,
# *.pkg.dev) supported by GKE Dataplane V2.
# =============================================================================
apiVersion: networking.gke.io/v1alpha1
kind: FQDNNetworkPolicy
metadata:
  name: trivy-scanner-egress-fqdn
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-egress
    app.kubernetes.io/part-of: security-scanning
  annotations:
    compliance.nist.gov/control: "SC-7,AC-4,SI-3,RA-5"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    compliance.nist.gov/last-reviewed: "2026-09-28"
    cage.io/poam: "POAM-007,POAM-011"
    cage.io/description: >
      Allows the Trivy vulnerability scanner CronJob to pull DB updates from
      ghcr.io (primary) and pkg.dev (Artifact Registry fallback). Scoped
      strictly to pods with label app=security-scanner in governance-stack.
spec:
  podSelector:
    matchLabels:
      app: security-scanner
  policyTypes:
    - Egress
  egress:
    # ---- Rule 1: GitHub Container Registry (primary Trivy DB source) --------
    - to:
        - fqdns:
            - "ghcr.io"
            - "*.ghcr.io"
      ports:
        - protocol: TCP
          port: 443

    # ---- Rule 2: Google Artifact Registry / pkg.dev (fallback) --------------
    - to:
        - fqdns:
            - "pkg.dev"
            - "*.pkg.dev"
      ports:
        - protocol: TCP
          port: 443
