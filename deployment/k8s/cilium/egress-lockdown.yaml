---
# =============================================================================
# Policy 1a: Gateway FQDN Egress — Strict FQDN allowlist for external APIs
#
# Rewritten from CiliumNetworkPolicy to GKE FQDNNetworkPolicy
# (networking.gke.io/v1alpha1) + Kubernetes NetworkPolicy (networking.k8s.io/v1).
# GKE Dataplane V2 enforces FQDN policies at L3/L4 by snooping DNS replies from
# kube-dns or Cloud DNS (169.254.169.254/32) and programming resolved IPs into
# Cilium's eBPF policy map. L7 HTTP-method and DNS-pattern rules are not
# supported on GKE Dataplane V2 and have been removed (recorded in OSCAL SC-7).
# =============================================================================
apiVersion: networking.gke.io/v1alpha1
kind: FQDNNetworkPolicy
metadata:
  name: gateway-egress-fqdn-allowlist
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-egress
  annotations:
    compliance.nist.gov/control: "SC-7,AC-4,SI-3"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    compliance.nist.gov/last-reviewed: "2026-09-28"
    cage.io/poam: "POAM-007,POAM-011"
    cage.io/RolloutTrigger: "restart-on-policy-change"
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Egress
  egress:
    # ---- Rule 1: Approved external AI provider APIs ----------------------
    - to:
        - fqdns:
            - "api.openai.com"
            - "api.anthropic.com"
            - "generativelanguage.googleapis.com"
      ports:
        - protocol: TCP
          port: 443

    # ---- Rule 2: GCP service APIs (Cloud KMS, Cloud Logging, GCS) --------
    # Wildcards use single-label prefix only (*.googleapis.com).
    - to:
        - fqdns:
            - "*.googleapis.com"
            - "metadata.google.internal"
      ports:
        - protocol: TCP
          port: 443

    # ---- Rule 3: Langfuse telemetry --------------------------------------
    - to:
        - fqdns:
            - "us.i.posthog.com"
            - "cloud.langfuse.com"
      ports:
        - protocol: TCP
          port: 443

    # ---- Rule 4: OFAC Sanctions API (SDN list lookups) -------------------
    - to:
        - fqdns:
            - "api.trade.gov"
            - "www.treasury.gov"
      ports:
        - protocol: TCP
          port: 443

---
# =============================================================================
# Policy 1a-dns: Gateway L3/L4 Egress — DNS (kube-dns / Cloud DNS) & Memorystore PSC
#
# Restricts port 53 egress to kube-system (k8s-app: kube-dns) and Cloud DNS
# metadata IP (169.254.169.254/32) so pods cannot bypass GKE Dataplane V2 DNS
# snooping via external resolvers, and permits TLS port 6379 egress to the
# Memorystore for Valkey PSC endpoint CIDR (§5.1 / §5.3 G6).
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-dns-egress
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-egress
  annotations:
    compliance.nist.gov/control: "SC-7,AC-4"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    compliance.nist.gov/last-reviewed: "2026-09-28"
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Memorystore for Valkey Governance PSC endpoint CIDR on TLS port 6379 (§5.1 / §5.3 G6)
    - to:
        - ipBlock:
            cidr: 10.128.0.0/20
      ports:
        - protocol: TCP
          port: 6379


---
# =============================================================================
# Policy 1b: Financial Advisor Egress — internal-only (H-14 companion rule)
#
# The governed-financial-advisor pod must NOT have external egress.
# It communicates only with the gateway (port 8080), compliance-bridge (8090),
# and cluster DNS (kube-dns / Cloud DNS).
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: financial-advisor-egress-internal-only
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-egress
  annotations:
    compliance.nist.gov/control: "SC-7,AC-4,SI-3"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    compliance.nist.gov/last-reviewed: "2026-09-28"
    cage.io/poam: "POAM-007"
    cage.io/description: >
      H-14 companion: restricts governed-financial-advisor to internal egress only.
      The pod must route all external calls through the gateway watchdog.
spec:
  podSelector:
    matchLabels:
      app: governed-financial-advisor
  policyTypes:
    - Egress
  egress:
    # DNS — kube-dns and Cloud DNS metadata IP only (never 0.0.0.0/0)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Gateway (orchestration return path and inference proxy)
    - to:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 8080
    # Compliance bridge
    - to:
        - podSelector:
            matchLabels:
              app: compliance-bridge
      ports:
        - protocol: TCP
          port: 8090

---
# =============================================================================
# Policy 2: Sovereign Agent Egress — Strict internal-only lockdown
#
# Pods labelled role=sovereign-agent may ONLY reach:
#   - kube-dns / Cloud DNS (port 53)
#   - OPA (policy evaluation — port 8181)
#   - CAGE Gateway (orchestration callbacks — port 8080)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-egress-internal-only
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-egress
  annotations:
    compliance.nist.gov/control: "SC-7,AC-4,SI-3,SC-39"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    compliance.nist.gov/last-reviewed: "2026-09-28"
    cage.io/poam: "POAM-007"
spec:
  podSelector:
    matchLabels:
      role: sovereign-agent
  policyTypes:
    - Egress
  egress:
    # ---- Rule 1: DNS — kube-dns and Cloud DNS only -----------------------
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # ---- Rule 2: OPA policy evaluation -----------------------------------
    - to:
        - podSelector:
            matchLabels:
              app: opa
      ports:
        - protocol: TCP
          port: 8181

    # ---- Rule 3: CAGE Gateway (orchestration return path) ----------------
    - to:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 8080

---
# =============================================================================
# Policy 3: Default-deny external egress for ALL governance-stack pods
#
# Works alongside network-policy.yaml default-deny-egress for defence-in-depth.
# Permits intra-namespace traffic and DNS resolution to kube-dns / Cloud DNS
# while blocking direct external IP connects not authorized by FQDNNetworkPolicy.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-external-egress
  namespace: governance-stack
  labels:
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-egress
  annotations:
    compliance.nist.gov/control: "SC-7,AC-4"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    compliance.nist.gov/last-reviewed: "2026-09-28"
    cage.io/description: >
      Explicit L3/L4 default-deny for all external (non-cluster) egress.
      Works alongside network-policy.yaml default-deny-egress and GKE
      FQDNNetworkPolicy resources on Dataplane V2.
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Allow intra-namespace traffic only
    - to:
        - podSelector: {}
    # DNS strictly restricted to kube-dns and Cloud DNS metadata IP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
