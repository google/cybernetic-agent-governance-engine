---
# CiliumNetworkPolicy — reconciliation-worker egress isolation
#
# Allows only the traffic required for a single reconciliation cycle:
#   1. Object storage (port 443) — ledger snapshot download (GCS, S3, MinIO TLS)
#   2. Cloud KMS (port 443) — HMAC signing
#   3. Redis (port 6379) — signed balance write
#   4. DNS (port 53 UDP/TCP) — name resolution
#
# All other ingress and egress is denied by the default-deny posture established
# in deployment/k8s/cilium/egress-lockdown.yaml.
#
# CAGE_DEPLOYMENT_REGION guard: this policy applies universally because GCS,
# KMS, and Redis are used in all three postures (US_FED, EU_ECB, APAC_MAS).
# Regional data residency is enforced by the KMS key location and GCS bucket
# region configured in reconciliation-worker-secrets, not by this policy.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: reconciliation-worker-egress
  namespace: governance-stack
  labels:
    app: reconciliation-worker
spec:
  endpointSelector:
    matchLabels:
      app: reconciliation-worker
      cage.io/account-purpose: "ledger-reconciliation"

  # No ingress permitted — worker is write-only.
  ingress: []

  egress:
    # DNS resolution (required for GCS / KMS FQDN lookup)
    - toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # Object storage + Cloud KMS — port 443
    # Covers: GCS (*.googleapis.com), AWS S3 (*.amazonaws.com), any custom endpoint.
    # For MinIO / on-premise S3: add a toEndpoints rule for the MinIO pod instead.
    - toFQDNs:
        - matchPattern: "*.googleapis.com"
        - matchPattern: "storage.googleapis.com"
        - matchPattern: "cloudkms.googleapis.com"
        - matchPattern: "*.amazonaws.com"
        - matchPattern: "*.s3.amazonaws.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # Redis in-cluster — governance-stack namespace only
    - toEndpoints:
        - matchLabels:
            app: redis-stack
            k8s:io.kubernetes.pod.namespace: governance-stack
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP

    # Langfuse OTLP trace export (audit trail for reconciliation spans)
    - toEndpoints:
        - matchLabels:
            app: langfuse-web
            k8s:io.kubernetes.pod.namespace: governance-stack
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP

