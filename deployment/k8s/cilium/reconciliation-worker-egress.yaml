---
# =============================================================================
# NetworkPolicy + FQDNNetworkPolicy — reconciliation-worker egress isolation
#
# Rewritten from CiliumNetworkPolicy to Kubernetes NetworkPolicy
# (networking.k8s.io/v1) + GKE FQDNNetworkPolicy (networking.gke.io/v1alpha1).
#
# Allows only the traffic required for a single reconciliation cycle:
#   1. Cloud KMS (port 443 via FQDNNetworkPolicy) — asymmetric signing of snapshots
#   2. Memorystore for Valkey PSC endpoint CIDR (TLS port 6379 via ipBlock) — signed snapshot write
#   3. DNS (port 53 UDP/TCP) — restricted strictly to kube-dns and Cloud DNS (169.254.169.254/32)
#   4. Langfuse (port 3000) — OTLP export of reconciliation spans
#
# The ground-truth source is the in-process simulated Tier 2 provider, so no
# ledger or object-store egress is allowed.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reconciliation-worker-egress
  namespace: governance-stack
  labels:
    app: reconciliation-worker
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-egress
  annotations:
    compliance.nist.gov/control: "SC-7,AC-4"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    compliance.nist.gov/last-reviewed: "2026-09-28"
spec:
  podSelector:
    matchLabels:
      app: reconciliation-worker
      cage.io/account-purpose: "ledger-reconciliation"
  policyTypes:
    - Ingress
    - Egress

  # No ingress permitted — worker is write-only.
  ingress: []

  egress:
    # DNS resolution — restricted strictly to kube-dns and Cloud DNS metadata IP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Memorystore for Valkey PSC endpoint CIDR on TLS port 6379 (§5.1 / §5.3 G6)
    - to:
        - ipBlock:
            cidr: 10.128.0.0/20
      ports:
        - protocol: TCP
          port: 6379

    # Langfuse OTLP trace export (audit trail for reconciliation spans)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: governance-stack
          podSelector:
            matchLabels:
              app: langfuse-web
      ports:
        - protocol: TCP
          port: 3000

---
# Cloud KMS FQDN egress for reconciliation-worker (asymmetricSign / getPublicKey)
apiVersion: networking.gke.io/v1alpha1
kind: FQDNNetworkPolicy
metadata:
  name: reconciliation-worker-egress-fqdn
  namespace: governance-stack
  labels:
    app: reconciliation-worker
    app.kubernetes.io/managed-by: cage
    cage.io/component: z3n-egress
  annotations:
    compliance.nist.gov/control: "SC-7,AC-4,SC-12"
    compliance.nist.gov/standard: "SP-800-53-Rev5"
    compliance.nist.gov/last-reviewed: "2026-09-28"
spec:
  podSelector:
    matchLabels:
      app: reconciliation-worker
      cage.io/account-purpose: "ledger-reconciliation"
  policyTypes:
    - Egress
  egress:
    # Cloud KMS — port 443 (asymmetricSign / getPublicKey only)
    - to:
        - fqdns:
            - "cloudkms.googleapis.com"
      ports:
        - protocol: TCP
          port: 443
