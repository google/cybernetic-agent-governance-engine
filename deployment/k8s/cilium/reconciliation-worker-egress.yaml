---
# CiliumNetworkPolicy — reconciliation-worker egress isolation
#
# Allows only the traffic required for a single reconciliation cycle:
#   1. Cloud KMS (port 443) — asymmetric signing of ground-truth snapshots
#   2. Redis (port 6379) — signed snapshot write
#   3. DNS (port 53 UDP/TCP) — name resolution
#   4. Langfuse (port 3000) — OTLP export of reconciliation spans
#
# The ground-truth source is the in-process simulated Tier 2 provider, so no
# ledger or object-store egress is allowed.
#
# All other ingress and egress is denied by the default-deny posture established
# in deployment/k8s/cilium/egress-lockdown.yaml.
#
# CAGE_DEPLOYMENT_REGION guard: this policy applies universally because KMS
# and Redis are used in all three postures (US_FED, EU_ECB, APAC_MAS).
# Regional data residency is enforced by the KMS key location configured in
# reconciliation-worker-secrets, not by this policy.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: reconciliation-worker-egress
  namespace: governance-stack
  labels:
    app: reconciliation-worker
spec:
  endpointSelector:
    matchLabels:
      app: reconciliation-worker
      cage.io/account-purpose: "ledger-reconciliation"

  # No ingress permitted — worker is write-only.
  ingress: []

  egress:
    # DNS resolution (required for KMS FQDN lookup)
    - toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # Cloud KMS — port 443 (asymmetricSign / getPublicKey only)
    - toFQDNs:
        - matchName: "cloudkms.googleapis.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # Redis in-cluster — governance-stack namespace only
    - toEndpoints:
        - matchLabels:
            app: redis-stack
            k8s:io.kubernetes.pod.namespace: governance-stack
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP

    # Langfuse OTLP trace export (audit trail for reconciliation spans)
    - toEndpoints:
        - matchLabels:
            app: langfuse-web
            k8s:io.kubernetes.pod.namespace: governance-stack
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP

