apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: governance-stack
  labels:
    app: redis
    tier: control-plane
    cage.governance/component: evidence-state-store
    deprecated: "true"
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        cage.governance/component: evidence-state-store
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis/redis-stack-server:7.4.0-v1
          # Load custom redis.conf from ConfigMap
          # Note: redis-stack-server uses /etc/redis-stack.conf by default;
          # we override with our hardened config via command args.
          # H-13: requirepass is injected from the redis-credentials Secret so
          # the password never appears in committed manifests or ConfigMaps.
          args:
            - "redis-server"
            - "/usr/local/etc/redis/redis.conf"
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            - "--loadmodule"
            - "/opt/redis-stack/lib/rejson.so"
            - "--loadmodule"
            - "/opt/redis-stack/lib/redisearch.so"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: redis-password
          ports:
            - containerPort: 6379
              name: redis

          # CRITICAL GKE INVARIANT: Requests == Limits guarantees "Guaranteed" QoS class.
          # This protects the state store pod from being evicted by the kubelet
          # under node memory pressure. The evidence state store holds frozen
          # transaction tokens that MUST survive node-level resource contention.
          resources:
            requests:
              cpu: "2"
              memory: "6Gi"
            limits:
              cpu: "2"
              memory: "6Gi"

          # Security hardening
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Required for AOF persistence writes
            runAsNonRoot: true
            runAsUser: 999                 # Standard redis UID
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/redis
              readOnly: true
            - name: redis-data
              mountPath: /data

          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: config
          configMap:
            name: cage-redis-config
            items:
              - key: redis.conf
                path: redis.conf

  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Production: use pd-ssd StorageClass for AOF throughput
        # storageClassName: premium-rwo
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: governance-stack
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: redis
