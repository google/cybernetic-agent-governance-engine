# ── vLLM Streamer Cloud Build ──────────────────────────────────────────────────
# Builds the vllm-streamer image used by the vLLM inference Terraform module.
#
# The vllm-streamer image extends vllm/vllm-openai:latest with:
#   - GCS Fuse / RunAI model streamer support (gcs_filesystem load format)
#   - GOOGLE_CLOUD_PROJECT env var wiring for ADC authentication
#
# Invoked by scripts/build_images.sh:
#   gcloud builds submit --config deployment/docker/cloudbuild.vllm.yaml \
#     [--substitutions=_HF_TOKEN=<token>] .
#
# Substitutions:
#   _HF_TOKEN  — optional Hugging Face Hub token for gated model downloads.
#                Passed as a build-time ARG; not baked into the image layer.
# ──────────────────────────────────────────────────────────────────────────────

substitutions:
  _HF_TOKEN: ""      # Override via --substitutions=_HF_TOKEN=hf_xxx at submit time
  _SHORT_SHA: "latest"  # Override via --substitutions=_SHORT_SHA=$(git rev-parse --short HEAD)

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: build-vllm-streamer
    args:
      - 'build'
      - '--file=deployment/docker/Dockerfile.vllm'
      - '--no-cache'
      - '--build-arg=HF_TOKEN=${_HF_TOKEN}'
      - '--tag=gcr.io/$PROJECT_ID/vllm-streamer:latest'
      - '--tag=gcr.io/$PROJECT_ID/vllm-streamer:$_SHORT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: push-vllm-streamer
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/vllm-streamer']

images:
  - 'gcr.io/$PROJECT_ID/vllm-streamer:latest'
  - 'gcr.io/$PROJECT_ID/vllm-streamer:$_SHORT_SHA'

# vLLM base image is large (~10 GB); allow up to 40 minutes.
timeout: '2400s'

options:
  # E2_HIGHCPU_32 provides enough RAM to pull and layer the vLLM base image.
  machineType: 'E2_HIGHCPU_32'
  logging: CLOUD_LOGGING_ONLY
