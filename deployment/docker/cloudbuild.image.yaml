# Generic Cloud Build template: build -> push -> Binary Authorization attestation.
#
# Required substitutions (no defaults; strict mode rejects omissions):
#   _IMAGE_NAME  — target repository name under gcr.io/$PROJECT_ID (e.g. gateway)
#   _DOCKERFILE  — repo-relative Dockerfile path (e.g. src/gateway/Dockerfile)
#   _SHORT_SHA   — immutable git commit short SHA tag (never mutable floating tags)
#
# Optional substitutions:
#   _ENVIRONMENT      — CAGE environment posture (default: staging)
#   _KMS_LOCATION     — Cloud KMS location for cage-signing-<env> (default: us-central1)
#   _KMS_KEY_VERSION  — binauthz-attestor key version (default: 1)

substitutions:
  _ENVIRONMENT: "staging"
  _KMS_LOCATION: "us-central1"
  _KMS_KEY_VERSION: "1"

serviceAccount: "projects/$PROJECT_ID/serviceAccounts/cage-cloudbuild-${_ENVIRONMENT}@$PROJECT_ID.iam.gserviceaccount.com"

steps:
  - name: "gcr.io/cloud-builders/docker"
    id: build-image
    args:
      - "build"
      - "--no-cache"
      - "--file=${_DOCKERFILE}"
      - "--tag=gcr.io/${PROJECT_ID}/${_IMAGE_NAME}:${_SHORT_SHA}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: push-image
    args:
      - "push"
      - "gcr.io/${PROJECT_ID}/${_IMAGE_NAME}:${_SHORT_SHA}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: attest-image
    entrypoint: "bash"
    env:
      - "PROJECT_ID=${PROJECT_ID}"
    args:
      - "scripts/attest_image.sh"
      - "gcr.io/${PROJECT_ID}/${_IMAGE_NAME}:${_SHORT_SHA}"
      - "${_ENVIRONMENT}"
      - "${_KMS_LOCATION}"
      - "${_KMS_KEY_VERSION}"

images:
  - "gcr.io/${PROJECT_ID}/${_IMAGE_NAME}:${_SHORT_SHA}"

timeout: "1200s"
options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: MUST_MATCH
