steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--no-cache"
      - "--build-arg"
      - "LULA_VERSION=0.9.5"
      - "-f"
      - "deployment/docker/Dockerfile.lula-multistage"
      - "-t"
      - "us-central1-docker.pkg.dev/${GCP_PROJECT_ID}/governance-stack/lula:0.9.5"
      - "-t"
      - "us-central1-docker.pkg.dev/${GCP_PROJECT_ID}/governance-stack/lula:latest"
      - "."

images:
  - "us-central1-docker.pkg.dev/${GCP_PROJECT_ID}/governance-stack/lula:0.9.5"
  - "us-central1-docker.pkg.dev/${GCP_PROJECT_ID}/governance-stack/lula:latest"

options:
  machineType: "E2_HIGHCPU_8"

# Allow up to 10 minutes for npm install + docker push
timeout: "600s"
