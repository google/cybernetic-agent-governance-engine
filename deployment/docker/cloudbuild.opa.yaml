substitutions:
  _GCP_PROJECT_ID: ""  # Pass via --substitutions=_GCP_PROJECT_ID=<project> or set in Cloud Build trigger
  _SHORT_SHA: "latest"

steps:
  - name: "gcr.io/cloud-builders/docker"
    id: build-opa
    args:
      - "build"
      - "--no-cache"
      - "--file=deployment/docker/Dockerfile.opa"
      - "--tag=gcr.io/${_GCP_PROJECT_ID}/cage-opa:latest"
      - "--tag=gcr.io/${_GCP_PROJECT_ID}/cage-opa:${_SHORT_SHA}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: push-opa
    args: ["push", "--all-tags", "gcr.io/${_GCP_PROJECT_ID}/cage-opa"]

images:
  - "gcr.io/${_GCP_PROJECT_ID}/cage-opa:latest"
  - "gcr.io/${_GCP_PROJECT_ID}/cage-opa:${_SHORT_SHA}"

timeout: "600s"
options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY
