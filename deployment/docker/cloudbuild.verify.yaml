# Build-and-verify Cloud Build template: build -> smoke import -> Trivy gate.
#
# Verifies a Dockerfile change on the GKE build architecture (linux/amd64)
# without pushing or attesting anything. Use it before a base-image or
# packaging change reaches cloudbuild.image.yaml.
#
#   gcloud builds submit --config deployment/docker/cloudbuild.verify.yaml \
#     --substitutions="_DOCKERFILE=src/gateway/Dockerfile,_SMOKE_MODULE=src.gateway.server.hybrid_server" .
#
# Required substitutions:
#   _DOCKERFILE    — repo-relative Dockerfile path
#   _SMOKE_MODULE  — module the image's entry point imports (proves the venv,
#                    native wheels and system libraries resolve at runtime)
#
# The Trivy step applies the same gate as .github/workflows/sbom.yml
# (HIGH/CRITICAL, .trivyignore, --show-suppressed, exit code 1).

steps:
  - name: "gcr.io/cloud-builders/docker"
    id: build-image
    args:
      - "build"
      - "--no-cache"
      - "--file=${_DOCKERFILE}"
      - "--tag=cage-verify:${BUILD_ID}"
      - "."

  # Runs as the image's own USER with its own ENV, exactly as the pod would.
  # The entry modules fail closed at import time on missing deployment config
  # (Langfuse credentials, CAGE_TRUSTED_CLIENT_IDENTITIES). This step checks
  # packaging, not configuration, so it sets the development posture and a
  # placeholder Linkerd identity that authorizes nothing outside this build.
  - name: "gcr.io/cloud-builders/docker"
    id: smoke-import
    args:
      - "run"
      - "--rm"
      - "--env=CAGE_ENV=development"
      - "--env=CAGE_TRUSTED_CLIENT_IDENTITIES=smoke.cage-verify.serviceaccount.identity.linkerd.cluster.local"
      - "--entrypoint=python"
      - "cage-verify:${BUILD_ID}"
      - "-c"
      - >-
        import bz2, ctypes, importlib, lzma, sqlite3, ssl, uuid, zlib;
        importlib.import_module("${_SMOKE_MODULE}");
        print("smoke import ok:", "${_SMOKE_MODULE}", ssl.OPENSSL_VERSION)

  # Trivy scans a saved tarball, so the step needs no Docker socket.
  - name: "gcr.io/cloud-builders/docker"
    id: save-image
    args: ["save", "--output=/workspace/cage-verify.tar", "cage-verify:${BUILD_ID}"]

  - name: "aquasec/trivy:0.75.0"
    id: trivy-gate
    args:
      - "image"
      - "--input=/workspace/cage-verify.tar"
      - "--format=table"
      - "--severity=CRITICAL,HIGH"
      - "--ignorefile=.trivyignore"
      - "--show-suppressed"
      - "--exit-code=1"

timeout: "2400s"
options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: MUST_MATCH
