steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-f"
      - "deployment/docker/Dockerfile.nemo"
      - "-t"
      - "gcr.io/${_GCP_PROJECT_ID}/nemo-guardrails:latest"
      - "."
images:
  - "gcr.io/${_GCP_PROJECT_ID}/nemo-guardrails:latest"
substitutions:
  _GCP_PROJECT_ID: "YOUR_GCP_PROJECT_ID"
timeout: "1200s"
options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY
