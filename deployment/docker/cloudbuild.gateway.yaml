# IMAGE_REGISTRY can be overridden via kustomize or helm values (default: gcr.io)
# To push to a different registry (e.g., ECR, ACR, Docker Hub), replace gcr.io/${_GCP_PROJECT_ID}
# with your registry prefix and update the _IMAGE_REGISTRY substitution accordingly.
# Example for Artifact Registry: us-central1-docker.pkg.dev/${_GCP_PROJECT_ID}/governance-stack
#
# Substitutions:
#   _GCP_PROJECT_ID — GCP project ID (required; pass via --substitutions or Cloud Build trigger)
#   _SHORT_SHA      — short git SHA for image tagging (defaults to "latest")
substitutions:
  _GCP_PROJECT_ID: ""  # Pass via --substitutions=_GCP_PROJECT_ID=<project> or set in Cloud Build trigger
  _SHORT_SHA: "latest"

steps:
  - name: "gcr.io/cloud-builders/docker"
    id: build-gateway
    args:
      - "build"
      - "--no-cache"
      - "--file=src/gateway/Dockerfile"
      - "--tag=gcr.io/${_GCP_PROJECT_ID}/gateway:latest"
      - "--tag=gcr.io/${_GCP_PROJECT_ID}/gateway:${_SHORT_SHA}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: push-gateway
    args: ["push", "--all-tags", "gcr.io/${_GCP_PROJECT_ID}/gateway"]

images:
  - "gcr.io/${_GCP_PROJECT_ID}/gateway:latest"
  - "gcr.io/${_GCP_PROJECT_ID}/gateway:${_SHORT_SHA}"

timeout: "1200s"
options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY
