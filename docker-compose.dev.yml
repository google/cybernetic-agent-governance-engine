version: "3.8"

services:
  gateway:
    # Re-attach the live src mount for local development iteration
    volumes:
      - ./src:/app/src
      - ./.env:/app/.env
      - opa_socket_vol:/tmp
    # Use the Hybrid Gateway composition root with WorkloadIdentityMiddleware (GHSA-4x3x-w2m3-8mfh)
    command: ["python", "src/gateway/server/hybrid_server.py"]
    environment:
      - PORT=8080
      - OPA_URL=http://opa:8181
      - CAGE_TRUSTED_CLIENT_IDENTITIES=${CAGE_TRUSTED_CLIENT_IDENTITIES:-governed-financial-advisor.governance-stack.serviceaccount.identity.linkerd.cluster.local}
      # v0.1.0: override in .env to test EU_ECB or APAC_MAS compliance posture locally
      - CAGE_DEPLOYMENT_REGION=${CAGE_DEPLOYMENT_REGION:-US_FED}

  app:
    volumes:
      - ./src:/app/src
      - ./.env:/app/.env
      - opa_socket_vol:/tmp
