# Access grants for the manual paper benchmark (benchmark-job.yaml).
# scripts/run_gke_benchmark_job.sh applies this with the throwaway Redis and
# deletes it afterwards, so the grants exist only for the run.
#
# Egress: governance-stack denies external egress by default (default-deny-
# external-egress). The benchmark signs with the benchmark-only KMS key, so
# its pod needs Cloud KMS and nothing else; OPA runs inside the benchmark Job
# pod over an in-pod Unix domain socket (D-195-3, no network grant needed).
apiVersion: networking.gke.io/v1alpha1
kind: FQDNNetworkPolicy
metadata:
  name: benchmark-egress-fqdn
  namespace: governance-stack
  labels:
    cage.io/benchmark-purpose: "paper-evaluation"
  annotations:
    cage.io/poam: "POAM-2026-079"
spec:
  podSelector:
    matchLabels:
      app: cage-paper-benchmark
  egress:
    - matches:
        - name: cloudkms.googleapis.com
      ports:
        - port: 443
          protocol: TCP
