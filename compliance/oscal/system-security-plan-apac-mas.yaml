    - uuid: apac-mas-res-0006-4000-8000-000000000006
      title: CAGE MAS Notice 655 Lula Validation
      rlinks:
      - href: compliance/lula/lula-validation-mas-notice655.yaml
        media-type: application/yaml
    - uuid: apac-mas-res-0007-4000-8000-000000000007
      title: CAGE MAS TRM §6.3 Lula Validation
      rlinks:
      - href: compliance/lula/lula-validation-mas-trm-s6.yaml
        media-type: application/yaml
    - uuid: apac-mas-res-0008-4000-8000-000000000008
      title: APAC_MAS Governance Thresholds Baseline
      rlinks:
      - href: config/thresholds/APAC_MAS_BASELINE.json
