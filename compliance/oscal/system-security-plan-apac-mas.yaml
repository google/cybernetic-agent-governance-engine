system-security-plan:
  uuid: apac-mas-ssp-2026-0001-4000-8000-000000000001
  metadata:
    title: CAGE System Security Plan (APAC_MAS — MAS FEAT / MAS Notice 655 / MAS TRM)
    published: '2026-06-15T00:00:00Z'
    last-modified: '2026-11-13T00:54:26Z'
    version: 1.0.0-draft+stpa
    oscal-version: 1.0.4
    remarks: 'This System Security Plan (SSP) documents the compliance controls implemented
      for the Cybernetic AI Governance Engine (CAGE) deployed in the Monetary Authority
      of Singapore (APAC_MAS) jurisdiction. This SSP covers MAS FEAT, MAS Notice 655,
      and MAS TRM compliance postures applicable to CAGE_DEPLOYMENT_REGION=APAC_MAS.

      CAGE_DEPLOYMENT_REGION: APAC_MAS

      Compliance Frameworks: - ISO/IEC 42001:2023 (Universal baseline — all regions)
      - MAS FEAT Principles (November 2019) — Fairness, Ethics, Accountability, Transparency
      for AI in financial services - MAS Notice 655 — Technology Risk Management -
      MAS TRM Guidelines §6.3 — AI and Machine Learning Controls - MAS TRM Guidelines
      §4.2 — Data Residency (asia-southeast1)

      Posture Scope: APAC_MAS deployments only (CAGE_DEPLOYMENT_REGION=APAC_MAS)

      US_FED SSP: compliance/oscal/system-security-plan.yaml EU_ECB SSP: compliance/oscal/system-security-plan-eu-ecb.yaml

      Note: This SSP is NOT applicable to US_FED or EU_ECB deployments. US_FED uses
      NIST SP 800-53 Rev 5 HIGH baseline. EU_ECB uses EU AI Act / GDPR / DORA baseline.

      Data Residency: All data paths must remain within asia-southeast1 (GCP). MAS
      TRM Guidelines §4.2 requires data residency within Singapore region.

      SR 26-2 "no legal force" sentinel: SR 26-2 (Federal Reserve supervisory guidance)
      has no legal force in APAC_MAS deployments. All SR 26-2 telemetry is suppressed
      for CAGE_DEPLOYMENT_REGION=APAC_MAS per .clinerules §12.4.

      '
    props:
    - name: cage-deployment-region
      value: APAC_MAS
    - name: cage-compliance-posture
      value: mas-feat-notice655-trm
    - name: cage-posture-scope
      value: apac-mas-only
    - name: data-residency-region
      value: asia-southeast1
    - name: authorization-status
      value: DRAFT — MAS notification pending
    - name: mas-feat-classification
      value: High-Risk AI — financial services advisory
    - name: customer_responsibility_tier3_ledger_apis
      ns: https://cage.laah.cybernetics.dev/ns/oscal
      value: 'Customer Responsibility (Tier-3 Commercial Deployment Interface — Retail-Banking,
        Custody & Payment Ledger APIs): CAGE ships the Tier-2 posture-completing simulated
        ground-truth reconciliation provider (SimulatedEstateProvider) with deterministic
        seeding, fault injection, and real Cloud KMS asymmetric snapshot signing (RECONCILER_KMS_KEY).
        Commercial retail-banking, custody, and core-banking ledger APIs are classified
        as Tier-3 commercial-deployment-only interfaces and do not live in the reference
        repository; organizations deploying CAGE in commercial production are responsible
        for supplying and accrediting their own external retail-banking ledger integration
        behind the EstateProvider seam.'
      class: customer-responsibility
    roles:
    - id: system-owner
      title: System Owner
      description: Overall responsibility for CAGE APAC_MAS deployment compliance.
    - id: trm-officer
      title: Technology Risk Management Officer
      description: MAS Notice 655 TRM Officer responsible for technology risk management
        framework, ICT incident management, and business continuity.
    - id: isso
      title: Information System Security Officer
      description: Primary security point of contact for APAC_MAS deployment. Maintains
        SSP and coordinates MAS TRM risk assessments.
    - id: compliance-engineer
      title: Compliance Engineer
      description: Maintains OSCAL artifacts, operates Lula compliance-as-code pipeline
        for MAS FEAT, Notice 655, and TRM controls.
    - id: ai-model-operator
      title: AI Model Operator
      description: Manages AI model versions, monitors FEAT fairness metrics, coordinates
        MAS TRM §6.3 AI governance framework updates.
    assurance-posture:
      status: ILLUSTRATIVE_REFERENCE
      attestation_boundary: CODEBASE_SYNTHETIC_EVALUATION
      disclaimer: This artifact represents a deterministic architectural reference
        generated by the Cybernetic Agent Governance Engine (CAGE). It demonstrates
        control mechanism linkage and evidence gathering paths. It does NOT constitute
        a formal statutory attestation, FedRAMP ATO, CE Conformity Mark, BSI ISO/IEC
        42001 certification, or MAS regulatory approval. Formal certification requires
        independent assessment by an accredited third-party body within the deploying
        organization's operational context.
      third_party_certificate_url: null
  import-profile:
    href: ./mas-feat-profile.yaml
    remarks: Imports the CAGE MAS FEAT compliance profile covering Fairness (F1, F2),
      Ethics (E1), Accountability (A1), and Transparency (T2) principles. Also imports
      common-controls-catalog.yaml for ISO 42001 universal baseline.
  system-characteristics:
    system-ids:
    - id: cage-gke-apac-mas
      identifier-type: https://cage.internal/system-ids
    system-name: Cybernetic Governance Engine (APAC_MAS)
    system-name-short: CAGE-APAC
    description: 'CAGE APAC_MAS deployment — AI governance platform for financial
      services operating under MAS FEAT Principles (Fairness, Ethics, Accountability,
      Transparency), MAS Notice 655 Technology Risk Management, and MAS TRM Guidelines
      §6.3 AI and Machine Learning Controls. Deployed on GKE in asia-southeast1 with
      all data paths confined to Singapore jurisdiction per MAS TRM Guidelines §4.2
      data residency requirements.

      '
    security-sensitivity-level: high
    status:
      state: under-development
      remarks: APAC_MAS SSP draft. MAS notification and FEAT assessment completion
        required before production deployment.
    authorization-boundary:
      description: The APAC_MAS authorization boundary encompasses all CAGE components
        deployed within the governance-stack Kubernetes namespace on GKE in asia-southeast1.
        All data storage (GCS buckets, Cloud SQL, Redis) must be provisioned in asia-southeast1.
        External interconnections to Langfuse must use a self-hosted APAC instance
        to satisfy MAS TRM §4.2 data residency requirements.
      props:
      - name: gcp-region
        value: asia-southeast1
      - name: data-residency-enforced
        value: 'true'
      - name: mas-trm-s42-compliant
        value: 'true'
  system-implementation:
    remarks: APAC_MAS system implementation. All components inherit the ISO 42001
      universal baseline from component-definition.yaml. MAS-specific controls are
      additive layers on top of the universal baseline.
    users:
    - uuid: apac-mas-user-0001-4000-8000-000000000001
      title: MAS-Regulated Financial Institution User
      short-name: fi-user
      description: Individual investors and financial institution clients whose data
        is processed by CAGE under MAS PDPA and FEAT protections.
      role-ids:
      - api-consumer
      props:
      - name: pdpa-data-subject-rights
        value: PDPA Part IV — access, correction, withdrawal of consent
    components:
    - uuid: apac-mas-comp-0001-4000-8000-000000000001
      type: policy
      title: Adopter-Operated MAS FEAT Governance and Fairness Assessment Boundary
      description: Institutional obligation (adopter-operated; not-applicable to the
        standalone CAGE software boundary). MAS FEAT Principles (Fairness F1/F2 demographic
        bias testing across PDPA-governed customer cohorts, Ethics E1 board-approved
        ethical principles, Accountability A1/A3 internal and external authority sign-off,
        and Transparency T1/T2 180-day customer/supervisor disclosures) bind the MAS-regulated
        financial institution and require real demographic cohort distributions and
        board/CRO sign-off outside the CAGE software boundary (the EU AI Act FRIA
        tier is not assembled under APAC_MAS). CAGE supplies the offline evaluation
        harness (src/eval_harness/) and deterministic runtime barriers as technical
        inputs.
      purpose: Documents the institutional boundary and concrete adopter integration
        steps for MAS FEAT Principles F1/F2, E1, A1, and T2 in Singapore financial-institution
        deployments.
      status:
        state: operational
      responsible-roles:
      - role-id: ai-model-operator
      props:
      - name: mas-feat-principles
        value: F1 (fairness testing), F2 (quantitative metrics), E1 (ethics), A1 (accountability),
          T2 (transparency)
      - name: bias-threshold-demographic-parity
        value: '0.08'
      - name: transparency-report-interval-days
        value: '180'
      - name: control-origination
        value: adopter-operated
      links:
      - href: ../../compliance/lula/lula-validation-mas-feat.yaml
        rel: lula
        text: 'Illustrative adopter Lula template: MAS FEAT Fairness Assessment'
    - uuid: apac-mas-comp-0002-4000-8000-000000000002
      type: policy
      title: Adopter-Operated MAS Notice 655 Technology Risk Management Boundary
      description: 'Institutional obligation (adopter-operated; not-applicable to
        the standalone CAGE software boundary). MAS Notice 655 (Cyber Hygiene and
        Technology Risk Management: enterprise critical-system RTO certification,
        1-hour significant IT incident notification to MAS, privileged-account governance,
        and independent TRM audit sign-off) governs the licensed financial institution''s
        enterprise IT estate. CAGE produces KMS-signed decision and infrastructure
        custody batches archived to the adopter''s asia-southeast1 WORM domain.'
      purpose: Documents the institutional boundary and concrete adopter integration
        steps for MAS Notice 655 technology risk management and asia-southeast1 audit
        retention.
      status:
        state: operational
      responsible-roles:
      - role-id: trm-officer
      props:
      - name: mas-notice
        value: MAS Notice 655 — Technology Risk Management
      - name: log-retention-years
        value: '5'
      - name: storage-region
        value: asia-southeast1
      - name: control-origination
        value: adopter-operated
      links:
      - href: ../../compliance/lula/lula-validation-mas-notice655.yaml
        rel: lula
        text: 'Illustrative adopter Lula template: MAS Notice 655 Audit Logging'
    - uuid: apac-mas-comp-0003-4000-8000-000000000003
      type: policy
      title: Adopter-Operated MAS TRM §6.3 Institutional Model Risk Management Boundary
      description: Institutional obligation (adopter-operated; not-applicable to the
        standalone CAGE software boundary). MAS TRM Guidelines §6.3 require a financial-institution-wide
        AI/ML model risk management (MRM) framework covering enterprise model inventory,
        independent model validation sign-off, ENRM environmental risk scoping, and
        production model-drift governance. CAGE's in-repo technical controls — the
        0.96 APAC_MAS trade-confidence floor (APAC_MAS_BASELINE.json domains.finance.confidence.min_trade_confidence.value,
        enforced since ecca70b9 by src/cage_finance/tiers/trade_confidence_tier.py)
        and the USD 8,500 (SGD 11,500) consensus escalation threshold (src/cage_finance/tiers/consensus_tier.py)
        — are implemented by apac-mas-comp-0004 and graded under ctrl-agt-001 and
        cm-6 below.
      purpose: Documents the institutional MRM boundary for MAS TRM §6.3 while cross-referencing
        CAGE''s runtime 0.96 trade-confidence floor (ctrl-agt-001) and APAC_MAS threshold
        overlay (cm-6).
      status:
        state: operational
      responsible-roles:
      - role-id: ai-model-operator
      props:
      - name: mas-trm-section
        value: §6.3 — AI and Machine Learning Controls
      - name: confidence-threshold
        value: '0.96'
      - name: consensus-threshold-sgd
        value: '11500'
      - name: max-latency-ms
        value: '175'
      - name: control-origination
        value: adopter-operated
      links:
      - href: ../../compliance/lula/lula-validation-mas-trm-s6.yaml
        rel: lula
        text: 'Illustrative adopter Lula template: MAS TRM §6.3 AI Controls'
    - uuid: apac-mas-comp-0004-4000-8000-000000000004
      type: software
      title: CAGE Regional Finance Threshold Overlay and Trade-Confidence Tier
      description: Since commit ecca70b9, load_and_validate_thresholds() (src/gateway/governance/schemas/thresholds.py)
        deep-merges the domains object of config/thresholds/APAC_MAS_BASELINE.json
        onto the global domains sections of config/governance_thresholds.json (src/gateway/governance/schemas/regional_overlay.py)
        when CAGE_DEPLOYMENT_REGION=APAC_MAS. The finance plugin (src/cage_finance/plugin.py)
        builds its CashBarrier, bounding contracts and trade_confidence tier from
        the effective domains.finance section, and the CBF, STPA and consensus readers
        resolve the same effective values through THRESHOLDS.resolve(). Before ecca70b9
        these APAC_MAS values were declared in the baseline file but not read; APAC_MAS
        ran on the global (US_FED) values.
      purpose: Applies the APAC_MAS configuration settings (NIST SP 800-53 CM-6) and
        the regional agentic confidence floor (CTRL_AGT_001) to the governor pipeline,
        failing closed when they cannot be applied.
      status:
        state: operational
      responsible-roles:
      - role-id: compliance-engineer
      props:
      - name: applicable-regions
        value: APAC_MAS
      - name: min-trade-confidence
        value: '0.96'
      - name: cbf-gamma
        value: '0.55'
      - name: drawdown-limit
        value: '0.045'
      - name: consensus-threshold-usd
        value: '8500.0'
      - name: remediation-commit
        value: ecca70b9
      links:
      - href: ../../config/thresholds/APAC_MAS_BASELINE.json
        rel: reference
        text: APAC_MAS regional threshold baseline (domains.finance overlay)
      - href: ../../src/gateway/governance/schemas/regional_overlay.py
        rel: reference
        text: Fail-closed regional overlay
      - href: ../../src/cage_finance/tiers/trade_confidence_tier.py
        rel: reference
        text: TradeConfidenceTier (CTRL_AGT_001)
  control-implementation:
    description: CAGE APAC_MAS compliance control implementations. ISO 42001 universal
      controls are inherited from component-definition.yaml. The following entries
      document MAS-specific additive controls only.
    implemented-requirements:
    - uuid: apac-mas-req-0001-4000-8000-000000000001
      control-id: mas-feat
      description: 'Not applicable to the standalone CAGE software boundary (control-origination:
        adopter-operated). MAS FEAT Principles (Fairness F1/F2 quantitative demographic
        parity testing across PDPA-governed customer cohorts, Ethics E1 board-approved
        ethical standards, Accountability A1/A3 internal and external authority sign-off,
        and Transparency T1/T2 180-day customer/supervisor disclosures) bind the MAS-regulated
        financial institution and require real customer demographic distributions
        and institutional governance sign-off outside the reference engine. Adopter
        implementation steps: (1) execute periodic Fairness Impact Assessments (demographic
        parity gap <= 0.08 across protected cohorts per APAC_MAS_BASELINE.json under
        PDPA proxy-variable governance) over institution-held production outcomes
        using src/eval_harness/; (2) obtain board/CRO FEAT accountability sign-off
        and publish 180-day T1/T2 disclosures; (3) optionally expose institutional
        FIA attestation status at GET /v1/compliance/mas/feat if activating the illustrative
        lula-validation-mas-feat.yaml template.'
      props:
      - name: implementation-status
        value: not-applicable
      - name: control-origination
        value: adopter-operated
      - name: regulatory-citation
        value: MAS FEAT Principles (November 2019)
      responsible-roles:
      - role-id: ai-model-operator
      by-components:
      - component-uuid: apac-mas-comp-0001-4000-8000-000000000001
        uuid: apac-mas-bycomp-0001-4000-8000-000000000001
        description: 'Adopter-operated MAS FEAT fairness and governance boundary.
          CAGE supplies offline evaluation tooling (src/eval_harness/) and deterministic
          runtime barriers; the MAS-regulated financial institution runs demographic
          FIA evaluations, obtains board/CRO sign-off, and publishes customer disclosures.
          The linked Lula manifest (# cage-status: not-applicable) is retained as
          an illustrative template.'
        implementation-status:
          state: not-applicable
        links:
        - href: ../../compliance/lula/lula-validation-mas-feat.yaml
          rel: reference
          text: Illustrative adopter Lula template for MAS FEAT
    - uuid: apac-mas-req-0002-4000-8000-000000000002
      control-id: mas-notice-655
      description: 'Not applicable to the standalone CAGE software boundary (control-origination:
        adopter-operated). MAS Notice 655 (Cyber Hygiene and Technology Risk Management:
        enterprise critical-system RTO certification, 1-hour significant IT incident
        notification to MAS, privileged-account governance, and independent TRM audit
        certification) governs the licensed financial institution''s enterprise IT
        estate rather than an embedded governance service. Adopter implementation
        steps: (1) deploy CAGE in asia-southeast1 (MAS TRM §4.2) with a persistent
        >=2555-day retention-locked WORM evidence domain (EVIDENCE_ARCHIVE_BUCKET)
        verified via CustodyVerifier; (2) integrate CAGE into the institution''s MAS
        Notice 655 RTO/DR drills, 1-hour MAS incident-notification runbook, and accredited
        TRM audit scope; (3) optionally expose institutional certification status
        at GET /v1/compliance/mas/notice655 if activating the illustrative lula-validation-mas-notice655.yaml
        template.'
      props:
      - name: implementation-status
        value: not-applicable
      - name: control-origination
        value: adopter-operated
      - name: regulatory-citation
        value: MAS Notice 655 — Technology Risk Management
      responsible-roles:
      - role-id: trm-officer
      by-components:
      - component-uuid: apac-mas-comp-0002-4000-8000-000000000002
        uuid: apac-mas-bycomp-0002-4000-8000-000000000002
        description: 'Adopter-operated MAS Notice 655 technology risk management boundary.
          CAGE produces KMS-signed WORM decision and infrastructure custody batches
          in asia-southeast1; the licensed financial institution operates RTO certification,
          1-hour MAS incident reporting, and annual TRM audit review. The linked Lula
          manifest (# cage-status: not-applicable) is retained as an illustrative
          template.'
        implementation-status:
          state: not-applicable
        links:
        - href: ../../compliance/lula/lula-validation-mas-notice655.yaml
          rel: reference
          text: Illustrative adopter Lula template for MAS Notice 655
    - uuid: apac-mas-req-0003-4000-8000-000000000003
      control-id: mas-trm-s6
      description: 'Not applicable to the standalone CAGE software boundary (control-origination:
        adopter-operated). MAS TRM Guidelines §6.3 mandate an enterprise-wide AI/ML
        model risk management (MRM) programme — model inventory registration, independent
        model-validation team sign-off, ENRM environmental risk scoping, and ongoing
        production model-drift governance — operated by the MAS-regulated financial
        institution. CAGE''s in-repo technical runtime threshold — the 0.96 APAC_MAS
        trade-confidence floor enforced for trade execution since commit ecca70b9
        (config/thresholds/APAC_MAS_BASELINE.json domains.finance.confidence.min_trade_confidence.value,
        src/cage_finance/tiers/trade_confidence_tier.py) alongside the USD 8,500 (SGD
        11,500) consensus escalation threshold — is implemented and graded under the
        ctrl-agt-001 (apac-mas-req-0005-4000-8000-000000000005) and cm-6 (apac-mas-req-0004-4000-8000-000000000004)
        requirements below. Adopter implementation steps: (1) register the governed
        model and APAC_MAS_BASELINE.json thresholds in the institution''s MRM inventory;
        (2) complete independent pre-deployment model validation, ENRM scoping, and
        asia-southeast1 drift monitoring; (3) optionally expose MRM validation currency
        at GET /v1/compliance/mas/trm-s6 if activating the illustrative lula-validation-mas-trm-s6.yaml
        template.'
      props:
      - name: implementation-status
        value: not-applicable
      - name: control-origination
        value: adopter-operated
      - name: regulatory-citation
        value: MAS TRM Guidelines §6.3 — AI and Machine Learning Controls
      responsible-roles:
      - role-id: ai-model-operator
      by-components:
      - component-uuid: apac-mas-comp-0003-4000-8000-000000000003
        uuid: apac-mas-bycomp-0003-4000-8000-000000000003
        description: 'Adopter-operated MAS TRM §6.3 model risk management boundary;
          in-repo runtime enforcement of the 0.96 trade-confidence floor and APAC_MAS
          finance thresholds is cross-referenced under ctrl-agt-001 and cm-6. The
          linked Lula manifest (# cage-status: not-applicable) is retained as an illustrative
          template.'
        implementation-status:
          state: not-applicable
        links:
        - href: ../../compliance/lula/lula-validation-mas-trm-s6.yaml
          rel: reference
          text: Illustrative adopter Lula template for MAS TRM §6.3
    - uuid: apac-mas-req-0004-4000-8000-000000000004
      control-id: cm-6
      description: 'Configuration settings (NIST SP 800-53 CM-6). The effective APAC_MAS
        domains.finance values, enforced since commit ecca70b9, are: CBF gamma 0.55
        (CashBarrier(gamma=...) in src/cage_finance/plugin.py); drawdown.limit 0.045
        (bounding contract B2, src/cage_finance/safety/bounding/contracts.py); consensus.threshold_usd
        8500.0 (deterministic HITL escalation NOTIONAL_THRESHOLD_ESCALATION by default,
        or multi-model critic consensus when CAGE_CONSENSUS_CRITICS_ENABLED=true,
        src/cage_finance/tiers/consensus_tier.py); STPA UCA-5 drawdown 4.0%, UCA-6
        order-volume fraction 0.008 and FIN-2 / UCA-2 latency 175 ms (src/cage_finance/stpa/uca_rules.py).
        The gateway supplies both inputs itself, never from the caller (src/cage_finance/tools/trade_inputs.py):
        latency_ms is the measured age of the traded symbol''s latest quote and drawdown
        is the daily NAV drawdown in percent; an unavailable or untrustworthy source
        leaves the input unset and UCA-2 / UCA-5 refuse the trade. Previews and the
        committing run evaluate the same server-side inputs (POAM-2026-105 closed):
        the finance plugin contributes TradeInputResolver through PluginContribution.server_inputs,
        and the kernel bind_server_inputs() (src/gateway/governance/governor/server_inputs.py)
        drops every caller value for latency_ms, drawdown, its aliases and portfolio_total
        before resolving them, in POST /governance/validate-action, the MCP simulate_governance_check
        dry run and the trade tool before its committing run. No STPA input is defaulted
        on a dry run. UCA-6 (order-volume fraction 0.008) is evaluated on every trade
        and refuses one lacking either input (POAM-2026-106 closed): order_size is
        the caller''s notional amount divided by the verified quote price, and daily_vol
        is the symbol''s average daily volume from the market-data feed (verified
        source, traded symbol, finite and positive, at most four days old), both bound
        server-side by TradeInputResolver. The same resolver is registered for execute_trade_bounded,
        and bounding contract B2 compares the drawdown the gateway measured (never
        a caller value) with drawdown.limit (4.5%); an unmeasured drawdown is a HARD
        refusal (POAM-2026-108 closed). The overlay fails closed: a missing or malformed
        APAC_MAS_BASELINE.json, a regional section with no global counterpart, or
        a shape change aborts threshold loading; an unknown or invalid key fails governor
        assembly (src/cage_finance/thresholds.py); and assemble_governor() (src/gateway/governance/governor/assembly.py)
        refuses to assemble when the thresholds region differs from the jurisdiction
        region. FIN-1 stpa.max_sell_portfolio_fraction (0.09) is enforced by UCA-13
        (src/cage_finance/stpa/uca_rules.py): a sell whose amount exceeds this fraction
        of portfolio_total, or that lacks a numeric amount or portfolio_total, is
        a HARD STPA violation (POAM-2026-103 closed). portfolio_total = current NAV
        from the server-side NAV source (src/cage_finance/tools/trade_inputs.py),
        never from the caller; an unavailable, unverified, stale or non-positive NAV
        leaves it unset and UCA-13 refuses the sell. The consensus threshold is configured
        in the key threshold_usd and documented in APAC_MAS_BASELINE.json as a SGD
        11,500 / USD 8,500 equivalent.'
      props:
      - name: implementation-status
        value: implemented
      - name: regulatory-citation
        value: NIST SP 800-53 Rev 5 CM-6 (Configuration Settings)
      - name: applicable-regions
        value: APAC_MAS
      responsible-roles:
      - role-id: compliance-engineer
      by-components:
      - component-uuid: apac-mas-comp-0004-4000-8000-000000000004
        uuid: apac-mas-bycomp-0004-4000-8000-000000000004
        description: Each fail-closed path and the effective APAC_MAS values are observed
          in tests/governor/test_regional_overlay.py (test_effective_finance_values_per_region,
          test_region_mismatch_fails_assembly, test_unknown_regional_key_fails_assembly,
          test_missing_regional_file_fails_closed). Remediation recorded as POAM-2026-102
          in docs/POAM.md.
        implementation-status:
          state: partially-implemented
        links:
        - href: ../../tests/governor/test_regional_overlay.py
          rel: reference
          text: Regional overlay fail-closed tests
    - uuid: apac-mas-req-0005-4000-8000-000000000005
      control-id: ctrl-agt-001
      description: 'CTRL_AGT_001 regional agentic confidence floor. Since commit ecca70b9
        the finance trade_confidence tier (src/cage_finance/tiers/trade_confidence_tier.py,
        phase 1, order 1) refuses execute_trade and execute_trade_bounded when the
        agent''s declared confidence parameter (a caller-supplied self-assessment,
        not a server-measured signal) is below the effective domains.finance.confidence.min_trade_confidence.value
        of 0.96: a score at or above the universal defer floor requires human approval
        (HITL), a lower score defers, and a missing or malformed score is a HARD violation.
        The kernel ConfidenceStage still enforces the universal confidence band (0.95)
        for every action. APAC_MAS sets requires_warrant false for this norm, so the
        kernel warrant reliance gate (WarrantStage, commit a0deb7ad) is not assembled
        in this region and no warrant source is needed.'
      props:
      - name: implementation-status
        value: partial
      - name: cage-control-id
        value: CTRL_AGT_001
      - name: applicable-regions
        value: APAC_MAS
      responsible-roles:
      - role-id: ai-model-operator
      by-components:
      - component-uuid: apac-mas-comp-0004-4000-8000-000000000004
        uuid: apac-mas-bycomp-0005-4000-8000-000000000005
        description: Verified by tests/cage_finance/test_trade_confidence_tier.py
          (test_plugin_wires_the_effective_floor_and_gamma) and tests/governor/test_jurisdiction_wiring.py
          (trade_confidence tier present in the assembled pipeline).
        implementation-status:
          state: partially-implemented
        links:
        - href: ../../tests/cage_finance/test_trade_confidence_tier.py
          rel: reference
          text: TradeConfidenceTier tests
    - uuid: g7000099-stpa-4000-8000-compiler00001
