    uuid: g7000099-stpa-4000-8000-compiler00001
    control-id: sa-11
    description: "The STPA-to-Policy Compiler deterministically compiles the merged\
      \ STAMP/STPA\n          Unsafe Control Action (UCA) specifications into governance\
      \ artifacts whose\n          freshness CI checks (scripts/check_stpa_freshness.py).\
      \ A UCA's Python rule\n          enforces at runtime only when every input it\
      \ reads is bound server-side by a\n          ServerInputResolver registered\
      \ in assemble_governor(); rules keyed on\n          caller-asserted flags are\
      \ advisory, so this control is implemented only\n          when every UCA enforces.\n\
      \n          Compiler source: src/gateway/governance/stpa_compiler.py\n     \
      \     Control structure sources: config/stpa/ and each domain's src/cage_*/config/stpa/\n\
      \          Generated artifacts:\n            - Python rules: src/cage_finance/stpa/uca_rules.py\
      \ (generated Python UCA rules), src/gateway/governance/stpa_validator.py (STPA\
      \ validator) (12 UCAs: 6 enforcing, 6 advisory)\n            - config/sandbox/generated_sandbox_policy.yaml\
      \ (sandbox metadata for 2 UCAs; design-time reference, not read at runtime)\n\
      \n          Target compliance framework: NIST SP 800-53 Rev 5 (FedRAMP baseline)\n\
      \          Framework reference: https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final\n\
      \          System: CAGE Financial Advisor v1.1.0\n          UCAs encoded: 12\
      \ (6 enforcing server-bound, 6 advisory)\n          Hazards modelled: 7\n  \
      \        Safety constraints: 3\n          Last compiled: 2026-11-08T19:00:34Z\n\
      \n          UCA-to-Control mapping (NIST SP 800-53 Rev 5 (FedRAMP baseline)):\n\
      \            UCA-1 (unsafe_action): Agent executes write operation without a\
      \ human approval token.\n  → NIST: ac-3 (Access Enforcement), sc-4 (Information\
      \ in Shared System Resources / Fiscal Limits)\nUCA-10 (wrong_timing) [advisory\
      \ — partial]: Agent reads account balance with stale connection data.\n  → NIST:\
      \ cm-6 (Configuration Settings), si-4 (System Monitoring)\nUCA-12 (unsafe_action)\
      \ [advisory — partial]: Agent executes bounded trade when bounding contracts\
      \ B1-B10 fail validation. Phase 5: execute_trade_bounded is EXTERNALLY_REVERSIBLE\
      \ when B10 rollback window validation passes, enabling HITL review without confidence\
      \ hard-gate per VEC-004. When B10 fails (closed rollback window), the bounding\
      \ tier raises a HITL violation (B10_ROLLBACK_WINDOW_CLOSED) and the request\
      \ parks for human approval, as an irreversible action would.\n  → NIST: ac-3\
      \ (Access Enforcement), sa-11 (Developer Testing and Evaluation)\nUCA-13 (unsafe_action):\
      \ Agent executes sell order exceeding the allowable fraction of portfolio value.\n\
      \  → NIST: sc-4 (Information in Shared System Resources / Fiscal Limits), cm-6\
      \ (Configuration Settings)\nUCA-2 (wrong_timing): Agent executes trade with\
      \ stale market data (latency > threshold).\n  → NIST: cm-6 (Configuration Settings),\
      \ sa-11 (Developer Testing and Evaluation)\nUCA-3 (unsafe_action) [advisory\
      \ — partial]: Agent outputs PII to user interface.\n  → NIST: ac-3 (Access Enforcement),\
      \ sc-28 (Protection of Information at Rest)\nUCA-4 (stopped_too_soon) [advisory\
      \ — partial]: Agent debits account but fails to credit asset (atomic failure).\n\
      \  → NIST: si-7 (Software, Firmware, and Information Integrity), au-10 (Non-Repudiation)\n\
      UCA-5 (unsafe_action): Agent executes buy order when daily drawdown exceeds\
      \ limit.\n  → NIST: ac-3 (Access Enforcement), sc-4 (Information in Shared System\
      \ Resources / Fiscal Limits)\nUCA-6 (wrong_timing): Agent submits market order\
      \ exceeding allowable fraction of daily volume.\n  → NIST: sc-4 (Information\
      \ in Shared System Resources / Fiscal Limits), si-3 (Malicious Code Protection)\n\
      UCA-7 (unsafe_action): Adversarial prompt injection score exceeds detection\
      \ threshold.\n  → NIST: sc-4 (Information in Shared System Resources / Fiscal\
      \ Limits), si-3 (Malicious Code Protection)\nUCA-8 (wrong_timing) [advisory\
      \ — partial]: Agent executes trade before risk assessment is complete.\n  →\
      \ NIST: ac-3 (Access Enforcement), sa-11 (Developer Testing and Evaluation)\n\
      UCA-9 (wrong_timing) [advisory — partial]: Agent executes trade with compliance\
      \ check bypassed.\n  → NIST: ac-3 (Access Enforcement), cm-6 (Configuration\
      \ Settings)"
