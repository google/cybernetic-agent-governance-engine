    description: "The STPA-to-Policy Compiler implements a deterministic, design-time\
      \ safety\n          control that translates STAMP/STPA Unsafe Control Action\
      \ (UCA) analysis\n          directly into runtime-enforceable governance artifacts.\
      \ This eliminates the\n          \"Natural Language Tax\" — the compliance gap\
      \ between human-readable safety\n          specifications and the actual code\
      \ running in the cluster.\n\n          Compiler source: src/gateway/governance/stpa_compiler.py\n\
      \          Control structure (source of truth): config/stpa_control_structure.yaml\n\
      \          Generated artifacts:\n            - config/opa/generated_stpa_policy.rego\
      \    (OPA Rego — 5 UCAs)\n            - config/rails/generated_stpa_rails.co\
      \     (NeMo Colang — 3 UCAs)\n            - src/gateway/governance/generated_stpa_validator.py\
      \ (Python — 6 UCAs)\n\n          System: CAGE Financial Advisor v1.1.0\n   \
      \       UCAs encoded: 9\n          Hazards modelled: 6\n          Safety constraints:\
      \ 3\n          Last compiled: 2026-05-17T17:31:03Z\n\n          UCA-to-Control\
      \ mapping:\n            UCA-1 (unsafe_action): Agent executes write operation\
      \ without a signed approval token.\n  → NIST: AC-3 (Access Enforcement), SC-4\
      \ (Information in Shared System Resources / Fiscal Limits)\n  → ISO 42001: A.8.4\n\
      UCA-2 (wrong_timing): Agent executes trade with stale market data (latency >\
      \ threshold).\n  → NIST: CM-6 (Configuration Settings), SA-11 (Developer Testing\
      \ and Evaluation)\n  → ISO 42001: A.8.4, A.6.2\nUCA-3 (unsafe_action): Agent\
      \ outputs PII to user interface.\n  → NIST: AC-3 (Access Enforcement), SC-28\
      \ (Protection of Information at Rest)\n  → ISO 42001: A.9.2\nUCA-4 (stopped_too_soon):\
      \ Agent debits account but fails to credit asset (atomic failure).\n  → NIST:\
      \ SI-7 (Software, Firmware, and Information Integrity), AU-10 (Non-Repudiation)\n\
      \  → ISO 42001: A.8.4\nUCA-5 (unsafe_action): Agent executes buy order when\
      \ daily drawdown exceeds limit.\n  → NIST: AC-3 (Access Enforcement), SC-4 (Information\
      \ in Shared System Resources / Fiscal Limits)\n  → ISO 42001: A.8.4, A.6.2\n\
      UCA-6 (wrong_timing): Agent submits market order exceeding allowable fraction\
      \ of daily volume.\n  → NIST: SC-4 (Information in Shared System Resources /\
      \ Fiscal Limits), SI-3 (Malicious Code Protection)\n  → ISO 42001: A.8.4, A.6.2\n\
      UCA-7 (unsafe_action): Adversarial prompt injection score exceeds detection\
      \ threshold.\n  → NIST: SC-4 (Information in Shared System Resources / Fiscal\
      \ Limits), SI-3 (Malicious Code Protection)\n  → ISO 42001: A.5.2\nUCA-8 (wrong_timing):\
      \ Agent executes trade before risk assessment is complete.\n  → NIST: AC-3 (Access\
      \ Enforcement), SA-11 (Developer Testing and Evaluation)\n  → ISO 42001: A.8.4\n\
      UCA-9 (wrong_timing): Agent executes trade with compliance check bypassed.\n\
      \  → NIST: AC-3 (Access Enforcement), CM-6 (Configuration Settings)\n  → ISO\
      \ 42001: A.8.4"
