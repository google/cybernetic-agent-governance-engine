    control-id: sa-11
    description: "The STPA-to-Policy Compiler implements a deterministic, design-time\
      \ safety\n          control that translates STAMP/STPA Unsafe Control Action\
      \ (UCA) analysis\n          directly into runtime-enforceable governance artifacts.\
      \ This eliminates the\n          \"Natural Language Tax\" — the compliance gap\
      \ between human-readable safety\n          specifications and the actual code\
      \ running in the cluster.\n\n          Compiler source: src/gateway/governance/stpa_compiler.py\n\
      \          Control structure (source of truth): config/stpa_control_structure.yaml\n\
      \          Generated artifacts:\n            - config/opa/generated_stpa_policy.rego\
      \    (OPA Rego — 5 UCAs)\n            - config/rails/generated_stpa_rails.co\
      \     (NeMo Colang — 3 UCAs)\n            - src/gateway/governance/generated_stpa_validator.py\
      \ (Python — 6 UCAs)\n\n          Target compliance framework: NIST SP 800-53\
      \ Rev 5 (FedRAMP baseline)\n          Framework reference: https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final\n\
      \          System: CAGE Financial Advisor v1.1.0\n          UCAs encoded: 9\n\
      \          Hazards modelled: 7\n          Safety constraints: 3\n          Last\
      \ compiled: 2026-08-29T19:37:15Z\n\n          UCA-to-Control mapping (NIST SP\
      \ 800-53 Rev 5 (FedRAMP baseline)):\n            UCA-1 (unsafe_action): Agent\
      \ executes write operation without a signed approval token.\n  → NIST: ac-3\
      \ (Access Enforcement), sc-4 (Information in Shared System Resources / Fiscal\
      \ Limits)\nUCA-2 (wrong_timing): Agent executes trade with stale market data\
      \ (latency > threshold).\n  → NIST: cm-6 (Configuration Settings), sa-11 (Developer\
      \ Testing and Evaluation)\nUCA-3 (unsafe_action): Agent outputs PII to user\
      \ interface.\n  → NIST: ac-3 (Access Enforcement), sc-28 (Protection of Information\
      \ at Rest)\nUCA-4 (stopped_too_soon): Agent debits account but fails to credit\
      \ asset (atomic failure).\n  → NIST: si-7 (Software, Firmware, and Information\
      \ Integrity), au-10 (Non-Repudiation)\nUCA-5 (unsafe_action): Agent executes\
      \ buy order when daily drawdown exceeds limit.\n  → NIST: ac-3 (Access Enforcement),\
      \ sc-4 (Information in Shared System Resources / Fiscal Limits)\nUCA-6 (wrong_timing):\
      \ Agent submits market order exceeding allowable fraction of daily volume.\n\
      \  → NIST: sc-4 (Information in Shared System Resources / Fiscal Limits), si-3\
      \ (Malicious Code Protection)\nUCA-7 (unsafe_action): Adversarial prompt injection\
      \ score exceeds detection threshold.\n  → NIST: sc-4 (Information in Shared\
      \ System Resources / Fiscal Limits), si-3 (Malicious Code Protection)\nUCA-8\
      \ (wrong_timing): Agent executes trade before risk assessment is complete.\n\
      \  → NIST: ac-3 (Access Enforcement), sa-11 (Developer Testing and Evaluation)\n\
      UCA-9 (wrong_timing): Agent executes trade with compliance check bypassed.\n\
      \  → NIST: ac-3 (Access Enforcement), cm-6 (Configuration Settings)"
