# OSCAL Component Definition
# CAGE Client SDK — Out-of-Process Policy Enforcement Point (PEP) Client
#
# This component definition documents the CAGE Client SDK (packages/cage-client/)
# security posture across implemented NIST SP 800-53 Rev 5 controls.

component-definition:
  uuid: "8a9f5c3d-2b1e-4f7a-9c8d-5e6f7a8b9c0d"
  metadata:
    title: "CAGE Client SDK — Out-of-Process PEP Client Component Definition"
    version: "1.5.0"
    oscal-version: "1.0.4"
    last-modified: "2026-11-24T23:00:00Z"
    remarks: >
      This component definition maps the Python CAGE Client SDK
      (packages/cage-client/, v0.5.0 unreleased) to NIST SP 800-53 Rev 5
      controls. packages/cage-client/ is the SDK's only source tree: in-repo
      consumers, including the reference advisor's GatewayClient
      (src/governed_financial_advisor/infrastructure/gateway_client.py),
      install it as a built non-editable wheel, and
      scripts/check_client_sdk_sync.py fails on mirror reappearance, editable
      installs, site-packages SHA-256 drift, or release-state dishonesty. The
      SDK verifies preview evaluations from the central CAGE Governance Gateway
      Policy Decision Point (PDP) over TLS/mTLS (/governance/validate-action;
      AC-3, SC-8), propagates W3C traceparent correlation headers, verifies
      GovernanceEnvelope.signature over RFC 8785 JCS canonical bytes against
      independently resolved out-of-band kid trust anchors on every HTTP 200
      and HTTP 403 verdict (AU-10), and enforces GovernanceEnvelope.expires_at
      temporal freshness and subject.action_hash request binding (SC-23)
      fail-closed by default. Committing tool execution (/tools/execute),
      server-side v3 asymmetric KMS JWT routing seals, and atomic Redis SETNX
      single-use nonce consumption live on the gateway
      (src/gateway/governance/routing_seal.py, src/gateway/server/mcp_tool_server.py),
      while the SDK committing client and replacement LangGraph node factory are
      tracked under POAM-2026-251.

  components:
    # -----------------------------------------------------------------------
    # Component 1: CAGE Client SDK (packages/cage-client/)
    # Controls: AC-3 (Access Enforcement), AU-10 (Non-Repudiation),
    #           SC-8 (Transmission Confidentiality), SC-23 (Session Authenticity)
    # -----------------------------------------------------------------------
    - uuid: "7c8e9f1a-3d4b-5c6e-8f9a-1b2c3d4e5f6a"
      title: "CAGE Client SDK"
      type: software
      description: >
        Python client library (packages/cage-client/, v0.5.0) providing
        out-of-process HTTP preview verification (POST /governance/validate-action)
        and fail-closed GovernanceEnvelope verification for Python and LangGraph
        applications communicating with the CAGE Governance Gateway PDP.
        Performs fail-closed HTTP status and verdict mediation across signed
        HTTP 200 and HTTP 403 GovernanceEnvelope responses (rejecting
        non-envelope 403, legacy 202/409/422, and 5xx fail-closed as
        CageGatewayError), out-of-band kid JWKS/PEM asymmetric signature
        verification over RFC 8785 JCS canonical bytes, expires_at freshness
        validation, subject.action and subject.action_hash request binding,
        Pydantic strict-mode schema validation, optional mutual TLS transport
        configuration, and W3C traceparent header propagation.
      purpose: >
        Enables standalone Python and LangGraph applications to submit proposed
        actions for preview evaluation to the CAGE Governance Gateway over
        TLS/mTLS, cryptographically verify returned GovernanceEnvelope decisions
        (both HTTP 200 and HTTP 403) against out-of-band kid trust anchors, and
        fail closed on gateway refusal, deferral, signature/freshness/binding
        failure, network error, or malformed/unverified response payloads.
      responsible-roles:
        - role-id: provider
      control-implementations:
        - uuid: "9b1c2d3e-4f5a-6b7c-8d9e-0f1a2b3c4d5e"
          source: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home"
          description: "NIST SP 800-53 Rev 5 controls mapped for the CAGE Client SDK (packages/cage-client/)"
          implemented-requirements:
            - uuid: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
              control-id: ac-3
              description: |
                Preview-plane and committing-plane access mediation in packages/cage-client/
                (v0.5.0) is implemented across packages/cage-client/src/cage_client/core.py
                (CageClient.validate_action(), CageClient.preview(), CageClient.execute_tool(),
                enforce_verification_posture()), packages/cage-client/src/cage_client/langgraph.py
                (governed_node(), governed_tool_node(), approval_park_node()),
                packages/cage-client/src/cage_client/outcomes.py (CommitOutcome,
                ApprovalRedemptionRefusal, verify_commit_outcome_payload()), and
                packages/cage-client/src/cage_client/idempotency.py (derive_plan_step_key(),
                derive_transaction_id()).

                Preview path (POST /governance/validate-action):
                - CageClient.validate_action() and CageClient.preview() post canonicalized
                  action parameters to dry-run POST /governance/validate-action (which
                  reserves no budget, mints no single-use routing seal, and performs no
                  actuation) and mediate verdicts fail-closed across HTTP 200 (ALLOW, NARROW,
                  DENY, DEFER / REQUIRE_APPROVAL), HTTP 403 (DENY with verified envelope and
                  non-blank proof_hash / audit_id), HTTP 429 / 503 (GatewayUnavailableError),
                  and unexpected / unverified responses.
                - Enforcing posture guard (enforce_verification_posture()): defaults
                  unset/blank CAGE_ENV and ENVIRONMENT fail-secure to "production",
                  treats "local" as enforcing, and rejects disabling signature,
                  expiration, or subject verification with ValueError unless CAGE_ENV /
                  ENVIRONMENT is explicitly in {"dev", "development", "test", "testing"}.

                Committing path (POST /tools/execute) and LangGraph node mediation:
                - CageClient.execute_tool() dispatches committing tool executions over
                  POST /tools/execute with optional approval_token and idempotency_key
                  (configurable idempotency_param), cryptographically verifying signed
                  CommitOutcome payloads (EXECUTED, DRY_RUN, REFUSED, DEFERRED,
                  INDETERMINATE, UNSETTLED_DUPLICATE) via verify_commit_outcome_payload()
                  using out-of-band JWKS/pinned keys and strict RFC 8785 JCS canonicalization,
                  mapping HTTP 429/503 or un-evidenced HTTP 403 to GatewayUnavailableError
                  and HTTP 500/502/504/transport ambiguity to fail-closed client-inferred
                  INDETERMINATE.
                - governed_node(), governed_tool_node(), and approval_park_node() require
                  explicit principal and action extractors (never fabricating default
                  "unknown" principals or {} actions), return langgraph.types.Command
                  updates so deferred_id checkpoints cleanly before interrupt() (raising
                  MissingDeferralTicketError when parked without a ticket), differentiate
                  retryable (PENDING, QUORUM_INCOMPLETE) vs terminal ApprovalRedemptionRefusal
                  outcomes without local unsealed actuation, and isolate reference-advisor
                  domain policy in src/governed_financial_advisor/graph/governance/tool_guard.py
                  (TOCTOU drift revalidation, REFUSAL_DESCRIPTIONS formatting, trade allowlist).

                Scope boundary: The retired preview-only @cage_guard decorator has been
                removed. Server-side v3 asymmetric KMS JWT routing seals and Redis SETNX
                single-use nonce consumption live in src/gateway/governance/routing_seal.py,
                and consecutive denial budget tracking (MAX_CONSECUTIVE_DENIALS) lives in
                src/governed_financial_advisor/graph/nodes/safety_node.py, outside
                packages/cage-client/.
              props:
                - name: implementation-status
                  value: implemented
                - name: control-origination
                  value: system-specific
                - name: implementation-date
                  value: "2026-11-26"
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=AC-3"
                  rel: reference
                - href: "../../packages/cage-client/src/cage_client/core.py"
                  rel: implementation
                  text: "Preview/commit verification and fail-closed posture guard in CageClient"
                - href: "../../packages/cage-client/src/cage_client/langgraph.py"
                  rel: implementation
                  text: "Command-based LangGraph governance factories (governed_tool_node, governed_node, approval_park_node)"
                - href: "../../packages/cage-client/src/cage_client/outcomes.py"
                  rel: implementation
                  text: "Signed CommitOutcome verification and ApprovalRedemptionRefusal decoding"
                - href: "../../tests/unit/test_advisor_sdk_checkpointer_e2e.py"
                  rel: implementation
                  text: "Real-checkpointer advisor DEFER -> interrupt -> premature resume -> quorum approve -> redeem -> CONSUMED replay E2E"

            - uuid: "2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e"
              control-id: au-10
              description: |
                Client-side cryptographic non-repudiation verification of gateway
                GovernanceEnvelope decisions is implemented in
                packages/cage-client/src/cage_client/core.py
                (CageClient._verify_envelope_response(), _verify_signature_block()),
                packages/cage-client/src/cage_client/crypto.py (verify_envelope_signature(),
                load_pinned_public_key()), packages/cage-client/src/cage_client/jwks.py
                (JwksKeyResolver), and packages/cage-client/src/cage_client/_jcs/.

                By default (verify_signature=True), CageClient verifies every HTTP 200
                and HTTP 403 GovernanceEnvelope before returning ALLOW or dispatching
                NARROW / DENY / DEFER / REQUIRE_APPROVAL verdicts:
                - Resolves signing public keys strictly out-of-band by kid via
                  JwksKeyResolver ({gateway_url}/governance/.well-known/jwks.json with
                  single-flight refresh, HTTP 304 rejection, rotation replacement,
                  immediate cache eviction on authoritative HTTP 200 empty or malformed
                  key sets, and hard max_jwks_staleness_s fail-closed eviction during
                  endpoint outages) or caller-pinned public_keys; embedded public keys
                  or unexpected signature fields inside the envelope raise
                  RoutingSealVerificationError
                - Canonicalizes the unsigned wire envelope via pure-stdlib RFC 8785 JCS
                  (_jcs.canonicalize) and accepts exactly two signature algorithms, the
                  two the gateway signs with: ES256 (EC P-256, SHA-256) and EdDSA
                  (Ed25519). Every other algorithm (including none, HS*, ES384, ES512,
                  RS* and PS*) and every other key type is rejected fail-closed, and a
                  JWKS containing any other key is refused as a whole
                - Acts only on the values it verified: every verdict response is parsed
                  as strict JSON (a repeated object key or a NaN/Infinity token raises
                  RoutingSealVerificationError), GovernanceEnvelope validates in Pydantic
                  strict mode without stripping, case-folding or coercing any field
                  (timestamps only as RFC 3339 strings with an explicit offset), and the
                  verdict, kid and algorithm are matched exactly as received
                - Propagates W3C Trace Context traceparent headers
                  (generate_w3c_traceparent()) for distributed audit correlation

                Point-to-point transport mTLS (sc-8) protects the wire channel only and
                does not substitute for end-to-end GovernanceEnvelope.signature
                verification. Remains marked partially-implemented under POAM-2026-241
                pending tagged release publication of cage-client v0.5.0. Server-side KMS
                envelope signing lives in src/gateway/governance/governance_envelope.py
                and src/gateway/governance/kms_signer.py.
              props:
                - name: implementation-status
                  value: partially-implemented
                - name: control-origination
                  value: system-specific
                - name: implementation-date
                  value: "2026-11-24"
                - name: w3c-traceparent-propagation
                  value: "true"
                - name: poam-reference
                  value: "POAM-2026-241"
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=AU-10"
                  rel: reference
                - href: "https://www.w3.org/TR/trace-context/"
                  rel: reference
                  text: "W3C Trace Context specification"
                - href: "../../packages/cage-client/src/cage_client/core.py"
                  rel: implementation
                  text: "Pre-verdict GovernanceEnvelope signature verification in CageClient._verify_envelope_response()"
                - href: "../../packages/cage-client/src/cage_client/crypto.py"
                  rel: implementation
                  text: "Asymmetric signature verification, pinned key validation, and W3C traceparent generation"
                - href: "../../packages/cage-client/src/cage_client/jwks.py"
                  rel: implementation
                  text: "Out-of-band kid JWKS resolver with bounded TTL and max_jwks_staleness_s eviction"

            - uuid: "3c4d5e6f-7a8b-9c0d-1e2f-3a4b5c6d7e8f"
              control-id: sc-8
              description: |
                Point-to-point transmission confidentiality and integrity are implemented
                in packages/cage-client/src/cage_client/transport.py::create_mtls_transport().

                create_mtls_transport() configures an httpx.AsyncHTTPTransport (with
                optional HTTP/2 multiplexing when the h2 extra is installed):
                - Rejects half-configured client cert/key pairs with ValueError and
                  validates that any supplied cert_path, key_path, or ca_path exists on
                  disk, raising FileNotFoundError fail-closed when missing
                - Builds an SSLContext via ssl.create_default_context(purpose=ssl.Purpose.SERVER_AUTH,
                  cafile=ca_path), loads client credentials via load_cert_chain() when
                  cert_path and key_path are supplied, and enforces check_hostname = True
                  and verify_mode = ssl.CERT_REQUIRED (or verify=True against the system
                  CA store when no custom paths are supplied)
                - CageClient disables HTTP redirects (follow_redirects=False)

                Scope boundary: packages/cage-client/ does not call
                src/gateway/infrastructure/tls_context.py::create_hardened_client_context().
                Channel TLS/mTLS covers sc-8 point-to-point transmission confidentiality
                only and does not substitute for end-to-end GovernanceEnvelope.signature
                verification (au-10) or GovernanceEnvelope.expires_at and subject binding
                checks (sc-23).
              props:
                - name: implementation-status
                  value: implemented
                - name: control-origination
                  value: system-specific
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=SC-8"
                  rel: reference
                - href: "../../packages/cage-client/src/cage_client/transport.py"
                  rel: implementation
                  text: "Client TLS/mTLS transport configuration in create_mtls_transport()"

            - uuid: "4d5e6f7a-8b9c-0d1e-2f3a-4b5c6d7e8f9a"
              control-id: sc-23
              description: |
                Client-side envelope temporal freshness, request-subject authenticity,
                per-call correlation_id replay binding, and deferral ticket TTL
                separation are implemented in packages/cage-client/src/cage_client/core.py
                (CageClient._verify_timestamps(), CageClient._verify_subject_binding(),
                CageClient._mediate_defer_verdict()),
                packages/cage-client/src/cage_client/crypto.py
                (compute_expected_action_hash()),
                packages/cage-client/src/cage_client/exceptions.py (DeferralPending),
                and packages/cage-client/src/cage_client/outcomes.py (PreviewResult),
                paired with gateway-side envelope binding and deferral TTL emission in
                src/gateway/governance/governance_envelope.py
                (GovernanceEnvelopeBuilder.build()),
                src/gateway/server/governance_middleware.py
                (_resolve_validate_correlation_id()), and
                src/gateway/governance/governor/verdicts.py (_defer_ttl_fields()).

                By default (verify_expiration=True, verify_subject=True,
                clock_skew_seconds=5.0), CageClient enforces on every HTTP 200 and
                HTTP 403 GovernanceEnvelope before returning ALLOW or mediating
                verdicts:
                - Requires timezone-aware issued_at and expires_at timestamps with
                  expires_at > issued_at, rejects future-dated issued_at where
                  issued_at - timedelta(seconds=clock_skew_seconds) > now(UTC), and
                  rejects expired envelopes where
                  expires_at + timedelta(seconds=clock_skew_seconds) <= now(UTC) with
                  RoutingSealVerificationError
                - Prevents cross-action, cross-parameter, and cross-call replay by
                  verifying envelope.subject["action"] == action, constant-time
                  hmac.compare_digest() parity between envelope.subject["action_hash"]
                  and sha256:<hex> over RFC 8785 JCS {"action": action, "params": ...},
                  and isinstance(str) + non-blank + constant-time hmac.compare_digest()
                  parity between signed envelope.payload["correlation_id"] and the
                  caller's per-call correlation_id (while gateway binds
                  payload["correlation_id"] conditionally when supplied, returning HTTP
                  400 on whitespace-only values or body/header mismatches)
                - Separates multi-hour HITL deferral ticket lifetime (defer_expires_at,
                  parsed from strict RFC 3339 defer_expires_at or derived from
                  issued_at + ttl_seconds with a WARNING log when falling back to
                  14400s — never envelope.expires_at) onto DeferralPending.expires_at /
                  DeferralPending.defer_expires_at (distinct from envelope_expires_at)
                  and PreviewResult.defer_expires_at

                Scope boundary: Stateless CageClient validates temporal freshness,
                request-parameter hash binding, and per-call correlation_id parity per
                call; stateful server-side single-use seal nonce consumption via atomic
                Redis SETNX (verify_and_consume_seal()) lives in
                src/gateway/governance/routing_seal.py, outside packages/cage-client/.
              props:
                - name: implementation-status
                  value: implemented
                - name: control-origination
                  value: system-specific
                - name: implementation-date
                  value: "2026-11-26"
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=SC-23"
                  rel: reference
                - href: "../../packages/cage-client/src/cage_client/core.py"
                  rel: implementation
                  text: "Temporal freshness, subject/correlation_id binding, and defer_expires_at mediation in CageClient"
                - href: "../../packages/cage-client/src/cage_client/crypto.py"
                  rel: implementation
                  text: "RFC 8785 JCS compute_expected_action_hash() request-parameter binding"
                - href: "../../packages/cage-client/src/cage_client/envelope.py"
                  rel: implementation
                  text: "Immutable GovernanceEnvelope issued_at, expires_at, payload, and subject schema fields"
                - href: "../../packages/cage-client/src/cage_client/exceptions.py"
                  rel: implementation
                  text: "DeferralPending defer_expires_at vs envelope_expires_at separation"
                - href: "../../src/gateway/governance/governance_envelope.py"
                  rel: implementation
                  text: "GovernanceEnvelopeBuilder signed payload.correlation_id binding"
                - href: "../../src/gateway/server/governance_middleware.py"
                  rel: implementation
                  text: "POST /governance/validate-action correlation_id validation and envelope binding"
                - href: "../../src/gateway/governance/governor/verdicts.py"
                  rel: implementation
                  text: "Explicit defer_expires_at and ttl_seconds emission in _defer_ttl_fields()"
                - href: "../../packages/cage-client/tests/test_sc23_correlation_and_ttl.py"
                  rel: implementation
                  text: "Standalone SC-23 correlation_id binding and defer_expires_at unit and mutant tests"
                - href: "../../tests/gateway/test_sc23_gateway_binding.py"
                  rel: implementation
                  text: "Live ASGI and dual-column SC23-M1..M5 mutation tests for gateway and SDK SC-23 binding"

  # -------------------------------------------------------------------------
  # Related Components (References Only)
