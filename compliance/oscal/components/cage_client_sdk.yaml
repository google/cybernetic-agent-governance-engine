# OSCAL Component Definition
# CAGE Client SDK — Out-of-Process Policy Enforcement Point (PEP) Client
#
# This component definition documents the CAGE Client SDK (packages/cage-client/)
# security posture across implemented and planned NIST SP 800-53 Rev 5 controls.

component-definition:
  uuid: "8a9f5c3d-2b1e-4f7a-9c8d-5e6f7a8b9c0d"
  metadata:
    title: "CAGE Client SDK — Out-of-Process PEP Client Component Definition"
    version: "1.1.0"
    oscal-version: "1.0.4"
    last-modified: "2026-11-06T18:00:00Z"
    remarks: >
      This component definition maps the Python CAGE Client SDK
      (packages/cage-client/) to NIST SP 800-53 Rev 5 controls. The SDK acts as
      an out-of-process HTTP Policy Enforcement Point (PEP) that mediates
      action execution against the central CAGE Governance Gateway Policy
      Decision Point (PDP) over TLS/mTLS (AC-3, SC-8) and propagates W3C
      traceparent correlation headers. Client-side cryptographic verification
      of GovernanceEnvelope.signature against an out-of-band kid trust anchor
      (AU-10) and client-side enforcement of GovernanceEnvelope.expires_at
      temporal freshness or single-use nonce consumption (SC-23) are not yet
      implemented in packages/cage-client/ and are recorded truthfully as
      planned. Server-side v3 asymmetric KMS JWT routing seals and atomic Redis
      SETNX single-use nonce consumption live in
      src/gateway/governance/routing_seal.py, and MAX_CONSECUTIVE_DENIALS lives
      in src/governed_financial_advisor/graph/nodes/safety_node.py, outside
      packages/cage-client/.

  components:
    # -----------------------------------------------------------------------
    # Component 1: CAGE Client SDK (packages/cage-client/)
    # Implemented: AC-3 (Access Enforcement), SC-8 (Transmission Confidentiality)
    # Planned:     AU-10 (Non-Repudiation), SC-23 (Session Authenticity)
    # -----------------------------------------------------------------------
    - uuid: "7c8e9f1a-3d4b-5c6e-8f9a-1b2c3d4e5f6a"
      title: "CAGE Client SDK"
      type: software
      description: >
        Python client library (packages/cage-client/) providing out-of-process
        HTTP Policy Enforcement Point (PEP) mediation for LangGraph and Python
        agent applications communicating with the CAGE Governance Gateway PDP.
        Performs fail-closed HTTP status mediation (200/403/422/202/409/5xx),
        Pydantic schema validation of GovernanceEnvelope responses, optional
        mutual TLS transport configuration, and W3C traceparent header
        propagation. Does not yet verify GovernanceEnvelope.signature or
        enforce GovernanceEnvelope.expires_at client-side.
      purpose: >
        Enables standalone Python and LangGraph applications to submit proposed
        actions to the CAGE Governance Gateway over TLS/mTLS and block execution
        fail-closed on gateway refusal, deferral, network failure, or malformed
        response payloads while propagating W3C traceparent headers for
        distributed trace correlation.
      responsible-roles:
        - role-id: provider
      control-implementations:
        - uuid: "9b1c2d3e-4f5a-6b7c-8d9e-0f1a2b3c4d5e"
          source: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home"
          description: "NIST SP 800-53 Rev 5 controls mapped for the CAGE Client SDK (packages/cage-client/)"
          implemented-requirements:
            - uuid: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
              control-id: ac-3
              description: |
                Access enforcement in packages/cage-client/ is implemented via
                out-of-process HTTP Policy Enforcement Point (PEP) mediation in
                packages/cage-client/src/cage_client/core.py (CageClient.validate_action())
                and packages/cage-client/src/cage_client/adapters/langgraph.py (@cage_guard).

                Before a decorated LangGraph node executes, @cage_guard calls
                CageClient.validate_action(), which posts canonicalized action parameters
                (SHA-256 parameter_hash) to /governance/validate-action and mediates
                execution fail-closed by HTTP response status and schema validity:
                - Network / timeout error (httpx.RequestError): raises CageGatewayError
                - HTTP 5xx or unexpected status code: raises CageGatewayError
                - HTTP 403 / 422 (DENY): requires audit_id and raises PolicyViolationException
                - HTTP 202 / 409 (DEFER): requires ticket_id and raises DeferralPending
                - HTTP 200 (ALLOW): requires valid JSON with a Pydantic-valid
                  GovernanceEnvelope (raises CageGatewayError on missing/malformed fields)

                Scope boundary: Client-side cryptographic verification of
                GovernanceEnvelope.signature (au-10) and client-side temporal freshness
                enforcement of GovernanceEnvelope.expires_at (sc-23) are not yet
                implemented in packages/cage-client/ (recorded as planned under au-10 and
                sc-23). Server-side v3 asymmetric KMS JWT routing seals and Redis SETNX
                single-use nonce consumption live in src/gateway/governance/routing_seal.py,
                and consecutive denial budget tracking (MAX_CONSECUTIVE_DENIALS) lives in
                src/governed_financial_advisor/graph/nodes/safety_node.py, outside
                packages/cage-client/.
              props:
                - name: implementation-status
                  value: implemented
                - name: control-origination
                  value: system-specific
                - name: implementation-date
                  value: "2026-09-18"
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=AC-3"
                  rel: reference
                - href: "../../packages/cage-client/src/cage_client/core.py"
                  rel: implementation
                  text: "Out-of-process HTTP PEP mediation in CageClient.validate_action()"
                - href: "../../packages/cage-client/src/cage_client/adapters/langgraph.py"
                  rel: implementation
                  text: "LangGraph pre-execution @cage_guard node decorator"

            - uuid: "2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e"
              control-id: au-10
              description: |
                Client-side non-repudiation is planned (not yet implemented) in
                packages/cage-client/.

                packages/cage-client/src/cage_client/crypto.py (generate_w3c_traceparent())
                generates and propagates a W3C Trace Context traceparent header
                (00-{trace_id}-{span_id}-01) on outbound /governance/validate-action
                requests for distributed trace correlation only; trace correlation is
                not cryptographic non-repudiation.

                While GovernanceEnvelope (packages/cage-client/src/cage_client/envelope.py)
                parses the signature dictionary (algorithm, value, kid), CageClient does
                not yet verify GovernanceEnvelope.signature against an independently
                resolved out-of-band kid trust anchor (implementation-status: planned).
                Point-to-point transport mTLS (sc-8) protects the wire channel only and
                does not substitute for end-to-end envelope signature verification or
                non-repudiation. Server-side asymmetric KMS JWT routing seal signing and
                verification live in src/gateway/governance/routing_seal.py, outside
                packages/cage-client/.
              props:
                - name: implementation-status
                  value: planned
                - name: control-origination
                  value: system-specific
                - name: w3c-traceparent-propagation
                  value: "true"
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=AU-10"
                  rel: reference
                - href: "https://www.w3.org/TR/trace-context/"
                  rel: reference
                  text: "W3C Trace Context specification"
                - href: "../../packages/cage-client/src/cage_client/crypto.py"
                  rel: implementation
                  text: "W3C traceparent generation for distributed trace correlation"
                - href: "../../packages/cage-client/src/cage_client/envelope.py"
                  rel: implementation
                  text: "GovernanceEnvelope Pydantic schema (signature parsed but unverified client-side)"

            - uuid: "3c4d5e6f-7a8b-9c0d-1e2f-3a4b5c6d7e8f"
              control-id: sc-8
              description: |
                Point-to-point transmission confidentiality and integrity are implemented
                in packages/cage-client/src/cage_client/transport.py::create_mtls_transport().

                create_mtls_transport() configures an httpx.AsyncHTTPTransport (with
                optional HTTP/2 multiplexing when the h2 extra is installed):
                - Validates that any supplied cert_path, key_path, or ca_path exists on
                  disk, raising FileNotFoundError fail-closed when missing
                - Builds an SSLContext via ssl.create_default_context(purpose=ssl.Purpose.SERVER_AUTH,
                  cafile=ca_path), loads client credentials via load_cert_chain() when
                  cert_path and key_path are supplied, and enforces check_hostname = True
                  and verify_mode = ssl.CERT_REQUIRED (or verify=True against the system
                  CA store when no custom paths are supplied)
                - CageClient disables HTTP redirects (follow_redirects=False)

                Scope boundary: packages/cage-client/ does not call
                src/gateway/infrastructure/tls_context.py::create_hardened_client_context().
                Channel TLS/mTLS covers sc-8 point-to-point transmission confidentiality
                only and does not substitute for end-to-end GovernanceEnvelope.signature
                verification (au-10) or GovernanceEnvelope.expires_at authenticity (sc-23).
              props:
                - name: implementation-status
                  value: implemented
                - name: control-origination
                  value: system-specific
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=SC-8"
                  rel: reference
                - href: "../../packages/cage-client/src/cage_client/transport.py"
                  rel: implementation
                  text: "Client TLS/mTLS transport configuration in create_mtls_transport()"

            - uuid: "4d5e6f7a-8b9c-0d1e-2f3a-4b5c6d7e8f9a"
              control-id: sc-23
              description: |
                Client-side session authenticity and envelope freshness enforcement are
                planned (not yet implemented) in packages/cage-client/.

                CageClient._handle_allow_response()
                (packages/cage-client/src/cage_client/core.py) parses
                GovernanceEnvelope.expires_at via Pydantic schema validation without
                enforcing temporal freshness against current UTC time or consuming a
                single-use nonce client-side (implementation-status: planned).

                Server-side v3 asymmetric KMS JWT routing seal TTL validation and atomic
                Redis SETNX single-use nonce consumption (verify_and_consume_seal()) live
                in src/gateway/governance/routing_seal.py, outside packages/cage-client/.
              props:
                - name: implementation-status
                  value: planned
                - name: control-origination
                  value: system-specific
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=SC-23"
                  rel: reference
                - href: "../../packages/cage-client/src/cage_client/core.py"
                  rel: implementation
                  text: "CageClient._handle_allow_response() envelope schema parsing (freshness check planned)"
                - href: "../../packages/cage-client/src/cage_client/envelope.py"
                  rel: implementation
                  text: "GovernanceEnvelope expires_at schema field"

  # -------------------------------------------------------------------------
  # Related Components (References Only)
  # -------------------------------------------------------------------------
  related-components:
    - component-uuid: "56654b26-d648-4e47-bbc8-19edd3ec67ba"
      title: "Governance Gateway"
      description: >
        Central governance gateway (PDP) that evaluates /governance/validate-action
        requests from CageClient and returns HTTP ALLOW, DENY, or DEFER responses.
    - component-uuid: "6f4d2e1b-8c3a-4d9f-9a1b-2c3d4e5f6a7b"
      title: "DeferQueue"
      description: >
        Server-side persistent queue (src/gateway/governance/defer_queue.py) for
        deferred governance decisions requiring human review; CageClient surfaces
        deferral ticket IDs via DeferralPending while single-use approval
        consumption is enforced server-side by DeferQueue.consume_approval().
