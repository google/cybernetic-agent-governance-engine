  - uuid: ftra0001-4e47-bbc8-irreversibility01
    title: FTRA Irreversibility Classifier
    type: software
    description: 'Forward-Looking Trajectory Reachability Analyzer (FTRA, Tier 0.5):
      classifies each tool call against the active domain''s digest-covered terminal
      registry, records the registry provenance of the classification, and lets a
      registered terminal clear without a human only inside its digest-covered autonomous
      envelope. It validates no parameter values; value policy is owned by STPA UCA
      rules and the domain OPA policy (docs/governance/FTRA_SCOPE.md).'
    purpose: Irreversibility classification and autonomous-envelope gating for tool
      execution
    responsible-roles:
    - role-id: provider
    props:
    - name: source-file
      value: src/gateway/governance/governor/stages/ftra.py
    - name: last-compiled
      value: '2026-11-09T02:00:49Z'
    control-implementations:
    - uuid: ftra0001-ctrl-impl-8000-classifier01
      source: https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home
      description: NIST SP 800-53 Rev 5 HIGH-baseline controls implemented by FTRA
        Irreversibility Classifier
      implemented-requirements:
      - uuid: si100001-ftra-8000-classifier00001
        control-id: si-10
        description: FTRA (Tier 0.5) classifies each tool call against the digest-covered
          terminal registry (src/gateway/governance/ftra/classifier.py) and routes
          irreversible or unregistered actions to human review; a registered terminal
          clears autonomously only inside its autonomous envelope with a known, finite,
          positive magnitude (src/gateway/governance/ftra/autonomy.py). Parameter
          value validation (SI-10) is delegated to the finance STPA UCA rules (src/cage_finance/stpa/uca_rules.py)
          and the domain OPA policy (src/cage_finance/opa/trade_governance.rego, mounted
          read-only into the gateway pod's Unix-domain-socket OPA sidecar via infra/modules/opa_policy/main.tf
          and infra/modules/gateway/main.tf with system.authz refusing runtime policy
          writes; live verification pending, POAM-2026-195). Finance UCA rules UCA-2,
          UCA-3, UCA-4, UCA-5, UCA-6, UCA-8, UCA-9, UCA-10, UCA-12 and UCA-13 bind
          their security-critical inputs server-side via TradeInputResolver (src/cage_finance/tools/trade_inputs.py).
          UCA-7 is enforced on the Python STPA path (_check_core_uca_7 in src/gateway/governance/stpa_validator.py),
          which denies a prompt_injection_check whose semantic_score, bound server-side
          by deterministic prompt-injection inspection (src/gateway/governance/governor/server_inputs.py),
          exceeds the UCA's threshold. The deterministic Stage 1 keyword scan (ac_keyword_scan
          in src/gateway/governance/text_filter.py) screens requests routed through
          the gateway inference proxy (src/gateway/server/inference_proxy.py), which
          Terraform configures as the sole model endpoint reachable by the governed
          advisor (live cluster verification pending, POAM-2026-191), and runs in
          the advisor's LangGraph input rail. The optional NeMo Colang rails add LLM-backed
          screening only when CAGE_NEMO_ENABLED=true on a semantic model backend.
          Before parking a REQUIRE_APPROVAL token for human review, run_pipeline()
          previews every claiming phase-2 barrier side-effect-free (Phase2Mode.PREVIEW
          in src/gateway/governance/governor/pipeline.py), denying outright on HARD
          barrier breaches and recording NARROWABLE barrier bounds (Violation.bound
          in src/gateway/governance/contracts.py) on the DeferToken snapshot. The
          registry's manifest_sha256 (registry_digest in src/gateway/governance/ftra/classifier.py)
          covers the autonomous_envelope together with the terminals, so an in-file
          edit to a ceiling fails the load-time integrity check; a re-hashed edit
          is refused only when FTRA_EXPECTED_MANIFEST_SHA256 is pinned, which infra/
          does not set.
        props:
        - name: implementation-status
          value: partial
        - name: control-origination
          value: system-specific
        links:
        - href: https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=SI-10
          rel: reference
