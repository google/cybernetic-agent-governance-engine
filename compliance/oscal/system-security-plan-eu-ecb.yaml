    - uuid: eu-ecb-req-0007-4000-8000-000000000007
      control-id: ac-3
      description: 'Access enforcement for reliance on a warranted norm (NIST
        SP 800-53 AC-3). In EU_ECB an execute_trade or execute_trade_bounded
        request is admitted only while WarrantStage finds an eligible warrant
        for confidence.min_trade_confidence (governing_version
        cage-policy-2.1.0); otherwise the governor defers with
        DeferReason.WARRANT_INELIGIBLE, mints no seal and commits no phase-2
        reservation, including at post-approval revalidation. Status is
        partially implemented: the enforcement path is complete and fails
        closed, but warrant authenticity is UNVERIFIED (digest-only, no issuer
        signature or kid trust anchor until VEIP v0.2), the configured
        provider_05 source has no live HTTP path (all EU_ECB trades defer),
        and a post-approval warrant refusal burns the approval token
        (src/gateway/server/governance_middleware.py consumes it before
        revalidation). See POAM-2026-104. Every admit and every refusal is
        evidenced: since 0cdb5aaa the reliance record is bound into the seal''s
        evidence record (record_hash), the DEFER/REQUIRE_APPROVAL token, the
        GOVERNANCE_DEFERRAL record and any co-occurring DENY receipt''s
        proof_hash, always with verification_status UNVERIFIED.'
