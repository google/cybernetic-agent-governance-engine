      by-components:
      - component-uuid: eu-ecb-comp-0004-4000-8000-000000000004
        uuid: eu-ecb-bycomp-0004-4000-8000-000000000004
        description: 'Fail-closed FRIA tier: stale or missing artefact, provider
          unavailability, timeout and refusal each deny; a needs_human_review
          finding requires approval. Each path is observed failing in
          tests/governor/test_jurisdiction_wiring.py.'
        implementation-status:
          state: implemented
        links:
        - href: ../../compliance/lula/lula-validation-eu-fria.yaml
          rel: reference
          text: Lula automated validation for EU AI Act Art. 27
    - uuid: eu-ecb-req-0005-4000-8000-000000000005
      control-id: cm-6
      description: 'Configuration settings (NIST SP 800-53 CM-6). The effective
        EU_ECB domains.finance values, enforced since commit ecca70b9, are:
        CBF gamma 0.6 (CashBarrier(gamma=...) in src/cage_finance/plugin.py);
        drawdown.limit 0.04 (bounding contract B2,
        src/cage_finance/safety/bounding/contracts.py); consensus.threshold_usd
        7500.0 (multi-model consensus above this amount,
        src/cage_finance/tiers/consensus_tier.py); STPA UCA-5 drawdown
        3.5%, UCA-6 order-volume fraction 0.005 and FIN-2 /
        UCA-2 latency 150 ms (src/cage_finance/stpa/uca_rules.py).
        The gateway trade tool supplies both inputs itself on every committing run,
        never from the caller (src/cage_finance/tools/trade_inputs.py):
        latency_ms is the measured age of the traded symbol''s latest quote at
        the tool boundary and drawdown is the daily NAV drawdown in percent; an
        unavailable or untrustworthy source leaves the input unset and UCA-2 /
        UCA-5 refuse the trade.
        The overlay fails closed: a missing or malformed EU_ECB_BASELINE.json,
        a regional section with no global counterpart, or a shape change aborts
        threshold loading; an unknown or invalid key fails governor assembly
        (src/cage_finance/thresholds.py); and assemble_governor()
        (src/gateway/governance/governor/assembly.py) refuses to assemble when
        the thresholds region differs from the jurisdiction region. FIN-1
        stpa.max_sell_portfolio_fraction (0.08) is enforced by UCA-13
        (src/cage_finance/stpa/uca_rules.py): a sell whose amount exceeds this
        fraction of portfolio_total, or that lacks a numeric amount or
        portfolio_total, is a HARD STPA violation (POAM-2026-103 closed).
        portfolio_total = current NAV from the server-side NAV source
        (src/cage_finance/tools/trade_inputs.py), never from the caller; an
        unavailable, unverified, stale or non-positive NAV leaves it unset and
        UCA-13 refuses the sell. The consensus threshold is configured in the key threshold_usd and documented in
        EU_ECB_BASELINE.json as a EUR 7,500 equivalent.'
      props:
      - name: implementation-status
        value: implemented
      - name: regulatory-citation
        value: NIST SP 800-53 Rev 5 CM-6 (Configuration Settings)
      - name: applicable-regions
        value: EU_ECB
      responsible-roles:
      - role-id: compliance-engineer
      by-components:
      - component-uuid: eu-ecb-comp-0005-4000-8000-000000000005
        uuid: eu-ecb-bycomp-0005-4000-8000-000000000005
        description: 'Each fail-closed path and the effective EU_ECB values
          are observed in tests/governor/test_regional_overlay.py
          (test_effective_finance_values_per_region,
          test_region_mismatch_fails_assembly,
          test_unknown_regional_key_fails_assembly,
          test_missing_regional_file_fails_closed). Remediation recorded as
          POAM-2026-102 in docs/POAM.md.'
        implementation-status:
          state: implemented
        links:
        - href: ../../tests/governor/test_regional_overlay.py
          rel: reference
          text: Regional overlay fail-closed tests
    - uuid: eu-ecb-req-0006-4000-8000-000000000006
      control-id: ctrl-agt-001
      description: 'CTRL_AGT_001 regional agentic confidence floor. Since commit
        ecca70b9 the finance trade_confidence tier
        (src/cage_finance/tiers/trade_confidence_tier.py, phase 1, order 1)
        refuses execute_trade and execute_trade_bounded when the confidence
        score is below the effective
        domains.finance.confidence.min_trade_confidence.value of 0.97: a
        score at or above the universal defer floor requires human approval
        (HITL), a lower score defers, and a missing or malformed score is a
        HARD violation. The kernel ConfidenceStage still enforces the universal
        confidence band (0.95) for every action. Since commit a0deb7ad the
        tier is built from the same NormBinding the warrant gate checks, so it
        enforces exactly the value the warrant refers to; changing that value
        requires a new governing_version and a re-issued warrant
        (test_eu_warranted_value_is_pinned_to_its_governing_version). Reliance
        on the floor is gated by the warrant reliance gate (eu-ecb-req-0007).'
