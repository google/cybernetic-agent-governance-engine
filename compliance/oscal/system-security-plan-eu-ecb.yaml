        unavailable, times out or refuses, and parks an approval when the
        provider escalates to human review.'
      purpose: 'Satisfies EU AI Act Art. 27 (Fundamental Rights Impact
        Assessment) and Art. 27(2) reassessment currency for deployers of
        High-Risk AI systems (control CTRL_FRIA_006).'
      status:
        state: operational
      responsible-roles:
      - role-id: dpo
      props:
      - name: eu-ai-act-article
        value: Art. 27 — Fundamental Rights Impact Assessment
      - name: applicable-regions
        value: EU_ECB
      links:
      - href: ../../compliance/lula/lula-validation-eu-fria.yaml
        rel: lula
        text: 'Lula validation: EU AI Act Art. 27 FRIA'
    - uuid: eu-ecb-comp-0005-4000-8000-000000000005
      type: software
      title: CAGE Regional Finance Threshold Overlay and Trade-Confidence Tier
      description: 'Since commit ecca70b9, load_and_validate_thresholds()
        (src/gateway/governance/schemas/thresholds.py) deep-merges the domains
        object of config/thresholds/EU_ECB_BASELINE.json onto the global
        domains sections of config/governance_thresholds.json
        (src/gateway/governance/schemas/regional_overlay.py) when
        CAGE_DEPLOYMENT_REGION=EU_ECB. The finance plugin
        (src/cage_finance/plugin.py) builds its CashBarrier, bounding contracts
        and trade_confidence tier from the effective domains.finance section,
        and the CBF, STPA and consensus readers resolve the same effective
        values through THRESHOLDS.resolve(). Before ecca70b9 these EU_ECB
        values were declared in the baseline file but not read; EU_ECB ran on
        the global (US_FED) values.'
      purpose: 'Applies the EU_ECB configuration settings (NIST SP 800-53
        CM-6) and the regional agentic confidence floor (CTRL_AGT_001) to the
        governor pipeline, failing closed when they cannot be applied.'
      status:
        state: operational
      responsible-roles:
      - role-id: compliance-engineer
      props:
      - name: applicable-regions
        value: EU_ECB
      - name: min-trade-confidence
        value: '0.97'
      - name: min-trade-confidence-requires-warrant
        value: 'true'
      - name: min-trade-confidence-governing-version
        value: cage-policy-2.1.0
      - name: cbf-gamma
        value: '0.6'
      - name: drawdown-limit
        value: '0.04'
      - name: consensus-threshold-usd
        value: '7500.0'
      - name: remediation-commit
        value: ecca70b9
      links:
      - href: ../../config/thresholds/EU_ECB_BASELINE.json
        rel: reference
        text: EU_ECB regional threshold baseline (domains.finance overlay)
      - href: ../../src/gateway/governance/schemas/regional_overlay.py
        rel: reference
        text: Fail-closed regional overlay
      - href: ../../src/cage_finance/tiers/trade_confidence_tier.py
        rel: reference
        text: TradeConfidenceTier (CTRL_AGT_001)
    - uuid: eu-ecb-comp-0006-4000-8000-000000000006
      type: software
      title: CAGE Warrant Reliance Gate (WarrantStage)
      description: 'Since commit a0deb7ad (#423) the EU_ECB trade-confidence
        floor is a warranted norm: config/thresholds/EU_ECB_BASELINE.json sets
        domains.finance.confidence.min_trade_confidence to value 0.97,
        requires_warrant true, governing_version cage-policy-2.1.0. The
        finance plugin contributes it as a kernel NormBinding
        (src/gateway/governance/contracts.py) for execute_trade and
        execute_trade_bounded. For every request to one of those actions the
        kernel WarrantStage (src/gateway/governance/governor/stages/warrant.py)
        fetches the norm''s warrant through the WarrantSource seam
        (src/gateway/governance/seams/warrant.py; adapter selected by
        CAGE_WARRANT_SOURCE, src/gateway/governance/warrant/source_factory.py)
        and evaluates its standing with WarrantStandingVerifier
        (src/gateway/governance/warrant/verifier.py) against the deployment
        jurisdiction and the binding''s governing_version. A missing, revoked,
        suspended, expired, out-of-scope, version-mismatched or
        digest-mismatched warrant, a warrant for another norm, a source error
        or a fetch timeout yields one RELIANCE_INELIGIBLE finding. The
        classifier ranks HARD > RELIANCE_INELIGIBLE > HITL > NARROWABLE >
        DEFERRABLE and answers DEFER with DeferReason.WARRANT_INELIGIBLE
        (quorum 3, not resolvable by data injection) regardless of model
        confidence; no seal is minted. The gate never short-circuits, so FTRA,
        STPA and OPA still run and a HARD finding still denies. WarrantStage
        is in POST_HITL_READ_ONLY_STAGES
        (src/gateway/governance/governor/pipeline.py), so a warrant revoked
        between human approval and execution is refused at
        revalidate_post_hitl() with no seal and no phase-2 commit.
        assemble_governor() (src/gateway/governance/governor/assembly.py)
        refuses to assemble when a warranted norm has no WarrantSource, when
        DEFER is disabled, when it lacks a governing_version, or when no domain
        tier claims its actions. Limits stated plainly: (1) warrant
        authenticity is not verified: the digest check proves internal
        consistency only, and issuer signature verification against a
        kid-resolved trust anchor is VEIP v0.2, so warrant attestations are
        UNVERIFIED (src/gateway/governance/warrant/evidence.py); (2) the
        configured source, Provider05WarrantSource
        (src/integrations/provider_05/warrant_source.py), has no implemented
        HTTP path, so in a deployed EU_ECB gateway every trade action defers
        (INELIGIBLE_MISSING) until a live warrant source exists. Tracked as
        POAM-2026-104. Since commit 0cdb5aaa (#427) every warranted norm the
        decision relied on yields a RelianceRecord
        (src/gateway/governance/warrant/reliance.py: norm_id, warrant_id,
        declared digest, warrant status, reliance status, governing_version,
        evaluated_at, provider_name, verification_status always UNVERIFIED).
        ALLOW and NARROW seals carry it in their evidence record, covered by
        record_hash, so altering or dropping it breaks seal verification
        (verify_seal_against_evidence, src/gateway/governance/routing_seal.py);
        the ALLOW envelope carries a WARRANT ExternalAttestation with status
        UNVERIFIED. Refusals are primary evidence: DEFER and REQUIRE_APPROVAL
        tokens and a hash-chained GOVERNANCE_DEFERRAL record carry the same
        record, and a DENY receipt with a co-occurring warrant failure carries
        it inside proof_hash. Refusal and deferral evidence writes are
        non-blocking (neither executes anything) but a failed write logs at
        ERROR and increments
        cage_governance_evidence_publish_failures_total{kind}
        (src/gateway/governance/governor/metrics.py). Whether an action is
        governed is resolved over the full stage set before POST_HITL
        filtering (resolve_claims, src/gateway/governance/governor/pipeline.py,
        shared with revalidate_post_hitl), so the warrant stage re-runs after
        approval even when only read-only tiers claim the action.'
      purpose: 'Ensures CAGE relies on the EU_ECB trade-confidence norm only
        while a current, in-scope warrant for the governing version is
        presented, failing closed (DEFER) otherwise.'
      status:
        state: operational
      responsible-roles:
      - role-id: compliance-engineer
      props:
      - name: applicable-regions
        value: EU_ECB
      - name: warranted-norm
        value: confidence.min_trade_confidence
      - name: governing-version
        value: cage-policy-2.1.0
      - name: warrant-source
        value: provider_05
      - name: warrant-attestation-status
        value: UNVERIFIED
      - name: remediation-commit
        value: a0deb7ad
      - name: evidence-binding-commit
        value: 0cdb5aaa
      links:
      - href: ../../src/gateway/governance/governor/stages/warrant.py
        rel: reference
        text: WarrantStage (kernel warrant reliance gate)
      - href: ../../src/gateway/governance/seams/warrant.py
        rel: reference
        text: WarrantSource seam
      - href: ../../src/gateway/governance/warrant/verifier.py
        rel: reference
        text: WarrantStandingVerifier
      - href: ../../tests/governor/test_warrant_reliance_gate.py
        rel: reference
        text: Warrant reliance gate tests
      - href: ../../src/gateway/governance/warrant/reliance.py
        rel: reference
        text: RelianceRecord (reliance evidence)
      - href: ../../tests/governor/test_warrant_evidence_binding.py
        rel: reference
        text: Warrant evidence binding tests
