system-security-plan:
  uuid: eu-ecb-ssp-2026-0001-4000-8000-000000000001
  metadata:
    title: CAGE System Security Plan (EU_ECB — EU AI Act / GDPR / DORA)
    published: '2026-06-15T00:00:00Z'
    last-modified: '2026-10-06T00:00:00Z'
    version: 1.0.0-draft
    oscal-version: 1.0.4
    remarks: 'This System Security Plan (SSP) documents the compliance controls
      implemented for the Cybernetic AI Governance Engine (CAGE) deployed in the
      European Central Bank (EU_ECB) jurisdiction. This SSP covers EU AI Act,
      GDPR, and DORA compliance postures applicable to CAGE_DEPLOYMENT_REGION=EU_ECB.

      CAGE_DEPLOYMENT_REGION: EU_ECB

      Compliance Frameworks:
        - ISO/IEC 42001:2023 (Universal baseline — all regions)
        - EU AI Act (Regulation (EU) 2024/1689) — High-Risk AI classification
        - GDPR (Regulation (EU) 2016/679) — Automated decision-making
        - DORA (Regulation (EU) 2022/2554) — ICT operational resilience

      Posture Scope: EU_ECB deployments only (CAGE_DEPLOYMENT_REGION=EU_ECB)

      US_FED SSP: compliance/oscal/system-security-plan.yaml
      APAC_MAS SSP: compliance/oscal/system-security-plan-apac-mas.yaml

      Note: This SSP is NOT applicable to US_FED or APAC_MAS deployments.
      US_FED uses NIST SP 800-53 Rev 5 HIGH baseline.
      APAC_MAS uses MAS FEAT / MAS Notice 655 / MAS TRM baseline.

      Data Residency: All data paths must remain within europe-west1 (GCP).
      GDPR Art. 44 prohibits cross-border data transfers without adequate safeguards.

      SR 26-2 "no legal force" sentinel: SR 26-2 (Federal Reserve supervisory
      guidance) has no legal force in EU_ECB deployments. All SR 26-2 telemetry
      is suppressed for CAGE_DEPLOYMENT_REGION=EU_ECB per .clinerules §12.4.

      '
    props:
    - name: cage-deployment-region
      value: EU_ECB
    - name: cage-compliance-posture
      value: eu-ai-act-gdpr-dora
    - name: cage-posture-scope
      value: eu-ecb-only
    - name: data-residency-region
      value: europe-west1
    - name: authorization-status
      value: DRAFT — EU AI Office registration pending
    - name: high-risk-ai-classification
      value: EU AI Act Annex III §5(b) — financial services AI
    roles:
    - id: system-owner
      title: System Owner
      description: Overall responsibility for CAGE EU_ECB deployment compliance.
    - id: dpo
      title: Data Protection Officer
      description: 'GDPR Art. 37 DPO responsible for data protection compliance,
        DPIA oversight, and Art. 22 automated decision-making safeguards.'
    - id: isso
      title: Information System Security Officer
      description: 'Primary security point of contact for EU_ECB deployment.
        Maintains SSP and coordinates DORA ICT risk assessments.'
    - id: compliance-engineer
      title: Compliance Engineer
      description: 'Maintains OSCAL artifacts, operates Lula compliance-as-code
        pipeline for EU AI Act, GDPR, and DORA controls.'
    - id: ai-model-operator
      title: AI Model Operator
      description: 'Manages AI model versions, monitors FEAT metrics, coordinates
        EU AI Act Art. 9 risk management system updates.'
  import-profile:
    href: ./eu-ai-act-profile.yaml
    remarks: 'Imports the CAGE EU AI Act compliance profile covering Art. 9
      (Risk Management), Art. 10 (Data Governance), Art. 13 (Transparency),
      Art. 14 (Human Oversight), and Art. 17 (Quality Management System).
      Also imports common-controls-catalog.yaml for ISO 42001 universal baseline.'
  system-characteristics:
    system-ids:
    - id: cage-gke-eu-ecb
      identifier-type: https://cage.internal/system-ids
    system-name: Cybernetic Governance Engine (EU_ECB)
    system-name-short: CAGE-EU
    description: 'CAGE EU_ECB deployment — AI governance platform for financial
      services operating under EU AI Act High-Risk AI classification (Annex III
      §5(b)), GDPR automated decision-making constraints (Art. 22), and DORA
      ICT operational resilience requirements (Art. 10). Deployed on GKE in
      europe-west1 with all data paths confined to EU jurisdiction per GDPR
      Art. 44 data residency requirements.

      '
    security-sensitivity-level: high
    status:
      state: under-development
      remarks: 'EU_ECB SSP draft. EU AI Office registration and DPIA completion
        required before production deployment.'
    authorization-boundary:
      description: 'The EU_ECB authorization boundary encompasses all CAGE
        components deployed within the governance-stack Kubernetes namespace
        on GKE in europe-west1. All data storage (GCS buckets, Cloud SQL,
        Redis) must be provisioned in europe-west1. External interconnections
        to Langfuse must use a self-hosted EU instance (not cloud.langfuse.com)
        to satisfy GDPR Art. 44 data residency requirements.'
      props:
      - name: gcp-region
        value: europe-west1
      - name: data-residency-enforced
        value: 'true'
      - name: gdpr-art44-compliant
        value: 'true'
