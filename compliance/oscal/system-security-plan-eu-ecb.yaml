        rel: lula
        text: 'Lula validation: DORA Art. 10 ICT Audit Logging'
    - uuid: eu-ecb-comp-0004-4000-8000-000000000004
      type: software
      title: CAGE EU AI Act Art. 27 FRIA Jurisdiction Tier
      description: 'The fria tier (src/gateway/governance/jurisdiction/eu_ai_act/fria_tier.py)
        contributed by the EU_ECB entry of the jurisdiction table
        (src/gateway/governance/jurisdiction/registry.py). A phase-1 read-only
