        description: 'Observed in tests/governor/test_warrant_reliance_gate.py:
          the failure matrix (test_every_ineligible_standing_is_one_reliance_finding,
          test_source_timeout_is_ineligible), a revoked warrant at confidence
          0.99 defers rather than denies
          (test_revoked_warrant_with_high_confidence_defers_not_denies), a HARD
          finding still denies, govern() mints no seal on a warrant failure, a
          warrant revoked after approval is refused with no seal and no commit
          (test_warrant_revoked_after_approval_is_refused_without_seal), the
          assembly refusals, and the pinned EU_ECB (norm_id, value) to
          governing_version pair. proof/model.py claims 12
          (warranted_norm_never_fabricates_deny) and 13
          (post_hitl_rechecks_warrant) hold, with runtime parity in
          tests/test_formal_profile_parity.py. Observed in
          tests/governor/test_warrant_evidence_binding.py: tampering with or
          dropping the reliance record breaks seal verification
          (test_tampered_reliance_record_breaks_seal_verification,
          test_dropping_the_reliance_record_breaks_seal_verification), DEFER
          tokens and GOVERNANCE_DEFERRAL records carry the ineligible record
          (test_defer_carries_the_ineligible_reliance_record), a post-approval
          revocation is refused with no seal when only read-only tiers claim
          the action
          (test_post_hitl_revocation_is_caught_when_only_read_only_tiers_claim),
          and a failed deferral evidence write is counted while the deferral
          proceeds (test_deferral_proceeds_and_is_counted_when_the_sink_fails).'
