    - uuid: p7000001-plat-sc7-8000-platform0001
      control-id: sc-7
      description: 'Ingress and external egress in the governance-stack namespace
        are default-deny on GKE Dataplane V2 (Cilium/eBPF) through Kubernetes NetworkPolicy
        (networking.k8s.io/v1), GKE FQDNNetworkPolicy (networking.gke.io/v1alpha1)
        and Dataplane V2 NetworkLogging resources reconciled by Terraform in infra/targets/gcp-gke/network_policy.tf
        and infra/targets/gcp-gke/dataplane_v2_logging.tf. default_deny_ingress and
        default_deny_external_egress block unpermitted pod-to-pod and external flows,
        per-workload policies scope Cloud SQL and Memorystore for Valkey /32 PSC endpoints
        strictly to their declared consumers (excluding the governed advisor from
        Valkey, POAM-2026-190, POAM-2026-195), and model_backend_ingress admits TCP
        8000 solely from app=gateway while routing in-cluster advisor completions
        through the gateway /v1/chat/completions proxy (POAM-2026-191). External HTTPS
        egress exists only where a workload FQDNNetworkPolicy allows it (the gateway,
        compliance-bridge, reconciliation-worker, vLLM, ClickHouse tiering and telemetry-stack
        allowlists); the governed financial advisor has none. Open gaps keep this
        control partial: FQDNNetworkPolicy enforces at L3/L4 on DNS-resolved IPs without
        L7 HTTP-method filtering and the gateway allowlist''s *.googleapis.com entry
        also matches Google''s model API (POAM-2026-152), and live deployed-cluster
        drop/allow corroboration for POAM-2026-190, POAM-2026-191 and POAM-2026-195
        remains pending Gate W.'
      props:
      - name: implementation-status
        value: partial
      - name: deployment-platform
        value: gcp-gke
      - name: evidence-file
        value: infra/targets/gcp-gke/network_policy.tf, infra/targets/gcp-gke/tests/namespace_segmentation.tftest.hcl,
          tests/infrastructure/test_gateway_egress_allowlist.py
      - name: poam-refs
        value: POAM-2026-152 (SC-7), POAM-2026-190 (SC-7), POAM-2026-191 (SC-7), POAM-2026-195
          (SC-7/AC-4)
      responsible-roles:
      - role-id: system-administrator
    - uuid: p8000001-plat-sc8-8000-platform0001
      control-id: sc-8
      description: 'Pods in the governance-stack namespace are meshed by Linkerd (linkerd.io/inject=enabled)
        with defaultInboundPolicy=all-authenticated via infra/modules/service_mesh,
        and a ValidatingAdmissionPolicy (charts/mesh-proxy-required) refuses any pod
        created there without the Linkerd proxy, including while the fail-open proxy
        injector is down (live verification pending, POAM-2026-167). Pod-to-pod traffic
        is mutual TLS using 24-hour in-memory workload certificates signed through
        a 48-hour Google Certificate Authority Service intermediate CSR flow, while
        OPA runs inside the gateway pod over a non-networked Unix domain socket (infra/modules/gateway/main.tf).
        Per-route Linkerd Server, HTTPRoute and AuthorizationPolicy resources in infra/modules/gateway/mesh-policy/templates/policy.yaml,
        infra/modules/compliance_bridge/mesh-policy/templates/policy.yaml and infra/targets/gcp-gke/charts/workload-mesh-policy/templates/servers-and-authz.yaml
        restrict L7 HTTP and ClickHouse TCP 9000 callers by ServiceAccount identity,
        backed by src/gateway/server/workload_identity.py on the gateway. Governance
        Memorystore for Valkey enforces transit_encryption_mode=SERVER_AUTHENTICATION
        over Private Service Connect with REDIS_CA_CERT_PATH (infra/modules/memorystore_valkey/main.tf,
        src/gateway/infrastructure/redis_client.py; POAM-2026-086), and Cloud SQL
        PostgreSQL enforces ssl_mode=ENCRYPTED_ONLY (infra/modules/cloudsql_postgres/main.tf).
        Open gaps keep this control partial: the application Memorystore instance
        (memorystore_app in infra/targets/gcp-gke/main.tf) runs with transit encryption
        and authentication disabled; live deployed-cluster verification of mesh mTLS
        and L7 authorization remains pending (POAM-2026-080, POAM-2026-195); and outbound
        Python HTTP clients use default SSL contexts with a TLS 1.2 floor because
        create_hardened_client_context in src/gateway/infrastructure/tls_context.py
        has no production call site (POAM-2026-011).'
      props:
      - name: implementation-status
        value: partial
      - name: deployment-platform
        value: gcp-gke
      - name: evidence-file
        value: infra/modules/service_mesh/main.tf, infra/modules/gateway/mesh-policy/templates/policy.yaml,
          infra/modules/compliance_bridge/mesh-policy/templates/policy.yaml, infra/targets/gcp-gke/charts/workload-mesh-policy/templates/servers-and-authz.yaml,
          infra/modules/memorystore_valkey/main.tf, infra/modules/cloudsql_postgres/main.tf,
          tests/integration/test_linkerd_mesh_conformance.py, tests/infrastructure/test_mesh_proxy_required_policy.py,
          tests/test_redis_async_builder.py
      - name: poam-refs
        value: POAM-011 (SC-8), POAM-2026-011 (SC-8), POAM-2026-080 (IA-9/SC-8), POAM-2026-086
          (SC-8), POAM-2026-167 (IA-9/SC-8), POAM-2026-195 (SC-8)
      responsible-roles:
      - role-id: system-administrator
    - uuid: p9000001-plat-sc39-8000-platform001
      control-id: sc-39
      description: 'Process isolation on the gcp-gke target rests on Kubernetes controls
        declared in Terraform. Pod Security Admission labels enforce the restricted
        profile on governance-stack when enable_pod_security_standards is true (infra/modules/k8s_namespace/main.tf;
        set in the staging, prod, eu-prod and apac-prod tfvars and off in the dev
        profiles), and every Terraform workload module sets run_as_non_root, allow_privilege_escalation
        = false, drops ALL capabilities and uses the RuntimeDefault seccomp profile
        (for example infra/modules/gateway/main.tf, infra/modules/compliance_bridge/main.tf
        and infra/modules/governed_advisor/main.tf, which runs the governed advisor
        in-cluster as a Kubernetes Deployment). Hardware-bound workloads are isolated
        on dedicated tainted node pools in infra/modules/gcp_gke_cluster/main.tf:
        vLLM on g2-standard-8 NVIDIA L4 nodes (nvidia.com/gpu=present:NoSchedule)
        and ClickHouse on local-SSD nodes (workload=clickhouse:NoSchedule). Open gap
        keeping this control partial: GKE Sandbox (gVisor) is not enabled. enable_gvisor_sandbox
        sets only the COS_CONTAINERD image type and a node label, the node_config.sandbox_config
        block that provides the gvisor RuntimeClass is not configured (it needs the
        google-beta provider), and no Terraform workload sets runtimeClassName, so
        containers share the node kernel.'
      props:
      - name: implementation-status
        value: partial
      - name: deployment-platform
        value: gcp-gke
      - name: evidence-file
        value: infra/modules/k8s_namespace/main.tf, infra/modules/gateway/main.tf,
          infra/modules/compliance_bridge/main.tf, infra/modules/governed_advisor/main.tf,
          infra/modules/gcp_gke_cluster/main.tf, tests/infrastructure/test_gke_sole_target_6f.py
      responsible-roles:
      - role-id: system-administrator
    - uuid: s3000001-plat-si3-8000-platform0001
      control-id: si-3
      description: 'Container supply-chain integrity on the gcp-gke target is enforced
        at plan and admission time. var.image_digests in infra/targets/gcp-gke/variables.tf
        rejects tag-only, :latest and empty-digest image references (exercised by
        infra/targets/gcp-gke/tests/image_digests.tftest.hcl). The Binary Authorization
        policy in infra/targets/gcp-gke/perimeter.tf requires an attestation from
        google_binary_authorization_attestor.build_attestor, whose signing key is
        the Cloud KMS asymmetric key google_kms_crypto_key.binauthz_attestor (infra/targets/gcp-gke/kms_signing.tf),
        with evaluation_mode REQUIRE_ATTESTATION and enforcement_mode ENFORCED_BLOCK_AND_AUDIT_LOG;
        images are attested by the build helpers (deployment/docker/cloudbuild.image.yaml,
        scripts/build_images.sh, scripts/mirror_and_attest_images.sh, scripts/attest_image.sh).
        CI runs pip-audit and a Trivy filesystem scan (CRITICAL,HIGH) over the repository
        (.github/workflows/security-scan.yml). Open gaps keep this control partial:
        attestation does not depend on a vulnerability-scan result, so admission does
        not block images with CRITICAL/HIGH CVEs; read_only_root_filesystem = true
        is set only by the gateway OPA sidecar, the non-production inference stub,
        the reconciliation worker and the Lula audit CronJob (infra/modules/gateway/main.tf,
        infra/modules/inference_stub/main.tf, infra/modules/reconciliation_worker/main.tf,
        infra/modules/lula_cron/main.tf), while the main gateway container, compliance-bridge,
        governed advisor and the remaining workload modules leave the root filesystem
        writable; and admission enforcement on a deployed cluster is unverified (POAM-2026-083).'
      props:
      - name: implementation-status
        value: partial
      - name: deployment-platform
        value: gcp-gke
      - name: evidence-file
        value: infra/targets/gcp-gke/perimeter.tf, infra/targets/gcp-gke/kms_signing.tf,
          infra/targets/gcp-gke/variables.tf, infra/targets/gcp-gke/tests/image_digests.tftest.hcl
      - name: poam-refs
        value: POAM-2026-083 (SI-3/SI-7)
      responsible-roles:
      - role-id: system-administrator
