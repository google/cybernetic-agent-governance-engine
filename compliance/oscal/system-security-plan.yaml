        '
    - id: compliance-engineer
      title: Compliance Engineer
      description: 'Maintains OSCAL artifacts, operates the Lula compliance-as-code
        pipeline, generates SBOM, runs automated compliance scans.

        '
    - id: common-control-provider
      title: Common Control Provider
      description: 'Google Cloud Platform / GKE Platform Team responsible for inherited
        infrastructure-level controls (PE, MP, MA, PS families).

        '
