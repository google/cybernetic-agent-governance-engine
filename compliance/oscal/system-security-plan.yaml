    implemented-requirements:
    - uuid: g7000001-0000-4000-8000-000000000001
      control-id: ac-2
      description: 'Account management for CAGE is partially implemented. GCP IAM
        manages organizational user accounts with role-based access bindings. Kubernetes
        RBAC (ClusterRoleBindings, RoleBindings) controls access to governance-stack
        namespace resources. Each workload runs as its own Kubernetes service account,
        bound 1:1 through Workload Identity to its own GCP service account where cloud
        API access is required (cage-gateway, cage-reconciler, cage-compliance-bridge,
        cage-vllm, langfuse, cage-benchmark; cage-advisor-sa has zero cloud identity)
        per infra/targets/gcp-gke/iam.tf. Signing keys are granted per key to a single
        signer with authoritative key-level IAM policies (infra/targets/gcp-gke/kms_signing.tf;
        POAM-2026-079 closed).

        Zero-trust outbound tool credential brokering (CredentialBrokerAdapter seam)
        enforces SPIFFE SVID-based authorization for egress API credentials. Autonomous
        agents never handle raw credentials; CAGE brokers tokens at dispatch time,
        scoped to specific tool actions. Credentials are masked in all logs and audit
        records to prevent leakage.

        POAM-001 tracks the gap: formal AC-2 account management procedures (periodic
        review cadence, documented approval workflow, and offboarding checklist) are
        not yet fully documented and enforced.

        '
      props:
      - name: implementation-status
        value: partially-implemented
      - name: poam-reference
        value: POAM-001
      responsible-roles:
      - role-id: system-admin
      by-components:
      - component-uuid: e5000007-0000-4000-8000-000000000007
        uuid: h8000001-0000-4000-8000-000000000001
        description: 'GKE Workload Identity provides service account isolation. GCP
          IAM enforces role-based access for human users. Kubernetes RBAC enforces
          namespace-level access boundaries. CredentialBrokerAdapter (src/gateway/governance/seams/credential_broker.py)
          provides zero-trust egress credential brokering via SPIFFE SVID authorization.

          '
        implementation-status:
          state: partially-implemented
        remarks: Formal review procedures documented in docs/ROLES_AND_RESPONSIBILITIES.md;
          automated review workflow pending POAM-001. Credential broker integration
          verified in tests/test_execution_actuator_broker.py
    - uuid: g7000002-0000-4000-8000-000000000002
      control-id: ac-3
      description: 'Access enforcement is implemented via Open Policy Agent (OPA)
        evaluating Rego policies on every request and SymbolicGovernor two-phase pipeline
        enforcement (src/gateway/governance/governor/governor.py). The system_authz.rego
        policy enforces RBAC role-based access decisions. The finance_policy.rego
        enforces fiscal limits by role (junior: $5,000/$10,000 single/daily; senior:
        $500,000/$1,000,000). Pre-flight validation (SymbolicGovernor.validate_action)
        runs under Profile.DRY_RUN, mutates no state, mints no GovernanceSeal, and
        parks REQUIRE_APPROVAL verdicts in DeferQueue (DeferReason.HITL_REQUIRED)
        with a side-effect-free phase-2 barrier preview (Phase2Mode.PREVIEW), returning
        deferred_id. A single committing run executes per trade: execute_trade_action(...,
        deferred_id=...) atomically consumes the human-approved token via DeferQueue.consume_approval()
        and invokes SymbolicGovernor.revalidate_post_hitl() inside src/gateway/server/governance_middleware.py
        (enforce_approved_governance). Any narrow_hint / narrowed_params attached
        to REQUIRE_APPROVAL is purely advisory, dry-run re-verified before surfacing
        (_reverified_narrow_hint) and re-verified in full by the committing run (_sealed_narrow
        with tamper-evident issue_narrow_receipt inside ReservationScope). OPA decisions
        are logged to stdout and captured by Cloud Logging for audit. All OPA enforce
        decisions are emitted as OTel spans tagged with control-id AC-3 for automated
        compliance verification via Lula. Since commit a0deb7ad the classifier ranks
        findings HARD > RELIANCE_INELIGIBLE > HITL > NARROWABLE > DEFERRABLE; RELIANCE_INELIGIBLE
        (no eligible warrant for a norm a region marks requires_warrant) defers with
        DeferReason.WARRANT_INELIGIBLE and is re-checked under Profile.POST_HITL.
        No US_FED norm is warranted, so it cannot arise in this region (see system-security-plan-eu-ecb.yaml).

        '
      props:
      - name: implementation-status
        value: implemented
      responsible-roles:
      - role-id: compliance-engineer
      by-components:
      - component-uuid: e5000003-0000-4000-8000-000000000003
        uuid: h8000002-0000-4000-8000-000000000002
        description: 'OPA policy engine evaluates system_authz.rego and finance_policy.rego
          for all trade execution and inference requests. Policy files: src/governed_financial_advisor/governance/policy/finance_policy.rego,
          deployment/system_authz.rego. Automated assertion via Lula: compliance/lula/lula-validation-ac3.yaml.

