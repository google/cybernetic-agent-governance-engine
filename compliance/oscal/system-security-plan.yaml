  control-implementation:
    description: CAGE SP 800-53 HIGH baseline control implementations
    set-parameters:
    - param-id: ac-1_prm_1
      values:
      - annually and upon significant system change
      remarks: AC-1 policy review frequency
    - param-id: ac-2_prm_1
      values:
      - 90 days for inactive accounts; immediate upon role change or separation
      remarks: AC-2 account review frequency
    - param-id: au-2_prm_1
      values:
      - authentication events, authorization decisions, governance verdict issuance,
        policy-violation, ai-governance-decision, prompt-injection-attempt, configuration
        changes, privileged function execution, account management events, system
        startup and shutdown
      remarks: AU-2 auditable event types — extended for AI governance events
    - param-id: au-9_prm_1
      values:
      - OTel spans → Langfuse → GCS WORM-equivalent (object versioning + retention
        policy)
      remarks: AU-9 audit log protection mechanism
    - param-id: sc-8_prm_1
      values:
      - TLS 1.3 for all external communications; Linkerd mTLS + NetworkPolicy for
        intra-cluster
      remarks: SC-8 transmission confidentiality protection
    implemented-requirements:
    - uuid: g7000001-0000-4000-8000-000000000001
      control-id: ac-2
      description: 'Account management for CAGE is partially implemented. GCP IAM
        manages organizational user accounts with role-based access bindings. Kubernetes
        RBAC (ClusterRoleBindings, RoleBindings) controls access to governance-stack
        namespace resources. Each workload runs as its own Kubernetes service account,
        bound 1:1 through Workload Identity to its own GCP service account where cloud
        API access is required (cage-gateway, cage-reconciler, cage-compliance-bridge,
        cage-vllm, langfuse, cage-benchmark; cage-advisor-sa has zero cloud identity)
        per infra/targets/gcp-gke/iam.tf. Signing keys are granted per key to a single
        signer with authoritative key-level IAM policies (infra/targets/gcp-gke/kms_signing.tf;
        POAM-2026-079 closed).

        Zero-trust outbound tool credential brokering (CredentialBrokerAdapter seam)
        enforces SPIFFE SVID-based authorization for egress API credentials. Autonomous
        agents never handle raw credentials; CAGE brokers tokens at dispatch time,
        scoped to specific tool actions. Credentials are masked in all logs and audit
        records to prevent leakage.

        POAM-001 tracks the gap: formal AC-2 account management procedures (periodic
        review cadence, documented approval workflow, and offboarding checklist) are
        not yet fully documented and enforced.

        '
      props:
      - name: implementation-status
        value: partially-implemented
      - name: poam-reference
        value: POAM-001
      responsible-roles:
      - role-id: system-admin
      by-components:
      - component-uuid: e5000007-0000-4000-8000-000000000007
        uuid: h8000001-0000-4000-8000-000000000001
        description: 'GKE Workload Identity provides service account isolation. GCP
          IAM enforces role-based access for human users. Kubernetes RBAC enforces
          namespace-level access boundaries. CredentialBrokerAdapter (src/gateway/governance/seams/credential_broker.py)
          provides zero-trust egress credential brokering via SPIFFE SVID authorization.

          '
        implementation-status:
          state: partially-implemented
        remarks: Formal review procedures documented in docs/README.md; automated
          review workflow pending POAM-001. Credential broker integration verified
          in tests/test_execution_actuator_broker.py
    - uuid: g7000002-0000-4000-8000-000000000002
      control-id: ac-3
      description: 'Access enforcement is implemented via Open Policy Agent (OPA)
        evaluating Rego policies on every request and SymbolicGovernor two-phase pipeline
        enforcement (src/gateway/governance/governor/governor.py). The domain trade
        policy (src/cage_finance/opa/trade_governance.rego) enforces fiscal limits
        by role (junior: $5,000/$10,000 single/daily; senior: $500,000/$1,000,000).
        The role, and the trader id that keys cumulative spend, are bound server-side
        from the verified Linkerd workload identity of the caller (CAGE_TRADER_ROLE_BINDINGS;
        an unbound identity is junior; with no verified identity an enforcing posture
        binds no role and OPA denies) by TradeInputResolver (src/cage_finance/tools/trade_inputs.py,
        src/cage_finance/tools/trader_binding.py) on every preview and committing
        run. The execute_trade_action MCP tool schema exposes neither field and caller-supplied
        values are dropped (GHSA-w39v-5v7h-fxg9). Every trade action (execute_trade
        and execute_trade_bounded) is held to the same role limits, quota rules and
        asset restrictions. A trade must name a tradable currency (an allowlist; USD),
        and the restricted assets BTC and XBT are refused as currency or instrument
        symbol, compared after trimming whitespace and upper-casing. Such a trade
        is denied outright; no MANUAL_REVIEW rule routes it to a human (GHSA-f6xq-23f7-9grm).
        Pre-flight validation (SymbolicGovernor.validate_action) runs under Profile.DRY_RUN,
        mutates no state, mints no GovernanceSeal, and parks REQUIRE_APPROVAL verdicts
        in DeferQueue (DeferReason.HITL_REQUIRED) with a side-effect-free phase-2
        barrier preview (Phase2Mode.PREVIEW), returning deferred_id. A single committing
        run executes per trade: execute_trade_action(..., deferred_id=...) invokes
        SymbolicGovernor.revalidate_post_hitl() inside src/gateway/server/governance_middleware.py
        (enforce_approved_governance), which spends the human-approved token atomically
        via DeferQueue.consume_approval() only when the run seals; a DENY spends it
        and a warrant-ineligible DEFER leaves it redeemable. The committing run re-runs
        OPA and every jurisdiction tier marked to re-run after approval (the EU_ECB
        FRIA tier). A human-review hold (OPA MANUAL_REVIEW or a re-run tier hold)
        is answered only when the approval was given against that same hold (DeferToken.hitl_holds,
        carried as PostHitlApproval.approved_holds and matched on tier and code);
        any other hold refuses the run with [APPROVAL_CONTEXT_DRIFT] (GHSA-f6xq-23f7-9grm).
        Any narrow_hint / narrowed_params attached to REQUIRE_APPROVAL is purely advisory,
        dry-run re-verified before surfacing (_reverified_narrow_hint) and re-verified
        in full by the committing run (_sealed_narrow with tamper-evident issue_narrow_receipt
        inside ReservationScope). OPA decisions are logged to stdout and captured
        by Cloud Logging for audit. All OPA enforce decisions are emitted as OTel
        spans tagged with control-id AC-3 for automated compliance verification via
        Lula. Since commit a0deb7ad the classifier ranks findings HARD > RELIANCE_INELIGIBLE
        > HITL > NARROWABLE > DEFERRABLE; RELIANCE_INELIGIBLE (no eligible warrant
        for a norm a region marks requires_warrant) defers with DeferReason.WARRANT_INELIGIBLE
        and is re-checked under Profile.POST_HITL. No US_FED norm is warranted, so
        it cannot arise in this region (see system-security-plan-eu-ecb.yaml). Every
        pipeline run (including Profile.POST_HITL in SymbolicGovernor.revalidate_post_hitl())
        also verifies that the requested action is in governor.claimed_actions (src/gateway/governance/governor/pipeline.py),
        refusing any unclaimed action with ADR009_ACTION_NOT_CLAIMED ([ACTION_NOT_CLAIMED])
        before any tier runs or seal is minted.

        '
      props:
      - name: implementation-status
        value: partial
      responsible-roles:
      - role-id: compliance-engineer
      by-components:
      - component-uuid: e5000003-0000-4000-8000-000000000003
        uuid: h8000002-0000-4000-8000-000000000002
        description: 'OPA policy engine evaluates trade_governance.rego for all trade
          execution requests. Policy files: src/cage_finance/opa/trade_governance.rego.
          Automated assertion via Lula: compliance/lula/lula-validation-ac3.yaml.

          '
        implementation-status:
          state: partially-implemented
        links:
        - href: ../../compliance/lula/lula-validation-ac3.yaml
          rel: reference
          text: Lula automated validation for AC-3
    - uuid: g7000003-0000-4000-8000-000000000003
