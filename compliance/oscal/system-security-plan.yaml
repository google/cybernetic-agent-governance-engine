  uuid: c9e1a2b3-d4f5-4678-9abc-def012345678
  metadata:
    title: CAGE System Security Plan (US_FED — NIST SP 800-53 Rev 5 HIGH)
    published: '2026-03-06T00:00:00Z'
    last-modified: '2026-10-07T01:14:23Z'
    version: 1.0.1-draft+stpa
    oscal-version: 1.0.4
    remarks: 'This System Security Plan (SSP) documents the security controls implemented
      for the Cybernetic AI Governance Engine (CAGE), a HIGH-impact AI governance
      platform for financial services deployed on Google Kubernetes Engine (GKE).
      This document is a DRAFT pending Authorizing Official (AO) review and approval.
      All TBD fields must be completed prior to submission for Authorization to Operate
      (ATO).

      CAGE_DEPLOYMENT_REGION: US_FED

      Compliance Framework: NIST SP 800-53 Rev 5 HIGH

      Posture Scope: US Federal deployments only (CAGE_DEPLOYMENT_REGION=US_FED)

      EU_ECB SSP: compliance/oscal/system-security-plan-eu-ecb.yaml (stub — not yet
      implemented)

      APAC_MAS SSP: compliance/oscal/system-security-plan-apac-mas.yaml (stub — not
      yet implemented)

      Note: This SSP is NOT applicable to EU_ECB or APAC_MAS deployments. Those regions
      use their own regional SSPs aligned to EU AI Act and MAS FEAT respectively.

      '
    props:
    - name: classification
      value: UNCLASSIFIED//FOR OFFICIAL USE ONLY
    - name: impact-level
      value: HIGH
    - name: authorization-status
      value: PRE-AUTHORIZATION DRAFT
    - name: poam-reference
      value: docs/POAM.md
    - name: fips199-reference
      value: compliance/categorization/FIPS199_CATEGORIZATION.md
    - name: cage-deployment-region
      value: US_FED
    - name: cage-compliance-posture
      value: nist-sp800-53-rev5-high
    - name: cage-posture-scope
      value: us-federal-only
    - name: customer_responsibility_tier3_wire_transfer
      ns: https://cage.laah.cybernetics.dev/ns/oscal
      value: 'Customer Responsibility (Tier-3 Commercial Deployment Interface — Wire
        Transfer / Payment Release): The reference finance domain does not expose
        a wire-release action. release_wire was removed from the finance FTRA terminal
        registry (config/ftra/terminal_registry.json), REGISTERED_ACTIONS and STPA
        UCA-11 on 2026-09-30 because no posture-completing control depends on it.
        Any action absent from the registry fails closed as FTRA_UNREGISTERED_ACTION
        (HITL) and is never auto-cleared. Organizations adding payment release in
        commercial production are responsible for registering it in their domain registry
        (re-signed with manifest_sha256), modelling its UCAs, and governing it with
        a cost-claiming phase-2 barrier so it is re-checked under POST_HITL.'
      class: customer-responsibility
    - name: customer_responsibility_tier3_ledger_apis
      ns: https://cage.laah.cybernetics.dev/ns/oscal
      value: 'Customer Responsibility (Tier-3 Commercial Deployment Interface — Retail-Banking,
        Custody & Payment Ledger APIs): CAGE ships the Tier-2 posture-completing simulated
        ground-truth reconciliation provider (SimulatedEstateProvider) with deterministic
        seeding, fault injection, and real Cloud KMS asymmetric snapshot signing (RECONCILER_KMS_KEY).
        Commercial retail-banking, custody, and core-banking ledger APIs are classified
        as Tier-3 commercial-deployment-only interfaces and do not live in the reference
        repository; organizations deploying CAGE in commercial production are responsible
        for supplying and accrediting their own external retail-banking ledger integration
        behind the EstateProvider seam.'
      class: customer-responsibility
    roles:
    - id: system-owner
      title: System Owner
      description: 'Overall responsibility for procurement, development, integration,
