    - uuid: g7000005-0000-4000-8000-000000000005
      control-id: cm-6
      description: 'Governance configuration settings are loaded once per process
        by load_and_validate_thresholds() (src/gateway/governance/schemas/thresholds.py)
        from config/governance_thresholds.json. Since commit ecca70b9 the loader deep-merges
        the domains object of the deployment region''s config/thresholds/{REGION}_BASELINE.json
        onto the global domains sections (src/gateway/governance/schemas/regional_overlay.py),
        so every reader of THRESHOLDS.domains sees the region''s effective values.
        The overlay fails closed: a missing or malformed regional file, a regional
        section with no global counterpart, or a value that changes shape aborts startup.
        The domain plugin schema (src/cage_finance/thresholds.py) validates the merged
        section at governor assembly, so an unknown or invalid regional key fails
        assembly, and assemble_governor() (src/gateway/governance/governor/assembly.py)
        refuses to assemble when the thresholds region differs from the jurisdiction
        region. For US_FED the regional overlay sets only domains.finance.confidence.min_trade_confidence
        (value 0.95, requires_warrant false), equal to the universal confidence band,
        so US_FED effective values are the global values. Since commit a0deb7ad a
        norm a region marks requires_warrant must carry a governing_version and is
        gated by the kernel WarrantStage; no US_FED norm is warranted, so no warrant
        stage is assembled in this region. The generated finance STPA rules (src/cage_finance/stpa/uca_rules.py)
        read the effective values: UCA-2/FIN-2 latency, UCA-5 drawdown, UCA-6 order-volume
        fraction and UCA-13/FIN-1 sell fraction (US_FED 0.10; a sell lacking a numeric
        amount or portfolio_total fails closed; portfolio_total = current NAV from
        the server-side NAV source, src/cage_finance/tools/trade_inputs.py, never
        from the caller, and an unavailable NAV leaves it unset so UCA-13 refuses).
        For UCA-2 and UCA-5, the gateway supplies both inputs itself, never from the
        caller (src/cage_finance/tools/trade_inputs.py): latency_ms is the measured
        age of the traded symbol''s latest quote and drawdown is the daily NAV drawdown
        in percent; an unavailable or untrustworthy source leaves the input unset
        and UCA-2 / UCA-5 refuse the trade. Previews and the committing run evaluate
        the same server-side inputs (POAM-2026-105 closed): the finance plugin contributes
        TradeInputResolver through PluginContribution.server_inputs, and the kernel
        bind_server_inputs() (src/gateway/governance/governor/server_inputs.py) drops
        every caller value for latency_ms, drawdown, its aliases and portfolio_total
        before resolving them, in SymbolicGovernor.validate_action() (POST /governance/validate-action),
        SymbolicGovernor.verify() (the MCP simulate_governance_check dry run) and
        the trade tool before its committing run. No STPA input is defaulted on a
        dry run. UCA-6 (US_FED order-volume fraction 0.01) is evaluated on every trade
        and refuses one lacking either input (POAM-2026-106 closed): order_size is
        the caller''s notional amount divided by the verified quote price, and daily_vol
        is the symbol''s average daily volume from the market-data feed (verified
        source, traded symbol, finite and positive, at most four days old), both bound
        server-side by TradeInputResolver. The same resolver is registered for execute_trade_bounded,
        and bounding contract B2 compares the drawdown the gateway measured (never
        a caller value) with drawdown.limit (US_FED 5%); an unmeasured drawdown is
        a HARD refusal (POAM-2026-108 closed). Startup posture enforcement (CM-6 /
        SC-24 / SA-8) is centralized in assert_production_posture() (src/gateway/governance/governor/posture.py),
