    - uuid: p7000001-plat-sc7-8000-platform0001
      control-id: sc-7
      description: 'L3/L4 and FQDN-resolved IP egress boundaries are enforced on all
        governance-stack pods by Kubernetes NetworkPolicy (networking.k8s.io/v1) and
        GKE FQDNNetworkPolicy (networking.gke.io/v1alpha1) resources on GKE Dataplane
        V2 (Cilium/eBPF). Standard Kubernetes NetworkPolicies (deployment/k8s/network-policy.yaml)
        provide L3/L4 default-deny and restrict port 53 DNS egress strictly to kube-system
        (k8s-app: kube-dns) and the Cloud DNS metadata IP (169.254.169.254/32); GKE
        Dataplane V2 (Cilium) snoops DNS responses from kube-dns or Cloud DNS and
        programs the resolved IP addresses into Cilium''s eBPF policy map in real
        time. Scope note: GKE FQDNNetworkPolicy v1alpha1 enforces at L3/L4 on DNS-resolved
        IPs and does not perform L7 HTTP-method or DNS-query-pattern filtering; L7
        HTTP-method enforcement is not claimed by this control implementation. Gateway
        pods may reach only approved external LLM provider endpoints (generativelanguage.googleapis.com,
        api.anthropic.com) and required GCP service APIs (*.googleapis.com). Reconciliation
        worker egress is restricted to Cloud KMS (cloudkms.googleapis.com:443), the
        Memorystore for Valkey PSC endpoint CIDR (ipBlock on TLS port 6379), sovereign
        telemetry OTLP (port 3000), and cluster DNS. Sovereign agent and financial
        advisor pods are locked to intra-cluster egress only (OPA:8181, Gateway:8080,
        Compliance-Bridge:8090) and cannot contact any external endpoint directly,
        preventing lateral movement and data exfiltration even if a pod is compromised.'
      props:
      - name: implementation-status
        value: implemented
      - name: deployment-platform
        value: gcp-gke
      - name: evidence-file
        value: deployment/k8s/cilium/egress-lockdown.yaml, deployment/k8s/cilium/reconciliation-worker-egress.yaml,
          deployment/k8s/network-policy.yaml
      - name: poam-refs
        value: POAM-007 (IA-3)
      responsible-roles:
      - role-id: system-administrator
    - uuid: p8000001-plat-sc8-8000-platform0001
      control-id: sc-8
      description: 'Pods in the governance-stack namespace are meshed by Linkerd (linkerd.io/inject=enabled),
        which Terraform installs with infra/modules/service_mesh. Pod-to-pod traffic
        is mutual TLS between Linkerd proxies. Each proxy certificate names the pod''s
        Kubernetes ServiceAccount (<sa>.<namespace>.serviceaccount.identity.linkerd.cluster.local),
        lives in memory only, and is re-issued every 24 hours. The trust anchor is
        a Google Certificate Authority Service root CA whose key is generated and
        held by CAS; the intermediate issuer certificate is obtained by cert-manager
        through a CSR and rotated every 48 hours, so no CA private key exists in Terraform
        state or in the repository. The gateway''s HTTP port is deny by default: a
        Linkerd Server/HTTPRoute/AuthorizationPolicy set admits only cage-advisor-sa
        outside a short list of open paths, and the gateway repeats the check on the
        verified l5d-client-id header in every environment (src/gateway/server/workload_identity.py).
        OPA and NeMo Server policies in deployment/k8s/linkerd-mtls-policy.yaml admit
        only the gateway (and the compliance bridge for OPA). Managed data-plane connections
        enforce in-transit TLS: dual Memorystore for Valkey instances (governance
        and app) enforce transit_encryption_mode=SERVER_AUTHENTICATION over Private
        Service Connect, verified under every enforcing posture (is_enforcing()),
        CA from REDIS_CA_CERT_PATH (infra/modules/memorystore_valkey/main.tf, src/gateway/infrastructure/redis_client.py),
        and Cloud SQL PostgreSQL enforces ssl_mode=ENCRYPTED_ONLY via the Cloud SQL
        Auth Proxy sidecar (infra/modules/cloudsql_postgres/main.tf). Verified by
        automated Linkerd mesh conformance tests (tests/integration/test_linkerd_mesh_conformance.py),
        Redis TLS verification tests (tests/test_redis_async_builder.py), and live
        CAS issuance tests (tests/live/test_cas_mesh_issuer_live.py) (POAM-2026-080,
        POAM-2026-086).'
      props:
      - name: implementation-status
        value: implemented
      - name: deployment-platform
        value: gcp-gke
      - name: evidence-file
        value: infra/modules/service_mesh/main.tf, infra/modules/gateway/mesh-policy,
          infra/modules/memorystore_valkey/main.tf, infra/modules/cloudsql_postgres/main.tf,
          deployment/k8s/linkerd-mtls-policy.yaml, tests/integration/test_linkerd_mesh_conformance.py,
          tests/test_redis_async_builder.py
      - name: poam-refs
        value: POAM-007 (IA-3), POAM-011 (SC-8), POAM-2026-080 (IA-9), POAM-2026-086
          (SC-8)
      responsible-roles:
      - role-id: system-administrator
    - uuid: p9000001-plat-sc39-8000-platform001
      control-id: sc-39
      description: 'All governance-stack pods execute with `runtimeClassName: gvisor`,
        enforcing application kernel sandboxing via gVisor''s reduced syscall attack
        surface. gVisor intercepts syscalls in userspace and emulates a Linux kernel
        interface, preventing direct host kernel access from containerized workloads.
        This isolation boundary mitigates container escape vulnerabilities (e.g.,
        runc CVE-2019-5736) and kernel privilege escalation exploits. Pod Security
        Standard enforcement (restricted profile) prevents RuntimeClass override.
        Evidence: kubectl get pod -n governance-stack -o jsonpath=''{.items[*].spec.runtimeClassName}''.'
      props:
      - name: implementation-status
        value: implemented
      - name: deployment-platform
        value: gcp-gke
      - name: evidence-file
        value: 'deployment/k8s/*-deployment.yaml (runtimeClassName: gvisor)'
      - name: poam-refs
        value: POAM-009 (SC-39)
      responsible-roles:
      - role-id: system-administrator
    - uuid: s3000001-plat-si3-8000-platform0001
      control-id: si-3
      description: 'All governance-stack containers enforce `readOnlyRootFilesystem:
        true` in their securityContext, preventing runtime modification of container
        image layers. Writable data is isolated to explicitly-mounted emptyDir volumes
        (tmpfs-backed, ephemeral). This immutability boundary prevents malware persistence,
        fileless attack staging, and post-compromise binary implantation. Container
        supply-chain integrity is enforced via `var.image_digests` (`@sha256:` digest
        pinning in `infra/targets/gcp-gke/variables.tf` with fail-closed validation
        rejecting tag-only or `:latest` references when `enable_binary_authorization
        = true`), Cloud KMS asymmetric signing (`google_kms_crypto_key.binauthz_attestor`
        wired as `pkix_public_key` into `google_binary_authorization_attestor.build_attestor`
        in `infra/targets/gcp-gke/perimeter.tf`), Cloud Build digest attestation (`gcloud
        container binauthz attestations sign-and-create` across `deployment/docker/cloudbuild.*.yaml`,
        `scripts/build_images.sh`, and `scripts/mirror_and_attest_images.sh`), and
        Artifact Registry vulnerability scanning (block on CRITICAL/HIGH CVEs). Note:
        Live staging cluster verification of mirrored third-party digests and Binary
        Authorization admission enforcement is tracked under POAM-2026-083 (referencing
        POAM-2026-013).'
      props:
      - name: implementation-status
        value: implemented
      - name: deployment-platform
        value: gcp-gke
      - name: evidence-file
        value: 'infra/targets/gcp-gke/perimeter.tf; infra/targets/gcp-gke/kms_signing.tf;
          infra/targets/gcp-gke/variables.tf; compliance/lula/lula-validation-si2.yaml;
          deployment/k8s/*-deployment.yaml (readOnlyRootFilesystem: true)'
      - name: poam-refs
        value: POAM-010 (SI-3), POAM-2026-013 (SI-2), POAM-2026-083 (SI-3/SI-7)
      responsible-roles:
      - role-id: system-administrator
