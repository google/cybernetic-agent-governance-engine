  import-profile:
    href: ./sp800053-profile.yaml
    remarks: 'Imports the CAGE-tailored SP 800-53 Rev 5 HIGH baseline profile, which
      includes AI-specific overlay controls (SR-3, SR-11, PT-2, PT-3) and excludes
      controls fully inherited from GCP (PE, MP, MA, PS families).

      '
  system-characteristics:
    system-ids:
    - id: cage-gke-prod
      identifier-type: https://cage.internal/system-ids
    system-name: Cybernetic Governance Engine
    system-name-short: CAGE
    description: 'The Cybernetic Governance Engine (CAGE) is a HIGH-impact AI governance
      platform for financial services that enforces real-time, deterministic controls
      over large language model (LLM) inference. CAGE implements a three-tier semantic
      shielding architecture: Tier 1 Aho-Corasick heuristic filtering, Tier 2 Small
      Language Model (SLM) semantic classification, and Tier 3 Open Policy Agent (OPA)
      Rego policy enforcement. All governance decisions are emitted as OpenTelemetry
      (OTel) spans stamped with ISO 42001 and NIST SP 800-53 control identifiers,
      providing a continuous, machine-verifiable audit trail aligned with SEC Rule
      17a-4 and FINRA 4511 record retention requirements.

      CAGE is deployed on Google Kubernetes Engine (GKE) within the governance-stack
      namespace and integrates with Langfuse for AI observability, NeMo Guardrails
      for input/output rail enforcement, and Microsoft Presidio for PII detection
      and anonymization. The system processes Financial Trade Execution Data, AI Governance
      Audit Logs, Personally Identifiable Information (PII), and Governance Policy
      Configurations. The system''s authorization boundary encompasses all containers
      deployed in the governance-stack namespace, the Cloud SQL PostgreSQL database,
      Google Cloud Storage buckets for audit log archival, and Redis cache for session
      state. External interconnections include the Langfuse observability platform
      (cloud-hosted SaaS) and external LLM provider APIs (OpenAI, Anthropic, Google).

      '
    security-sensitivity-level: high
    information-types:
    - uuid: b2000001-0000-4000-8000-000000000001
      title: Financial Transaction Data
      description: 'Buy/sell orders, portfolio positions, trade recommendations, and
        AI-generated financial advice generated by the CAGE AI governance pipeline.
        Governed by SEC Rule 17a-4, FINRA 4511, and OFAC sanctions screening requirements.

        '
      categorizations:
      - system: https://doi.org/10.6028/NIST.SP.800-60v2r1
        information-type-ids:
        - C.2.8.12
      confidentiality-impact:
        base: moderate
        selected: moderate
        adjustment-justification: 'Unauthorized disclosure enables front-running or
          market manipulation but does not rise to catastrophic harm.

          '
      integrity-impact:
        base: high
        selected: high
        adjustment-justification: 'Tampering with trade orders or AI-generated recommendations
          could result in severe financial loss, regulatory violations, and reputational
          damage.

          '
      availability-impact:
        base: moderate
        selected: high
        adjustment-justification: 'System must be available during trading hours;
          unavailability causes business disruption and potential regulatory non-compliance.
          Elevated from moderate to HIGH based on financial services operational requirements.

          '
    - uuid: b2000002-0000-4000-8000-000000000002
      title: AI Governance Audit Logs
      description: 'OTel spans with ISO 42001 evidence stamps, OSCAL assessment results,
        Langfuse traces, governance verdicts, and STPA validation results. Required
        for regulatory examination by SEC and FINRA.

        '
      categorizations:
      - system: https://doi.org/10.6028/NIST.SP.800-60v2r1
        information-type-ids:
        - D.16.1
      confidentiality-impact:
        base: low
        selected: moderate
        adjustment-justification: 'Audit logs contain proprietary governance methodology
          and enforcement patterns; elevated from LOW to MODERATE to protect against
          adversarial analysis of governance bypass opportunities.

          '
      integrity-impact:
        base: high
        selected: high
        adjustment-justification: 'Tampered audit records undermine the ISO 42001
          evidence chain and obstruct regulatory examination. Integrity must be HIGH.

          '
      availability-impact:
        base: moderate
        selected: moderate
    - uuid: b2000003-0000-4000-8000-000000000003
      title: PII/User Identity Data
      description: 'Individual investor PII processed through NeMo Guardrails Presidio
        PII detection (16 entity types including SSN, credit card, bank numbers, passport).
        Governed by SEC Reg S-P and FINRA privacy rules.

        '
      categorizations:
      - system: https://doi.org/10.6028/NIST.SP.800-60v2r1
        information-type-ids:
        - D.2.2
      confidentiality-impact:
        base: high
        selected: high
        adjustment-justification: 'Unauthorized disclosure of investor PII causes
          severe privacy harm, triggers SEC Reg S-P breach notification obligations.
          Confidentiality must be HIGH.

          '
      integrity-impact:
        base: high
        selected: high
        adjustment-justification: 'Corrupted PII records cause incorrect financial
          decisions and legal liability.

          '
      availability-impact:
        base: low
        selected: moderate
        adjustment-justification: 'PII records are not time-critical for system operation;
          elevated to MODERATE to ensure audit trail continuity for regulatory examinations.

          '
    - uuid: b2000004-0000-4000-8000-000000000004
      title: System Configuration Data
      description: 'Rego policies, Colang rail definitions, safety thresholds, NeMo
        Guardrails configuration, and governance policy singletons (governance_thresholds.json).
        Governs all AI enforcement behavior.

        '
      categorizations:
      - system: https://doi.org/10.6028/NIST.SP.800-60v2r1
        information-type-ids:
        - C.3.5.1
      confidentiality-impact:
        base: moderate
        selected: moderate
        adjustment-justification: 'Exposure of Rego/Colang logic reveals proprietary
          governance methodology; MODERATE protects against adversarial reverse-engineering.

          '
      integrity-impact:
        base: high
        selected: high
        adjustment-justification: 'Tampered governance policies could silently disable
          safety controls, allowing prohibited trade actions or PII exfiltration.
          Integrity must be HIGH.

          '
      availability-impact:
        base: high
        selected: high
        adjustment-justification: 'Governance policies must be continuously available;
          their unavailability causes the system to fail-safe (blocking all AI inference),
          which is operationally unacceptable during trading hours.

          '
    security-impact-level:
      security-objective-confidentiality: moderate
      security-objective-integrity: high
      security-objective-availability: high
    status:
      state: operational
      remarks: 'CAGE is deployed and operational in GKE governance-stack namespace.
        Pre-authorization draft SSP; ATO pending assessment completion.

        '
    authorization-boundary:
      description: 'The authorization boundary of the CAGE system encompasses all
        components deployed within the governance-stack Kubernetes namespace on GKE.
        This includes the CAGE FastAPI/gRPC gateway, NeMo Guardrails server, OPA policy
        engine, Compliance Bridge service, AgentSight eBPF monitor, and associated
        GCP managed services (Cloud SQL PostgreSQL, Cloud Storage buckets for audit
        archival, Redis for session state, Cloud Secret Manager for credential storage).
        The boundary is enforced via Kubernetes NetworkPolicy restricting all ingress/egress
        to authorized sources only. External to the boundary: Langfuse SaaS observability
        platform (external interconnection with data flow agreement), LLM provider
        APIs (OpenAI/Anthropic/Google), and OFAC sanctions API. GKE cluster infrastructure
        (physical, hypervisor, network fabric) is managed by Google Cloud Platform
        as Common Control Provider and is inherited via GCP FedRAMP High authorization.

        '
      props:
      - name: namespace
        value: governance-stack
      - name: cluster-type
        value: Google Kubernetes Engine (GKE)
      - name: network-policy-enforced
        value: 'true'
        remarks: deployment/k8s/network-policy.yaml
      - name: poam-gap-mtls
        value: POAM-013
        remarks: mTLS between services pending — NetworkPolicy is primary control
    network-architecture:
      description: 'CAGE is deployed in a single GKE cluster spanning multiple availability
        zones. All inter-service communication is restricted to the governance-stack
        namespace via Kubernetes NetworkPolicy (deployment/k8s/network-policy.yaml).
        Inbound traffic is routed through a Cloud Load Balancer to the CAGE gateway
        service. Outbound traffic egresses via Cloud NAT (nat-config-{region}) for
        controlled egress to external LLM APIs and Langfuse. All external traffic
        uses TLS 1.3. Internal service-to-service communication uses gRPC and HTTP
        over in-cluster networking; mTLS implementation is planned per POAM-013. GCP
        VPC networking provides network isolation at the hypervisor level inherited
        from GCP FedRAMP High authorization. The Redis cache, Cloud SQL PostgreSQL,
        and Cloud Storage are accessed via Private Service Connect or VPC-native routes,
        not exposed to the public internet.

        '
      diagrams:
      - uuid: c3000001-0000-4000-8000-000000000001
        description: CAGE network architecture diagram
        links:
        - href: docs/GATEWAY_ARCHITECTURE.md
          rel: reference
          text: Gateway Architecture Documentation
        - href: docs/INFERENCE_GATEWAY_ARCHITECTURE.md
          rel: reference
          text: Inference Gateway Architecture
    data-flow:
      description: 'Inbound: Client applications and end-user API consumers submit
        requests via gRPC or REST over TLS 1.3 to the CAGE gateway. Market data feeds
        enter via HTTPS. Financial Trade Data (IT-001) and PII (IT-004) are received
        at the gateway boundary.

        Internal processing pipeline: Gateway → NeMo Guardrails (gRPC, intra-cluster;
        Presidio PII masking strips PII before any external egress) → OPA Policy Engine
        (HTTP, intra-cluster; fiscal limits and RBAC enforcement) → LLM inference
        layer. All services emit OTel spans to the Langfuse collector endpoint. AgentSight
        eBPF monitor observes kernel-level syscalls for anomaly detection without
        data exfiltration.

        Outbound: PII-redacted inference requests exit to external LLM provider APIs
        (OpenAI/Anthropic/Google) via Cloud NAT over HTTPS. OFAC sanctions API queries
        exit via Cloud NAT. Audit logs (OTel spans) flow to Langfuse SaaS over HTTPS
        and are archived to GCS buckets for long-term retention per SEC Rule 17a-4.

        Data at rest: Cloud SQL PostgreSQL stores Langfuse metadata and session data
        encrypted with CMEK. GCS buckets store audit log archives with object versioning
        and CMEK encryption. Redis cache stores transient session state (TTL-bounded).
        Kubernetes Secrets reference Cloud Secret Manager for credential storage.

        '
      diagrams:
      - uuid: c3000002-0000-4000-8000-000000000002
        description: CAGE data flow diagram
        links:
        - href: compliance/oscal/information-type-registry.yaml
          rel: reference
          text: Information Type Registry with data flow summary
  system-implementation:
    remarks: 'System implementation documents the users, software components, and
      inventory items within the CAGE authorization boundary. Component UUIDs reference
      the existing component-definition.yaml where applicable. This section must be
      updated whenever new components are added or existing components are significantly
      modified.

      '
    users:
    - uuid: d4000001-0000-4000-8000-000000000001
      title: API User
      short-name: api-user
      description: 'External client applications and end-user API consumers who submit
        financial advisory queries via the CAGE gRPC/REST gateway. Authenticated via
        API keys stored in Cloud Secret Manager; access limited to inference endpoints
        only.

        '
      role-ids:
      - api-consumer
      props:
      - name: sensitivity-level
        value: moderate
      - name: authentication-method
        value: API Key (Cloud Secret Manager)
    - uuid: d4000002-0000-4000-8000-000000000002
      title: Administrative User
      short-name: admin-user
      description: 'System administrators with kubectl and GCP IAM access to manage
        cluster configuration, apply patches, and perform account management. Access
        requires MFA and is governed by AC-2 account management procedures.

        '
      role-ids:
      - system-admin
      props:
      - name: sensitivity-level
        value: high
      - name: authentication-method
        value: GCP IAM + MFA
      - name: privileged-access
        value: 'true'
    - uuid: d4000003-0000-4000-8000-000000000003
      title: Auditor User
      short-name: auditor-user
      description: 'Read-only access to Langfuse dashboards, compliance reports, and
