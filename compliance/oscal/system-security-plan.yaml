        \ (Sandbox — 1 UCAs)\n\n          Target compliance framework: NIST SP 800-53\
        \ Rev 5 (FedRAMP baseline)\n          Framework reference: https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final\n\
        \          System: CAGE Financial Advisor v1.1.0\n          UCAs encoded:\
        \ 12\n          Hazards modelled: 7\n          Safety constraints: 3\n   \
        \       Last compiled: 2026-10-07T01:14:23Z\n\n          UCA-to-Control mapping\
        \ (NIST SP 800-53 Rev 5 (FedRAMP baseline)):\n            UCA-1 (unsafe_action):\
        \ Agent executes write operation without a signed approval token.\n  → NIST:\
        \ ac-3 (Access Enforcement), sc-4 (Information in Shared System Resources\
