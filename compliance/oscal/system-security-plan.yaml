          2026-08-27 are not verifiable by the current code.

          '
        implementation-status:
          state: implemented
        links:
        - href: ../../src/gateway/governance/provenance_chain.py
          rel: reference
          text: Provenance chain implementation (evidence-of-execution)
        - href: ../../src/gateway/governance/routing_seal.py
