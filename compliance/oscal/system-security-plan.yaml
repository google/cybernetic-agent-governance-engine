      third_party_certificate_url: null
  import-profile:
    href: ./sp800053-profile.yaml
    remarks: 'Imports the CAGE-tailored SP 800-53 Rev 5 HIGH baseline profile, which
      includes AI-specific overlay controls (SR-3, SR-11, PT-2, PT-3) and excludes
      controls fully inherited from GCP (PE, MP, MA, PS families).

      '
  system-characteristics:
    system-ids:
    - id: cage-gke-prod
      identifier-type: https://cage.internal/system-ids
    system-name: Cybernetic Governance Engine
    system-name-short: CAGE
    description: 'The Cybernetic Governance Engine (CAGE) is a HIGH-impact AI governance
      platform for financial services that enforces real-time, deterministic controls
      over large language model (LLM) inference. Its deterministic screening has three
      parts: a Tier 1 Aho-Corasick scan for prompt-injection and control-override
      phrases, in-process Microsoft Presidio and regex PII redaction, and Tier 3 Open
      Policy Agent (OPA) Rego policy enforcement. NeMo Guardrails Colang rails are
      an optional tier, off by default (CAGE_NEMO_ENABLED=false), that adds LLM-backed
      content screening when an operator enables it. All governance decisions are
      emitted as OpenTelemetry (OTel) spans stamped with ISO 42001 and NIST SP 800-53
      control identifiers, providing a continuous, machine-verifiable audit trail
      aligned with SEC Rule 17a-4 and FINRA 4511 record retention requirements.

      CAGE is deployed on Google Kubernetes Engine (GKE) within the governance-stack
      namespace and integrates with Langfuse for AI observability. Microsoft Presidio
      runs in-process, so PII redaction depends on no separate service and no LLM.
      The system processes Financial Trade Execution Data, AI Governance Audit Logs,
      Personally Identifiable Information (PII), and Governance Policy Configurations.
      The system''s authorization boundary encompasses all containers deployed in
      the governance-stack namespace, the Cloud SQL PostgreSQL database, Google Cloud
      Storage buckets for audit log archival, and Redis cache for session state. External
      interconnections include the Langfuse observability platform (cloud-hosted SaaS).
      On GKE, model inference stays in the cluster: the inference backend is in-cluster
      vLLM or none, and the external-provider backend is compose-only.

      '
    security-sensitivity-level: high
    information-types:
    - uuid: b2000001-0000-4000-8000-000000000001
      title: Financial Transaction Data
      description: 'Buy/sell orders, portfolio positions, trade recommendations, and
        AI-generated financial advice generated by the CAGE AI governance pipeline.
        Governed by SEC Rule 17a-4, FINRA 4511, and OFAC sanctions screening requirements.

        '
      categorizations:
      - system: https://doi.org/10.6028/NIST.SP.800-60v2r1
        information-type-ids:
        - C.2.8.12
      confidentiality-impact:
        base: moderate
        selected: moderate
        adjustment-justification: 'Unauthorized disclosure enables front-running or
          market manipulation but does not rise to catastrophic harm.

          '
      integrity-impact:
        base: high
        selected: high
        adjustment-justification: 'Tampering with trade orders or AI-generated recommendations
          could result in severe financial loss, regulatory violations, and reputational
          damage.

          '
      availability-impact:
        base: moderate
        selected: high
        adjustment-justification: 'System must be available during trading hours;
          unavailability causes business disruption and potential regulatory non-compliance.
          Elevated from moderate to HIGH based on financial services operational requirements.

          '
    - uuid: b2000002-0000-4000-8000-000000000002
      title: AI Governance Audit Logs
      description: 'OTel spans with ISO 42001 evidence stamps, OSCAL assessment results,
        Langfuse traces, governance verdicts, and STPA validation results. Required
        for regulatory examination by SEC and FINRA.

        '
      categorizations:
      - system: https://doi.org/10.6028/NIST.SP.800-60v2r1
        information-type-ids:
        - D.16.1
      confidentiality-impact:
        base: low
        selected: moderate
        adjustment-justification: 'Audit logs contain proprietary governance methodology
          and enforcement patterns; elevated from LOW to MODERATE to protect against
          adversarial analysis of governance bypass opportunities.

          '
      integrity-impact:
        base: high
        selected: high
        adjustment-justification: 'Tampered audit records undermine the ISO 42001
          evidence chain and obstruct regulatory examination. Integrity must be HIGH.

          '
      availability-impact:
        base: moderate
        selected: moderate
    - uuid: b2000003-0000-4000-8000-000000000003
      title: PII/User Identity Data
      description: 'Individual investor PII, redacted in-process by Microsoft Presidio
        (12 identity entity types, including SSN, credit card, bank account and passport
        numbers) and deterministic regex scrubbing. Governed by SEC Reg S-P and FINRA
        privacy rules.

        '
      categorizations:
      - system: https://doi.org/10.6028/NIST.SP.800-60v2r1
        information-type-ids:
        - D.2.2
      confidentiality-impact:
        base: high
        selected: high
        adjustment-justification: 'Unauthorized disclosure of investor PII causes
          severe privacy harm, triggers SEC Reg S-P breach notification obligations.
          Confidentiality must be HIGH.

          '
      integrity-impact:
        base: high
        selected: high
        adjustment-justification: 'Corrupted PII records cause incorrect financial
          decisions and legal liability.

          '
      availability-impact:
        base: low
        selected: moderate
        adjustment-justification: 'PII records are not time-critical for system operation;
          elevated to MODERATE to ensure audit trail continuity for regulatory examinations.

          '
    - uuid: b2000004-0000-4000-8000-000000000004
      title: System Configuration Data
      description: 'Rego policies, Colang rail definitions, safety thresholds, NeMo
        Guardrails configuration, and governance policy singletons (governance_thresholds.json).
        Governs all AI enforcement behavior.

        '
      categorizations:
      - system: https://doi.org/10.6028/NIST.SP.800-60v2r1
        information-type-ids:
        - C.3.5.1
      confidentiality-impact:
        base: moderate
        selected: moderate
        adjustment-justification: 'Exposure of Rego/Colang logic reveals proprietary
          governance methodology; MODERATE protects against adversarial reverse-engineering.

          '
      integrity-impact:
        base: high
        selected: high
        adjustment-justification: 'Tampered governance policies could silently disable
          safety controls, allowing prohibited trade actions or PII exfiltration.
          Integrity must be HIGH.

          '
      availability-impact:
        base: high
        selected: high
        adjustment-justification: 'Governance policies must be continuously available;
          their unavailability causes the system to fail-safe (blocking all AI inference),
          which is operationally unacceptable during trading hours.

          '
    security-impact-level:
      security-objective-confidentiality: moderate
      security-objective-integrity: high
      security-objective-availability: high
    status:
      state: operational
      remarks: 'CAGE is deployed and operational in GKE governance-stack namespace.
        Pre-authorization draft SSP; ATO pending assessment completion.

        '
    authorization-boundary:
      description: 'The authorization boundary of the CAGE system encompasses all
        components deployed within the governance-stack Kubernetes namespace on GKE.
        This includes the CAGE FastAPI/gRPC gateway, OPA policy engine, the optional
        NeMo Guardrails server where an operator enables it, Compliance Bridge service,
        AgentSight eBPF monitor, and associated GCP managed services (Cloud SQL PostgreSQL,
        Cloud Storage buckets for audit archival, Redis for session state, Cloud Secret
        Manager for credential storage). The boundary is enforced via Kubernetes NetworkPolicy
        restricting all ingress/egress to authorized sources only. External to the
        boundary: Langfuse SaaS observability platform (external interconnection with
        data flow agreement) and OFAC sanctions API. No LLM provider API is an interconnection
        on GKE: model inference stays in the cluster, and the external-provider backend
        is compose-only. GKE cluster infrastructure (physical, hypervisor, network
        fabric) is managed by Google Cloud Platform as Common Control Provider and
        is inherited via GCP FedRAMP High authorization.

        '
      props:
      - name: namespace
        value: governance-stack
      - name: cluster-type
        value: Google Kubernetes Engine (GKE)
      - name: network-policy-enforced
        value: 'true'
        remarks: infra/targets/gcp-gke/network_policy.tf
      - name: poam-gap-mtls
        value: POAM-013
        remarks: mTLS between services pending — NetworkPolicy is primary control
    network-architecture:
      description: 'CAGE is deployed in a single GKE cluster spanning multiple availability
        zones. All inter-service communication is restricted to the governance-stack
        namespace via Kubernetes NetworkPolicy (infra/targets/gcp-gke/network_policy.tf).
        Inbound traffic is routed through a Cloud Load Balancer to the CAGE gateway
        service. Outbound traffic egresses via Cloud NAT (nat-config-{region}) for
        controlled egress to the endpoints on each workload''s FQDN allowlist; model
        inference stays in the cluster. All external traffic uses TLS 1.3. Internal
        service-to-service communication uses gRPC and HTTP over in-cluster networking;
        mTLS implementation is planned per POAM-013. GCP VPC networking provides network
        isolation at the hypervisor level inherited from GCP FedRAMP High authorization.
        The Redis cache, Cloud SQL PostgreSQL, and Cloud Storage are accessed via
        Private Service Connect or VPC-native routes, not exposed to the public internet.

        '
      diagrams:
      - uuid: c3000001-0000-4000-8000-000000000001
        description: CAGE network architecture diagram
        links:
        - href: docs/architecture/GATEWAY_ARCHITECTURE.md
          rel: reference
          text: Gateway Architecture Documentation
        - href: docs/architecture/INFERENCE_GATEWAY_ARCHITECTURE.md
          rel: reference
          text: Inference Gateway Architecture
    data-flow:
      description: 'Inbound: Client applications and end-user API consumers submit
        requests via gRPC or REST over TLS 1.3 to the CAGE gateway. Market data feeds
        enter via HTTPS. Financial Trade Data (IT-001) and PII (IT-004) are received
        at the gateway boundary.

        Internal processing pipeline: the governed agent''s input rail redacts identity
        PII from each user message in-process (Presidio; it fails open if the engines
        cannot initialise, POAM-2026-147) and runs the Stage 1 keyword scan before
        any agent or model sees the text → Gateway inference proxy (Stage 1 keyword
        scan over every message; regex PII scrub of every model response) → OPA Policy
        Engine (HTTP, intra-cluster; fiscal limits and RBAC enforcement) → LLM inference
        layer. NeMo Guardrails joins this path only when CAGE_NEMO_ENABLED=true. All
        services emit OTel spans to the Langfuse collector endpoint. AgentSight eBPF
        monitor observes kernel-level syscalls for anomaly detection without data
        exfiltration.

        Outbound: model inference does not leave the cluster. On GKE the inference
        backend is in-cluster vLLM (inference_backend = "vllm") or none, and the "external"
        backend, which sends requests to a third-party provider, is compose-only.
        OFAC sanctions API queries exit via Cloud NAT. Audit logs (OTel spans) flow
        to Langfuse SaaS over HTTPS and are archived to GCS buckets for long-term
        retention per SEC Rule 17a-4.

        Data at rest: Cloud SQL PostgreSQL stores Langfuse metadata and session data
        encrypted with CMEK. GCS buckets store audit log archives with object versioning
        and CMEK encryption. Redis cache stores transient session state (TTL-bounded).
        Kubernetes Secrets reference Cloud Secret Manager for credential storage.

        '
      diagrams:
      - uuid: c3000002-0000-4000-8000-000000000002
        description: CAGE data flow diagram
        links:
        - href: compliance/oscal/information-type-registry.yaml
          rel: reference
          text: Information Type Registry with data flow summary
  system-implementation:
    remarks: 'System implementation documents the users, software components, and
      inventory items within the CAGE authorization boundary. Component UUIDs reference
      the existing component-definition.yaml where applicable. This section must be
      updated whenever new components are added or existing components are significantly
      modified.

      '
    users:
    - uuid: d4000001-0000-4000-8000-000000000001
      title: API User
      short-name: api-user
      description: 'External client applications and end-user API consumers who submit
        financial advisory queries via the CAGE gRPC/REST gateway. Authenticated via
        API keys stored in Cloud Secret Manager; access limited to inference endpoints
        only.

        '
      role-ids:
      - api-consumer
      props:
      - name: sensitivity-level
        value: moderate
      - name: authentication-method
        value: API Key (Cloud Secret Manager)
    - uuid: d4000002-0000-4000-8000-000000000002
      title: Administrative User
      short-name: admin-user
      description: 'System administrators with kubectl and GCP IAM access to manage
        cluster configuration, apply patches, and perform account management. Access
        requires MFA and is governed by AC-2 account management procedures.

        '
      role-ids:
      - system-admin
      props:
      - name: sensitivity-level
        value: high
      - name: authentication-method
        value: GCP IAM + MFA
      - name: privileged-access
        value: 'true'
    - uuid: d4000003-0000-4000-8000-000000000003
      title: Auditor User
      short-name: auditor-user
      description: 'Read-only access to Langfuse dashboards, compliance reports, and
        audit log archives. Used by ISSO, compliance engineers, and external assessors
        during assessment activities.

        '
      role-ids:
      - isso
      - assessor
      - compliance-engineer
      props:
      - name: sensitivity-level
        value: moderate
      - name: authentication-method
        value: GCP IAM read-only role
    - uuid: d4000004-0000-4000-8000-000000000004
      title: AI Model Operator
      short-name: ai-model-operator
      description: 'Personnel who manage AI model versions, review OPA Rego governance
        policies, tune NeMo Guardrails Colang rail definitions where the optional
        tier is enabled, and monitor AI model performance via Langfuse dashboards
        per SR 11-7 model risk management.

        '
      role-ids:
      - ai-model-operator
      props:
      - name: sensitivity-level
        value: high
      - name: authentication-method
        value: GCP IAM + MFA
    components:
    - uuid: e5000001-0000-4000-8000-000000000001
      type: software
      title: CAGE Gateway
      description: 'FastAPI/gRPC hybrid gateway serving as the primary ingress enforcement
        layer. Implements deterministic screening: the Tier 1 Aho-Corasick keyword
        scan, regex PII scrubbing of model responses, and Tier 3 OPA policy enforcement.
        NeMo Guardrails rails run in the gateway only when CAGE_NEMO_ENABLED=true.
        Emits OTel spans stamped with ISO 42001 and NIST SP 800-53 control identifiers.

        '
      purpose: 'Provides the system''s authorization boundary ingress point, enforcing
        all governance controls before any request reaches the LLM inference layer.

        '
      status:
        state: operational
      responsible-roles:
      - role-id: system-admin
        party-uuids:
        - a1000004-0000-4000-8000-000000000004
      props:
      - name: software-version
        value: TBD — see SBOM
      - name: container-image
        value: cage-gateway:latest
      - name: namespace
        value: governance-stack
    - uuid: e5000002-0000-4000-8000-000000000002
      type: software
      title: NeMo Guardrails Server
      description: 'NVIDIA NeMo Guardrails Colang input rails and LLM output judge.
        Optional tier, off by default: the gateway builds NeMo rails only when CAGE_NEMO_ENABLED=true
        and an inference backend is configured, and refuses every rail path otherwise
        (POAM-2026-144). The nemo-guardrails server deployment exists only where an
        operator enables the nemo_guardrails Terraform module. PII redaction does
        not depend on this component (see Deterministic PII Redaction).

        '
      purpose: 'When enabled, adds LLM-backed input screening and semantic output
        validation (ISO 42001 A.6.1.2). Claims no control in the default posture.

        '
      status:
        state: other
        remarks: 'Optional tier, disabled by default since AG-5 (#576). The ISO 42001
          A.9.2 and NIST PT-2/PT-3 claims this component carried belong to the in-process
          Deterministic PII Redaction component (POAM-2026-145).

          '
      responsible-roles:
      - role-id: ai-model-operator
      props:
      - name: container-image
        value: nemo-guardrails:latest
      - name: namespace
        value: governance-stack
      - name: enablement
        value: CAGE_NEMO_ENABLED=true (default false)
    - uuid: e5000008-0000-4000-8000-000000000008
      type: software
      title: Deterministic PII Redaction
      description: 'In-process PII redaction with no LLM and no network dependency
        (spaCy NER runs locally), independent of CAGE_NEMO_ENABLED (POAM-2026-142).
        Microsoft Presidio (src/integrations/presidio/redactor.py) replaces 12 identity
        entity types (PERSON, EMAIL_ADDRESS, PHONE_NUMBER, CREDIT_CARD, CRYPTO, US_SSN,
        US_ITIN, US_PASSPORT, US_BANK_NUMBER, US_DRIVER_LICENSE, IBAN_CODE, IP_ADDRESS)
        with type tokens; scrub_pii (src/gateway/infrastructure/privacy.py) removes
        SSN, credit card, email and phone patterns with regular expressions. The governed
        agent''s input rail node (src/gateway/governance/langgraph_harness/nemo_node_factory.py)
        replaces each user message with its redacted text before any agent or model
        sees it. It fails closed in enforcing postures when redaction raises, but
        not when the Presidio engines failed to initialise: redaction then returns
        the text unchanged and the message passes unredacted (POAM-2026-147). The
        output rail node applies both passes to every agent answer and returns the
        blocked sentinel on any error. The gateway''s inference proxy applies scrub_pii
        to every model response and to the prompt text it records in telemetry.

        '
      purpose: 'Keeps identity PII in user input from reaching the inference layer
        while the Presidio engines are initialised (POAM-2026-147), and PII in model
        output from reaching users or telemetry. Implements ISO 42001 A.9.2 data transfer
        controls and supports NIST SP 800-53 PT-2/PT-3 PII processing controls. A.9.2''s
        automated evidence has no producer yet (POAM-2026-146).

        '
      status:
        state: operational
        remarks: 'Operational with a documented fail-open: if the Presidio engines
          fail to initialise, input redaction passes text through unredacted, in enforcing
          postures too (POAM-2026-147, reproduced 2026-10-29). The shipped advisor
          image installs Presidio and its spaCy models, so the defect is latent there.
          Output keeps its regex scrub_pii pass.

          '
      responsible-roles:
      - role-id: ai-model-operator
      props:
      - name: pii-masking
        value: Microsoft Presidio (12 identity entity types) + regex scrub_pii
      - name: deployment-type
        value: In-process library (governed agent rail nodes, gateway inference proxy)
      - name: namespace
        value: governance-stack
      - name: poam-gap
        value: POAM-2026-147
        remarks: Input redaction fails open when the Presidio engines fail to initialise
      - name: poam-gap-evidence
        value: POAM-2026-146
        remarks: A.9.2's automated Lula evidence has no producer
    - uuid: e5000003-0000-4000-8000-000000000003
      type: software
      title: OPA Policy Engine
      description: 'Open Policy Agent evaluating Rego policies (trade_governance.rego)
        on every trade execution request. Enforces RBAC role limits (junior: $5k/$10k;
        senior: $500k/$1M) for the trader role the gateway binds from the verified
        caller workload identity, and fiscal thresholds. Decision logs captured by
        Cloud Logging.

        '
      purpose: 'Provides deterministic, auditable policy enforcement independent of
