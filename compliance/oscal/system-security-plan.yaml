        '
    - id: assessor
      title: Security Control Assessor
      description: 'Independent assessor who conducts security control assessments
        and produces the Security Assessment Report (SAR).

        '
    - id: ai-model-operator
      title: AI Model Operator
      description: 'Monitors AI model performance, manages model versioning, reviews
