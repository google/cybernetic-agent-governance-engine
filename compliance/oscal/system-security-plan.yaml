        value: moderate
      - name: authentication-method
        value: GCP IAM read-only role
    - uuid: d4000004-0000-4000-8000-000000000004
      title: AI Model Operator
      short-name: ai-model-operator
      description: 'Personnel who manage AI model versions, tune NeMo Guardrails Colang
        rail definitions, review OPA Rego governance policies, and monitor AI model
        performance via Langfuse dashboards per SR 11-7 model risk management.

        '
      role-ids:
      - ai-model-operator
      props:
      - name: sensitivity-level
        value: high
      - name: authentication-method
        value: GCP IAM + MFA
    components:
    - uuid: e5000001-0000-4000-8000-000000000001
      type: software
      title: CAGE Gateway
      description: 'FastAPI/gRPC hybrid gateway serving as the primary ingress enforcement
        layer. Implements three-tier semantic shielding: Tier 1 Aho-Corasick heuristic,
        Tier 2 SLM semantic classification, Tier 3 OPA policy enforcement. Emits OTel
        spans stamped with ISO 42001 and NIST SP 800-53 control identifiers.

        '
      purpose: 'Provides the system''s authorization boundary ingress point, enforcing
        all governance controls before any request reaches the LLM inference layer.

        '
      status:
        state: operational
      responsible-roles:
      - role-id: system-admin
        party-uuids:
        - a1000004-0000-4000-8000-000000000004
      props:
      - name: software-version
        value: TBD — see SBOM
      - name: container-image
        value: cage-gateway:latest
      - name: namespace
        value: governance-stack
    - uuid: e5000002-0000-4000-8000-000000000002
      type: software
      title: NeMo Guardrails Server
      description: 'NVIDIA NeMo Guardrails applying Colang-defined input/output rails.
        Integrates Microsoft Presidio for PII entity detection and anonymization across
        16 PII entity types before any data egresses the cluster.

        '
      purpose: 'Prevents PII transmission to external AI suppliers. Implements A.9.2
        ISO 42001 data transfer controls and PT-2/PT-3 NIST SP 800-53 PII controls.

        '
      status:
        state: operational
      responsible-roles:
      - role-id: ai-model-operator
      props:
      - name: container-image
        value: nemo-guardrails:latest
      - name: namespace
        value: governance-stack
      - name: pii-masking
        value: Microsoft Presidio (16 entity types)
    - uuid: e5000003-0000-4000-8000-000000000003
      type: software
      title: OPA Policy Engine
      description: 'Open Policy Agent evaluating Rego policies (finance_policy.rego,
        system_authz.rego, trade_policy.rego) on every trade execution request. Enforces
        RBAC role limits (junior: $5k/$10k; senior: $500k/$1M) and fiscal thresholds.
        Decision logs captured by Cloud Logging.

        '
      purpose: 'Provides deterministic, auditable policy enforcement independent of
        LLM reasoning. Implements AC-3 access enforcement and CM-6 configuration settings.

        '
      status:
        state: operational
      responsible-roles:
      - role-id: compliance-engineer
      props:
      - name: container-image
        value: openpolicyagent/opa:latest-rootless
      - name: namespace
        value: governance-stack
      - name: policy-files
        value: finance_policy.rego, system_authz.rego, trade_policy.rego
    - uuid: e5000004-0000-4000-8000-000000000004
      type: software
      title: Compliance Bridge Service
      description: 'Python service aggregating OTel spans into time-windowed safety_rate
        metrics, parsing OSCAL assessment results, and triggering Slack/PagerDuty
        alerts for compliance violations. Runs automated_auditor.py for continuous
        AU-12 audit record generation and review.

        '
      purpose: 'Implements AU-12 audit record generation, IR-6 incident reporting
        notifications, and continuous compliance monitoring per CA-7.

        '
      status:
        state: operational
      responsible-roles:
      - role-id: isso
      props:
      - name: container-image
        value: cage-compliance-bridge:latest
      - name: namespace
        value: governance-stack
    - uuid: e5000005-0000-4000-8000-000000000005
      type: software
      title: AgentSight eBPF Monitor
      description: 'eBPF-based kernel-level monitoring agent that observes syscalls,
        network connections, and file access patterns of AI workloads without requiring
        application code changes. Provides runtime anomaly detection.

        '
      purpose: 'Implements SI-4 information system monitoring and AU-2 audit event
        generation at the kernel level, providing tamper-resistant observability.

        '
      status:
        state: operational
      responsible-roles:
      - role-id: system-admin
      props:
      - name: deployment-type
        value: DaemonSet (privileged)
      - name: namespace
        value: governance-stack
    - uuid: e5000006-0000-4000-8000-000000000006
      type: software
      title: Langfuse Observability
      description: 'AI observability platform receiving OTel spans from all CAGE components.
        Provides trace aggregation, prompt/response logging, compliance dashboards,
        and long-term audit log storage. External interconnection (SaaS).

        '
      purpose: 'Implements AU-2/AU-12 audit record storage and CA-7 continuous monitoring
        dashboard. Audit logs are archived from Langfuse to GCS for SEC Rule 17a-4
        retention compliance.

        '
      status:
        state: operational
      responsible-roles:
      - role-id: compliance-engineer
      props:
      - name: component-type
        value: external-interconnection
      - name: data-sharing-agreement
        value: TBD — Langfuse DPA required before ATO
      - name: poam-gap
        value: 'POAM-TBD: Langfuse DPA'
    - uuid: e5000007-0000-4000-8000-000000000007
      type: service
      title: Google Kubernetes Engine (GKE) Cluster
      description: 'Google Kubernetes Engine cluster hosting the governance-stack
        namespace. Provides container orchestration, Workload Identity, Binary Authorization,
        Container Analysis API, and multi-zone availability. Managed by Google Cloud
        Platform as Common Control Provider.

        '
      purpose: 'Leveraged authorization platform. GKE/GCP provides inherited controls
        for PE, MP, MA, PS control families per GCP FedRAMP High authorization. CAGE
