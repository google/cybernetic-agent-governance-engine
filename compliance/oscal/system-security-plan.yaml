    - uuid: g7000004-0000-4000-8000-000000000004
      control-id: au-12
      description: "Audit record generation is implemented through two distinct auditing\
        \ modes,\neach providing different consistency/availability trade-offs:\n\n\
        1. DECISION-TIME AUDIT (fire-and-forget, default mode):\n   Implemented via\
        \ OpenTelemetry spans in src/gateway/infrastructure/telemetry.py\n   and scripts/automated_auditor.py.\
        \ Governance decisions emit OTel spans\n   asynchronously to Langfuse containing\
        \ ISO 42001 6-attribute evidence stamps:\n   control_id, decision_outcome,\
        \ timestamp_utc, request_id, user_role, and\n   enforcement_tier. Routing\
        \ seals are issued immediately after the governance\n   decision without waiting\
        \ for audit record persistence. This mode prioritizes\n   availability — audit\
        \ persistence is decoupled from seal issuance.\n\n2. EVIDENCE-OF-EXECUTION\
        \ AUDIT (blocking mode, EVIDENCE_CHAIN_BLOCKING=true):\n   Implemented via\
        \ the provenance chain in src/gateway/governance/provenance_chain.py.\n  \
        \ When the EVIDENCE_CHAIN_BLOCKING environment variable is set to true, the\n\
        \   provenance chain MUST successfully persist the evidence record to the\
        \ backing\n   store BEFORE the routing seal is computed and returned. This\
        \ creates a\n   cryptographic dependency: no seal can exist without a corresponding\
        \ committed\n   evidence record. The evidence chain includes hash-linked records\
        \ providing\n   time-correlation across audit entries.\n\nKEY DISTINCTION:\n\
        - Decision-time audit records WHAT was decided (the governance outcome)\n\
        - Evidence-of-execution audit proves THAT the decision was recorded BEFORE\n\
        \  action (seal issuance), providing stronger non-repudiation guarantees\n\
        \nThe blocking mode satisfies AU-12(1) system-wide/time-correlated audit trail\n\
        requirements through the hash-linked evidence chain. Each evidence record\n\
        includes a previous_hash field linking to the prior entry, enabling forensic\n\
        reconstruction of the complete audit trail sequence.\n\nBoth modes are compliant\
        \ AU-12 implementations — the choice depends on whether\nthe deployment prioritizes\
        \ availability (decision-time) or non-repudiation\n(evidence-of-execution).\n\
        \nAudit records are exported to GCS buckets for long-term retention per SEC\n\
        Rule 17a-4. The Compliance Bridge Service triggers Slack/PagerDuty alerts\n\
        when safety_rate thresholds are breached.\n\nRefusal and deferral parity (0cdb5aaa,\
        \ #427): a DENY writes a GOVERNANCE_REFUSAL record and a DEFER or REQUIRE_APPROVAL\
        \ writes a hash-chained GOVERNANCE_DEFERRAL record (src/gateway/governance/governor/verdicts.py).\
        \ The writes are non-blocking because neither outcome executes anything, but\
        \ a failed write logs at ERROR and increments cage_governance_evidence_publish_failures_total{kind}\
        \ (src/gateway/governance/governor/metrics.py). For a warranted norm the RelianceRecord\
        \ is bound into the routing seal's evidence record under record_hash (src/gateway/governance/warrant/reliance.py).\n"
      props:
      - name: implementation-status
        value: partial
      - name: evidence-chain-blocking
        value: configurable via EVIDENCE_CHAIN_BLOCKING environment variable
      - name: auditing-modes
        value: decision-time (async), evidence-of-execution (blocking)
      - name: au-12-1-enhancement
        value: hash-linked evidence chain provides time-correlated audit trail
      responsible-roles:
      - role-id: compliance-engineer
      by-components:
      - component-uuid: e5000004-0000-4000-8000-000000000004
        uuid: h8000004-0000-4000-8000-000000000005
        description: 'Compliance Bridge Service (src/compliance_bridge/audit_workflow.py)
          aggregates

          OTel spans and generates OSCAL assessment result records.

          scripts/automated_auditor.py performs scheduled audit trail generation.


          Decision-time audit: OTel spans emitted to Langfuse asynchronously.

          Evidence-of-execution audit: provenance_chain.py ensures commit before seal.


          Lula validation: compliance/lula/lula-validation-au12.yaml validates both
          modes.

          '
        implementation-status:
          state: partially-implemented
        links:
        - href: ../../compliance/lula/lula-validation-au12.yaml
          rel: reference
          text: Lula automated validation for AU-12 (dual auditing modes)
      - component-uuid: e5000001-0000-4000-8000-000000000001
        uuid: h8000004-0000-4000-8000-000000000006
        description: 'CAGE Gateway implements the provenance chain (src/gateway/governance/provenance_chain.py)

          providing evidence-of-execution audit capability. When EVIDENCE_CHAIN_BLOCKING=true,

          the routing seal (src/gateway/governance/routing_seal.py) is not issued
          until

          the evidence record is successfully committed. This ties the cryptographic
          seal

          directly to the persisted audit record, ensuring non-repudiation.


          The backward-compatibility remediation (BC-01–BC-08, 2026-08-27) removed
          the

