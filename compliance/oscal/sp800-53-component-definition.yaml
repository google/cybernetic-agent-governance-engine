            - uuid: "17537e23-e213-4c9c-b583-68992eb29794"
              control-id: ca-7
              description: |
                Continuous ground-truth reconciliation keeps verified CBF state fresh
                (POAM-2026-096, open). Terraform deploys the reconciliation worker
                (infra/modules/reconciliation_worker/main.tf, on by default through
                enable_reconciliation_worker) as a single-replica Deployment with the Recreate
                strategy. It runs GroundTruthReconciler.run_loop()
                (src/gateway/governance/reconciliation/daemon.py) every 60 s against a 300 s
                verified-state TTL, and run_loop() refuses to start when the TTL is less than
                twice the poll interval, so one missed poll does not expire a signed snapshot.
                The worker signs snapshots with the reconciler-snapshot KMS key under its own
                service account. When the discrepancy guard trips, the daemon first advances the
                fence epoch, invalidates the verified state and records an active-fence marker,
                then appends a RECONCILIATION_DISCREPANCY_FENCE record (KMS-signed under an
                enforcing posture) to the hash-chained evidence stream; the gateway stays fenced
                if that append fails, and the failure is counted. The daemon never writes the
                CBF state key from an unverified reading. Status is partial: the worker reads a
                simulated ground-truth provider (RECONCILIATION_PROVIDER=simulated; from_env()
                builds _DefaultSimulatedProvider), and the loop has not been verified running on
                a deployed cluster.
              props:
                - name: implementation-status
                  value: partial
                - name: control-origination
                  value: system-specific
                - name: poam-reference
                  value: "POAM-2026-096"
              links:
                - href: "../../infra/modules/reconciliation_worker/main.tf"
