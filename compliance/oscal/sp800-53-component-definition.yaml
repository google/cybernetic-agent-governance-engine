                  rel: implementation
                  text: "generate_seal() JOSE alg header"
                - href: "../../src/gateway/governance/kms_signer.py"
                  rel: implementation
                  text: "KMSGovernanceSigner.sign_jws() DER to raw conversion"
                - href: "../../src/gateway/governance/jwks.py"
                  rel: implementation
                  text: "kid-required key resolution"
                - href: "../../tests/test_routing_seal_asymmetric_roundtrip.py"
