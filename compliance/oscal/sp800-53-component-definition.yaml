            - uuid: "2f94e8b5-7d3a-4c61-b9f4-8e5a9d6c3f2a"
              control-id: sc-13
              description: |
                Cryptographic protection is implemented via the RawMessageSigner protocol
                abstraction (src/gateway/governance/raw_signer_protocol.py) for KMS-signed
                ConsequenceToken JWS (src/gateway/governance/consequence_token.py) introduced
                in FlowSignal Phase 2. The RawMessageSigner protocol decouples cryptographic
                operations from key lifecycle management via dependency injection in
                actuator_01 (src/integrations/actuator_01/adapter.py:117-142), replacing
                direct KMSGovernanceSigner coupling. All runtime signing paths are async
                (KMSGovernanceSigner.sign_async, sign_raw_async, sign_jws_async,
                sign_precomputed_digest_async, sign_decision_async,
                BatchGovernanceSigner.sign_batch_async, routing_seal.generate_seal, and
                ConsequenceToken.mint) and offload blocking HSM RPCs onto a dedicated
                ThreadPoolExecutor (cage-kms) guarded by an asyncio.Semaphore
                (CAGE_KMS_MAX_CONCURRENCY) and fail-closed asyncio.timeout
                (CAGE_KMS_SIGN_TIMEOUT_SECONDS). Calling synchronous .sign*() methods from
                a thread with an active asyncio event loop is guarded by
                _guard_no_running_loop() (raising RuntimeError in non-enforcing postures
                and logging ERROR in enforcing postures) and enforced statically by
                tests/unit/test_no_sync_signing_in_async.py. ConsequenceToken.mint() awaits
                the injected signer's sign_raw_async() to produce a compact JWS with 8
                claims (sub, tid, rec, act, ver, iat, exp, jti). The signing algorithm is
                determined by the KMS key type (ES256/ES384 for ECDSA, EdDSA for Ed25519,
                PS256/RS256 for RSA). ConsequenceToken.verify() validates the JWS signature
                via verify_raw(), rejects alg:none, and enforces algorithm consistency
                (protected header alg must match signer.jose_alg). All cryptographic
                operations fail closed — bad signature, expired token, algorithm confusion,
                or malformed claims raise ConsequenceTokenError. The token carries a SHA-256
                digest of the RFC 8785 JCS-canonicalized action payload in the 'act' claim,
                providing cryptographic binding between governance evaluation and execution.
                The backward-compatibility remediation (BC-01–BC-08, 2026-08-27) migrated
                all hash-chain modules (provenance_chain.py, evidence_stream.py,
                context_accumulator.py) from json.dumps(sort_keys=True) to RFC 8785 JCS
                (jcs_canonicalize_plan) for deterministic cross-platform evidence integrity
                verification. This migration was a breaking change — records written before
                2026-08-27 are not verifiable by the current code. No cryptographic path is
                excluded from JCS: the WORM-bucket KMS signing payload built by _sign_record()
                in uca_logger.py was migrated to RFC 8785 JCS with no compatibility shim and
                no carve-out, so previously-signed WORM UCA records will not verify under the
                current algorithm. That break is accepted because the data-at-rest
                read-compatibility exception is dormant, not active (see the Dormant Rules
                section of AGENTS.md).
              props:
                - name: implementation-status
                  value: implemented
                - name: control-origination
                  value: system-specific
                - name: phase-2-implementation
                  value: "true"
                - name: raw-signer-protocol
                  value: "src/gateway/governance/raw_signer_protocol.py"
                - name: actuator-01-di
                  value: "src/integrations/actuator_01/adapter.py:117-142"
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=SC-13"
                  rel: reference

            - uuid: "c5c6-ia5-kms-lifecycle-00001111"
              control-id: ia-5
              description: |
                Authenticator management for signing keys is partial. Signing goes through the
                BaseKMSProvider abstraction (src/gateway/governance/kms_signer.py), with
                provider implementations for Cloud KMS, AWS KMS and Azure Key Vault
                (src/integrations/gcp/kms_provider.py, src/integrations/aws/kms_provider.py,
                src/integrations/azure/kms_provider.py), and RawMessageSigner dependency
                injection (src/gateway/governance/raw_signer_protocol.py) lets a signer be
