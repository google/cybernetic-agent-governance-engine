            - uuid: "bcb59824-06a7-5be1-b456-29504bf608fa"
              control-id: si-10
              description: |
                Governed trades execute at most once per transaction_id while the ledger
                remembers the key. execute_trade_action
                (src/cage_finance/tools/tool_provider.py) refuses a trade without a UUIDv4 or
                UUIDv5 transaction_id and, before governance runs, claims the key in the kernel
                ExecutionLedger (src/gateway/governance/execution_idempotency.py;
                governor.components.execution_ledger, built by assemble_governor on the
                gateway's shared Redis client, the governance Memorystore instance in
                Terraform): Redis SET NX EX with a per-attempt token claims it, and a Lua
                compare-and-set on that token records EXECUTED, BLOCKED or UNKNOWN with the
                outcome text. execute_trade keys are namespaced by action, not by caller, so a
                resubmission collides whichever path it takes. A resubmitted key is neither
                governed nor dispatched through the ActuatorRegistry again: it receives the
                recorded outcome, or UnsettledDuplicate while the first attempt runs or its
                outcome is UNKNOWN, and the refusal is committed to the evidence stream as a
                GOVERNANCE_REFUSAL_RECEIPT (AC-3). An UNKNOWN actuation keeps the claim pending
                reconciliation. Only a resubmission carrying an approval (deferred_id) may
                re-claim a key whose attempt was BLOCKED; the gateway verifies and spends the
                approval before anything runs. Without Redis an enforcing posture refuses the
                trade; only DEV, TEST and CI fall back to a process-local registry. The broker
                order carries the transaction_id as client_order_id
                (src/cage_finance/tools/trade_executor.py). GatewayMCPClient
                (src/gateway/infrastructure/mcp_client.py) resends a tool call only when nothing
                was sent or the gateway annotates the tool readOnlyHint or idempotentHint, and
                otherwise raises MCPToolOutcomeUnknownError for the caller to reconcile. Status
                is partial because the guarantee is bounded: a key is remembered for
                DEFAULT_TTL_SECONDS (7 days), after which only the broker's client_order_id
                deduplication remains, and claim writes are not acknowledged by a replica, so a
                Valkey failover that loses a recent claim leaves the same broker deduplication
                as the only guard.
              props:
                - name: implementation-status
                  value: partial
                - name: control-origination
                  value: system-specific
