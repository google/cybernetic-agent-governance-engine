                  rel: lula

    # -----------------------------------------------------------------------
    # Component 5: STPA Safety Validator (src/gateway/governance/stpa_validator.py)
    # Enforces: RA-3 (Risk Assessment), SI-4 (System Monitoring)
    # -----------------------------------------------------------------------
    - uuid: "4fd30a2a-c26b-4401-af55-ce57ceab042d"
      title: "STPA Safety Validator"
      type: software
      description: >
        System-Theoretic Process Analysis (STPA) hazard validator with Control
        Barrier Function (CBF) safety envelopes. Evaluates unsafe-control-action
        rules and barrier constraints on governed actions. Implemented in
        src/gateway/governance/stpa_validator.py
        and src/gateway/governance/safety/cbf_engine.py (settlement-aware debit
        ledger in src/gateway/governance/safety/debit_ledger.py, ADR-010).
      purpose: >
        Provides formal safety analysis (STPA) and real-time safety monitoring
        (CBF) to identify and mitigate unsafe control actions from the AI
        reasoning layer. Tracks safety envelope violations, escalates to the
        symbolic governor, and generates evidence for risk assessment documentation.
      responsible-roles:
        - role-id: provider
      control-implementations:
        - uuid: "a11854f4-c67e-4674-8818-817ed8c4a09a"
          source: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home"
          description: "NIST SP 800-53 Rev 5 HIGH-baseline controls implemented by the STPA Safety Validator"
          implemented-requirements:
            - uuid: "6020e394-0647-480b-b9e5-2f05b6cb360c"
              control-id: ra-3
              description: |
                Risk assessment for governed actions combines STPA unsafe-control-action (UCA)
                rules, a control barrier function and an optional causal tier; status is
                partial. STPAValidator (src/gateway/governance/stpa_validator.py) evaluates the
                kernel's hand-written core rules (UCA-1 on write_db, UCA-7 on
                prompt_injection_check) and the active domain's compiled rules (finance:
                src/cage_finance/stpa/uca_rules.py, generated from
                src/cage_finance/config/stpa/trade_hazards.yaml) on every governed action. Rule
                inputs marked server_bound are measured or bound by the gateway
                (portfolio_total, drawdown, latency_ms, order_size, daily_vol and trader_role in
                finance; approval_token and semantic_score for the core rules); the remaining
                inputs, such as risk_assessed, compliance_checked and confidence, come from the
                caller, so rules keyed on them constrain only what the caller asserts. Control
                Barrier Functions in src/gateway/governance/safety/cbf_engine.py define the
                discrete-time safety constraint (h(S(t+1)) >= (1 - gamma) h(S(t))) and commit it
                (as well as LUA_ROLLBACK_CBF rollbacks) in one Redis Lua hop with the
                fence-epoch check, followed by Redis WAIT on the same pinned write socket via
                src/gateway/infrastructure/redis_replication.py. In reconciled mode the hop nets
                the custodian-attested scalar against the settlement-aware local-debit ledger
                (cbf:debits, cbf:debits:total in src/gateway/governance/safety/debit_ledger.py):
                debits are ledgered by debit_id when admitted, retired exactly and idempotently
                on rollback, and settled by the reconciler
                (src/gateway/governance/reconciliation/daemon.py) only up to the custodian's
                signed settled_through minus a clock-skew margin (ADR-010, POAM-2026-087); the
                reference reconciler reads a simulated ground-truth provider (see CA-7
                17537e23). The DoWhy causal gatekeeper
                (src/gateway/governance/causal/gatekeeper.py, with
                src/gateway/governance/causal/world_model_refresher.py and
                src/cage_finance/tiers/causal_tier.py) assesses model risk for execute_trade
                only when CAGE_CAUSAL_TIER_ENABLED=true. The reference Terraform leaves it off
                (causal_tier_enabled defaults to false in infra/modules/gateway/variables.tf,
                and infra/targets/gcp-gke/main.tf does not set it), so the finance plugin
                installs a disabled causal tier. When it is on, an enforcing posture requires
                CAUSAL_GATEKEEPER_STRICT_MODE=true and live telemetry credentials, the Terraform
                plan requires a telemetry Secret other than the advisor's, every causal failure
                is a HARD deny with a distinct code (CAUSAL_TELEMETRY_UNAVAILABLE,
                CAUSAL_INSUFFICIENT_SAMPLES), and synthetic telemetry is never substituted
                (POAM-2026-088). Safety parameters (thresholds, envelope bounds) are defined in
                config/governance_thresholds.json and config/safety_params.json. Hazard analysis
                is documented in docs/security/STPA_ANALYSIS.md and findings are tracked in
                docs/POAM.md.
              props:
                - name: implementation-status
                  value: partial
                - name: control-origination
                  value: system-specific
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=RA-3"
                  rel: reference
                - href: "#1c436570-b67f-4857-bbbf-d1ba683dae25"
                  rel: lula

            - uuid: "42c2150e-0256-4ef0-b49b-8a7ee847f9cc"
              control-id: si-4
              description: |
                System monitoring is partial. The CBF barrier
                (src/gateway/governance/safety/cbf_engine.py) is evaluated on every governed
                action a domain tier routes through it (finance: execute_trade state
                transitions), not on model outputs, and refuses a transition that would leave
                the safety envelope. The reconciliation daemon's discrepancy guard
                (src/gateway/governance/reconciliation/daemon.py) refuses and fences any
                custodian snapshot that moves outside the band of the gateway's own state plus
                its unsettled debits by more than max(reconciliation.discrepancy_ratio x
                |baseline|, reconciliation.discrepancy_abs_floor). The symbolic governor records
                each request's tier violations (for example fiscal limits and STPA constraints).
                The authoritative record of these events is the hash-chained evidence stream:
                every DENY writes a GOVERNANCE_REFUSAL record, a CBF rollback writes a
                CBF_ROLLBACK record, and a fence writes a RECONCILIATION_DISCREPANCY_FENCE
                record. CBF violations are also emitted as OTel span events with severity
                WARNING or CRITICAL; these are telemetry only and feed no alerting. The
                compliance bridge's evidence-age SLA monitor
                (src/compliance_bridge/sla_monitor.py) computes per-control metrics from the
                custody chain every 5 minutes and alerts through the configured notifier
                (console in the reference Terraform) when a control's evidence goes stale.
                scripts/automated_auditor.py runs only when invoked by hand; nothing schedules
                it.
              props:
                - name: implementation-status
                  value: partial
                - name: control-origination
                  value: system-specific
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=SI-4"
                  rel: reference

    # -----------------------------------------------------------------------
    # Component 6: GCP/GKE Infrastructure (inherited controls)
    # Enforces: SC-7 (Boundary Protection), IA-2 (Identification and Auth),
    #           SC-8 (Transmission Confidentiality and Integrity)
    # -----------------------------------------------------------------------
    - uuid: "3014bff4-f8df-4f9f-a957-9aab57e8f87d"
      title: "GCP/GKE Infrastructure"
      type: service
      description: >
        Google Cloud Platform / Google Kubernetes Engine infrastructure providing
        inherited security controls. Includes VPC-native GKE networking with
        private nodes and GCP Workload Identity Federation for workload
        authentication; the reference Terraform deploys no external load
        balancer or Ingress. Supplemented by Kubernetes-layer controls
        defined in infra/targets/gcp-gke/ and infra/modules/.
      purpose: >
        Provides platform-level inherited security controls that the application
        components rely upon. Network boundary protection, identity and
        authentication, and transmission encryption are inherited from the GCP
        Common Controls Package and supplemented by cluster-level Kubernetes
        network policies.
      responsible-roles:
        - role-id: provider
      control-implementations:
        - uuid: "47bd5e3c-7e9f-4006-98e8-dac390437a7e"
          source: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home"
          description: "NIST SP 800-53 Rev 5 HIGH-baseline controls inherited from GCP/GKE platform"
          implemented-requirements:
            - uuid: "2d27d190-b3da-49f4-bd39-1d4f25f5d20a"
              control-id: sc-7
              description: |
                Boundary protection combines GCP platform controls with customer-configured
                Kubernetes policy; status is partial. The GKE cluster runs on a dedicated VPC
                (module.vpc_network in infra/targets/gcp-gke/perimeter.tf), with private nodes
                in the staging and prod profiles. The reference Terraform deploys no external
                load balancer or Ingress: the gateway Service is ClusterIP
                (infra/modules/gateway/main.tf). It creates a Cloud Armor policy and can reserve
                a global address, but attaches the policy to no backend, and VPC Service
                Controls are off by default (enable_vpc_sc). NetworkPolicies in
                infra/targets/gcp-gke/network_policy.tf deny egress outside the namespace except
                DNS, allow data-store egress only to the live Memorystore and Cloud SQL endpoint
                addresses, and add per-workload egress rules and an FQDNNetworkPolicy allowlist
                for external names; they still let every pod in the namespace reach every other
                pod and define no default-deny ingress (POAM-2026-195). All workloads share one
                namespace. Pod Security Admission labels from
                infra/modules/k8s_namespace/main.tf enforce the restricted profile where
                enable_pod_security_standards is set, as the staging and prod tfvars do.
              props:
                - name: implementation-status
                  value: partial
                - name: control-origination
                  value: hybrid
                - name: inherited-from
                  value: "GCP/GKE Platform — Google Cloud Common Controls Package"
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=SC-7"
                  rel: reference

            - uuid: "ca8f96e2-69a3-4d6b-980c-962e73e075d8"
              control-id: ia-2
              description: |
                **IA-2 Identification and Authentication (Organizational Users)** is partial.

                1. **Platform (inherited and customer-configured)**: workloads that call Google
                   APIs run as their own Kubernetes service account bound 1:1 through Workload
                   Identity to a dedicated GCP service account (infra/targets/gcp-gke/iam.tf);
                   the advisor's and OPA's service accounts have no cloud identity. Human access
                   to the GKE control plane uses GCP IAM. Multi-factor authentication for those
                   users is an organization policy outside this repository, and the reference
                   Terraform configures no Identity-Aware Proxy.

                2. **Workload callers**: every gateway endpoint except health and JWKS requires
                   a Linkerd mTLS workload identity (`l5d-client-id`,
                   `<sa>.<ns>.serviceaccount.identity.linkerd.<trust-domain>`) from the
                   pod-local proxy that is listed in `CAGE_TRUSTED_CLIENT_IDENTITIES`
                   (`WorkloadIdentityMiddleware` and `extract_client_identity(scope)` in
                   src/gateway/server/workload_identity.py; see AC-3 and IA-3). X-Agent-ID and
                   X-SPIFFE-ID header parsing was removed; requests without a verified identity
                   fail closed (403/401).

                3. **Human operators on the approval path**: POST /v1/defer/{defer_id}/escalate
                   accepts only a human operator identity (require_human_operator_identity() in
                   src/compliance_bridge/auth.py):

                   a. OIDC JWT, enabled when an issuer is configured
                      (CAGE_OPERATOR_IDENTITY_ALLOW_OIDC, set by
                      infra/modules/compliance_bridge/main.tf): the signature is verified
                      against keys resolved by kid from an out-of-band key set, an https:// JWKS
                      URI in Terraform, never from the token
                      (src/compliance_bridge/oidc_verifier.py); iss, aud and exp are checked,
                      and the sub must be in CAGE_TRUSTED_OPERATOR_IDENTITIES. The principal
                      hash is the SHA-256 of the sub.

                   b. Workload identities (SVIDs, or a sub that looks like one) are refused with
                      403, and the bridge refuses to start in an enforcing posture with an empty
                      allowlist or a workload entry in it.

                   c. Dev-mode synthetic principals require CAGE_ENV=dev and
                      CAGE_OPERATOR_IDENTITY_ALLOW_DEV_SYNTHETIC=true and carry the reserved
                      urn:cage:dev: prefix; enforcing postures never yield them.

                The request body may not assert identity (DeferEscalateRequest forbids
                operator_urn, session_id and auth_method). Enforcing postures require a WebAuthn
                client_data_json bound to a 32-byte challenge_binding, and DeferQueue.approve()
                (src/gateway/governance/defer_queue.py) records the verified principal hash
                (auth_principal_hash) in each ApprovalRecord and refuses approval by the
                request's initiator.

                Open: human-only approval has not been verified on a deployed cluster
                (POAM-2026-196), and the operator identities and OIDC issuer in the committed
                tfvars are example values that an adopter replaces.
              props:
                - name: implementation-status
                  value: partial
                - name: control-origination
                  value: hybrid
                - name: inherited-from
                  value: "GCP/GKE Platform — Google Cloud Common Controls Package (workload/cluster identity)"
                - name: application-level-implementation-date
                  value: "2026-09-07"
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=IA-2"
                  rel: reference
                - href: "../../src/compliance_bridge/auth.py"
                  rel: implementation
                  text: "require_human_operator_identity() OIDC operator authentication"
                - href: "../../infra/modules/service_mesh/main.tf"
                  rel: configuration
                  text: "Linkerd mTLS SPIFFE trust domain configuration"
                - href: "../../src/compliance_bridge/oidc_verifier.py"
                  rel: implementation
                  text: "Out-of-band kid-resolved OIDC JWT verification"
                - href: "../../tests/unit/governance/test_hitl_operator_identity.py"
                  rel: test

            - uuid: "230de322-4b76-4a0d-b07d-267f4fa23769"
              control-id: sc-8
              description: |
                Transmission confidentiality and integrity combine GCP platform encryption with
                customer-configured mesh and data-store settings; status is partial. The
                reference Terraform deploys no external load balancer, Ingress, managed
                certificate or SSL policy, so it terminates no external TLS. Inside the cluster,
                Linkerd (infra/modules/service_mesh/main.tf) gives every meshed pod a 24 h
                workload certificate from an identity issuer (48 h) chained to a Google CAS
                root, so traffic between meshed pods is mutual TLS, and a
                ValidatingAdmissionPolicy refuses governance-namespace pods created without the
                proxy. Only the gateway has Linkerd Server and AuthorizationPolicy resources
                that require an authenticated mesh identity
                (infra/modules/gateway/mesh-policy/templates/policy.yaml); other workloads have
                none (POAM-2026-195). The governance Memorystore instance uses
                server-authenticated transit encryption, and the gateway, reconciler and
                compliance bridge pin its CA; the application Memorystore instance has transit
                encryption disabled; Cloud SQL accepts only encrypted connections
                (infra/modules/cloudsql_postgres/main.tf). The gateway exports OTLP to the
                in-cluster Langfuse over plain HTTP (infra/modules/gateway/main.tf), and no
                Slack or PagerDuty channel is configured.
              props:
                - name: implementation-status
                  value: partial
                - name: control-origination
                  value: hybrid
                - name: inherited-from
                  value: "GCP/GKE Platform — Google Cloud Common Controls Package"
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=SC-8"
                  rel: reference

            - uuid: "34dedd4e-aa78-4976-a329-72da887391f7"
              control-id: sc-24
              description: |
                Fail in known state for the governance state held on the governance
                Memorystore for Valkey instance (module.memorystore_governance in
                infra/targets/gcp-gke/main.tf): CBF commits, single-use consumption
                markers, deferrals, and evidence-stream records not yet in custody.
                Whenever the posture enforces (local.enforcing_posture: the prod and
                staging tiers always, dev only under a compliance flag), the instance
                runs AOF persistence with append_fsync = ALWAYS, which saves every write
                to durable storage. infra/modules/memorystore_valkey always renders
                persistence_config (DISABLED, or AOF with an explicit fsync policy), so
                persistence is never left to a provider or service default, and it
                refuses AOF without a policy and a policy without AOF. The app instance
                holds no governance state and plans an explicit DISABLED.

                Scope: persistence recovers from the loss of every node in the shard.
                A failover to a replica that missed a write is covered by the replica
                acknowledgement (WAIT) that CBF commits use, and for single-use markers
                by POAM-2026-156 item 1, not by persistence. Changing persistence_config
                updates the instance in place (nothing under it is ForceNew in the
                google provider), so applying it keeps the state the instance holds.

                Status remains partial until the AOF setting is applied to staging and
                the measured p50/p99 latency delta for marker consumption and CBF commits
                is recorded (POAM-2026-156, closure criterion 3).
              props:
                - name: implementation-status
                  value: partial
                - name: control-origination
                  value: hybrid
                - name: poam-reference
                  value: "POAM-2026-156"
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=SC-24"
                  rel: reference
                - href: "../../infra/modules/memorystore_valkey/main.tf"
                  rel: implementation
                  text: "Explicit persistence_config from validated inputs"
                - href: "../../infra/targets/gcp-gke/main.tf"
                  rel: configuration
                  text: "local.enforcing_posture selects AOF + ALWAYS on the governance instance"
                - href: "../../infra/targets/gcp-gke/tests/governance_persistence.tftest.hcl"
                  rel: test
                  text: "Mock-provider plan of every committed profile and the module's refusals"

