            - uuid: "0c2d40d7-0d19-4b9d-9afa-6c80967b31b4"
              control-id: sc-13
              description: |
                Asymmetric routing seals round-trip under every supported KMS key type
                (POAM-2026-095). generate_seal() (src/gateway/governance/routing_seal.py)
                writes the signer's JOSE algorithm (jose_alg) into the protected header
                rather than a provider label, and KMSGovernanceSigner.sign_jws()
                (src/gateway/governance/kms_signer.py) converts ECDSA DER signatures to
                the JOSE raw R||S form; providers declare their native ECDSA encoding.
                The verifier accepts only ES256/ES384/ES512 for EC keys. Seal
                verification resolves keys strictly by kid (src/gateway/governance/jwks.py):
                a seal with no kid no longer falls back to a single published key and
                fails closed.
              props:
                - name: implementation-status
                  value: implemented
                - name: control-origination
                  value: system-specific
                - name: poam-reference
                  value: "POAM-2026-095"
              links:
