    # -----------------------------------------------------------------------
    # Component 3: FTRA Irreversibility Classifier (src/gateway/governance/ftra/)
    # Enforces: SI-10 (Input Validation, by delegation), AC-3 (Access Enforcement),
    #           AC-6 (Least Privilege). Scope: docs/governance/FTRA_SCOPE.md
    # -----------------------------------------------------------------------
    - uuid: "ftra0001-4e47-bbc8-irreversibility01"
      title: "FTRA Irreversibility Classifier"
      type: software
      description: >
        Forward-Looking Trajectory Reachability Analyzer (FTRA, Tier 0.5):
        classifies each tool call against the active domain's digest-covered
        terminal registry, records the registry provenance of the classification,
        and lets a registered terminal clear without a human only inside its
        signed autonomous envelope. It validates no parameter values; value
        policy is owned by STPA UCA rules and the domain OPA policy
        (docs/governance/FTRA_SCOPE.md).
      purpose: "Irreversibility classification and autonomous-envelope gating for tool execution"
      responsible-roles:
        - role-id: provider
      control-implementations:
        - uuid: "ftra0001-ctrl-impl-8000-classifier01"
          source: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home"
          description: "NIST SP 800-53 Rev 5 HIGH-baseline controls implemented by FTRA Irreversibility Classifier"
          implemented-requirements:
            - uuid: "si100001-ftra-8000-classifier00001"
              control-id: si-10
              description: |
                FTRA (Tier 0.5) classifies each tool call against the digest-covered terminal
                registry (src/gateway/governance/ftra/classifier.py) and routes irreversible or
                unregistered actions to human review; a registered terminal clears autonomously
                only inside its autonomous envelope with a known, finite, positive magnitude
                (src/gateway/governance/ftra/autonomy.py). FTRA validates no parameter values;
                status is partial because the checks that do are only partly independent of the
                caller. Parameter values are checked by the STPA UCA rules
                (src/cage_finance/stpa/uca_rules.py) and the domain OPA policy
                (src/cage_finance/opa/trade_governance.rego). Only inputs marked server_bound
                (in finance: portfolio_total, drawdown, latency_ms, order_size, daily_vol and
                trader_role; src/cage_finance/config/stpa/trade_hazards.yaml) are measured or
                bound by the gateway; other UCA inputs, such as risk_assessed,
                compliance_checked and confidence, are taken from the caller. The OPA policy
                runs in an OPA whose REST API takes no authentication (POAM-2026-195). Prompt
                injection is screened by the deterministic Stage 1 keyword scan (ac_keyword_scan
                in src/gateway/governance/text_filter.py) in the governed advisor's LangGraph
                input rail and in the gateway's inference proxy, which the reference
                deployment's advisor does not call (see 8e46d991); at the action boundary the
                gateway's server-input binding inspects every governed action's string
                parameters and denies the action on a detection
                (src/gateway/governance/governor/server_inputs.py). UCA-7 is enforced on the
                Python STPA path for the prompt_injection_check action:
                PromptInjectionInputResolver (src/gateway/governance/governor/server_inputs.py)
                strips any caller-supplied semantic_score and recomputes it from deterministic
                server-side inspection, and _check_core_uca_7
                (src/gateway/governance/stpa_validator.py) denies a missing score or one above
                the UCA's threshold. The optional NeMo Colang rails add LLM-backed screening
                only when CAGE_NEMO_ENABLED=true. Before parking a REQUIRE_APPROVAL token for
                human review, run_pipeline() previews every claiming phase-2 mutating barrier
                side-effect-free (Phase2Mode.PREVIEW / _preview_mutating in
                src/gateway/governance/governor/pipeline.py): a HARD barrier breach (such as
                CBF_BARRIER_VIOLATED) denies the request before a human reviewer is paged
                (hard_preview_denies_before_hitl in proof/model.py), while a NARROWABLE barrier
                breach (such as FISCAL_LIMIT_EXCEEDED) records barrier_preview=FAIL and
                barrier_preview_violations with Violation.bound
                (src/gateway/governance/contracts.py) on the DeferToken snapshot without holding
                a Redis reservation across human review time (PREVIEW_IS_PURE,
                tests/governor/test_cbf_preview_purity.py). Multi-critic consensus evaluation in
                src/gateway/governance/consensus/engine.py parses critic votes strictly
                (_parse_critic_vote), allowlists per-critic context_keys, delimits parameters as
                RFC 8785 canonical JSON (<params_json>...</params_json>), and pins the gateway
                prompt fields (role, action, action_type, magnitude) so untrusted agent
                parameters cannot override critic instructions (POAM-2026-081); the reference
                Terraform leaves the critics off (CAGE_CONSENSUS_CRITICS_ENABLED=false). The
                FTRA terminal registry's manifest_sha256 (registry_digest in
                src/gateway/governance/ftra/classifier.py) covers the autonomous_envelope
                together with the terminals, so an edited ceiling fails the load-time integrity
                check, and an envelope without a digest, or with a non-finite, non-positive or
                malformed max_magnitude, refuses to load. The digest is unkeyed and stored in
                the same file; out-of-band tamper resistance needs FTRA_EXPECTED_MANIFEST_SHA256
                or the CI stpa-freshness-check, and no Terraform profile sets that pin.
              props:
                - name: implementation-status
                  value: partial
                - name: control-origination
                  value: system-specific
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=SI-10"
                  rel: reference
                - href: "../../tests/test_ftra_conditional_clearance.py"
                  rel: test
                  text: "Envelope clearance, digest coverage and refusal to load malformed envelopes"
                - href: "../../tests/test_server_inputs.py"
                  rel: test
                  text: "Server-bound inputs and UCA-7 semantic_score recomputation"

            - uuid: "ac030001-ftra-8000-envelope000001"
              control-id: ac-3
              description: |
                FTRA boundary enforcement (src/gateway/governance/governor/stages/ftra.py)
                classifies every action against the active domain's digest-covered terminal
                registry and names the provenance of the decision
                (FtraBoundaryResult.from_classification in
                src/gateway/governance/ftra/models.py): FTRA_REGISTERED_IRREVERSIBLE,
                FTRA_REGISTERED_EXTERNALLY_REVERSIBLE, FTRA_UNREGISTERED_ACTION and
                FTRA_REGISTRY_ENTRY_INVALID require human approval, except that a registered
                terminal inside its autonomous envelope clears without one (AC-6);
                FTRA_REGISTRY_UNAVAILABLE (unreadable registry) is a HARD deny. Pre-flight
                validation (SymbolicGovernor.validate_action in
                src/gateway/governance/governor/governor.py) runs under Profile.DRY_RUN, mints
                no seal, and parks REQUIRE_APPROVAL verdicts as DeferReason.HITL_REQUIRED tokens
                in DeferQueue, returning deferred_id. Only distinct human operators
                authenticated by OIDC can approve a token, through POST
                /v1/defer/{defer_id}/escalate on the compliance bridge (AC-3, IA-2); dev-mode
                synthetic approvers need CAGE_ENV=dev and an explicit opt-in. A single
                committing run executes per trade: execute_trade_action(..., deferred_id=...)
                invokes SymbolicGovernor.revalidate_post_hitl() under Profile.POST_HITL, which
                decides first and spends second: a clean run spends the approval atomically
                (DeferQueue.consume_approval()) before the seal is minted, a DENY spends it, and
                a warrant-ineligible DEFER leaves it redeemable. The stages each profile runs
                are fixed by stage_runs_under in src/gateway/governance/governor/pipeline.py and
                mirrored in proof/model.py. Any narrow_hint / narrowed_params attached to
                REQUIRE_APPROVAL is advisory, dry-run re-verified before surfacing
                (_reverified_narrow_hint) and re-verified in full by the committing run
                (_sealed_narrow with issue_narrow_receipt inside ReservationScope).
              props:
                - name: implementation-status
                  value: partial
                - name: control-origination
                  value: system-specific
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=AC-3"
                  rel: reference
                - href: "../../tests/governor/stages/test_ftra_stage.py"
                  rel: test
                - href: "../../tests/test_ftra_conditional_clearance.py"
                  rel: test
                  text: "Provenance codes, unavailable registry is HARD, unregistered never clears"
                - href: "../../tests/governor/test_post_hitl_approval_spend.py"
                  rel: test
                  text: "Approval spent once by the committing run; DEFER leaves it redeemable"
                - href: "../../tests/unit/governance/test_hitl_operator_identity.py"
                  rel: test
                  text: "Only allowlisted human OIDC operators can approve"

            - uuid: "ac060001-ftra-8000-envelope000001"
              control-id: ac-6
              description: |
                Least privilege for autonomous action: a registered terminal may proceed without a
                human only inside the autonomous_envelope its domain registry grants it
                (src/gateway/governance/ftra/autonomy.py, conditional_clear_reason): a known
                magnitude with 0 < magnitude <= max_magnitude (finance: 10,000 for execute_trade
                and execute_trade_bounded) and agent confidence >= confidence.agent_threshold. Unregistered
                actions, unreadable registries, missing or raising magnitude extractors and
                unknown magnitudes never clear. The same predicate governs plan reachability
                (src/gateway/governance/ftra/graph_analyzer.py).
              props:
                - name: implementation-status
                  value: implemented
                - name: control-origination
                  value: system-specific
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=AC-6"
                  rel: reference
                - href: "../../tests/test_ftra_conditional_clearance.py"
                  rel: test
                  text: "Envelope clearance, never clears outside its conditions, plan analyzer uses the same predicate"

    # -----------------------------------------------------------------------
    # Component 4: OPA Policy Engine (src/cage_finance/opa/trade_governance.rego)
    # Enforces: AC-6 (Least Privilege), AC-3 (Access Enforcement),
    #           IA-3 (Device Identification and Authentication)
    # -----------------------------------------------------------------------
    - uuid: "0ea79813-1236-4a81-a077-71638e3f8627"
      title: "OPA Policy Engine"
      type: software
      description: >
        Open Policy Agent evaluating the active domain's Rego policy (finance:
        src/cage_finance/opa/trade_governance.rego) as a stage of the governor
        pipeline for every action submitted to the governor. Enforces
        role-graduated trade limits and asset rules. The reference Terraform runs
        OPA without a decision-log configuration and without REST API
        authentication (POAM-2026-195).
      purpose: >
        Provides deterministic, auditable policy enforcement independent of the
        LLM reasoning layer. Least-privilege access and RBAC are enforced via
        declarative Rego rules. Caller workload authentication happens before
        the policy layer, by Linkerd mTLS identity at the gateway.
      responsible-roles:
        - role-id: provider
      control-implementations:
        - uuid: "74b69ba2-d9a3-42d6-ac2d-89e9f88cc2e6"
          source: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home"
          description: "NIST SP 800-53 Rev 5 HIGH-baseline controls implemented by OPA"
          implemented-requirements:
            - uuid: "d3a6a007-74a4-4c0f-b2ba-d68bb2c395ff"
              control-id: ac-6
              description: |
                Least privilege for trading is enforced by the active domain's OPA policy,
                src/cage_finance/opa/trade_governance.rego, which Terraform loads into the
                in-cluster OPA (infra/targets/gcp-gke/main.tf) and the governor's OPA stage
                queries for every action submitted to the governor. It defines two roles: junior
                traders are allowed up to $5,000 per trade, routed to manual review up to
                $10,000 and denied above; senior traders are allowed up to $500,000, routed to
                manual review up to $1,000,000 and denied above. A missing or unknown role is
                denied for every action except market_analysis. The gateway binds trader_role
                server-side from the caller's verified mesh identity (TraderRoleBindings in
                src/cage_finance/tools/trader_binding.py, configured by
                CAGE_TRADER_ROLE_BINDINGS); the caller cannot name its own role, and with no
                bindings configured, as in the reference Terraform, every verified identity is
                junior. Status is partial: OPA's REST API takes no authentication and has no
                Linkerd Server policy, so another pod in the namespace could replace the loaded
                policy (POAM-2026-195).

                Workload least privilege: each workload runs as its own Kubernetes service
                account; those that call Google APIs are bound 1:1 to their own GCP service
                account (infra/targets/gcp-gke/iam.tf), and the advisor and OPA have no cloud
                identity. The advisor, model-serving (vLLM), telemetry and UI workloads hold no
                KMS signer role; only the gateway signs with gateway-seal
                (infra/targets/gcp-gke/kms_signing.tf; POAM-2026-079 closed), and
                tests/infrastructure/test_workload_identity_partition.py fails the build if a
                KMS role is granted at keyring or project scope.
              props:
                - name: implementation-status
                  value: partial
                - name: control-origination
                  value: system-specific
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=AC-6"
                  rel: reference
                - href: "../../src/cage_finance/opa/trade_governance.rego"
                  rel: implementation
                  text: "Role-graduated trade limits"
                - href: "../../src/cage_finance/tools/trader_binding.py"
                  rel: implementation
                  text: "Server-side trader_role binding from verified identity"
                - href: "../../tests/cage_finance/test_trader_binding.py"
                  rel: test
                - href: "../../tests/infrastructure/test_workload_identity_partition.py"
                  rel: test

            - uuid: "f919c0a0-f04d-4925-8605-6a759f9ee94e"
              control-id: ac-3
              description: |
                Access enforcement decisions on governed actions come from the governor's OPA
                stage (src/gateway/governance/governor/stages/opa.py), which queries the active
                domain's package (finance: src/cage_finance/opa/trade_governance.rego); an OPA
                DENY or an OPA failure is a HARD violation and the action is refused. The audit
                trail of a refusal is the hash-chained evidence stream: handle_deny() builds a
                refusal receipt naming the violated tier and violation codes and commits it as a
                GOVERNANCE_REFUSAL record (publish_refusal in
                src/gateway/governance/governor/verdicts.py), blocking under
                EVIDENCE_CHAIN_BLOCKING=true, which Terraform sets. POST
                /governance/validate-action returns HTTP 403 with the violations and the
                receipt's proof_hash, or 503 when the record cannot be committed. The compliance
                bridge re-verifies, KMS-signs and archives these records (see AU-9 and AU-10).
                OPA itself keeps no decision log (Terraform runs it without a config file;
                infra/modules/opa_policy/main.tf), and nothing ingests OPA decision logs. Status
                is partial: live verification of evidence custody is pending (POAM-2026-084),
                and OPA's REST API takes no authentication (POAM-2026-195).
              props:
                - name: implementation-status
                  value: partial
                - name: control-origination
                  value: system-specific
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=AC-3"
                  rel: reference
                - href: "#a08c55f1-6d12-445d-b4ae-a99c8b573935"
                  rel: lula
                - href: "../../src/gateway/governance/governor/verdicts.py"
                  rel: implementation
                  text: "handle_deny() and publish_refusal()"
                - href: "../../tests/test_refusal_receipt_ingestion.py"
                  rel: test

            - uuid: "5f386745-cdda-431b-adec-850cdd899f3e"
              control-id: ia-3
              description: |
                **IA-3 Device Identification and Authentication** uses Linkerd mTLS workload
                identity; status is partial.

                1. **Linkerd identity** (infra/modules/service_mesh/main.tf): every meshed pod
                   gets a 24 h workload certificate from an identity issuer (48 h, renewed by
                   cert-manager) chained to a Google CAS root, and a ValidatingAdmissionPolicy
                   refuses governance-namespace pods created without the proxy. Traffic between
                   meshed pods is mutual TLS. The inbound proxy sets `l5d-client-id` to the
                   caller's verified identity
                   (`<sa>.<ns>.serviceaccount.identity.linkerd.<trust-domain>`) or removes it.

                2. **Gateway ingress** (POAM-2026-080): `WorkloadIdentityMiddleware` and
                   `extract_client_identity(scope)` (src/gateway/server/workload_identity.py)
                   trust `l5d-client-id` only on a pod-local connection (the TCP peer is the
                   pod's own non-loopback IP; loopback peers such as kubectl port-forward are
                   refused), check its syntax, and admit only identities in
                   `CAGE_TRUSTED_CLIENT_IDENTITIES`, which is required in every environment.
                   Requests without a verified identity fail closed (401/403). The gateway's
                   mesh policy chart (infra/modules/gateway/mesh-policy/templates/policy.yaml)
                   admits only the trusted identities on gated routes at the mesh layer. The
                   former HMAC request seal (CAGE_ROUTING_SEAL_SECRET) is removed.

                3. **Compliance bridge** (src/compliance_bridge/auth.py): `l5d-client-id` is
                   accepted only from a pod-local connection (401 otherwise) and converted to a
                   canonical spiffe:// URI; the client-controllable x-cage-source-principal
                   header is never accepted as an identity. POST /v1/infra/events and POST
                   /v1/audit/ingest derive the producer from that verified identity and admit
                   only allowlisted producers. The approval path (POST
                   /v1/defer/{defer_id}/escalate) refuses workload identities and requires a
                   human OIDC identity (IA-2), so a workload certificate never authenticates a
                   human approver.

                BREAKING CHANGE (2026-09-22): Removed X-Agent-ID and X-SPIFFE-ID header parsing.
                All requests must present a verified Linkerd mTLS workload identity.
                Anonymous/unauthenticated requests fail closed (403/401).

                Open: only the gateway has Linkerd Server and AuthorizationPolicy resources;
                OPA, NeMo and the compliance bridge have none, and OPA's REST API takes no
                authentication (POAM-2026-195, POAM-2026-080). CI's mesh-conformance job
                exercises the gateway chart and image on kind with stock Linkerd
                (tests/integration/test_linkerd_mesh_conformance.py); the checks have not been
                run on a deployed, CAS-rooted cluster (POAM-2026-167).
              props:
                - name: implementation-status
                  value: partial
                - name: control-origination
                  value: system-specific
                - name: operator-path-extension-date
                  value: "2026-09-07"
                - name: spiffe-enforcement-date
                  value: "2026-09-22"
                - name: breaking-change
                  value: "removed X-Agent-ID and X-SPIFFE-ID header parsing; mTLS client certificate required"
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=IA-3"
                  rel: reference
                - href: "../../src/gateway/server/workload_identity.py"
                  rel: implementation
                  text: "Gateway workload identity enforcement and extraction (WorkloadIdentityMiddleware, extract_client_identity)"
                - href: "../../infra/modules/gateway/mesh-policy/templates/policy.yaml"
                  rel: configuration
                  text: "Linkerd SPIFFE trust domain and gateway mTLS authorization policy"
                - href: "../../src/compliance_bridge/auth.py"
                  rel: implementation
                  text: "Pod-local l5d-client-id check, producer mesh identity, human-only approval path"
                - href: "../../tests/test_inference_proxy_extended.py"
                  rel: test
                  text: "SPIFFE enforcement and fail-closed device authentication tests"
                - href: "../../tests/test_workload_identity_middleware.py"
                  rel: test
                - href: "../../tests/integration/test_linkerd_mesh_conformance.py"
                  rel: test
                  text: "kind + stock Linkerd: chart rendering, untrusted identity and forged header refused"

    # -----------------------------------------------------------------------
    # Component 4: Compliance Bridge (src/compliance_bridge/)
    # Enforces: CA-7 (Continuous Monitoring), AU-9 / AU-9(3) (Protection of Audit
    #           Info), AU-10 (Non-Repudiation), IR-6 (Incident Reporting)
    # -----------------------------------------------------------------------
    - uuid: "7acccab0-36a0-45d3-adbe-cf31d6cec458"
      title: "Compliance Bridge"
      type: software
      description: >
        Compliance service and evidence custodian: it re-verifies the gateway's
        evidence chain, KMS-signs each batch and archives it to a retention-locked
        WORM bucket, records Lula results and infrastructure events on hash chains,
        monitors evidence age, and reports through a configurable notifier
        (console in the reference Terraform) and an SSE event stream.
      purpose: >
        Operationalizes continuous compliance monitoring by automating the
        collect-analyze-report cycle. Protects audit integrity through object
        storage with locking. Raises alerts when a control's evidence exceeds its
        SLA age.
      responsible-roles:
        - role-id: provider
      props:
        - name: cer-disclosure-capability
          value: "true"
        - name: cer-hash-algorithms
          value: "SHA-256, SHA-512"
        - name: cer-disclosure-postures
          value: "PUBLIC, PRIVATE, EMBARGO"
      control-implementations:
        - uuid: "43e1c175-3c01-4176-9cf2-8de2549c876d"
          source: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home"
          description: "NIST SP 800-53 Rev 5 HIGH-baseline controls implemented by the Compliance Bridge"
          implemented-requirements:
            - uuid: "356c3f20-ff82-4a9e-9b62-83c0aa240df1"
              control-id: ca-7
              description: |
                Continuous monitoring in the compliance bridge is partial.
                - In-cluster Lula auditor: Terraform deploys a CronJob
                  (infra/modules/lula_cron/main.tf, on by default, every 15 minutes by default)
                  that runs lula validate on every manifest in compliance/lula/ not marked `#
                  cage-status: planned` and posts a pass/fail summary to POST /v1/infra/events,
                  which records it on the INFRA hash chain under the auditor's verified mesh
                  identity. Of the linked manifests, lula-validation-ra5.yaml is planned, and
                  lula-validation-cm6.yaml is active but checks for a ConfigMap nothing creates
                  (POAM-2026-151), so the auditor's summary cannot report a full pass until it
                  is repointed.
                - Evidence age: the bridge lifespan runs the SLA monitor
                  (src/compliance_bridge/sla_monitor.py) every 5 minutes over per-control
                  metrics computed from the custody chain (src/compliance_bridge/metrics.py) and
                  alerts through the configured notifier when a control's newest evidence
                  exceeds its SLA.
                - Custody verification: CustodyVerifier re-verifies archived evidence batches on
                  a schedule (see AU-10).
                - Lula results ingestion: src/compliance_bridge/audit_workflow.py processes
                  OSCAL results submitted to POST /v1/audit/ingest by an allowlisted Lula mesh
                  identity. It stores the raw YAML, parses findings, appends them to a SHA-256
                  hash-chained ContextAccumulator, scores them in the Langfuse compliance
                  project, alerts on FAIL findings for critical controls, and, with a model
                  backend configured, drafts a remediation advisory for human review. The
                  Terraform CronJob does not submit to this endpoint.
                - Status events stream to dashboards over SSE
                  (src/compliance_bridge/sse_events.py).
                - Formal-model conformance: every governor decision and actuation emits a
                  GOVERNANCE_TRACE evidence event (src/gateway/governance/governor/trace.py),
                  and scripts/check_trace_conformance.py checks an exported stream against
                  proof/model.py (reachability, seal-before-execution, single-use seals). CI's
                  quickstart-smoke job runs it against a Docker Compose stack's evidence stream;
                  nothing runs it against a deployed cluster.
              props:
