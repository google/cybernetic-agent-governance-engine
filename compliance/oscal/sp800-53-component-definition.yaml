            - uuid: "61c43f8a-6693-4049-ae09-edd8b22f500a"
              control-id: sc-12
              description: |
                Signing keys are established in Cloud KMS by Terraform
                (infra/targets/gcp-gke/kms_signing.tf) on a dedicated signing keyring
                separate from the symmetric CMEK keyring (infra/modules/kms/main.tf): one
                asymmetric EC_SIGN_P256_SHA256 key per signer (gateway-seal via
                KMS_GOVERNANCE_KEY, reconciler-snapshot via RECONCILER_KMS_KEY,
                compliance-evidence via EVIDENCE_KMS_KEY, benchmark-signing),
                HSM-protected outside dev postures. Private keys never leave KMS. Each
                key has an authoritative key-level IAM policy granting
                roles/cloudkms.signer to its owning workload's GCP service account only;
                verifiers receive roles/cloudkms.publicKeyViewer. No KMS role is granted
                at keyring or project scope, and a static guard
                (tests/infrastructure/test_workload_identity_partition.py) fails the
                build if one is added.

                The HMAC-SHA256 seal fallback keyed by GOVERNANCE_SALT
                (src/gateway/governance/routing_seal.py) is a dev-posture fallback only;
                enforcing postures refuse it at startup via assert_production_posture()
                (src/gateway/governance/governor/posture.py), which receives kms_signing_mode
                from KMSGovernanceSigner during bootstrap_governor()
                (src/gateway/governance/governor/bootstrap.py) and exits 1 unless
                kms_signing_mode == "strict", and it is not evidence for this
                control. The former HMAC ingress secret (CAGE_ROUTING_SEAL_SECRET) is
                retired (POAM-2026-080 closed). The advisor has zero KMS signer bindings
                and zero seal secrets (POAM-2026-079 closed). All KMS provider RPCs
                (GCPKMSProvider, AWSKMSProvider, AzureKMSProvider) enforce explicit
                connect/read/RPC deadlines (CAGE_KMS_RPC_TIMEOUT_SECONDS /
                CAGE_KMS_SIGN_TIMEOUT_SECONDS, default 5.0 s) and execute off the
                asyncio event loop on a dedicated worker pool (cage-kms) bounded by
                CAGE_KMS_MAX_CONCURRENCY (default 16).
              props:
                - name: implementation-status
                  value: implemented
                - name: control-origination
                  value: system-specific
              links:
