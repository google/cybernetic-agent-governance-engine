                only: the asymmetric signing keys in infra/targets/gcp-gke/kms_signing.tf
                (gateway-seal, reconciler-snapshot, compliance-evidence, benchmark-signing) and
                the CMEK key ring, for which a plan-time precondition in
                infra/modules/kms/main.tf refuses us-central1 for EU_ECB and APAC_MAS. The
                signing keys have no rotation period. docs/operations/KEY_ROTATION.md describes
                an illustrative manual 90-day rotation with JWKS overlap and an emergency
                revocation runbook; nothing records or checks that a rotation took place.
                Verifiers resolve keys strictly by kid (src/gateway/governance/jwks.py), so a
                seal without a kid, or whose kid matches no published key, fails verification.
                The HMAC routing-seal secret is retired; HMAC remains only as a dev-posture seal
                fallback that enforcing postures refuse at startup (see SC-12).
