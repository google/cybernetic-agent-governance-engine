# OSCAL Component Definition
# Cybernetic Governance Engine — NIST SP 800-53 Rev 5 HIGH Baseline
#
# This file maps the top 15 SP 800-53 HIGH-baseline controls to the
# technical components that enforce them. It complements the ISO 42001
# component definition (component-definition.yaml).
#
# Used by: lula validate --input compliance/oscal/sp800-53-component-definition.yaml
# Companion: compliance/oscal/component-definition.yaml (ISO 42001 controls)
# SSP Reference: compliance/ssp/SYSTEM_SECURITY_PLAN_OUTLINE.md
# Categorization: compliance/categorization/FIPS199_CATEGORIZATION.md

component-definition:
  uuid: "172cb046-96dc-47bb-9209-38ec37dbd579"
  metadata:
    title: "Cybernetic Governance Engine — NIST SP 800-53 Rev 5 Component Definition"
    version: "1.0.0"
    oscal-version: "1.0.4"
    last-modified: "2026-10-25T23:30:57Z"
    remarks: >
      This component definition maps technical enforcement components to
      NIST SP 800-53 Rev 5 HIGH-baseline controls. Each implemented requirement
      links where applicable to a Lula validation manifest for automated
      continuous compliance assessment. Satisfies CA-2 (Security Assessment)
      and PL-2 (System Security Plan) documentation requirements.

  components:
    # -----------------------------------------------------------------------
    # Component 1: Governance Gateway (src/gateway/)
    # Enforces: AC-3 (Access Enforcement), AU-12 (Audit Record Generation),
    #           SC-12 (Cryptographic Key Establishment)
    # -----------------------------------------------------------------------
    - uuid: "56654b26-d648-4e47-bbc8-19edd3ec67ba"
      title: "Governance Gateway"
      type: software
      description: >
        Python FastAPI gateway providing deny-by-default ingress authentication
        by Linkerd mTLS workload identity (src/gateway/server/workload_identity.py).
        It runs the governance pipeline (FTRA, STPA, the domain OPA policy and
        domain tiers) on governed actions, records each decision in a hash-chained
        evidence stream, and binds each KMS-signed routing seal to its committed
        evidence record.
      purpose: >
        Acts as the primary enforcement layer for governed agent actions.
        Enforces access control on those actions, records every governance
        decision as hash-chained evidence (ISO 42001 attributes are also stamped
        on its telemetry spans), and admits only callers whose mesh-verified
        workload identity is trusted.
      responsible-roles:
        - role-id: provider
      control-implementations:
        - uuid: "6f075699-75de-4f31-a574-35bb22a194bd"
          source: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home"
          description: "NIST SP 800-53 Rev 5 HIGH-baseline controls implemented by the Governance Gateway"
          implemented-requirements:
            - uuid: "12e40b44-a5eb-4e0d-b319-42bab7d5d10a"
              control-id: ac-3
              description: |
                AC-3 (Access Enforcement) is implemented in three layers. Status is partial
                until the open items listed at the end are closed.

                1. Workload identity at the gateway and the mesh: before any handler runs,
                   WorkloadIdentityMiddleware and extract_client_identity(scope)
                   (src/gateway/server/workload_identity.py) reject with 401/403 every request
                   outside an exact open-path list (health and JWKS paths only; no prefixes;
                   /metrics is served on port 9090, not 8080) unless its Linkerd l5d-client-id
                   (<sa>.<ns>.serviceaccount.identity.linkerd.<trust-domain>):
                   - is present as a single header,
                   - arrives on a pod-local connection (is_pod_local_connection: the TCP peer is
                     the pod's own non-loopback IP, which only the pod's Linkerd inbound proxy
                     uses; loopback peers, including kubectl port-forward, are refused),
                   - matches Linkerd workload identity syntax, and
                   - is listed in CAGE_TRUSTED_CLIENT_IDENTITIES, which is required in every
                     environment; Terraform lists only the advisor's identity
                     (infra/targets/gcp-gke/main.tf).
                   A ValidatingAdmissionPolicy (infra/modules/service_mesh/main.tf) refuses
                   governance-namespace pods created without the Linkerd proxy. The gateway's
                   Linkerd Server, HTTPRoute, AuthorizationPolicy and MeshTLSAuthentication
                   resources (infra/modules/gateway/mesh-policy/templates/policy.yaml, installed
                   by infra/modules/gateway/main.tf) admit only those identities on gated
                   routes. CI's mesh-conformance job renders that chart on kind with stock
                   Linkerd (not the CAS-rooted install), boots the gateway image, and checks
                   that an untrusted service account and a port-forwarded request carrying a
                   forged l5d-client-id are refused on a gated route
                   (tests/integration/test_linkerd_mesh_conformance.py). Header-based identity
                   (X-Agent-ID, X-SPIFFE-ID) and anonymous fallback were removed.

                2. Policy enforcement on governed actions: every action submitted to the
                   governor runs the FTRA, STPA and OPA stages
                   (src/gateway/governance/governor/pipeline.py), and an action a domain tier
                   claims also runs that domain's tiers. The OPA stage
                   (src/gateway/governance/governor/stages/opa.py) queries the active domain's
                   package, which Terraform loads into the in-cluster OPA from
                   src/cage_<domain>/opa/ (finance: src/cage_finance/opa/trade_governance.rego);
                   an OPA DENY or an OPA failure is a HARD violation. FTRA sends an action
                   absent from the domain's terminal registry to human approval
                   (FTRA_UNREGISTERED_ACTION), and assemble_governor()
                   (src/gateway/governance/governor/assembly.py) refuses to start when an
                   IRREVERSIBLE_TERMINAL action in the registry is claimed by no tier. With
                   EVIDENCE_CHAIN_BLOCKING=true (Terraform's setting), a DENY is returned only
                   after its GOVERNANCE_REFUSAL record is committed to the hash-chained evidence
                   stream (see AU-12).

                3. Dual-control approval and single-commit binding:
                   - Human approval: POST /v1/defer/{defer_id}/escalate
                     (src/compliance_bridge/main.py) authenticates the approver with
                     require_human_operator_identity() (src/compliance_bridge/auth.py): an OIDC
                     JWT verified against out-of-band, kid-resolved keys
                     (src/compliance_bridge/oidc_verifier.py) whose sub must be in
                     CAGE_TRUSTED_OPERATOR_IDENTITIES. Workload SVIDs are refused with 403. The
                     bridge refuses to start in an enforcing posture when the allowlist is empty
                     or holds a workload identity, and the Terraform plan refuses the same
                     (infra/modules/compliance_bridge/main.tf). Enforcing postures require each
                     approval to carry a WebAuthn client_data_json bound to a 32-byte
                     challenge_binding. /v1/defer/{defer_id}/inject requires the internal token,
                     which Terraform stores only in the compliance bridge's own Secret
                     (infra/modules/app_secrets/main.tf); it refuses quorum-3 reasons and
                     partially approved tokens and never produces a redeemable approval.
                   - Quorum: DeferQueue.approve() (src/gateway/governance/defer_queue.py)
                     requires distinct approver_urn values under WATCH/MULTI/EXEC (a repeat is
                     ALREADY_APPROVED) and refuses approval by the token's initiator_urn, which
                     _park_defer_context() takes from the verified caller identity when one is
                     present. Required quorum follows the defer_reason: 3 for
                     FTRA_IRREVERSIBLE_TERMINAL, EXTERNAL_VALIDATION, EXTERNAL_HOLD and
                     WARRANT_INELIGIBLE, 2 for all others.
                   - Approval binding: approve() stamps each ApprovalRecord with the token's
                     barrier snapshot (approved_barrier_preview); consume_approval() refuses
                     approvals bound to a different snapshot, and
                     SymbolicGovernor.revalidate_post_hitl() refuses the committing run with
                     [APPROVAL_CONTEXT_DRIFT] when barriers that passed at approval now refuse,
                     and mints no seal (tests/test_trade_governance_e2e.py).
                   - Single commit: SymbolicGovernor.validate_action()
                     (src/gateway/governance/governor/governor.py) runs under Profile.DRY_RUN,
                     mints no seal, and parks REQUIRE_APPROVAL verdicts as
                     DeferReason.HITL_REQUIRED tokens. execute_trade_action(...,
                     deferred_id=...) (src/cage_finance/tools/tool_provider.py) is the only
                     committing path: enforce_approved_governance()
                     (src/gateway/server/governance_middleware.py) checks the approved token
                     without spending it (DeferQueue.redeemable_approval()), and
                     revalidate_post_hitl() decides first and spends second: a clean run spends
                     the approval with a RESOLVED to CONSUMED compare-and-set before the seal is
                     minted, so concurrent redemptions seal at most once; a DENY spends it; a
                     warrant-ineligible DEFER leaves it redeemable. When narrowing is enabled, a
                     narrow_hint is dry-run re-verified before it is surfaced
                     (_reverified_narrow_hint) and re-verified in full by the committing run
                     (_sealed_narrow with issue_narrow_receipt in
                     src/gateway/governance/narrow_receipt.py, inside ReservationScope).

                Open: OPA's REST API takes no authentication, and only the gateway has Linkerd
                Server and AuthorizationPolicy resources, so another pod in the namespace can
                call OPA or replace its policy (POAM-2026-195, POAM-2026-080). The pod-local
                identity check and human-only approval have not been verified on a deployed
                cluster (POAM-2026-167, POAM-2026-196). The operator identities and OIDC issuer
                in the committed tfvars are example values that an adopter replaces.
              props:
                - name: implementation-status
                  value: partial
                - name: control-origination
                  value: system-specific
                - name: dual-control-implementation-date
