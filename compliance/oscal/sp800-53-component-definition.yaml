            - uuid: "4ccc6861-3f69-476a-9ff2-cbd215b18d46"
              control-id: au-12
              description: |
                Audit record generation has one authoritative record and two telemetry channels.
                Status is partial until custody of the record is verified on a deployed cluster
                (POAM-2026-084).

                1. AUTHORITATIVE RECORD (hash-chained evidence stream): the gateway's
                   EvidenceStreamSink (src/gateway/governance/evidence/stream.py) appends
                   governance decisions, refusals, deferrals, settlements and actuation receipts
                   to a Redis Stream on the governance Memorystore instance; each record is RFC
                   8785 JCS-canonicalized (jcs_canonicalize_plan) and linked to its predecessor
                   by SHA-256 (record_hash, prev_hash). EVIDENCE_CHAIN_BLOCKING defaults to true
                   and Terraform sets it (infra/modules/gateway/main.tf); an enforcing posture
                   refuses to start with it off unless CAGE_ALLOW_NONBLOCKING_PROD=true. With it
                   on:
                   - generate_seal_with_evidence() (src/gateway/governance/routing_seal.py)
                     mints a routing seal only after the decision's evidence record is
                     committed, binds that record_hash into the seal, and raises
                     EvidenceChainUnavailableError (no seal) when the commit fails;
                   - publish_refusal() and publish_deferral()
                     (src/gateway/governance/governor/verdicts.py) commit GOVERNANCE_REFUSAL and
                     GOVERNANCE_DEFERRAL records synchronously through
                     commit_decision_evidence(). A failed write logs at ERROR, increments
                     cage_governance_evidence_publish_failures_total{kind}
                     (src/gateway/governance/governor/metrics.py) and fails the request (HTTP
                     503 on POST /governance/validate-action and POST /tools/execute); a
                     deferral whose record fails is unparked.
                   The compliance bridge's EvidenceCustodian re-verifies the chain, KMS-signs
                   each batch and writes it to the retention-locked WORM bucket, and
                   CustodyVerifier re-verifies the archive on a schedule (see AU-9, AU-9(3) and
                   AU-10). Decisions use the five-value vocabulary ALLOW, DENY, DEFER, NARROW
                   and REQUIRE_APPROVAL (GovernanceDecision in
                   src/gateway/governance/decisions.py); PAUSE was removed and a transient fault
                   is a DENY with a refusal receipt.

                2. WARRANT RELIANCE: when a region marks a norm requires_warrant, the
                   RelianceRecord for each warranted norm
                   (src/gateway/governance/warrant/reliance.py) is bound into the decision's
                   evidence record (see AU-10). No Terraform profile configures a warrant source
                   (CAGE_WARRANT_SOURCE), and the US_FED and APAC_MAS baselines declare no
                   warranted norm, so the reference deployment writes no reliance records.

                3. DECISION-TIME TELEMETRY (non-authoritative): the gateway exports OTel spans
                   over OTLP to the in-cluster Langfuse
                   (src/gateway/infrastructure/telemetry.py), and stamp_iso_control()
                   (src/gateway/governance/iso_control.py) adds the iso42001.control,
                   ingress_stage, outcome, timestamp, gateway_version and evidence_chain
                   attributes. The gateway uses its own telemetry key pair, kept out of the
                   advisor's Secret (infra/modules/gateway/main.tf). Spans are operational
                   telemetry, not evidence for this control: they are not hash-chained or
                   retention-locked, and nothing reconciles them against the evidence stream.

                4. OPERATIONAL METRICS: the gateway serves Prometheus metrics on
                   CAGE_METRICS_PORT (9090) from a daemon thread started in _gateway_lifespan
                   (src/gateway/observability/loop_monitor.py,
                   src/gateway/server/hybrid_server.py), including the 250 ms event-loop lag
                   histogram cage_event_loop_lag_seconds and the Cloud KMS RPC counter
                   cage_kms_rpc_total{op} (src/integrations/gcp/kms_provider.py); an enforcing
                   posture refuses to start if the metrics server cannot start. Port 9090
                   traverses the Linkerd inbound proxy under Server/gateway-metrics
                   (infra/targets/gcp-gke/charts/workload-mesh-policy/templates/servers-and-authz.yaml,
                   Exact GET /metrics from NetworkAuthentication/workload-probe-network; no
                   config.linkerd.io/skip-inbound-ports), and /metrics is not served without
                   mesh identity on port 8080. Terraform installs PodMonitoring/gateway-metrics
                   (infra/modules/gateway/metrics-monitors/templates/monitors.yaml) and
                   google_monitoring_alert_policy.prometheus_metrics_scrape_liveness
                   (infra/targets/gcp-gke/metrics_alerting.tf) on up{job="gateway-metrics"} and
                   cage_event_loop_lag_seconds_count absence; compliance/lula/lula-validation-metrics.yaml
                   checks that the PodMonitoring object exists with the expected selector and
                   endpoint, while live GMP sample arrival under Server/gateway-metrics awaits
                   certification.

                Open: live staging verification of signed attestations in the WORM bucket
                (POAM-2026-084); staging keeps WORM objects for 1 day inside the ephemeral
                workload project, and signing-key manifests are not archived (POAM-2026-197).
              props:
                - name: implementation-status
                  value: partial
                - name: control-origination
                  value: system-specific
                - name: evidence-chain-blocking
                  value: "true by default and in Terraform; enforcing postures refuse false unless CAGE_ALLOW_NONBLOCKING_PROD=true"
