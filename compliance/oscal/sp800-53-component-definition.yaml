            - uuid: "80d95b3a-12ae-4dd4-8db4-b52661335fa4"
              control-id: au-9
              description: |
                Protection of audit information separates the producer of governance
                evidence from its custodian (POAM-2026-084). The gateway
                (src/gateway/governance/evidence/stream.py, EvidenceStreamSink) only
                hash-chains records into a Redis Stream through a per-process group-commit
                appender and atomic Lua batch compare-and-append (_APPEND_BATCH_SCRIPT),
                so HA replicas share one linear chain without forks. Appends are
                retry-safe (issue #511): a script re-sent after a lost Redis reply answers
                ALREADY instead of appending again, a CONFLICT first checks whether the
                batch already landed after its predecessor, and a batch whose outcome is
                unknown is re-sent verbatim, never re-sealed, then failed with
                EvidenceAppendUnsettledError, so each event is recorded at most once. On
                restore the stream head must hash to its own record_hash, and a sink that
                already holds a chain raises EvidenceChainCorruptError on an emptied
                stream, a head on another chain or a regressed head instead of starting a
                new chain. Refusal and deferral receipts use awaited enqueue (never
                dropped), while best-effort GOVERNANCE_TRACE telemetry sheds with a metric
                if the bounded queue fills.
                The gateway holds no evidence signing key, no cold store and no WORM
                bucket IAM.

                The compliance bridge's EvidenceCustodian
                (src/compliance_bridge/evidence_custodian.py) independently re-verifies
                every record hash, prev_hash link and sequence before writing, halts
                without advancing its durable cursor on any integrity violation, records
                sequence gaps (entries trimmed before custody) and chain rotations (a new
                chain starting at genesis after another chain was custodied, logged
                CRITICAL as kind CHAIN_ROTATION) in the batch attestation,
                and writes NDJSON batches plus attestations with put_if_absent to the
                retention-locked, CMEK-encrypted GCS WORM bucket (infra/modules/worm_bucket;
                locked 1 day in staging, 7 years in prod). The cursor advances only after
                both objects are durable, so a failed write is retried with identical
                bytes. Under an enforcing posture the bridge refuses to start custody with
                a null cold store (EvidenceCustodyConfigError). Bucket IAM is scoped to the
                compliance-bridge service account (roles/storage.objectCreator /
                objectViewer). OSCAL Assessment Results continue to be stored through
                src/compliance_bridge/storage.py.

                Status remains partial until live staging verification of attestations in
                the WORM bucket closes POAM-2026-084.
              props:
                - name: implementation-status
                  value: partial
                - name: control-origination
                  value: hybrid
                - name: poam-reference
                  value: "POAM-2026-084"
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=AU-9"
                  rel: reference
                - href: "../../src/compliance_bridge/evidence_custodian.py"
                  rel: implementation
                  text: "EvidenceCustodian re-verification, WORM put_if_absent, durable cursor"
                - href: "../../src/gateway/governance/evidence/stream.py"
                  rel: implementation
                  text: "EvidenceStreamSink producer-only compare-and-append"
                - href: "../../tests/test_evidence_custodian.py"
                  rel: test
                  text: "Integrity halt, gap recording, retry-safe cursor, fail-closed config"
                - href: "../../tests/test_evidence_stream.py"
                  rel: test
                  text: "Retry-safe appends and fail-closed chain restore (issue #511)"

            - uuid: "abd3ab8a-f0cf-439c-a0ee-8537cbf42b2b"
              control-id: au-11
              description: |
                Customer responsibility (audit record retention). This statement makes
                no implementation claim; it records what an adopter must decide.

                CAGE retains governance evidence, including Provider 02 stateHash
                preimages (STATE_COMMITMENT records), in a retention-locked WORM
                bucket. The preimages are PII-sanitized, not anonymized
                (docs/architecture/EVIDENCE_CHAIN.md §4.4 lists the sanitizer's gaps:
                free-text names, addresses, non-IBAN account numbers, numeric PII and the
                pseudonymous user_id). The reference defaults in
                infra/targets/gcp-gke/main.tf are a 7-year locked retention policy in
                prod, a 1-day locked policy in staging, and an unlocked policy in dev.
                These are illustrative defaults, not a legal determination.

                Before deploying, the adopting organization must (1) establish the
                lawful basis and the retention period for audit records in its
                jurisdiction and set the WORM retention to match before the policy is
                locked, and (2) determine whether residual personal data in
                WORM-retained, PII-sanitized evidence falls under an erasure exemption
                (for example GDPR Art. 17(3)(b) or (e)). If no exemption applies,
                the organization must decide how erasure requests are met (for example
                with a shorter retention, or by excluding such data before
                commitment), because a locked bucket cannot delete objects early.
              props:
                - name: control-origination
                  value: customer-configured
                - name: responsibility
                  ns: "https://cage.laah.cybernetics.dev/ns/oscal"
                  value: customer
                  class: customer-responsibility
                - name: poam-reference
                  value: "POAM-2026-084"
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=AU-11"
                  rel: reference
                - href: "../../infra/targets/gcp-gke/main.tf"
                  rel: reference
                  text: "Reference WORM retention defaults (prod 7y locked / staging 1d locked / dev unlocked)"
                - href: "../../docs/architecture/EVIDENCE_CHAIN.md"
                  rel: reference
                  text: "State commitments: sanitizer coverage and known gaps"

            - uuid: "4bc5258d-a69c-4bdf-a40c-a12496cb279b"
              control-id: au-9.3
              description: |
                Cryptographic protection of audit information combines a SHA-256 hash chain
                over RFC 8785 JCS-canonicalized records (cage-audit/3.0 headers bind
                chain_id, sequence, trace_id and event_type into each link) with a per-batch
                cage-evidence-batch/1 attestation signed by the compliance bridge using the
                dedicated asymmetric Cloud KMS key EVIDENCE_KMS_KEY
                (infra/targets/gcp-gke/kms_signing.tf, compliance-evidence; signer IAM
                granted to the compliance-bridge service account only). The attestation
                covers the chain id, sequence range, first prev_hash, last record_hash,
                NDJSON SHA-256 and any recorded gap. Under an enforcing posture custody
                refuses to run without an active signer, and a signing failure writes
                nothing. Attestations written in dev/test/ci without a signer carry
                signature_status UNSIGNED and evidentiary false, are stored under a
                distinct .attestation.unsigned.json key, and are rejected by
                assert_citable(); they are never evidence for this control.
              props:
                - name: implementation-status
                  value: partial
                - name: control-origination
                  value: system-specific
                - name: poam-reference
                  value: "POAM-2026-084"
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=AU-9"
                  rel: reference
                - href: "../../src/compliance_bridge/evidence_custodian.py"
                  rel: implementation
                  text: "Signed cage-evidence-batch/1 attestations; assert_citable()"
                - href: "../../src/compliance_bridge/kms_batch_signer.py"
                  rel: implementation
                  text: "build_evidence_signer() resolves EVIDENCE_KMS_KEY"

            - uuid: "3513ab15-d8d3-459e-8b2a-e979cfaa2efe"
              control-id: au-10
              description: |
                Non-repudiation of recorded governance evidence rests on the KMS-signed batch
                attestation. Each attestation binds a contiguous, re-verified range of the
                hash chain (first/last sequence, first prev_hash, last record_hash, content
                SHA-256) to the compliance-evidence key, whose private half never leaves
                Cloud KMS and whose signer role is held only by the compliance-bridge
                workload identity. Because the gateway that produces the records cannot
                sign them, and the custodian that signs them cannot author gateway
                decisions, neither workload alone can fabricate an attested record. The
                signed body itself asserts evidentiary true. CustodyVerifier
                (src/compliance_bridge/evidence_verifier.py) reads the archive back and
                resolves the public key by signature.key_id from trust anchors loaded
                out-of-band (the EVIDENCE_KMS_KEY provider plus an optional
                EVIDENCE_TRUST_ANCHORS_FILE for retired versions), never from the
                attestation, and rejects gateway or reconciler kids. It also binds each
                attestation to its data object, re-verifies every record, and fails on
                any undeclared break in chain continuity. A chain rotation is a declared
                break: the custodian records it as a CHAIN_ROTATION gap and the verifier
                reports it among the declared gaps, which block citation unless explicitly
                allowed; a malformed rotation declaration fails. Unsigned attestations are
                non-evidentiary by construction (see AU-9(3)). The compliance-bridge
                lifespan (src/compliance_bridge/main.py) runs CustodyVerifier.run_forever()
                on a configurable schedule (EVIDENCE_VERIFY_INTERVAL_S), exports Prometheus
                counters and gauges (cage_evidence_verification_runs_total,
                cage_evidence_verified_batches, cage_evidence_verification_failures,
                cage_evidence_declared_gaps, cage_evidence_non_evidentiary_batches), exposes
                on-demand verification at GET /v1/evidence/verify, and gates OSCAL Assessment
                Results citation in src/compliance_bridge/oscal_exporter.py via
                CustodyVerificationReport.assert_citable().
              props:
                - name: implementation-status
                  value: partial
                - name: control-origination
                  value: system-specific
                - name: poam-reference
                  value: "POAM-2026-084"
              links:
                - href: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home?element=AU-10"
                  rel: reference
                - href: "../../src/compliance_bridge/evidence_custodian.py"
                  rel: implementation
                  text: "Batch attestation signed with EVIDENCE_KMS_KEY"
                - href: "../../src/compliance_bridge/evidence_verifier.py"
                  rel: implementation
                  text: "CustodyVerifier kid-resolved read-back verification, scheduler, and citation gate"
                - href: "../../src/compliance_bridge/oscal_exporter.py"
                  rel: implementation
                  text: "OSCAL Assessment Results custody citation gate and attestation provenance links"
                - href: "../../tests/test_evidence_verifier.py"
                  rel: test
                  text: "Tamper, deletion, foreign-kid, unknown-kid, citation gate, and endpoint fail-closed paths"

            - uuid: "07769d00-7959-4cfe-86aa-972a537952d5"
              control-id: ir-6
              description: |
                Incident reporting is partial. src/compliance_bridge/notifier.py delivers alerts
                to the console, Slack, PagerDuty or a generic webhook, chosen by ALERT_CHANNEL.
                The reference Terraform sets alert_channel = "console"
                (infra/targets/gcp-gke/main.tf), so alerts are structured log lines on the
                bridge's stdout and no Slack or PagerDuty delivery is configured. Two producers
                raise alerts: the evidence-age SLA monitor
                (src/compliance_bridge/sla_monitor.py), every 5 minutes, when a control's newest
                custody-chain evidence exceeds its SLA; and
                src/compliance_bridge/audit_workflow.py, for FAIL findings on critical controls
                in Lula results submitted to POST /v1/audit/ingest. No alert fires on the PII
                safety rate, an overall compliance score or OPA availability. Governance events
                stream to subscribed dashboards over SSE (src/compliance_bridge/sse_events.py).
                The linked Lula manifest (lula-validation-ir6.yaml) checks only that the
                compliance-bridge Deployment has a ready replica.
              props:
