    # -----------------------------------------------------------------------
    # Component 2: Deterministic Input Screening and PII Redaction
    # (src/gateway/governance/text_filter.py, src/integrations/presidio/)
    # Enforces: SI-10 (Information Input Validation), SI-3 (Malicious Code Protection)
    # The optional NeMo Guardrails tier (CAGE_NEMO_ENABLED, default false) is not
    # credited here: every statement below holds with it off (POAM-2026-145).
    # -----------------------------------------------------------------------
    - uuid: "3d19fa63-7253-4563-b757-23c89ea461ce"
      title: "Deterministic Input Screening and PII Redaction"
      type: software
      description: >
        In-process screening that needs no LLM and no network service: the Stage 1
        Aho-Corasick keyword scan (ac_keyword_scan in src/gateway/governance/text_filter.py)
        for known prompt-injection and control-override phrases, Microsoft Presidio
        identity-PII redaction (src/integrations/presidio/redactor.py), and regex PII
        scrubbing (scrub_pii in src/gateway/infrastructure/privacy.py). It runs whether
        or not the optional NeMo Guardrails tier is enabled (POAM-2026-142).
      purpose: >
        Screens every input for known injection phrases, redacts 12 identity PII
        entity types from user input before any agent or model sees it, and scrubs
        PII from model output.
      responsible-roles:
        - role-id: provider
      control-implementations:
        - uuid: "2de5e59a-f094-4d79-94eb-b3321211b4dc"
          source: "https://csrc.nist.gov/projects/cprt/api/cprt/framework/version/SP_800_53_5_1_1/home"
          description: "NIST SP 800-53 Rev 5 HIGH-baseline controls implemented by deterministic input screening and PII redaction"
          implemented-requirements:
            - uuid: "8e46d991-dd78-416a-897d-f909cb63be8d"
              control-id: si-10
              description: |
                Information input validation for the governed advisor's conversation is
                deterministic and in-process, but it runs inside the advisor, not in the
                governance plane, so status is partial. The advisor's LangGraph input rail
                (create_nemo_guardrail_node in
                src/gateway/governance/langgraph_harness/nemo_node_factory.py, wired by
                src/governed_financial_advisor/graph/nodes/guardrail_node.py) replaces each user
                message with its Presidio-redacted text (12 identity entity types: PERSON,
                EMAIL_ADDRESS, PHONE_NUMBER, CREDIT_CARD, CRYPTO, US_SSN, US_ITIN, US_PASSPORT,
                US_BANK_NUMBER, US_DRIVER_LICENSE, IBAN_CODE, IP_ADDRESS;
                src/integrations/presidio/redactor.py), failing closed in enforcing postures
                when redaction raises, and blocks input that matches the Stage 1 keyword list
                (tier1_keywords in config/governance_thresholds.json). A Presidio engine that
                fails to initialise leaves input unredacted instead of failing closed
                (POAM-2026-147, open). The gateway's inference proxy
                (src/gateway/server/inference_proxy.py) runs the same keyword scan over every
                message of each request it receives and stamps the outcome on the request's OTel
                span, but the reference deployment does not route the advisor's model calls
                through it: Terraform points the advisor at the vLLM services directly
                (infra/targets/gcp-gke/main.tf), and the namespace NetworkPolicy allows that
                path (infra/targets/gcp-gke/network_policy.tf). Neither screen writes its
                outcome to the evidence stream. At the action boundary, the gateway's
                server-input binding inspects the string parameters of every governed action for
                the same keywords and for injection markers, and a detection makes the
                confidence stage deny the action (inspect_prompt_injection_params in
                src/gateway/governance/governor/server_inputs.py).
