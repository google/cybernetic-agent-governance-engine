            - uuid: "c3-au10-attestation-2026-0909"
              control-id: au-10
              description: |
                Non-repudiation of external warrant reliance is implemented in the governance
                pipeline but is not exercised by the reference deployment, so status is partial.
                No Terraform profile sets a warrant source (CAGE_WARRANT_SOURCE), and the US_FED
                and APAC_MAS baselines declare no warranted norm. The EU_ECB baseline marks
                confidence.min_trade_confidence requires_warrant, and assemble_governor()
                (src/gateway/governance/governor/assembly.py) refuses to start when a warranted
                norm has no WarrantSource.

                When a norm requires a warrant, the kernel warrant stage records one
                RelianceRecord per warranted norm (src/gateway/governance/warrant/reliance.py)
                for eligible and ineligible outcomes alike. The record carries provider_name,
                the warrant_id and the issuer-declared warrant_digest, reliance_status (ELIGIBLE
                or an INELIGIBLE_* reason such as INELIGIBLE_AUTHENTICITY or INELIGIBLE_STALE),
                verification_status, the governing version the binding requires and the one the
                warrant declares, issuing_authority, authority_basis, revocation_ref,
                residual_risk_ref (recorded opaquely), attested_at, and CAGE's receipt time and
                freshness (observed_at, age_seconds, max_age_seconds). The record is bound into
                the decision's hash-chained evidence record, and the signed GovernanceEnvelope's
                WARRANT attestation is built from the same record (an ExternalAttestation,
                src/gateway/governance/seams/attestation.py, whose metadata equals the record),
                so the envelope and the chain cannot disagree (AU-3).

                A warrant state is relied on for at most 60 s: a cached warrant older than that
                whose re-fetch fails, or a VEIP v0.2 warrant whose issuer state_as_of is older
                than that, is INELIGIBLE_STALE (src/gateway/governance/warrant/cache.py,
                src/gateway/governance/warrant/verifier.py). verification_status is VERIFIED
                only after the Ed25519 warrant signature verifies against a key resolved by kid
                from a VerifiedKeyManifest anchored to an out-of-band WarrantTrustAnchor
                (src/gateway/governance/warrant/trust_anchor.py); otherwise it is UNVERIFIED,
                and an unknown kid, a digest mismatch or a failed signature makes the warrant
                ineligible (INELIGIBLE_AUTHENTICITY). ExternalAttestation carries a first-class
                provider_name, so a provider's failure is attributed without parsing
                attestation_type. Background AttestationAggregator polling was removed from the
                gateway lifespan because nothing read its cache (POAM-2026-169 #6).

                Custody of the evidence follows AU-9 and AU-10 (3513ab15): live staging
                verification of signed attestations is pending (POAM-2026-084).
              props:
