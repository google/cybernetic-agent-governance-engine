            - uuid: "2de236dc-7f43-4ec2-939e-febbed7f1a5c"
              control-id: au-10
              description: |
                Actuation outcomes are three-valued, recorded exactly once, and carry a
                signature verification status (POAM-2026-098). ActuationReceipt
                (src/gateway/governance/seams/actuation.py) distinguishes ACCEPTED,
                REJECTED and UNKNOWN; an UNKNOWN outcome is never retryable and settles as
                possibly executed, so an indeterminate dispatch cannot release reserved
                capacity. The kernel dispatch_actuation()
                (src/gateway/governance/execution_actuator.py) is the sole caller of
                actuate() and the sole writer of actuation evidence: it converts an
                actuator exception into an UNKNOWN receipt and records every receipt once
                as ACTUATION_RECEIPT, ACTUATION_REFUSAL_RECEIPT or
                ACTUATION_INDETERMINATE_RECEIPT. Each receipt carries a ReceiptVerification
                status (VERIFIED / UNVERIFIED / INVALID). The actuator_01 adapter verifies
                an optional detached Ed25519 receipt signature against a key resolved by
                kid from an independently fetched manifest
                (src/integrations/actuator_01/receipt_verifier.py), never from the receipt;
                an invalid signature, unknown kid or envelope-digest mismatch forces the
                outcome to UNKNOWN, and a strict mode treats unsigned receipts the same way.
                Residual: the receipt signature format is a CAGE-proposed extension that
                the partner has not yet adopted, so live receipts are recorded as
                UNVERIFIED until partner adoption and over-the-wire conformance testing.
