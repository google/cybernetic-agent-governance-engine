information-type-registry:
  system: "Cybernetic AI Governance Engine (CAGE)"
  version: "1.0"
  date: "2026-03-06"
  reference: "NIST SP 800-60 Volume II"
  fips199-overall-category:
    confidentiality: "high"
    integrity: "high"
    availability: "high"
  information-types:
    - id: "IT-001"
      name: "Financial Trade Execution Data"
      sp800-60-identifier: "C.2.8.12"
      description: "Buy/sell orders, portfolio positions, trade recommendations generated by AI agents"
      confidentiality: "moderate"
      integrity: "high"
      availability: "moderate"
      pii-indicator: false
      applicable-regulations:
        - "SEC Rule 17a-4"
        - "FINRA 4511"
        - "OFAC"
      notes: >
        Integrity is HIGH because tampering with trade orders or AI-generated recommendations
        could result in severe financial loss, regulatory violations, and reputational damage.
        Confidentiality is MODERATE because unauthorized disclosure enables front-running or
        market manipulation but does not rise to catastrophic harm.

    - id: "IT-002"
      name: "AI Model Inference Outputs"
      sp800-60-identifier: "D.14.1"
      description: "LLM responses, governance verdicts, risk scores, STPA validation results"
      confidentiality: "moderate"
      integrity: "high"
      availability: "moderate"
      pii-indicator: false
      applicable-regulations:
        - "SR 11-7"
      notes: >
        Integrity is HIGH because tampered AI outputs could bypass governance controls and
        cause compliant-looking but harmful financial recommendations to be executed, violating
        SR 11-7 model risk management requirements. Confidentiality is MODERATE because
        governance verdicts contain proprietary methodology.

    - id: "IT-003"
      name: "Audit and Accountability Records"
      sp800-60-identifier: "D.16.1"
      description: "OTel spans with ISO 42001 evidence stamps, OSCAL assessment results, Langfuse traces"
      confidentiality: "low"
      integrity: "high"
      availability: "moderate"
      pii-indicator: false
      applicable-regulations:
        - "NIST SP 800-53 AU"
        - "SEC Rule 17a-4"
        - "FINRA 4511"
      notes: >
        Integrity is HIGH because tampered audit records undermine the ISO 42001 evidence chain
        and obstruct regulatory examination. Confidentiality is LOW because audit logs are
        designed to be shareable for regulatory review and do not contain sensitive content
        beyond operational metadata.

    - id: "IT-004"
      name: "Personal Identifiable Information (PII)"
      sp800-60-identifier: "D.2.2"
      description: "Individual investor PII processed through NeMo Guardrails Presidio PII detection (16 entity types)"
      confidentiality: "high"
      integrity: "high"
      availability: "low"
      pii-indicator: true
      pii-entity-types:
        - "PERSON"
        - "EMAIL_ADDRESS"
        - "PHONE_NUMBER"
        - "US_SSN"
        - "CREDIT_CARD"
        - "US_BANK_NUMBER"
        - "US_ITIN"
        - "US_PASSPORT"
        - "US_DRIVER_LICENSE"
        - "IP_ADDRESS"
        - "DATE_TIME"
        - "LOCATION"
        - "NRP"
        - "URL"
        - "MEDICAL_LICENSE"
        - "CRYPTO"
      applicable-regulations:
        - "FINRA"
        - "SEC Reg S-P"
        - "NIST SP 800-53 PT"
      notes: >
        Confidentiality is HIGH because unauthorized disclosure of investor PII causes severe
        privacy harm, triggers SEC Reg S-P breach notification obligations, and constitutes a
        reportable breach. Integrity is HIGH because corrupted PII records cause incorrect
        financial decisions and legal liability. Availability is LOW because PII records are
        not time-critical for system operation.

    - id: "IT-005"
      name: "Governance Policy Configurations"
      sp800-60-identifier: "C.3.5.1"
      description: "Rego policies, Colang rail definitions, safety thresholds, NeMo Guardrails config"
      confidentiality: "moderate"
      integrity: "high"
      availability: "high"
      pii-indicator: false
      applicable-regulations:
        - "SR 11-7"
        - "ISO 42001"
      notes: >
        Integrity is HIGH because tampered governance policies could silently disable safety
        controls, allowing prohibited trade actions or PII exfiltration to proceed undetected.
        Availability is HIGH because governance policies must be continuously available; their
        unavailability causes the system to fail-safe (blocking all AI inference), which is
        operationally unacceptable during trading hours. Confidentiality is MODERATE because
        exposure of Rego/Colang logic reveals proprietary governance methodology.

  data-flow-summary:
    inbound:
      - source: "End user / client application"
        data-types: ["IT-001", "IT-004"]
        transport: "gRPC/REST over TLS 1.3"
      - source: "Market data feeds"
        data-types: ["IT-001"]
        transport: "HTTPS"
    internal:
      - flow: "Gateway → NeMo Guardrails"
        data-types: ["IT-001", "IT-002", "IT-004", "IT-005"]
        transport: "gRPC (intra-cluster, shared HMAC — see POAM-007)"
      - flow: "Gateway → OPA"
        data-types: ["IT-001", "IT-002", "IT-005"]
        transport: "HTTP (intra-cluster)"
      - flow: "All services → Langfuse"
        data-types: ["IT-002", "IT-003"]
        transport: "HTTPS"
    outbound:
      - destination: "LLM Provider (OpenAI / Anthropic / Google)"
        data-types: ["IT-001", "IT-002"]
        transport: "HTTPS"
        note: "PII should be redacted by NeMo Guardrails before egress; see IT-004"
      - destination: "OFAC Sanctions API"
        data-types: ["IT-001"]
        transport: "HTTPS"
