  merge:
    # Flat merge: all selected controls combined into a single flat list
    flat: {}

  modify:
    # =========================================================================
    # PARAMETER ASSIGNMENTS — CAGE-specific values
    # =========================================================================
    set-parameters:
      # AU-2: Event Logging — extended for AI governance event types
      - param-id: "au-2_prm_1"
        values:
          - >
            authentication events, authorization decisions (OPA policy evaluations),
            governance verdict issuance (allow/deny/manual-review), policy-violation
            detections, ai-governance-decision events with model version metadata,
            prompt-injection-attempt detections, PII detection and masking events,
            configuration changes (governance_thresholds.json, Rego policy updates),
            privileged function executions (kubectl, terraform apply), account management
            events (create/modify/delete/disable), system startup and shutdown,
            trade execution requests and outcomes, OFAC sanctions screen results
        remarks: >
          CAGE AI governance event types extend the standard HIGH baseline event list.
          AI-specific events (ai-governance-decision, policy-violation, prompt-injection-attempt)
          are critical for SR 11-7 model risk management audit trails.

      # AU-9: Protect Audit Information
      - param-id: "au-9_prm_1"
        values:
          - "OTel spans exported to Langfuse → archived to GCS with CMEK encryption, object versioning, and retention lock (WORM-equivalent per SEC Rule 17a-4)"
        remarks: >
          Audit logs must be protected from modification. GCS object versioning with
          lifecycle policies provides WORM-equivalent protection. CMEK encryption
          adds a CAGE-managed cryptographic layer over GCP default encryption.

      # AC-3: Access Enforcement mechanism
      - param-id: "ac-3_prm_1"
        values:
          - "Open Policy Agent (OPA) Rego policy evaluation (finance_policy.rego, system_authz.rego, trade_policy.rego) with fiscal role limits: junior $5,000/$10,000 single/daily; senior $500,000/$1,000,000"
        remarks: >
          AC-3 enforcement is implemented via deterministic OPA policy evaluation,
          not LLM judgment. This provides auditable, reproducible access decisions
          independent of AI model behavior.

      # SC-8: Transmission Confidentiality
      - param-id: "sc-8_prm_1"
        values:
          - "TLS 1.3 for all external communications; Kubernetes NetworkPolicy for intra-cluster isolation; mTLS service mesh planned for Phase 3 (POAM-013)"
        remarks: >
          Current implementation satisfies SC-8 for external traffic. Intra-cluster
          mTLS is an enhancement tracked in POAM-013. NetworkPolicy provides network-level
          isolation as compensating control during the interim period.

      # IA-2: Identification and Authentication frequency
      - param-id: "ia-2_prm_1"
        values:
          - "MFA required for all privileged administrative access; API key authentication for external client applications; Workload Identity for service-to-service"
        remarks: >
          Multi-factor authentication enforced via GCP IAM for administrative users.
          Service accounts use Workload Identity (cryptographic certificate-based).

      # CM-6: Configuration Settings review frequency
      - param-id: "cm-6_prm_1"
        values:
          - "Configuration baselines reviewed upon every deployment (CI/CD validation) and at minimum quarterly by the ISSO"
        remarks: >
          Pydantic schema validation enforces configuration settings at every deployment.
          Quarterly ISSO review ensures ongoing compliance with CIS Kubernetes Benchmark.

      # RA-5: Vulnerability Scanning frequency
      - param-id: "ra-5_prm_1"
        values:
          - "CI-triggered scans on every push (pip-audit, Trivy, OPA test); weekly authenticated scans of running cluster (target — POAM-010); monthly full assessment"
        remarks: >
          CI-triggered scanning provides immediate vulnerability detection.
          Weekly authenticated scanning is the target state per POAM-010.

      # IR-6: Incident Reporting timeframe
      - param-id: "ir-6_prm_1"
        values:
          - "P1 Critical: 1 hour to ISSO/AO; P2 High: 4 hours; P3 Medium: 24 hours; External regulatory reporting per applicable law (SEC/FINRA: varies by incident type)"
        remarks: >
          Slack notifications provide automated P1/P2 alerting. PagerDuty escalation
          pending POAM-IR-6-001.

      # SC-12: Cryptographic Key Establishment
      - param-id: "sc-12_prm_1"
        values:
          - "GCP Cloud KMS provides key management infrastructure; CAGE uses Customer-Managed Encryption Keys (CMEK) for Cloud SQL and GCS; key rotation annually minimum"
        remarks: >
          Key management is a shared control with GCP. GCP provides the KMS infrastructure;
          CAGE is responsible for CMEK key creation, rotation, and access control.

      # CP-9: Backup frequency and testing
      - param-id: "cp-9_prm_1"
        values:
          - "Cloud SQL automated daily backups (7-day retention); GCS object versioning continuous; application-level backup testing quarterly"
        remarks: >
          Cloud SQL automated backup is inherited from GCP. Application-level backup
          procedures and annual restore testing are CAGE responsibilities.

    # =========================================================================
    # CONTROL ALTERATIONS — AI Overlay additions and clarifications
    # =========================================================================
    alters:
      # SR-3: Supply Chain Controls — tailored for AI model supply chain
      - control-id: "sr-3"
        adds:
          - position: ending
            parts:
              - id: "sr-3_cage-ai"
                name: "cage-implementation-guidance"
                prose: >
                  CAGE-SPECIFIC AI SUPPLY CHAIN REQUIREMENT: All AI models (LLM providers,
                  embedding models, SLM classifiers) must have documented provenance including:
                  (1) model version identifier and SHA-256 hash of model weights,
                  (2) training data lineage documentation from provider,
                  (3) model card or equivalent risk documentation,
                  (4) contractual provisions for model change notification.
                  AI model supply chain verification is enforced via OTel span metadata
                  (model_version, model_provider attributes) on every inference request.
                  Model registry updates require ISSO approval per Change Management procedures.

      # SR-11: Component Authenticity — tailored for AI model version integrity
      - control-id: "sr-11"
        adds:
          - position: ending
            parts:
              - id: "sr-11_cage-ai"
                name: "cage-implementation-guidance"
                prose: >
                  CAGE-SPECIFIC AI MODEL AUTHENTICITY REQUIREMENT: AI model version integrity
                  is enforced via: (1) GKE Binary Authorization policies preventing deployment
                  of unsigned or unauthorized container images, (2) OTel span metadata tagging
                  every inference with model_version and model_hash for audit traceability,
                  (3) Langfuse prompt versioning tracking all prompt template changes,
                  (4) Pydantic singleton validation ensuring governance_thresholds.json schema
                  integrity at every startup. Model version changes must be reviewed by the
                  AI Model Operator and approved by the ISSO before production deployment.

      # PT-2: Authority to Process PII — tailored for AI prompt processing
      - control-id: "pt-2"
        adds:
          - position: ending
            parts:
              - id: "pt-2_cage-ai"
                name: "cage-implementation-guidance"
                prose: >
                  CAGE-SPECIFIC PII AUTHORITY REQUIREMENT: CAGE processes PII in AI prompts
                  and must maintain documented authority for each PII processing activity.
                  Microsoft Presidio (NeMo Guardrails integration) detects and anonymizes
                  16 PII entity types (PERSON, EMAIL_ADDRESS, PHONE_NUMBER, US_SSN,
                  CREDIT_CARD, US_BANK_NUMBER, US_ITIN, US_PASSPORT, US_DRIVER_LICENSE,
                  IP_ADDRESS, DATE_TIME, LOCATION, NRP, URL, MEDICAL_LICENSE, CRYPTO)
                  before any prompt exits the cluster boundary to external LLM providers.
                  PII processing authority must be documented in privacy notices (SEC Reg S-P)
                  and reviewed annually by the ISSO and Legal/Privacy team.

      # PT-3: Purpose Specification — tailored for AI inference purpose limitation
      - control-id: "pt-3"
        adds:
          - position: ending
            parts:
              - id: "pt-3_cage-ai"
                name: "cage-implementation-guidance"
                prose: >
                  CAGE-SPECIFIC PURPOSE LIMITATION REQUIREMENT: PII collected and processed
                  by CAGE is limited to financial advisory and governance functions. The system
                  must not use PII for AI model training without explicit documented authority.
                  NeMo Guardrails Colang rail definitions enforce purpose limitation at the
                  inference layer by blocking off-topic requests that would process PII for
                  unauthorized purposes. OTel spans log the declared purpose for each
                  PII-touching inference event for audit trail compliance with SEC Reg S-P.

