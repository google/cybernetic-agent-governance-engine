# OSCAL Profile
# CAGE SP 800-53 Rev 5 HIGH Baseline — AI Governance Overlay
# oscal-version: 1.0.4
#
# This profile imports the NIST SP 800-53 Rev 5 catalog, applies the HIGH baseline
# selection, and adds CAGE-specific tailoring overlays for AI governance in financial
# services. Controls fully inherited from GCP/GKE are excluded (PE, MP, MA, PS).
#
# Referenced by: compliance/oscal/system-security-plan.yaml (import-profile)

profile:
  uuid: "b1c2d3e4-f5a6-4789-bcde-f01234567890"
  metadata:
    title: "CAGE SP 800-53 Rev 5 HIGH Baseline Profile with AI Overlay"
    published: "2026-03-06T00:00:00Z"
    last-modified: "2026-03-06T00:00:00Z"
    version: "1.0.0-draft"
    oscal-version: "1.0.4"
    remarks: >
      This OSCAL profile defines the security control baseline for the Cybernetic
      AI Governance Engine (CAGE). It imports the full NIST SP 800-53 Rev 5 catalog,
      selects all HIGH baseline controls, and applies CAGE-specific tailoring including:
      (1) additional AI-system controls not in the standard HIGH baseline (SR-3, SR-11,
      PT-2, PT-3), (2) parameter value assignments for AI governance event types and
      enforcement mechanisms, and (3) exclusions for controls fully inherited from the
      GCP/GKE Common Control Provider. See compliance/oscal/common-controls-catalog.yaml
      for documentation of inherited controls.
    roles:
      - id: profile-maintainer
        title: "Profile Maintainer"
        description: >
          Compliance Engineer responsible for maintaining this profile in alignment
          with NIST SP 800-53 Rev 5 and organizational tailoring requirements.
    parties:
      - uuid: "a2000001-0000-4000-8000-000000000001"
        type: organization
        name: "Cybernetic Governance Engine (CAGE) Compliance Team"
    responsible-parties:
      - role-id: profile-maintainer
        party-uuids:
          - "a2000001-0000-4000-8000-000000000001"

