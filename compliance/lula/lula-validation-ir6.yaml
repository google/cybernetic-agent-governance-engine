    remarks: |-
      Auto-converted from standalone lula validation format.
      Region: US_FED. Posture: nist-sp800-53.
      Notes: NIST SP 800-53 Rev 5 IR-6: Incident Reporting. Namespace: governance-stack (confirmed from live cluster deployment snapshot). Automated verification that the compliance-bridge incident reporting service is live and operational. The compliance-bridge (src/compliance_bridge/) provides:
        - Verified GCP Cloud Pub/Sub alert publishing (reference-architecture terminal sink) plus optional Slack/Webhook/PagerDuty fan-out via notifier.py, enforced fail-closed at pod startup in enforcing postures (POAM-2026-230)
        - Compliance audit workflow with observed-delivery critical-failure alerting via audit_workflow.py
        - The /v1/metrics/* API endpoints consumed by other Lula validations
      IR-6 requires that security incidents be reported to appropriate organizational officials and external authorities within defined timeframes — the compliance-bridge is the automated first-responder for this requirement. See: compliance/continuous-monitoring/ISCM_STRATEGY.md — IR-6 monitoring cadence. See: docs/operations/JURISDICTION_INVENTORY.md — ISSO/ISSM incident response chain.
