# lula-validation-ir6.yaml
# NIST SP 800-53 Rev 5 — IR-6: Incident Reporting
#
# Asserts that the compliance-bridge service is running and ready in the cluster.
# The compliance-bridge (src/compliance_bridge/) handles incident notification
# via audit_workflow.py, sla_monitor.py, and notifier.py — in CAGE's reference
# architecture it publishes critical compliance alerts to GCP Cloud Pub/Sub
# (PubSubNotifier, verified terminal sink; POAM-2026-230), with optional
# Slack/Webhook/PagerDuty downstream fan-out, and refuses to start in enforcing
# postures if ALERT_CHANNEL is unset or set to console/mock.
#
# Domain: kubernetes → compliance-bridge Deployment
# Provider: opa (inline Rego)
#
# References:
#   - src/compliance_bridge/notifier.py — Incident notification dispatcher
#   - src/compliance_bridge/audit_workflow.py — Compliance audit + alert pipeline
#   - infra/modules/compliance_bridge/main.tf — compliance-bridge Deployment module
#   - 00442dec^:docs/governance/ROLES_AND_RESPONSIBILITIES.md — IR-6 ISSO/ISSM responsibilities
#
# Namespace: governance-stack (confirmed from live cluster deployment snapshot)

component-definition:
