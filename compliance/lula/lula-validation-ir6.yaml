# lula-validation-ir6.yaml
# NIST SP 800-53 Rev 5 — IR-6: Incident Reporting
#
# Asserts that the compliance-bridge service is running and ready in the cluster.
# The compliance-bridge (src/compliance_bridge/) handles incident notification
# via audit_workflow.py and notifier.py — it is the primary incident reporting
# mechanism for this system, sending alerts to Slack/PagerDuty on critical
# compliance failures (ISO 42001 A.9.2, SC-4, AU-12 violations).
#
# Domain: kubernetes → compliance-bridge Deployment
# Provider: opa (inline Rego)
#
# References:
#   - src/compliance_bridge/notifier.py — Incident notification dispatcher
#   - src/compliance_bridge/audit_workflow.py — Compliance audit + alert pipeline
#   - deployment/k8s/compliance-bridge.yaml — compliance-bridge Deployment manifest
#   - docs/ROLES_AND_RESPONSIBILITIES.md — IR-6 ISSO/ISSM responsibilities
#
# Namespace: governance-stack (confirmed from live cluster deployment snapshot)

metadata:
  annotations:
    cage.region: US_FED
    cage.compliance-posture: nist-sp800-53
    cage.posture-note: "NIST SP 800-53 is a US Federal posture requirement. This validation is skipped for EU_ECB and APAC_MAS deployments."

domain:
  type: kubernetes
  kubernetes-spec:
    resources:
      - name: compliance-bridge-deployment
        resource: deployments
        namespace: governance-stack

provider:
  type: opa
  opa-spec:
    rego: |
      package lula

      import future.keywords.if

      # IR-6: Incident Reporting
      # Verifies the compliance-bridge Deployment is present and has at least 1
      # ready replica, confirming the incident reporting and notification
      # infrastructure is operational.
      # The compliance-bridge dispatches Slack/PagerDuty alerts on:
      #   - Critical ISO 42001 compliance failures (A.9.2 PII leak, SC-4 OPA down)
      #   - Governance threshold violations above MANUAL_REVIEW threshold
      #   - Audit workflow failures requiring ISSO/ISSM notification
      validate if {
        input["compliance-bridge-deployment"].status.readyReplicas >= 1
      }

notes: >
  NIST SP 800-53 Rev 5 IR-6: Incident Reporting.
  Namespace: governance-stack (confirmed from live cluster deployment snapshot).
  Automated verification that the compliance-bridge incident reporting service
  is live and operational. The compliance-bridge (src/compliance_bridge/) provides:
    - Real-time Slack/PagerDuty alerting via notifier.py
    - Compliance audit workflow with critical-failure alerting via audit_workflow.py
    - The /v1/metrics/* API endpoints consumed by other Lula validations
  IR-6 requires that security incidents be reported to appropriate organizational
  officials and external authorities within defined timeframes — the compliance-bridge
  is the automated first-responder for this requirement.
  See: compliance/continuous-monitoring/ISCM_STRATEGY.md — IR-6 monitoring cadence.
  See: docs/ROLES_AND_RESPONSIBILITIES.md — ISSO/ISSM incident response chain.
