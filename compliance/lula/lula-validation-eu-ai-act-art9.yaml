# lula-validation-eu-ai-act-art9.yaml
# EU AI Act Art. 9 — Risk Management System for High-Risk AI
#
# Asserts that the CAGE compliance bridge reports an active risk management
# system for the High-Risk AI classification, including documented risk
# assessments and residual risk acceptance records.
#
# Domain: api → compliance-bridge (Python FastAPI service)
# Provider: opa (inline Rego)
#
# Regulatory basis: EU AI Act Art. 9 — Risk Management System
# Jurisdiction: EU_ECB (CAGE_DEPLOYMENT_REGION=EU_ECB)
# POAM: EU-AI-ACT-001

component-definition:
  uuid: 76439699-18db-5ea9-b9a9-9c5fae6bef97
  metadata:
    title: CAGE Validation — EU AI ACT ART9
    last-modified: '2026-07-01T13:18:54Z'
    version: 1.0.0
    oscal-version: 1.1.2
    remarks: 'Auto-converted from standalone lula validation format.

      Region: EU_ECB. Posture: eu-ai-act.

      Notes: EU AI Act Art. 9: Risk Management System for High-Risk AI. CAGE is classified as a High-Risk AI system under EU AI Act Annex III §5(b) (AI systems used in financial services for creditworthiness assessment and risk scoring). Art. 9 mandates a documented risk management system covering: (a) identification and analysis of known and foreseeable risks; (b) estimation and evaluation of risks that may emerge when used as intended; (c) evaluation of risks based on post-market monitoring data; (d) adoption of suitable risk management measures. Evidence: GET /v1/compliance/eu-ai-act/art9 (compliance-bridge service). Staleness guard: 365 days (annual reassessment required per Art. 9(4)). Jurisdiction: EU_ECB only (CAGE_DEPLOYMENT_REGION=EU_ECB).'
  components:
  - uuid: af6edb46-06ac-5854-9745-9667579adfbb
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial advisor.
    control-implementations:
    - uuid: 58d1a2f5-47d9-594b-805f-3316a2fdc129
      source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R1689
      description: 'Control implementation for EU AI ACT ART9. Region: EU_ECB. Posture: eu-ai-act.'
      implemented-requirements:
      - uuid: 5f274328-f25a-5a19-8d0a-4a103d341baf
        control-id: eu-ai-act-art9
        description: Automated lula validation for EU AI ACT ART9.
        links:
        - href: '#bf519130-9b51-584d-b88c-d2357f5ab16f'
