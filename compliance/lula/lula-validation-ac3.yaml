      - href: lula.dev
      description: "domain:\n  type: kubernetes\n  kubernetes-spec:\n    resources:\n    - name: opa-deployment\n      resource: deployments\n      namespace: governance-stack\n    - name: opa-compliance-status\n      resource: configmaps\n      namespace: governance-stack\nprovider:\n  type: opa\n  opa-spec:\n    rego: \"package lula\\n\\nimport future.keywords.if\\n\\n# AC-3: Access Enforcement\\n# Verifies the OPA Deployment is present and ready, and that the\\n# compliance ConfigMap is labelled as ISO 42001 enabled — confirming\\n# the access enforcement layer is live and correctly configured.\\nvalidate if {\\n  input[\\\"opa-deployment\\\"].status.readyReplicas >= 1\\n  input[\\\"opa-compliance-status\\\"].metadata.labels[\\\"compliance.iso42001/enabled\\\"] == \\\"true\\\"\\n}\\n\"\n"
