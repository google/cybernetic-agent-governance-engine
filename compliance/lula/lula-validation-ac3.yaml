# lula-validation-ac3.yaml
# NIST SP 800-53 Rev 5 — AC-3: Access Enforcement
#
# Asserts that the gateway Deployment runs the read-only OPA Unix-socket
# sidecar (--addr=unix:///var/run/opa/opa.sock, --authorization=basic, zero TCP
# ports) and mounts the read-only opa-policies and opa-system-authz ConfigMaps
# in governance-stack (D-195-3, F-19, F-102, R-15).
#
# References:
#   - infra/modules/opa_policy/main.tf — OPA policy, system.authz & config ConfigMaps
#   - infra/modules/gateway/main.tf — Gateway UDS OPA sidecar container
#   - src/cage_finance/opa/trade_governance.rego — Active domain trade RBAC policy

component-definition:
  uuid: bf1cba97-1e27-5806-b6f5-f04499ef0a96
  metadata:
    title: CAGE Validation — AC3
    last-modified: '2026-11-08T00:00:00Z'
    version: 1.1.0
    oscal-version: 1.1.2
    remarks: |-
      Region: US_FED. Posture: nist-sp800-53.
      Notes: NIST SP 800-53 Rev 5 AC-3: Access Enforcement. Namespace: governance-stack. Automated verification that the gateway Deployment runs its in-pod OPA sidecar over a shared Unix domain socket (http+unix://%2Fvar%2Frun%2Fopa%2Fopa.sock) with --authorization=basic, readOnlyRootFilesystem, and zero TCP listener ports, backed by ISO 42001-labelled opa-policies and opa-system-authz ConfigMaps. See: compliance/continuous-monitoring/ISCM_STRATEGY.md — AC-3 monitoring cadence.
  components:
  - uuid: 319247ba-1fb5-5c62-99a7-24771b750845
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial
      advisor.
    control-implementations:
    - uuid: b8efdf73-2801-5ce0-a588-b486e87bd490
      source: https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final
      description: 'Control implementation for AC3. Region: US_FED. Posture: nist-sp800-53.'
      implemented-requirements:
      - uuid: dc9af4f2-aeef-55ae-ac99-95eeed7f3521
        control-id: ac3
        description: Automated lula validation for AC3.
        links:
        - href: '#73f98590-b9c9-52da-bfac-27cf03ae46af'
          rel: lula
  back-matter:
    resources:
    - uuid: 73f98590-b9c9-52da-bfac-27cf03ae46af
      title: Lula Validation — AC3
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: kubernetes
          kubernetes-spec:
            resources:
              - name: gateway-deployment
                resource-rule:
                  group: apps
                  version: v1
                  resource: deployments
                  namespaces:
                    - governance-stack
              - name: opa-configmaps
                resource-rule:
                  group: ""
                  version: v1
                  resource: configmaps
                  namespaces:
                    - governance-stack
        provider:
          type: opa
          opa-spec:
            output:
              validation: lula.validate
            rego: |
              package lula

              import future.keywords.if
              import future.keywords.in

              # AC-3: Access Enforcement — Gateway UDS OPA Sidecar & Immutable Bundle
              gateway_opa_uds_sidecar_ready if {
                some deploy in input["gateway-deployment"]
                deploy.metadata.name == "gateway"
                deploy.status.readyReplicas >= 1
                some gw in deploy.spec.template.spec.containers
                gw.name == "gateway"
                some env in gw.env
                env.name == "OPA_URL"
                env.value == "http+unix://%2Fvar%2Frun%2Fopa%2Fopa.sock"
                some opa in deploy.spec.template.spec.containers
                opa.name == "opa"
                "--addr=unix:///var/run/opa/opa.sock" in opa.args
                "--authorization=basic" in opa.args
                opa.securityContext.readOnlyRootFilesystem == true
                count(object.get(opa, "ports", [])) == 0
              }

              opa_policies_loaded if {
                some cm in input["opa-configmaps"]
                cm.metadata.name == "opa-policies"
                cm.metadata.labels["compliance.iso42001/enabled"] == "true"
                some policy_name, policy_rego in cm.data
                endswith(policy_name, ".rego")
                policy_rego != ""
              }

              opa_system_authz_loaded if {
                some cm in input["opa-configmaps"]
                cm.metadata.name == "opa-system-authz"
                cm.metadata.labels["compliance.iso42001/enabled"] == "true"
                contains(cm.data["system_authz.rego"], "package system.authz")
                contains(cm.data["system_authz.rego"], "default allow := false")
              }

              validate if {
                count(input["gateway-deployment"]) > 0
                count(input["opa-configmaps"]) > 0
                gateway_opa_uds_sidecar_ready
                opa_policies_loaded
                opa_system_authz_loaded
              }
