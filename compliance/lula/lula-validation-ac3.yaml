# lula-validation-ac3.yaml
# NIST SP 800-53 Rev 5 — AC-3: Access Enforcement
#
# Asserts that the OPA (Open Policy Agent) Deployment is running and ready
# in the cluster. OPA is the primary access enforcement mechanism, evaluating
# every trade and governance request against the canonical Rego policy in
# deployment/system_authz.rego.
#
# Domain: kubernetes → OPA Deployment
# Provider: opa (inline Rego)
#
# References:
#   - infra/modules/opa_policy/main.tf — OPA Deployment & ConfigMap module
#   - deployment/opa_config.yaml — OPA bundle configuration
#   - deployment/system_authz.rego — Canonical access enforcement policy
#
# Namespace: governance-stack (confirmed from live cluster deployment snapshot)

component-definition:
  uuid: bf1cba97-1e27-5806-b6f5-f04499ef0a96
  metadata:
    title: CAGE Validation — AC3
    last-modified: '2026-07-01T13:18:54Z'
    version: 1.0.0
    oscal-version: 1.1.2
    remarks: |-
      Auto-converted from standalone lula validation format.
      Region: US_FED. Posture: nist-sp800-53.
      Notes: NIST SP 800-53 Rev 5 AC-3: Access Enforcement. Namespace: governance-stack (confirmed from live cluster deployment snapshot). Automated verification that OPA is live and enforcing access control policies for every governance decision. The canonical Rego policy (deployment/system_authz.rego) implements RBAC-based trade limits: junior traders ≤ $5k, senior traders ≤ $500k, with fail-closed defaults for all unrecognized roles or actions. This validation also checks the opa-compliance-status ConfigMap label to confirm the ISO 42001 compliance configuration is applied (mirrors lula-validation-sc4.yaml). See: compliance/continuous-monitoring/ISCM_STRATEGY.md — AC-3 monitoring cadence.
  components:
  - uuid: 319247ba-1fb5-5c62-99a7-24771b750845
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial
      advisor.
    control-implementations:
    - uuid: b8efdf73-2801-5ce0-a588-b486e87bd490
      source: https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final
      description: 'Control implementation for AC3. Region: US_FED. Posture: nist-sp800-53.'
      implemented-requirements:
      - uuid: dc9af4f2-aeef-55ae-ac99-95eeed7f3521
        control-id: ac3
        description: Automated lula validation for AC3.
        links:
        - href: '#73f98590-b9c9-52da-bfac-27cf03ae46af'
          rel: lula
  back-matter:
    resources:
    - uuid: 73f98590-b9c9-52da-bfac-27cf03ae46af
      title: Lula Validation — AC3
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: kubernetes
          kubernetes-spec:
            resources:
              - name: opa-deployment
                resource-rule:
                  group: apps
                  version: v1
                  resource: deployments
                  namespaces:
                    - governance-stack
              - name: opa-policies
                resource-rule:
                  group: ""
                  version: v1
                  resource: configmaps
                  namespaces:
                    - governance-stack
        provider:
          type: opa
          opa-spec:
            rego: |
              package lula

              import future.keywords.if
              import future.keywords.in

              # AC-3: Access Enforcement
              # Verifies the in-state opa-service Deployment is ready and the in-state
              # opa-policies ConfigMap contains active Rego policy bundles.
              opa_deployment_ready if {
                some deploy in input["opa-deployment"]
                deploy.metadata.name == "opa-service"
                deploy.status.readyReplicas >= 1
              }

              opa_policies_loaded if {
                some cm in input["opa-policies"]
                cm.metadata.name == "opa-policies"
                some policy_name, policy_rego in cm.data
                endswith(policy_name, ".rego")
                policy_rego != ""
              }

              validate if {
                count(input["opa-deployment"]) > 0
                count(input["opa-policies"]) > 0
                opa_deployment_ready
                opa_policies_loaded
              }
