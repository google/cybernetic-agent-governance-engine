# lula-validation-ac3.yaml
# NIST SP 800-53 Rev 5 — AC-3: Access Enforcement
#
# Asserts that the OPA (Open Policy Agent) Deployment is running and ready
# in the cluster. OPA is the primary access enforcement mechanism, evaluating
# every trade and governance request against the canonical Rego policy in
# deployment/system_authz.rego.
#
# Domain: kubernetes → OPA Deployment
# Provider: opa (inline Rego)
#
# References:
#   - deployment/k8s/opa.yaml — OPA Deployment manifest
#   - deployment/opa_config.yaml — OPA bundle configuration
#   - deployment/system_authz.rego — Canonical access enforcement policy
#
# Namespace: governance-stack (confirmed from live cluster deployment snapshot)

