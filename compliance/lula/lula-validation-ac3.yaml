      Notes: NIST SP 800-53 Rev 5 AC-3: Access Enforcement. Namespace: governance-stack (confirmed from live cluster deployment snapshot). Automated verification that OPA is live and enforcing access control policies for every governance decision. The canonical Rego policy (deployment/system_authz.rego) implements RBAC-based trade limits: junior traders ≤ $5k, senior traders ≤ $500k, with fail-closed defaults for all unrecognized roles or actions. This validation also checks the opa-compliance-status ConfigMap label to confirm the ISO 42001 compliance configuration is applied (mirrors lula-validation-sc4.yaml). See: compliance/continuous-monitoring/ISCM_STRATEGY.md — AC-3 monitoring cadence.'
