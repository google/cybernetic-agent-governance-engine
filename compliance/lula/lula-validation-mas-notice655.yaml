# lula-validation-mas-notice655.yaml
# MAS Notice 655 — Technology Risk Management Audit Logging
#
# Asserts that the CAGE system maintains comprehensive audit logging
# and technology risk management controls as required by MAS Notice 655
# (Technology Risk Management) for financial institutions in Singapore.
#
# Domain: api → compliance-bridge (Python FastAPI service)
# Provider: opa (inline Rego)
#
# Regulatory basis: MAS Notice 655 — Technology Risk Management
# Jurisdiction: APAC_MAS (CAGE_DEPLOYMENT_REGION=APAC_MAS)
# POAM: APAC-MAS-N655-001

component-definition:
  uuid: 711f8a0a-776b-547d-b29b-8b303aa9d11c
  metadata:
    title: CAGE Validation — MAS NOTICE655
    last-modified: '2026-07-01T13:18:54Z'
    version: 1.0.0
    oscal-version: 1.1.2
    remarks: "Auto-converted from standalone lula validation format.\nRegion: APAC_MAS. Posture: mas-notice-655.\nNotes: MAS Notice 655: Technology Risk Management. MAS Notice 655 applies to all financial institutions in Singapore and mandates comprehensive technology risk management including audit logging, incident management, and business continuity controls. Key Notice 655 requirements: - §4.3: Audit logging of all technology-related events with minimum 5-year\n  retention for significant incidents\n- §5.1: Technology risk management framework documented and reviewed annually - §6.2: Incident detection and response capabilities with defined RTO/RPO - §7.1: Business continuity management with tested recovery procedures Data residency: All audit logs must be stored within asia-southeast1 (MAS TRM Guidelines §4.2 data residency requirement). The SR 26-2 \"no legal force\" sentinel is active for APAC_MAS deployments, suppressing US Federal Reserve-specific telemetry that lacks legal basis under MAS Notice 655. CAGE implements Notice 655 audit logging via the Compliance Bridge (src/compliance_bridge/audit_workflow.py) with OTel spans archived to GCS buckets in asia-southeast1. Evidence: GET /v1/compliance/mas/notice655 (compliance-bridge service). Staleness guard: 48 hours. Jurisdiction: APAC_MAS only (CAGE_DEPLOYMENT_REGION=APAC_MAS)."
  components:
  - uuid: 16fa7cf2-c4d0-5a55-984b-251269b55ae4
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial advisor.
    control-implementations:
    - uuid: 27475017-b615-5f28-bc86-137cebf13a3a
      source: https://lula.dev
      description: 'Control implementation for MAS NOTICE655. Region: APAC_MAS. Posture: mas-notice-655.'
      implemented-requirements:
      - uuid: 564d9d85-b2a5-5494-83d2-d06334ec06b7
        control-id: mas-notice655
        description: Automated lula validation for MAS NOTICE655.
        links:
        - href: '#31845ca7-3729-5a11-8faa-028892829144'
          rel: lula
  back-matter:
    resources:
    - uuid: 31845ca7-3729-5a11-8faa-028892829144
      title: Lula Validation — MAS NOTICE655
      rlinks:
      - href: lula.dev
      description: "domain:\n  type: api\n  api-spec:\n    endpoints:\n    - name: mas_notice655_status\n      url: http://compliance-bridge.governance-stack.svc.cluster.local/v1/compliance/mas/notice655\n      method: GET\nprovider:\n  type: opa\n  opa-spec:\n    rego: \"package lula\\n\\nimport future.keywords.if\\n\\n# MAS Notice 655: Technology Risk Management Audit Logging\\n# Asserts that:\\n#   1. Audit logging is active and capturing all required technology events\\n#   2. Log retention meets MAS Notice 655 requirements (minimum 5 years)\\n#   3. Technology risk management framework is documented and current\\n#   4. Incident detection and response capabilities are operational\\n#   5. Audit logs are stored within asia-southeast1 (data residency)\\n\\n# Rule 1: Audit logging active with required retention and data residency\\nvalidate if {\\n  input.mas_notice655_status.audit_logging_active == true\\n  input.mas_notice655_status.log_retention_years >= 5\\n  input.mas_notice655_status.data_residency_region == \\\"asia-southeast1\\\"\\n  input.mas_notice655_status.tamper_evident_storage == true\\n  input.mas_notice655_status.evidence_age_seconds < 172800\\n}\\n\\n# Rule 2: Technology risk management framework operational\\nvalidate if {\\n  input.mas_notice655_status.audit_logging_active == true\\n  input.mas_notice655_status.trm_framework_documented == true\\n  input.mas_notice655_status.incident_detection_active == true\\n  input.mas_notice655_status.recovery_time_objective_defined == true\\n  input.mas_notice655_status.evidence_age_seconds < 172800\\n}\\n\"\n"
