    - uuid: 1fcd8ff2-3d20-5d34-a450-0f78901b8039
      title: Lula Validation — AC2
      rlinks:
      - href: lula.dev
      description: "domain:\n  type: kubernetes\n  kubernetes-spec:\n    resources:\n    - name: cage-service-accounts\n      resource: serviceaccounts\n      namespace: governance-stack\n    - name: cage-pods\n      resource: pods\n      namespace: governance-stack\nprovider:\n  type: opa\n  opa-spec:\n    rego: \"package lula\\n\\nimport future.keywords.if\\nimport future.keywords.every\\n\\n# AC-2: Account Management\\n#\\n# Check 1: All non-default ServiceAccounts have the cage.io/account-purpose label.\\n# Check 2: The \\\"default\\\" ServiceAccount has automountServiceAccountToken: false.\\n# Check 3: No Pod uses the \\\"default\\\" ServiceAccount (all pods must use named SAs).\\n#\\n# POAM-001 remediation: formalizes account management for GKE service accounts.\\n#\\n# C-AC2 fix: the original first validate block contained an inverted condition —\\n# `sa.metadata.name == \\\"default\\\"` inside `every` caused the block to pass only\\n# when ALL service accounts were named \\\"default\\\", which is the opposite of the\\n# intended check.  The correct assertion is that every named (non-default) SA\\n# carries the cage.io/account-purpose label, expressed as a single block below.\\n\\nvalidate if {\\n  # Check 1: Every non-default ServiceAccount must have the account-purpose label.\\n  # Filter to named SAs first, then assert the label is present on each.\\n  named_sas := [sa | sa := input[\\\"cage-service-accounts\\\"][_]; sa.metadata.name != \\\"default\\\"]\\n  every sa in named_sas {\\n    sa.metadata.labels[\\\"cage.io/account-purpose\\\"] != null\\n  }\\n}\\n\\nvalidate if {\\n  # Check 2: \\\"default\\\" ServiceAccount must disable auto-mount of SA token.\\n  default_sas := [sa | sa := input[\\\"cage-service-accounts\\\"][_]; sa.metadata.name == \\\"default\\\"]\\n  count(default_sas) >= 1\\n  every sa in default_sas {\\n    sa.automountServiceAccountToken == false\\n  }\\n}\\n\\nvalidate if {\\n  # Check 3: No Pod may use the \\\"default\\\" ServiceAccount.\\n  every pod in input[\\\"cage-pods\\\"] {\\n    pod.spec.serviceAccountName != \\\"default\\\"\\n    pod.spec.serviceAccountName != null\\n  }\\n}\\n\"\n"
