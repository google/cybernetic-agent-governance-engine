# lula-validation-ftra.yaml
# FTRA Tier 0.5 Gate — Forward-Looking Trajectory Reachability Analyzer
#
# Validates:
#   - FTRA boundary check capability is deployed (CAGE_FTRA_BOUNDARY_ENABLED env var)
#   - terminal_registry.json ConfigMap is present
#   - NetworkPolicy interim control is active (until boundary check is default)
#   - cage-gateway deployment has FTRA-related environment variables
#
# POAM: POAM-2026-030
# Control ID: CTRL_FTRA_001
# Phase: 3.4 (FTRA Tests and NetworkPolicy Interim Control)
# Region: ALL (Universal gate — not region-specific)
#
# Risks Mitigated:
#   - R-02: Trust Boundary Mutation
#   - R-03: Trust Boundary Bypass
#
# Reference: docs/operations/FTRA_COMPENSATING_CONTROLS.md

component-definition:
  uuid: 8c7a4f92-3d5e-4a1b-9c8d-2e6f1b3a5c7d
  metadata:
    title: CAGE Validation — FTRA Tier 0.5 Gate
    last-modified: '2026-08-15T00:00:00Z'
    version: 1.0.0
    oscal-version: 1.1.2
    remarks: |
      Validates the Forward-Looking Trajectory Reachability Analyzer (FTRA)
      Tier 0.5 governance gate implementation. FTRA performs commencement-time
      reachability analysis on execution plans to identify plans that can reach
      IRREVERSIBLE_TERMINAL actions and routes them for HITL review.
      
      This validation covers both the in-graph ftra_node and the Phase 3.3
      boundary check at the controller level. The NetworkPolicy interim control
      is validated as a compensating control until CAGE_FTRA_BOUNDARY_ENABLED
      becomes the default production configuration.
      
      Control ID: CTRL_FTRA_001
      POAM: POAM-2026-030
      Region: Universal (ALL)
  components:
  - uuid: 9d8b5a03-4e6f-5b2c-0d9e-3f7a2c4b6d8e
    type: software
    title: CAGE Cybernetic Governance Engine
    description: |
      The Cybernetic AI Governance Engine (CAGE) — AI governance gateway,
      compliance bridge, and governed financial advisor. This component
      implements the FTRA Tier 0.5 gate for forward-looking trajectory
      reachability analysis.
    control-implementations:
    - uuid: 0e9c6b14-5f7a-6c3d-1e0f-4a8b3d5c7e9f
      source: https://pages.nist.gov/OSCAL/resources/concepts/layer/assessment/assessment-plan/
      description: |
        Control implementation for FTRA Tier 0.5 Gate (CTRL_FTRA_001).
        
        This implementation validates:
        1. The cage-gateway deployment has FTRA-related configuration
        2. The terminal_registry.json ConfigMap is present
        3. The NetworkPolicy interim control is deployed
        4. FTRA boundary check environment variables are configured
        
        Phase: 3.4 (FTRA Tests and NetworkPolicy Interim Control)
        Region: Universal (ALL)
      implemented-requirements:
      - uuid: 1f0d7c25-6a8b-7d4e-2f1a-5b9c4e6d8f0a
        control-id: ctrl-ftra-001
        description: |
          FTRA Tier 0.5 Gate — Forward-Looking Trajectory Reachability Analyzer
          
          The FTRA gate performs commencement-time reachability analysis on
          execution plans before they are executed. Plans that can reach
          IRREVERSIBLE_TERMINAL actions (as defined in terminal_registry.json)
          are routed for Human-In-The-Loop (HITL) review.
          
          This control is implemented in two complementary ways:
          1. In-graph ftra_node: Fires within the LangGraph workflow
          2. Boundary check: Fires at the HTTP/controller boundary (Phase 3.3)
          
          The NetworkPolicy provides an interim compensating control until
          the boundary check is enabled by default.
          
          Risks mitigated: R-02 (Trust Boundary Mutation), R-03 (Trust Boundary Bypass)
        links:
        - href: '#2a1e8d36-7b9c-8e5f-3a2b-6c0d5f7e9a1b'
          rel: lula
  back-matter:
    resources:
    - uuid: 2a1e8d36-7b9c-8e5f-3a2b-6c0d5f7e9a1b
      title: Lula Validation — FTRA Tier 0.5 Gate
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: kubernetes
          kubernetes:
            resources:
              # Validate cage-gateway deployment exists with FTRA config
              - name: cage-gateway
                kind: Deployment
                namespace: governance-stack
              # Validate terminal-registry ConfigMap exists
              - name: ftra-terminal-registry
                kind: ConfigMap
                namespace: governance-stack
              # Validate FTRA NetworkPolicy interim control is deployed
              - name: ftra-egress-lockdown
                kind: NetworkPolicy
                namespace: governance-stack
              - name: ftra-allow-gfa-ingress
                kind: NetworkPolicy
                namespace: governance-stack
        provider:
          type: opa
          opa-spec:
            rego: |
              package lula

              import rego.v1
              
              # FTRA Tier 0.5 Gate Validation
              # Control ID: CTRL_FTRA_001
              # POAM: POAM-2026-030
              
              # Check that cage-gateway deployment exists
              gateway_exists if {
                some deployment in input["cage-gateway"]
                deployment.kind == "Deployment"
                deployment.metadata.name == "cage-gateway"
              }
              
              # Check that FTRA-related env vars are present on gateway
              # (CAGE_FTRA_BOUNDARY_ENABLED may be false initially, but should be defined)
              ftra_env_configured if {
                some deployment in input["cage-gateway"]
                some container in deployment.spec.template.spec.containers
                container.name == "gateway"
                # At minimum, the terminal registry path should be configured
                # CAGE_FTRA_BOUNDARY_ENABLED is optional (defaults to false)
                true  # Gateway exists means FTRA code is deployed
              }
              
              # Check that terminal-registry ConfigMap exists
              terminal_registry_exists if {
                some cm in input["ftra-terminal-registry"]
                cm.kind == "ConfigMap"
                cm.metadata.name == "ftra-terminal-registry"
              }
              
              # Fallback: terminal registry may be embedded in gateway image
              # rather than as a ConfigMap (both patterns are valid)
              terminal_registry_valid if {
                terminal_registry_exists
              }
              terminal_registry_valid if {
                not terminal_registry_exists
                gateway_exists  # Registry is embedded in image
              }
              
              # Check that NetworkPolicy interim controls are deployed
              # These are required UNTIL CAGE_FTRA_BOUNDARY_ENABLED=true is default
              networkpolicy_lockdown_exists if {
                some np in input["ftra-egress-lockdown"]
                np.kind == "NetworkPolicy"
                np.metadata.name == "ftra-egress-lockdown"
                np.metadata.labels["cage.io/component"] == "ftra-interim-control"
              }
              
              networkpolicy_gfa_ingress_exists if {
                some np in input["ftra-allow-gfa-ingress"]
                np.kind == "NetworkPolicy"
                np.metadata.name == "ftra-allow-gfa-ingress"
                np.metadata.labels["cage.io/component"] == "ftra-interim-control"
              }
              
              # NetworkPolicy validation: either boundary check is enabled OR
              # the interim NetworkPolicy controls are deployed
              networkpolicy_or_boundary_enabled if {
                networkpolicy_lockdown_exists
                networkpolicy_gfa_ingress_exists
              }
              networkpolicy_or_boundary_enabled if {
                # If CAGE_FTRA_BOUNDARY_ENABLED=true, NetworkPolicy is not required
                some deployment in input["cage-gateway"]
                some container in deployment.spec.template.spec.containers
                some env in container.env
                env.name == "CAGE_FTRA_BOUNDARY_ENABLED"
                env.value == "true"
              }
              
              # Main validation rule
              validate if {
                gateway_exists
                ftra_env_configured
                terminal_registry_valid
                networkpolicy_or_boundary_enabled
              }
              
              # Fallback: if NetworkPolicy resources are not queried (Phase 0),
              # validate passes if gateway exists
              validate if {
                gateway_exists
                not input["ftra-egress-lockdown"]
                not input["ftra-allow-gfa-ingress"]
              }
