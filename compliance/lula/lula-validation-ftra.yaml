# lula-validation-ftra.yaml
# FTRA Tier 0.5 Gate — Forward-Looking Trajectory Reachability Analyzer
#
# Asserts only gateway_exists: a gateway Deployment with a container named
# "gateway" exists in governance-stack. It does not exercise FTRA, read the
# terminal registry, or check a NetworkPolicy, so it is not evidence for
# CTRL_FTRA_001 and compliance/lula/README.md does not rate it Active.
#
# Before #664 (372daad2) it also defined rules named for FTRA configuration, the
# terminal registry ConfigMap and an interim NetworkPolicy, but each of them
# passed whenever the gateway container existed, and its gateway rule matched
# only a Deployment named cage-gateway, which Terraform does not create. #664
# widened the name match and deleted the other rules, and this header kept
# describing them until 2026-11-14 (POAM-2026-219). The ConfigMap and
# NetworkPolicies are retired. FTRA itself is covered by tests/test_ftra_package.py.
#
# POAM: POAM-2026-030, POAM-2026-219
# Control ID: CTRL_FTRA_001
# Region: ALL (Universal gate — not region-specific)
#
# Reference: docs/operations/FTRA_COMPENSATING_CONTROLS.md

component-definition:
  uuid: 8c7a4f92-3d5e-4a1b-9c8d-2e6f1b3a5c7d
  metadata:
    title: CAGE Validation — FTRA Tier 0.5 Gate
    last-modified: '2026-11-14T00:00:00Z'
    version: 1.0.1
    oscal-version: 1.1.2
    remarks: |
      Asserts only gateway_exists: a gateway Deployment with a container named
      gateway exists in governance-stack. It does not exercise the Forward-Looking
      Trajectory Reachability Analyzer (FTRA), read the terminal registry, or
      check a NetworkPolicy, and compliance/lula/README.md does not rate it Active.

      Before #664 (372daad2) it also defined rules named for FTRA configuration,
      the terminal registry ConfigMap and an interim NetworkPolicy, each of which
      passed whenever the gateway container existed. #664 deleted them, and this
      description kept naming them until 2026-11-14 (POAM-2026-219). FTRA is
      covered by tests/test_ftra_package.py.

      Control ID: CTRL_FTRA_001
      POAM: POAM-2026-030, POAM-2026-219
      Region: Universal (ALL)
  components:
  - uuid: 9d8b5a03-4e6f-5b2c-8d9e-3f7a2c4b6d8e
    type: software
    title: CAGE Cybernetic Governance Engine
    description: |
      The Cybernetic AI Governance Engine (CAGE) — AI governance gateway,
      compliance bridge, and governed financial advisor. This component
      implements the FTRA Tier 0.5 gate for forward-looking trajectory
      reachability analysis.
    control-implementations:
    - uuid: 0e9c6b14-5f7a-4c3d-9e0f-4a8b3d5c7e9f
      source: https://pages.nist.gov/OSCAL/resources/concepts/layer/assessment/assessment-plan/
      description: |
        Control implementation for FTRA Tier 0.5 Gate (CTRL_FTRA_001).

        This validation asserts only that a gateway Deployment with a gateway
        container exists (gateway_exists). It checks no FTRA configuration, no
        terminal registry and no NetworkPolicy.

        Region: Universal (ALL)
      implemented-requirements:
      - uuid: 1f0d7c25-6a8b-4d4e-af1a-5b9c4e6d8f0a
        control-id: ctrl-ftra-001
        description: |
          FTRA Tier 0.5 Gate — Forward-Looking Trajectory Reachability Analyzer

          The FTRA gate performs commencement-time reachability analysis on
          execution plans before they are executed. Plans that can reach
          IRREVERSIBLE_TERMINAL actions (as defined in terminal_registry.json)
          are routed for Human-In-The-Loop (HITL) review.

          This control is implemented in two complementary ways:
          1. In-graph ftra_node: Fires within the LangGraph workflow
          2. Boundary check: Fires at the HTTP/controller boundary (Phase 3.3)

          The NetworkPolicy provides an interim compensating control until
          the boundary check is enabled by default.

          Risks mitigated: R-02 (Trust Boundary Mutation), R-03 (Trust Boundary Bypass)
        links:
        - href: '#2a1e8d36-7b9c-4e5f-ba2b-6c0d5f7e9a1b'
          rel: lula
  back-matter:
    resources:
    - uuid: 2a1e8d36-7b9c-4e5f-ba2b-6c0d5f7e9a1b
      title: Lula Validation — FTRA Tier 0.5 Gate
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: kubernetes
          kubernetes-spec:
            resources:
              - name: cage-gateway
                resource-rule:
                  group: apps
                  version: v1
                  resource: deployments
                  namespaces:
                    - governance-stack
        provider:
          type: opa
          opa-spec:
            output:
              validation: lula.validate
            rego: |
              package lula

              import future.keywords.if
              import future.keywords.in

              # FTRA Tier 0.5 Gate Validation (CTRL_FTRA_001 / POAM-2026-030)
              gateway_exists if {
                some deployment in input["cage-gateway"]
                deployment.metadata.name in {"gateway", "cage-gateway", "stera-gateway"}
                some container in deployment.spec.template.spec.containers
                container.name == "gateway"
              }

              validate if {
                count(input["cage-gateway"]) > 0
                gateway_exists
              }
