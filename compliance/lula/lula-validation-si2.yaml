    remarks: "Auto-converted from standalone lula validation format.\nRegion: US_FED. Posture: nist-sp800-53.\nNotes: NIST SP 800-53 Rev 5 SI-2: Flaw Remediation — Image Digest Pinning and Vulnerability Scanning. Namespace: governance-stack. Implements four flaw remediation and supply-chain integrity assertions for the CAGE governance namespace:\n  (1) Required Terraform-managed Deployments (gateway, governed-financial-advisor,\n      vllm-inference, vllm-reasoning, nemo-guardrails, agentsight-ui) must exist\n      and every container image must be pinned by an immutable @sha256: digest\n      (never :latest or tag-only).\n  (2) When compliance-bridge is deployed, its container images must also be pinned\n      by an immutable @sha256: digest (never :latest).\n  (3) All container images across governance-stack Deployments must be pinned by\n      @sha256: digest and use imagePullPolicy in {\"Always\", \"IfNotPresent\"}.\n  (4) At least one CronJob labeled cage.io/purpose: vulnerability-scan must exist\n      (provides continuous vulnerability scanning evidence per SI-2 and RA-5;\n      see also lula-validation-ra5.yaml for the dedicated RA-5 validation).\nSee: docs/POAM.md — POAM-2026-013, POAM-2026-083 (SI-2 / SI-7 remediation), POAM-2026-010 (RA-5 remediation)."
