      - href: lula.dev
      description: "domain:\n  type: kubernetes\n  kubernetes-spec:\n    resources:\n    - name: cage-deployments\n      resource: deployments\n      namespace: governance-stack\n    - name: vuln-scan-cronjobs\n      resource: cronjobs\n      namespace: governance-stack\nprovider:\n  type: opa\n  opa-spec:\n    rego: \"package lula\\n\\nimport future.keywords.if\\nimport future.keywords.every\\nimport future.keywords.in\\n\\n# SI-2 / SI-7: Flaw Remediation — Digest Pinning and Vulnerability Scanning (POAM-2026-083)\\n#\\n# Check 1: All required Terraform-managed Deployments (gateway, governed-financial-advisor,\\n#          vllm-inference, vllm-reasoning, nemo-guardrails, agentsight-ui) must exist\\n#          and every container image must be pinned by @sha256: digest (never :latest).\\n# Check 2: If compliance-bridge is deployed, its container images must be pinned by @sha256: digest.\\n# Check 3: All containers across all CAGE deployments must be digest-pinned and use\\n#          imagePullPolicy in {\\\"Always\\\", \\\"IfNotPresent\\\"}.\\n# Check 4: At least one CronJob with label cage.io/purpose: vulnerability-scan must exist.\\n\\nrequired_deployments := {\\n  \\\"gateway\\\",\\n  \\\"governed-financial-advisor\\\",\\n  \\\"vllm-inference\\\",\\n  \\\"vllm-reasoning\\\",\\n  \\\"nemo-guardrails\\\",\\n  \\\"agentsight-ui\\\"\\n}\\n\\nuses_latest_tag(image) if { endswith(image, \\\":latest\\\") }\\nuses_latest_tag(image) if { contains(image, \\\":latest@\\\") }\\nuses_latest_tag(image) if { not contains(image, \\\":\\\") }\\n\\npinned_by_digest(image) if {\\n  contains(image, \\\"@sha256:\\\")\\n  not uses_latest_tag(image)\\n}\\n\\n# Check 1: Every required Terraform Deployment is present and digest-pinned.\\ncage_images_pinned if {\\n  every req_name in required_deployments {\\n    matching := [d | d := input[\\\"cage-deployments\\\"][_]; d.metadata.name == req_name]\\n    count(matching) >= 1\\n    every deploy in matching {\\n      every container in deploy.spec.template.spec.containers {\\n        pinned_by_digest(container.image)\\n      }\\n    }\\n  }\\n}\\n\\n# Check 2: Optional compliance-bridge Deployment (when enabled) is digest-pinned.\\nbridge_images_pinned if {\\n  bridge_deploys := [d | d := input[\\\"cage-deployments\\\"][_]; d.metadata.name == \\\"compliance-bridge\\\"]\\n  every deploy in bridge_deploys {\\n    every container in deploy.spec.template.spec.containers {\\n      pinned_by_digest(container.image)\\n    }\\n  }\\n}\\n\\n# Check 3: All containers across all CAGE deployments are digest-pinned and use Always or IfNotPresent.\\nall_containers_pull_policy_valid if {\\n  count(input[\\\"cage-deployments\\\"]) >= 1\\n  every deploy in input[\\\"cage-deployments\\\"] {\\n    every container in deploy.spec.template.spec.containers {\\n      pinned_by_digest(container.image)\\n      container.imagePullPolicy in {\\\"Always\\\", \\\"IfNotPresent\\\"}\\n    }\\n  }\\n}\\n\\n# Check 4: At least one vulnerability-scan CronJob must exist.\\nvuln_scan_exists if {\\n  some cj in input[\\\"vuln-scan-cronjobs\\\"]\\n  cj.metadata.labels[\\\"cage.io/purpose\\\"] == \\\"vulnerability-scan\\\"\\n  cj.spec.schedule != null\\n}\\n\\nvalidate if {\\n  cage_images_pinned\\n  bridge_images_pinned\\n  all_containers_pull_policy_valid\\n  vuln_scan_exists\\n}\\n\"\n"
