# lula-validation-si2.yaml
# NIST SP 800-53 Rev 5 — SI-2: Flaw Remediation & SI-7: Software Integrity (Digest Pinning)
#
# Asserts that:
#   1. All core Terraform-managed Deployments (gateway, governed-financial-advisor,
#      vllm-inference, vllm-reasoning, nemo-guardrails, agentsight-ui) are present
#      and every container image is pinned by an immutable @sha256: digest (no :latest)
#   2. If the optional compliance-bridge Deployment is present, its container images
#      are also pinned by @sha256: digest (no :latest)
#   3. All container images across governance-stack Deployments are digest-pinned and
#      use imagePullPolicy in {"Always", "IfNotPresent"}
#   4. A CronJob or Job labeled cage.io/purpose: vulnerability-scan exists
#      in the governance-stack namespace (CI scanning evidence)
#
# Domain: kubernetes → Deployments, CronJobs in governance-stack namespace
# Provider: opa (inline Rego)
#
# References:
#   - infra/targets/gcp-gke/main.tf — GKE workload module definitions
#   - infra/targets/gcp-gke/variables.tf — image_digests map & Binary Authorization validation
#   - .github/workflows/security-scan.yml — CI Trivy container scanning
#   - docs/POAM.md — POAM-2026-013, POAM-2026-083 (SI-2 / SI-7: digest pinning & Binary Authorization)
#   - docs/POAM.md — POAM-2026-010 (RA-5: vulnerability scanning in CI)
#
# OSCAL Mapping:
#   component: cage-gateway
#   control: si-2
#
# Namespace: governance-stack (confirmed from live cluster deployment snapshot)

component-definition:
  uuid: a8a8a1df-4abf-52f0-be21-8a88b8af0722
  metadata:
    title: CAGE Validation — SI2
    last-modified: '2026-09-28T00:00:00Z'
    version: 1.1.0
    oscal-version: 1.1.2
    remarks: |-
      Auto-converted from standalone lula validation format.
      Region: US_FED. Posture: nist-sp800-53.
      Notes: NIST SP 800-53 Rev 5 SI-2: Flaw Remediation — Image Digest Pinning and Vulnerability Scanning. Namespace: governance-stack. Implements four flaw remediation and supply-chain integrity assertions for the CAGE governance namespace:
        (1) Required Terraform-managed Deployments (gateway, governed-financial-advisor,
            vllm-inference, vllm-reasoning, nemo-guardrails, agentsight-ui) must exist
            and every container image must be pinned by an immutable @sha256: digest
            (never :latest or tag-only).
        (2) When compliance-bridge is deployed, its container images must also be pinned
            by an immutable @sha256: digest (never :latest).
        (3) All container images across governance-stack Deployments must be pinned by
            @sha256: digest and use imagePullPolicy in {"Always", "IfNotPresent"}.
        (4) At least one CronJob labeled cage.io/purpose: vulnerability-scan must exist
            (provides continuous vulnerability scanning evidence per SI-2 and RA-5;
            see also lula-validation-ra5.yaml for the dedicated RA-5 validation).
      See: docs/POAM.md — POAM-2026-013, POAM-2026-083 (SI-2 / SI-7 remediation), POAM-2026-010 (RA-5 remediation).
  components:
  - uuid: 8c900df5-a133-56be-a946-99fa2e009bf1
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial
      advisor.
    control-implementations:
    - uuid: 265c3e24-6a08-5306-8c7e-e2c1d830495f
      source: https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final
      description: 'Control implementation for SI2. Region: US_FED. Posture: nist-sp800-53.'
      implemented-requirements:
      - uuid: 41943d9b-5ead-5c8e-ace2-b07b769526ac
        control-id: si2
        description: Automated lula validation for SI2.
        links:
        - href: '#daff725b-aea0-5a5c-981e-df1a30306f2e'
          rel: lula
  back-matter:
    resources:
    - uuid: daff725b-aea0-5a5c-981e-df1a30306f2e
      title: Lula Validation — SI2
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: kubernetes
          kubernetes-spec:
            resources:
              - name: cage-deployments
                resource-rule:
                  group: apps
                  version: v1
                  resource: deployments
                  namespaces:
                    - governance-stack
        provider:
          type: opa
          opa-spec:
            rego: |
              package lula

              import future.keywords.if
              import future.keywords.every
              import future.keywords.in

              # SI-2 / SI-7: Flaw Remediation — Digest Pinning (POAM-2026-083)
              required_deployments := {
                "gateway",
                "agentsight-ui",
              }

              optional_deployments := {
                "governed-financial-advisor",
                "vllm-inference",
                "vllm-reasoning",
                "nemo-guardrails",
                "compliance-bridge",
              }

              uses_latest_tag(image) if { endswith(image, ":latest") }
              uses_latest_tag(image) if { contains(image, ":latest@") }
              uses_latest_tag(image) if { not contains(image, ":") }

              pinned_by_digest(image) if {
                contains(image, "@sha256:")
                not uses_latest_tag(image)
              }

              cage_images_pinned if {
                every req_name in required_deployments {
                  matching := [d | some d in input["cage-deployments"]; d.metadata.name == req_name]
                  count(matching) >= 1
                  every deploy in matching {
                    every container in deploy.spec.template.spec.containers {
                      pinned_by_digest(container.image)
                    }
                  }
                }
              }

              optional_images_pinned if {
                every opt_name in optional_deployments {
                  present := [d | some d in input["cage-deployments"]; d.metadata.name == opt_name]
                  every deploy in present {
                    every container in deploy.spec.template.spec.containers {
                      pinned_by_digest(container.image)
                    }
                  }
                }
              }

              all_containers_pull_policy_valid if {
                every deploy in input["cage-deployments"] {
                  every container in deploy.spec.template.spec.containers {
                    pinned_by_digest(container.image)
                    container.imagePullPolicy in {"Always", "IfNotPresent"}
                  }
                }
              }

              validate if {
                count(input["cage-deployments"]) > 0
                cage_images_pinned
                optional_images_pinned
                all_containers_pull_policy_valid
              }
