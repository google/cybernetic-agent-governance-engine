component-definition:
  uuid: aeb5ec66-fae3-5700-b76c-d6719bc396ff
  metadata:
    title: CAGE Validation — AI600 HUMAN AI CONFIG
    last-modified: '2026-07-01T13:18:54Z'
    version: 1.0.0
    oscal-version: 1.1.2
    remarks: "Auto-converted from standalone lula validation format.\nRegion: US_FED. Posture: nist-ai-600-1.\nNotes: NIST AI 600-1 §2.5: Human-AI Configuration controls. Phase 2 assertions:\n  (1) defer-queue Deployment must be Running with ≥1 ready replica.\n      Confirms the DeferQueue HITL escalation service is operational.\n  (2) CONSENSUS_THRESHOLD_USD env var must be set in the governed-advisor\n      Deployment (expected value: 10000). Confirms the consensus gate\n      threshold is enforced at runtime.\n  (3) HITL_ESCALATION_ENABLED=true in the governed-advisor Deployment.\n      Confirms the HITL escalation pipeline is active.\nHuman override OTel audit trail implemented via hitl_override_audit_span() in hitl_escalator.py (ISO 42001 A.8.4 evidence, AI600-005). Regional SLAs documented in HUMAN_OVERSIGHT_SCOPE.md:\n  US_FED: 4hr (SR 26-2 §3.2), EU_ECB: 2hr (DORA Art. 10),\n  APAC_MAS: 1hr (MAS FEAT).\nRemediates: AI600-004 / AI600-005 (POAM_US_FED.md)."
  components:
  - uuid: a43a25df-2b6a-533b-91fc-c7001c9dca4a
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial advisor.
    control-implementations:
    - uuid: b5983a2f-a30b-5ce7-a0e9-b68d3742f6a2
      source: https://lula.dev
      description: 'Control implementation for AI600 HUMAN AI CONFIG. Region: US_FED. Posture: nist-ai-600-1.'
      implemented-requirements:
      - uuid: 89f7803d-8e98-555e-ba2e-1b399360124f
        control-id: ai600-human-ai-config
        description: Automated lula validation for AI600 HUMAN AI CONFIG.
        links:
        - href: '#b0ac20a5-0f42-5926-b95c-4bb674406110'
          rel: lula
  back-matter:
    resources:
    - uuid: b0ac20a5-0f42-5926-b95c-4bb674406110
      title: Lula Validation — AI600 HUMAN AI CONFIG
      rlinks:
      - href: lula.dev
      description: "domain:\n  type: kubernetes\n  kubernetes-spec:\n    resources:\n    - name: defer-queue-deployment\n      resource: deployments\n      namespace: governance-stack\n      filters:\n      - field: metadata.name\n        value: defer-queue\n    - name: governed-advisor-deployment\n      resource: deployments\n      namespace: governance-stack\n      filters:\n      - field: metadata.name\n        value: governed-financial-advisor\nprovider:\n  type: opa\n  opa-spec:\n    rego: \"package lula\\n\\nimport future.keywords.if\\n\\n# AI 600-1 §2.5 Human-AI Configuration Controls\\n#\\n# Check 1: defer-queue Deployment is running in governance-stack namespace\\n# Check 2: CONSENSUS_THRESHOLD_USD env var is set in governed-advisor Deployment\\n# Check 3: HITL_ESCALATION_ENABLED=true in governed-advisor Deployment\\n\\ndefer_queue_running if {\\n  input[\\\"defer-queue-deployment\\\"].status.readyReplicas >= 1\\n}\\n\\nconsensus_threshold_set if {\\n  some container in input[\\\"governed-advisor-deployment\\\"].spec.template.spec.containers\\n  some env in container.env\\n  env.name == \\\"CONSENSUS_THRESHOLD_USD\\\"\\n  env.value != \\\"\\\"\\n}\\n\\nhitl_escalation_enabled if {\\n  some container in input[\\\"governed-advisor-deployment\\\"].spec.template.spec.containers\\n  some env in container.env\\n  env.name == \\\"HITL_ESCALATION_ENABLED\\\"\\n  env.value == \\\"true\\\"\\n}\\n\\nvalidate if {\\n  defer_queue_running\\n  consensus_threshold_set\\n  hitl_escalation_enabled\\n}\\n\"\n"
