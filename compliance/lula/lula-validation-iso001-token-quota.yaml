component-definition:
  uuid: 0ddb2190-5503-51f2-97c5-1a4ed5e97a1c
  metadata:
    title: CAGE Validation — ISO001 TOKEN QUOTA (ISO-001)
    last-modified: '2026-07-01T13:18:54Z'
    version: 1.0.0
    oscal-version: 1.1.2
    remarks: |-
      Auto-converted from standalone lula validation format.
      Region: ALL. Posture: iso42001.
      Notes: ISO 42001 §A.4: AI System Resource Controls — Token Quota OPA Injection (ISO-001). Asserts that the governed-financial-advisor Deployment matches required state signatures.
  components:
  - uuid: a30eb71f-447c-53aa-8891-bb1b7db73afa
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial
      advisor.
    control-implementations:
    - uuid: 3f2c9f85-c105-5d35-898d-e7fde67638ef
      source: https://www.iso.org/standard/81230.html
      description: 'Control implementation for ISO001 TOKEN QUOTA (ISO-001). Region: ALL. Posture: iso42001.'
      implemented-requirements:
      - uuid: b73bcc6c-d919-5368-bbd3-77f142eb54dd
        control-id: A.4
        description: Automated lula validation for ISO001 TOKEN QUOTA (ISO-001).
        links:
        - href: '#9c4c3db2-8fc7-5959-ba63-38e6ffd6ecc9'
          rel: lula
  back-matter:
    resources:
    - uuid: 9c4c3db2-8fc7-5959-ba63-38e6ffd6ecc9
      title: Lula Validation — ISO001 TOKEN QUOTA (ISO-001)
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: kubernetes
          kubernetes-spec:
            resources:
              - name: gateway-deployment
                resource-rule:
                  group: apps
                  version: v1
                  resource: deployments
                  namespaces:
                    - governance-stack
              - name: opa-policy-configmap
                resource-rule:
                  group: ""
                  version: v1
                  resource: configmaps
                  namespaces:
                    - governance-stack
        provider:
          type: opa
          opa-spec:
            rego: |
              package lula

              import future.keywords.if
              import future.keywords.in

              # ISO 42001 §A.4 — Token Quota & OPA Policy Enforcement (ISO-001)
              gateway_has_redis_url if {
                some d in input["gateway-deployment"]
                d.metadata.name in {"gateway", "governed-financial-advisor"}
                some container in d.spec.template.spec.containers
                some env in container.env
                env.name == "REDIS_URL"
                env.value != ""
              }

              opa_policy_present if {
                some cm in input["opa-policy-configmap"]
                cm.metadata.name in {"opa-policies", "opa-policy"}
                count(cm.data) > 0
              }

              validate if {
                count(input["gateway-deployment"]) > 0
                count(input["opa-policy-configmap"]) > 0
                gateway_has_redis_url
                opa_policy_present
              }
