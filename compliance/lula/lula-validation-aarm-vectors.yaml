# lula-validation-aarm-vectors.yaml
# AARM Threat Vector Conformance Validation (CAGE v0.1.0)
#
# Validates that the CAGE compliance bridge reports conformance against all
# 11 CSA Autonomous Agent Risk Management (AARM) threat vectors.
#
# Domain:   api → compliance-bridge /v1/aarm/conformance-report endpoint
# Provider: opa (inline Rego)
#
# Assertions:
#   1. All 11 AARM vectors are present in the conformance report.
#   2. Zero vectors are EXPOSED (all must be at least PARTIAL).
#   3. Critical-severity vectors must be NEUTRALIZED:
#      AARM-V1 (Memory Poisoning), AARM-V2 (Goal Hijacking),
#      AARM-V3 (Confused Deputy), AARM-V4 (Cross-Agent Propagation),
#      AARM-V9 (Privilege Escalation), AARM-V10 (Data Exfiltration),
#      AARM-V11 (Model Substitution)
#   4. schema_version must equal "cage-aarm-conformance/1.0".
#   5. aarm_spec_version must equal "CSA-AARM-v1.0".

component-definition:
  uuid: 76ca0840-beed-5de8-a0e2-35933be05cd5
  metadata:
    title: CAGE Validation — AARM VECTORS
    last-modified: '2026-07-01T13:18:54Z'
    version: 1.0.0
    oscal-version: 1.1.2
    remarks: |-
      Auto-converted from standalone lula validation format.
      Region: ALL. Posture: csa-aarm.
      Notes: CSA AARM Threat Vector Conformance (CAGE v0.1.0). Validates machine-readable proof that CAGE control points neutralize all 11 AARM attack vectors defined in the Cloud Security Alliance Autonomous Agent Risk Management (AARM) specification.
      Critical vectors requiring NEUTRALIZED status (all 7 CRITICAL-severity vectors):
        AARM-V1  Memory Poisoning        → A.5.3, A.8.4 (Context Accumulator)
        AARM-V2  Goal Hijacking          → A.5.2, SC-4  (NeMo + OPA)
        AARM-V3  Confused Deputy         → SC-4, A.8.4  (HMAC Signed Handshake)
        AARM-V4  Cross-Agent Propagation → SC-4, SC-8   (FiscalLimitGuard + Linkerd)
        AARM-V9  Privilege Escalation    → SC-4, A.8.4  (OPA RBAC + scope declaration)
        AARM-V10 Data Exfiltration       → A.9.2, SC-7  (Presidio + Cilium)
        AARM-V11 Model Substitution      → SC-8, SC-4   (Sovereign vLLM + routing seal)

      Non-critical vectors may be PARTIAL but not EXPOSED. Evidence: GET /v1/aarm/conformance-report (compliance-bridge service). Auto-generated artifact: <audit_id>/aarm_conformance.json (GCS/S3).
  components:
  - uuid: e8310512-e8e1-5752-9929-09410398e064
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial
      advisor.
    control-implementations:
    - uuid: a3697688-6e46-5205-910e-22c7b44f6bdd
      source: https://cloudsecurityalliance.org/research/working-groups/artificial-intelligence
      description: 'Control implementation for AARM VECTORS. Region: ALL. Posture: csa-aarm.'
      implemented-requirements:
      - uuid: 6915c619-071a-51ea-a57f-60232a68751d
        control-id: aarm-vectors
        description: Automated lula validation for AARM VECTORS.
        links:
        - href: '#ec32ba67-e5a7-50b4-8ff5-eca8aac8da66'
          rel: lula
  back-matter:
    resources:
    - uuid: ec32ba67-e5a7-50b4-8ff5-eca8aac8da66
      title: Lula Validation — AARM VECTORS
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: api
          api-spec:
            requests:
              - name: aarm_conformance_report
                url: http://compliance-bridge.governance-stack.svc.cluster.local/v1/aarm/conformance-report
                method: GET
        provider:
          type: opa
          opa-spec:
            rego: |
              package lula

              import future.keywords.if
              import future.keywords.in

              report_doc := object.get(input.aarm_conformance_report, "report", input.aarm_conformance_report)

              vector_index[vid] := v if {
                v := report_doc.vectors[_]
                vid := v.vector_id
              }

              critical_vectors := {
                "AARM-V1", "AARM-V2", "AARM-V3", "AARM-V4",
                "AARM-V9", "AARM-V10", "AARM-V11"
              }

              critical_vectors_unexposed if {
                count([v | some v in critical_vectors; vector_index[v].fail_count > 0]) == 0
                count([v | some v in critical_vectors; vector_index[v].status == "EXPOSED"]) == 0
              }

              validate if {
                count(input.aarm_conformance_report) > 0
                required_vectors := {
                  "AARM-V1",  "AARM-V2",  "AARM-V3",  "AARM-V4",
                  "AARM-V5",  "AARM-V6",  "AARM-V7",  "AARM-V8",
                  "AARM-V9",  "AARM-V10", "AARM-V11"
                }
                present_vectors := {v | vector_index[v]}
                required_vectors == present_vectors
                report_doc.exposed == 0
                critical_vectors_unexposed
                report_doc.schema_version    == "cage-aarm-conformance/1.0"
                report_doc.aarm_spec_version == "CSA-AARM-v1.0"
              }
