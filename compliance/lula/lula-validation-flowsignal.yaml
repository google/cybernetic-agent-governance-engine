# lula-validation-flowsignal.yaml
# FlowSignal Integration — Consequence Authority Store & Provider Configuration
#
# Asserts that:
#   1. CAGE_NORMATIVE_PROVIDER=provider_01 is sourced via env var (not hardcoded image)
#   2. FlowSignal secrets (FLOWSIGNAL_CLIENT_CERT, FLOWSIGNAL_CLIENT_KEY, 
#      FLOWSIGNAL_CA_BUNDLE) are referenced via secretKeyRef if present — never inline value:
#   3. Redis key namespace flowsignal:token:* does not collide with existing prefixes
#      (fiscal:*, DEFER:*, safety:*)
#   4. REDIS_URL env var is present on the gateway Deployment (consumption store dependency)
#
# Domain: kubernetes → Gateway Deployment in governance-stack namespace
# Provider: opa (inline Rego)
#
# References:
#   - src/gateway/governance/consequence_authority_store.py — Redis consumption store
#   - src/integrations/provider_01/provider.py — FlowSignal NormativeProvider
#   - plans/flowsignal_integration_implementation_plan.md — Phase 1 §4
#
# OSCAL Mapping:
#   component: cage-gateway
#   control: A.8.4 (ISO 42001 — AI System Operation Controls)
#
# Namespace: governance-stack (confirmed from infra/modules/gateway/main.tf)

component-definition:
  uuid: f1025a8c-4d3e-5a99-8b2f-c418e7f92d1a
  metadata:
    title: CAGE Validation — FlowSignal Integration (FLOWSIGNAL-001)
    last-modified: '2026-08-27T16:14:00Z'
    version: 1.1.0
    oscal-version: 1.1.2
    remarks: |-
      Auto-converted from standalone lula validation format.
      Region: ALL. Posture: iso42001.
      Notes: ISO 42001 §A.8.4 — FlowSignal Integration Compliance (FLOWSIGNAL-001). Asserts that the FlowSignal (provider_01) consequence authority integration is configured correctly on the gateway Deployment in the governance-stack namespace:
        (1) CAGE_NORMATIVE_PROVIDER=provider_01 is set via env var (not hardcoded in image),
            enabling runtime provider selection per the plugin architecture specification.
        (2) All FlowSignal mTLS secrets (FLOWSIGNAL_CLIENT_CERT, FLOWSIGNAL_CLIENT_KEY,
            FLOWSIGNAL_CA_BUNDLE) are referenced via secretKeyRef if present — never
            inline value: fields (prevents credential exposure in pod specs).
        (3) Redis key namespace flowsignal:token:* does not collide with existing
            prefixes (fiscal:*, DEFER:*, safety:*) — ensures namespace isolation for
            the distributed consequence authority consumption store.
        (4) REDIS_URL env var is present on the gateway Deployment (consumption store
            dependency per consequence_authority_store.py from_env() factory).
        (5) Phase 2: KMS configuration env vars (KMS_GOVERNANCE_KEY or CAGE_KMS_PROVIDER)
            are present for ConsequenceToken JWS signing via KMSGovernanceSigner.
      Reference architecture: This validation enforces illustrative deployment patterns for FlowSignal consequence authority integration. Adopters should adapt namespace prefixes, secret names, and KMS key configurations to their own environments. See: plans/flowsignal_integration_implementation_plan.md Phase 1 §4, Phase 2 §5. See: src/gateway/governance/consequence_authority_store.py — Redis key schema, src/gateway/governance/consequence_token.py — KMS-signed JWS.
  components:
  - uuid: a4d8f2c1-6e9b-5c73-ba18-f29e4a7c8d0e
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial
      advisor.
    control-implementations:
    - uuid: b5e9a3d2-7f0c-5d84-8b29-a30f5b8d9e1f
      source: https://www.iso.org/standard/81230.html
      description: 'Control implementation for FlowSignal Integration (FLOWSIGNAL-001). Region: ALL. Posture: iso42001.'
      implemented-requirements:
      - uuid: c6f0b4e3-8a1d-5e95-9c3a-b41a6c9e0f2a
        control-id: A.8.4
        description: Automated lula validation for FlowSignal Integration (FLOWSIGNAL-001).
        links:
        - href: '#d7a1c5f4-9b2e-5fa6-ad4b-c52b7d0a1f3b'
          rel: lula
  back-matter:
    resources:
    - uuid: d7a1c5f4-9b2e-5fa6-ad4b-c52b7d0a1f3b
      title: Lula Validation — FlowSignal Integration (FLOWSIGNAL-001)
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: kubernetes
          kubernetes-spec:
            resources:
              - name: gateway-deployment
                resource-rule:
                  group: apps
                  version: v1
                  resource: deployments
                  namespaces:
                    - governance-stack
        provider:
          type: opa
          opa-spec:
            output:
              validation: lula.validate
            rego: |
              package lula

              import future.keywords.if
              import future.keywords.every
              import future.keywords.in

              gateway_deploy(d) if {
                d.metadata.name in {"gateway", "cage-gateway", "stera-gateway"}
              }

              flowsignal_secret_names := {"FLOWSIGNAL_CLIENT_CERT", "FLOWSIGNAL_CLIENT_KEY", "FLOWSIGNAL_CA_BUNDLE"}

              flowsignal_env_vars[env] if {
                some d in input["gateway-deployment"]
                gateway_deploy(d)
                some container in d.spec.template.spec.containers
                some env in container.env
                flowsignal_secret_names[env.name]
              }

              flowsignal_secrets_use_secretref if {
                every env in flowsignal_env_vars {
                  env.valueFrom.secretKeyRef != null
                  not env.value
                }
              }

              existing_prefixes := {"fiscal:", "DEFER:", "safety:"}
              flowsignal_prefix := "flowsignal:token:"

              redis_namespace_no_collision if {
                every prefix in existing_prefixes {
                  not startswith(flowsignal_prefix, prefix)
                  not startswith(prefix, flowsignal_prefix)
                }
              }

              redis_url_configured if {
                some d in input["gateway-deployment"]
                gateway_deploy(d)
                some container in d.spec.template.spec.containers
                some env in container.env
                env.name == "REDIS_URL"
              }

              kms_config_present if {
                some d in input["gateway-deployment"]
                gateway_deploy(d)
                some container in d.spec.template.spec.containers
                some env in container.env
                env.name in {"KMS_GOVERNANCE_KEY", "CAGE_KMS_PROVIDER"}
              }

              validate if {
                count(input["gateway-deployment"]) > 0
                flowsignal_secrets_use_secretref
                redis_namespace_no_collision
                redis_url_configured
                kms_config_present
              }
