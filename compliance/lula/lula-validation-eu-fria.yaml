component-definition:
  uuid: 2ed0f8fd-6e9e-5bff-870b-a604fcaf8f4d
  metadata:
    title: CAGE Validation — EU FRIA (EU-001)
    last-modified: '2026-10-01T00:00:00Z'
    version: 1.1.0
    oscal-version: 1.1.2
    remarks: |-
      Auto-converted from standalone lula validation format.
      Region: EU_ECB. Posture: eu_ai_act.
      Notes: EU AI Act Art. 27: Fundamental Rights Impact Assessment gating (EU-001). Asserts that the cage-gateway Deployment in EU_ECB:
        (1) Is Running with ≥1 ready replica.
        (2) CAGE_NORMATIVE_PROVIDER is set to a non-stub value (e.g. "provider_01").
            "static" is NOT permitted in EU_ECB — it means FRIA gating is bypassed.
        (3) CAGE_NORMATIVE_ENDPOINT is set to the external normative provider API URL.
        (4) The cage-deployment ConfigMap declares CAGE_DEPLOYMENT_REGION=EU_ECB and the gateway reads its region from it (configMapKeyRef); EU_ECB is the only region whose jurisdiction entry assembles the fria tier (src/gateway/governance/jurisdiction/registry.py); the tier is absent from US_FED and APAC_MAS deployments by construction (tests/governor/test_jurisdiction_wiring.py).
      Failure means FRIA validation is in stub mode: all governance decisions are self-admitted without independent external compliance validation, which does not satisfy EU AI Act Art. 27 for High-Risk AI systems. POAM reference: EU-001 (POAM_EU_ECB.md). See also: docs/compliance/eu_ecb/FRIA_ATTESTATION.md for the full FRIA document.
  components:
  - uuid: 8c303a7e-01aa-5f29-8517-978957c411f9
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial
      advisor.
    control-implementations:
    - uuid: 3e5c5cbb-a661-56be-9742-ed8e86fe38f9
      source: https://lula.dev
      description: 'Control implementation for EU FRIA (EU-001). Region: EU_ECB. Posture: eu_ai_act.'
      implemented-requirements:
      - uuid: e30d88ac-5dd8-5a04-b6f3-5eaf024e508e
        control-id: EU_AI_ACT_ART27
        description: Automated lula validation for EU FRIA (EU-001).
        links:
        - href: '#3b422f73-7da4-5147-8c46-8abe44f82892'
          rel: lula
  back-matter:
    resources:
    - uuid: 3b422f73-7da4-5147-8c46-8abe44f82892
      title: Lula Validation — EU FRIA (EU-001)
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: kubernetes
          kubernetes-spec:
            resources:
              - name: cage-gateway-deployment
                resource-rule:
                  group: apps
                  version: v1
                  resource: deployments
                  namespaces:
                    - governance-stack
              - name: cage-deployment-configmap
                resource-rule:
                  group: ""
                  version: v1
                  resource: configmaps
                  namespaces:
                    - governance-stack
        provider:
          type: opa
          opa-spec:
            rego: |
              package lula

              import future.keywords.if
              import future.keywords.in

              gateway_running if {
                some d in input["cage-gateway-deployment"]
                d.metadata.name in {"gateway", "cage-gateway", "stera-gateway"}
                d.status.readyReplicas >= 1
              }

              region_from_configmap if {
                some cm in input["cage-deployment-configmap"]
                cm.metadata.name == "cage-deployment"
                cm.data.CAGE_DEPLOYMENT_REGION in {"EU_ECB", "US_FED", "APAC_MAS"}
                some d in input["cage-gateway-deployment"]
                d.metadata.name in {"gateway", "cage-gateway", "stera-gateway"}
                some container in d.spec.template.spec.containers
                some env in container.env
                env.name == "CAGE_DEPLOYMENT_REGION"
                env.valueFrom.configMapKeyRef.name == "cage-deployment"
              }

              validate if {
                count(input["cage-gateway-deployment"]) > 0
                count(input["cage-deployment-configmap"]) > 0
                gateway_running
                region_from_configmap
              }
