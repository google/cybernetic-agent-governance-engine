component-definition:
  uuid: 2ed0f8fd-6e9e-5bff-870b-a604fcaf8f4d
  metadata:
    title: CAGE Validation — EU FRIA (EU-001)
    last-modified: '2026-11-14T00:00:00Z'
    version: 1.1.1
    oscal-version: 1.1.2
    remarks: |-
      Auto-converted from standalone lula validation format.
      Region: EU_ECB. Posture: eu_ai_act.
      Notes: EU AI Act Art. 27: Fundamental Rights Impact Assessment gating (EU-001). Asserts gateway_running (a gateway Deployment has at least one ready replica) and region_from_configmap (the cage-deployment ConfigMap holds EU_ECB, US_FED or APAC_MAS, and the gateway reads CAGE_DEPLOYMENT_REGION from it through configMapKeyRef).
      It checks neither the fria tier, nor the normative provider, nor that the region is EU_ECB, so a US_FED deployment satisfies it, as the certified Gate W run did. compliance/lula/README.md does not rate it Active.
      Until #664 (372daad2) it also asserted that CAGE_NORMATIVE_PROVIDER is set and not "static", that CAGE_NORMATIVE_ENDPOINT is set, and that the ConfigMap declares EU_ECB. The committed Terraform set none of these for the US_FED staging deployment, and #664 removed the three checks without updating these Notes (POAM-2026-219).
      The fria tier's EU_ECB-only assembly and the refusal of an enforcing EU_ECB posture on the stub provider are verified by tests/governor/test_jurisdiction_wiring.py (POAM-2026-099). Independent external FRIA validation remains tracked by EU-001 (POAM_EU_ECB.md). See also: docs/compliance/eu_ecb/FRIA_ATTESTATION.md.
  components:
  - uuid: 8c303a7e-01aa-5f29-8517-978957c411f9
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial
      advisor.
    control-implementations:
    - uuid: 3e5c5cbb-a661-56be-9742-ed8e86fe38f9
      source: https://lula.dev
      description: 'Control implementation for EU FRIA (EU-001). Region: EU_ECB. Posture: eu_ai_act.'
      implemented-requirements:
      - uuid: e30d88ac-5dd8-5a04-b6f3-5eaf024e508e
        control-id: EU_AI_ACT_ART27
        description: Automated lula validation for EU FRIA (EU-001).
        links:
        - href: '#3b422f73-7da4-5147-8c46-8abe44f82892'
          rel: lula
  back-matter:
    resources:
    - uuid: 3b422f73-7da4-5147-8c46-8abe44f82892
      title: Lula Validation — EU FRIA (EU-001)
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: kubernetes
          kubernetes-spec:
            resources:
              - name: cage-gateway-deployment
                resource-rule:
                  group: apps
                  version: v1
                  resource: deployments
                  namespaces:
                    - governance-stack
              - name: cage-deployment-configmap
                resource-rule:
                  group: ""
                  version: v1
                  resource: configmaps
                  namespaces:
                    - governance-stack
        provider:
          type: opa
          opa-spec:
            output:
              validation: lula.validate
            rego: |
              package lula

              import future.keywords.if
              import future.keywords.in

              gateway_running if {
                some d in input["cage-gateway-deployment"]
                d.metadata.name in {"gateway", "cage-gateway", "stera-gateway"}
                d.status.readyReplicas >= 1
              }

              region_from_configmap if {
                some cm in input["cage-deployment-configmap"]
                cm.metadata.name == "cage-deployment"
                cm.data.CAGE_DEPLOYMENT_REGION in {"EU_ECB", "US_FED", "APAC_MAS"}
                some d in input["cage-gateway-deployment"]
                d.metadata.name in {"gateway", "cage-gateway", "stera-gateway"}
                some container in d.spec.template.spec.containers
                some env in container.env
                env.name == "CAGE_DEPLOYMENT_REGION"
                env.valueFrom.configMapKeyRef.name == "cage-deployment"
              }

              validate if {
                count(input["cage-gateway-deployment"]) > 0
                count(input["cage-deployment-configmap"]) > 0
                gateway_running
                region_from_configmap
              }
