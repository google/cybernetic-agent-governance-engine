# lula-validation-au12.yaml
# NIST SP 800-53 Rev 5 — AU-12: Audit Record Generation & AU-12(1) Time-Correlated Trail
#
# Validates authoritative governance audit record generation and custody:
#   1. Gateway deployment is running with EVIDENCE_STREAM_ENABLED="true" and
#      EVIDENCE_CHAIN_BLOCKING="true" so every governance decision commits an
#      RFC 8785 JCS hash-chained evidence record before action execution.
#   2. Compliance-bridge deployment is running with durable cold-store archival
#      configured (EVIDENCE_COLD_STORE in {"gcs", "s3"}) to drain and KMS-sign
#      hash-chained evidence batches into retention-locked WORM storage.
#
# Langfuse is regional operational LLM trace telemetry and is intentionally NOT
# treated as an AU-12 compliance sink (R-2, F-84).
#
# Domain: kubernetes → Gateway Deployment + Compliance Bridge Deployment
# Provider: opa (inline Rego)
#
# References:
#   - infra/modules/gateway/main.tf — EVIDENCE_STREAM_ENABLED + EVIDENCE_CHAIN_BLOCKING
#   - infra/modules/compliance_bridge/main.tf — EVIDENCE_COLD_STORE WORM archival
#   - src/gateway/governance/evidence/stream.py — Redis Stream hash-chain commit
#   - src/gateway/governance/evidence/cold_store.py — KMS-signed batch WORM export

component-definition:
  uuid: cf25a83a-cdbb-5eb4-a4dd-8a3812a4a76e
  metadata:
    title: CAGE Validation — AU12 (Authoritative Hash-Chained Evidence Custody)
    last-modified: '2026-11-06T00:00:00Z'
    version: 3.0.0
    oscal-version: 1.1.2
    remarks: |
      Region: US_FED. Posture: nist-sp800-53.

      Notes: NIST SP 800-53 Rev 5 AU-12 (Audit Record Generation) and AU-12(1)
      (System-Wide/Time-Correlated Audit Trail). Verifies that the gateway enforces
      blocking RFC 8785 JCS hash-chained evidence writes (EVIDENCE_STREAM_ENABLED=true,
      EVIDENCE_CHAIN_BLOCKING=true) and that compliance-bridge drains signed batches
      to durable object cold storage (EVIDENCE_COLD_STORE in {"gcs", "s3"}).
      Langfuse operational trace telemetry is excluded per R-2 / F-84.
  components:
  - uuid: ce18ebc3-50f2-550a-9fbc-503d5114c06f
    type: software
    title: CAGE Cybernetic Governance Engine
    description: |
      The Cybernetic AI Governance Engine (CAGE) — AI governance gateway with
      blocking hash-chained evidence record generation and KMS-signed WORM archival.
    control-implementations:
    - uuid: 257ab77e-1020-5595-a07b-a8ae59511c0d
      source: https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final
      description: |
        Control implementation for AU-12 and AU-12(1).
        Region: US_FED. Posture: nist-sp800-53.
      implemented-requirements:
      - uuid: 4405db85-a4ec-513f-bc34-161e9935bf04
        control-id: au-12
        description: |
          Automated lula validation for AU-12. Verifies gateway blocking evidence
          stream generation and compliance-bridge durable cold-store archival.
        links:
        - href: '#7a2b3c4d-5e6f-4a8b-9c0d-1e2f3a4b5c6d'
          rel: lula
          text: Blocking evidence chain and durable cold-store custody validation
      - uuid: 8b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
        control-id: au-12.1
        description: |
          AU-12(1) System-Wide/Time-Correlated Audit Trail enhancement.
          Hash-linked RFC 8785 JCS evidence records in src/gateway/governance/evidence/stream.py
          bind timestamp_utc, request_id, previous_hash, decision, and enforcement_tier.
        links:
        - href: '#7a2b3c4d-5e6f-4a8b-9c0d-1e2f3a4b5c6d'
          rel: lula
          text: Hash-linked evidence chain validation
  back-matter:
    resources:
    - uuid: 7a2b3c4d-5e6f-4a8b-9c0d-1e2f3a4b5c6d
      title: Lula Validation — AU-12 Blocking Hash-Chain & Cold-Store Custody
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: kubernetes
          kubernetes-spec:
            resources:
              - name: cage-deployments
                resource-rule:
                  group: apps
                  version: v1
                  resource: deployments
                  namespaces:
                    - governance-stack
        provider:
          type: opa
          opa-spec:
            rego: |
              package lula

              import future.keywords.if
              import future.keywords.in

              env_equals(container, key, expected) if {
                some env in container.env
                env.name == key
                env.value == expected
              }

              gateway_blocking_evidence_ready if {
                some deploy in input["cage-deployments"]
                deploy.metadata.name in {"gateway", "stera-gateway"}
                deploy.status.readyReplicas >= 1
                some container in deploy.spec.template.spec.containers
                container.name == "gateway"
                env_equals(container, "EVIDENCE_STREAM_ENABLED", "true")
                env_equals(container, "EVIDENCE_CHAIN_BLOCKING", "true")
              }

              bridge_cold_store_ready if {
                some deploy in input["cage-deployments"]
                deploy.metadata.name == "compliance-bridge"
                deploy.status.readyReplicas >= 1
                some container in deploy.spec.template.spec.containers
                some env in container.env
                env.name == "EVIDENCE_COLD_STORE"
                env.value in {"gcs", "s3"}
              }

              validate if {
                count(input["cage-deployments"]) > 0
                gateway_blocking_evidence_ready
                bridge_cold_store_ready
              }

