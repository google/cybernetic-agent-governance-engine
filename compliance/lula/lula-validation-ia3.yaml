# lula-validation-ia3.yaml
# NIST SP 800-53 Rev 5 — IA-3: Device Identification and Authentication
#
# POAM-007 STATUS: CLOSED 2026-05-17
# Asserts Linkerd mTLS workload identity enforcement on the gateway Deployment,
# L3/L4 NetworkPolicy isolation, and in-pod OPA UDS sidecar isolation (zero TCP
# listener ports, --addr=unix:///var/run/opa/opa.sock, --authorization=basic).
#
# References:
#   - infra/targets/gcp-gke/network_policy.tf — default-deny and L3/L4 NetworkPolicy definitions
#   - infra/modules/service_mesh/main.tf & infra/modules/gateway/mesh-policy/ — Linkerd mTLS SPIFFE authorization policies
#   - infra/modules/gateway/main.tf — Gateway UDS OPA sidecar
#   - docs/POAM.md — POAM-007 (IA-3: Linkerd mTLS — CLOSED 2026-05-17)

component-definition:
  uuid: f9dc196a-c256-50dc-8884-955eb90df5a6
  metadata:
    title: CAGE Validation — IA3
    last-modified: '2026-11-08T00:00:00Z'
    version: 1.1.0
    oscal-version: 1.1.2
    remarks: |-
      Region: US_FED. Posture: nist-sp800-53.
      Notes: NIST SP 800-53 Rev 5 IA-3: Device Identification and Authentication. POAM-007 CLOSED 2026-05-17 — Linkerd mTLS implemented. Namespace: governance-stack.
      Asserts Linkerd mTLS CAGE_TRUSTED_CLIENT_IDENTITIES enforcement on the gateway Deployment, active NetworkPolicy isolation, and in-pod OPA UDS sidecar execution with zero TCP listener ports (D-195-3).
      See: docs/POAM.md — POAM-007 (IA-3: Linkerd mTLS — CLOSED 2026-05-17). See: compliance/continuous-monitoring/ISCM_STRATEGY.md — IA-3 monitoring cadence.
  components:
  - uuid: fb5c6ee6-5166-560c-afa9-9327e94bb14b
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial
      advisor.
    control-implementations:
    - uuid: b0982882-d418-5f5f-b01c-c473cbb86fba
      source: https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final
      description: 'Control implementation for IA3. Region: US_FED. Posture: nist-sp800-53.'
      implemented-requirements:
      - uuid: a92a8532-0edd-5c5f-800e-a112ff570d38
        control-id: ia3
        description: Automated lula validation for IA3.
        links:
        - href: '#976c6d03-26a0-5071-86ec-98978bdc5a7e'
          rel: lula
  back-matter:
    resources:
    - uuid: 976c6d03-26a0-5071-86ec-98978bdc5a7e
      title: Lula Validation — IA3
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: kubernetes
          kubernetes-spec:
            resources:
              - name: cage-deployments
                resource-rule:
                  group: apps
                  version: v1
                  resource: deployments
                  namespaces:
                    - governance-stack
              - name: cage-network-policies
                resource-rule:
                  group: networking.k8s.io
                  version: v1
                  resource: networkpolicies
                  namespaces:
                    - governance-stack
        provider:
          type: opa
          opa-spec:
            output:
              validation: lula.validate
            rego: |
              package lula

              import future.keywords.if
              import future.keywords.in

              # IA-3: Device Identification and Authentication — Linkerd mTLS & OPA UDS Sidecar
              gateway_mtls_identity_enforced if {
                some deploy in input["cage-deployments"]
                deploy.metadata.name == "gateway"
                some container in deploy.spec.template.spec.containers
                some env in container.env
                env.name == "CAGE_TRUSTED_CLIENT_IDENTITIES"
                env.value != ""
              }

              opa_uds_sidecar_running if {
                some deploy in input["cage-deployments"]
                deploy.metadata.name == "gateway"
                deploy.status.readyReplicas >= 1
                some opa in deploy.spec.template.spec.containers
                opa.name == "opa"
                "--addr=unix:///var/run/opa/opa.sock" in opa.args
                "--authorization=basic" in opa.args
                count(object.get(opa, "ports", [])) == 0
              }

              network_isolation_present if {
                some np in input["cage-network-policies"]
                np.metadata.name in {"default-deny-external-egress", "default-deny-ingress", "gateway-egress-l3-l4"}
              }

              validate if {
                count(input["cage-deployments"]) > 0
                count(input["cage-network-policies"]) > 0
                gateway_mtls_identity_enforced
                opa_uds_sidecar_running
                network_isolation_present
              }
