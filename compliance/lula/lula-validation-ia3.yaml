# lula-validation-ia3.yaml
# NIST SP 800-53 Rev 5 — IA-3: Device Identification and Authentication
#
# POAM-007 STATUS: CLOSED 2026-05-17
# Linkerd mTLS has been implemented across all intra-cluster service
# communication in the governance-stack namespace.  This validation has been
# updated from the previous compensating-control assertion (NetworkPolicy +
# OPA + intent annotation) to assert the actual Linkerd mTLS posture.
#
# Asserts that:
#   1. The Linkerd control-plane namespace exists (linkerd namespace present).
#   2. All Deployments in governance-stack carry the
#      linkerd.io/inject: enabled annotation on their pod template, confirming
#      the Linkerd proxy sidecar is injected for mTLS.
#   3. The default-deny-ingress NetworkPolicy still exists as a defence-in-depth
#      L3/L4 control (retained post-mTLS per security hardening policy).
#   4. The OPA Deployment is running (policy-based access enforcement layer).
#
# Domain: kubernetes → Deployments, NetworkPolicies, Namespaces
# Provider: opa (inline Rego)
#
# References:
#   - deployment/k8s/network-policy.yaml — default-deny-ingress NetworkPolicy
#   - deployment/k8s/network-policy-hardening.yaml — hardened L3/L4 policies
#   - deployment/k8s/opa.yaml — OPA Deployment
#   - docs/POAM.md — POAM-007 (IA-3: Linkerd mTLS — CLOSED 2026-05-17)
#
# OSCAL Mapping:
#   component: cage-gateway
#   control: ia-3
#
# Namespace: governance-stack (confirmed from live cluster deployment snapshot)

metadata:
  annotations:
    cage.region: US_FED
    cage.compliance-posture: nist-sp800-53
    cage.posture-note: "NIST SP 800-53 is a US Federal posture requirement. This validation is skipped for EU_ECB and APAC_MAS deployments."
    cage.poam-007: "CLOSED 2026-05-17 — Linkerd mTLS implemented. Validation updated from compensating-control to full mTLS assertion."

domain:
  type: kubernetes
  kubernetes-spec:
    resources:
      - name: cage-deployments
        resource: deployments
        namespace: governance-stack
      - name: cage-network-policies
        resource: networkpolicies
        namespace: governance-stack
      - name: opa-deployment
        resource: deployments
        namespace: governance-stack
      - name: linkerd-namespaces
        resource: namespaces

provider:
  type: opa
  opa-spec:
    rego: |
      package lula

      import future.keywords.if
      import future.keywords.every

      # IA-3: Device Identification and Authentication — Linkerd mTLS (POAM-007 CLOSED)
      #
      # POAM-007 was closed 2026-05-17 after Linkerd mTLS was deployed across
      # all intra-cluster service communication in governance-stack.
      #
      # This validation asserts the full mTLS posture:
      #   (1) Linkerd control-plane namespace exists
      #   (2) All governance-stack Deployments have Linkerd proxy injection enabled
      #   (3) default-deny NetworkPolicy retained as defence-in-depth
      #   (4) OPA Deployment running for policy-based access enforcement

      # Check 1: Linkerd control-plane namespace must exist.
      linkerd_namespace_exists if {
        some ns in input["linkerd-namespaces"]
        ns.metadata.name == "linkerd"
      }

      # Check 2: All Deployments in governance-stack must have Linkerd proxy
      # injection enabled on their pod template spec.
      # The annotation linkerd.io/inject: "enabled" on the pod template causes
      # the Linkerd admission webhook to inject the proxy sidecar, establishing
      # per-pod mTLS identity via SPIFFE/X.509 certificates.
      deployments_have_linkerd_injection if {
        every deploy in input["cage-deployments"] {
          deploy.spec.template.metadata.annotations["linkerd.io/inject"] == "enabled"
        }
      }

      # Check 3: default-deny-ingress NetworkPolicy must still exist as
      # defence-in-depth (L3/L4 isolation retained post-mTLS).
      default_deny_exists if {
        some np in input["cage-network-policies"]
        np.metadata.name == "default-deny-ingress"
        np.spec.policyTypes[_] == "Ingress"
      }

      # Check 4: OPA Deployment must be running (policy-based access enforcement).
      opa_running if {
        input["opa-deployment"].status.readyReplicas >= 1
      }

      validate if {
        linkerd_namespace_exists
        deployments_have_linkerd_injection
        default_deny_exists
        opa_running
      }

notes: >
  NIST SP 800-53 Rev 5 IA-3: Device Identification and Authentication.
  POAM-007 CLOSED 2026-05-17 — Linkerd mTLS implemented.
  Namespace: governance-stack (confirmed from live cluster deployment snapshot).

  This validation was updated from the previous compensating-control assertion
  (NetworkPolicy + OPA + intent annotation) to assert the actual Linkerd mTLS
  posture following POAM-007 closure.

  Linkerd provides per-pod cryptographic identity via SPIFFE/X.509 certificates
  issued by the Linkerd certificate authority.  The linkerd.io/inject: "enabled"
  annotation on pod templates causes the Linkerd admission webhook to inject the
  proxy sidecar, which transparently upgrades all intra-cluster TCP connections
  to mTLS.  This provides cryptographic device identity verification for all
  service-to-service communication within governance-stack.

  Retained controls (defence-in-depth):
    - default-deny-ingress NetworkPolicy (L3/L4 isolation)
    - OPA Deployment (policy-based access enforcement on every request)

  Evidence:
    - Linkerd namespace existence confirms control-plane is deployed
    - linkerd.io/inject: "enabled" on all pod templates confirms proxy injection
    - NetworkPolicy and OPA assertions confirm defence-in-depth layers are live

  See: docs/POAM.md — POAM-007 (IA-3: Linkerd mTLS — CLOSED 2026-05-17).
  See: compliance/continuous-monitoring/ISCM_STRATEGY.md — IA-3 monitoring cadence.
