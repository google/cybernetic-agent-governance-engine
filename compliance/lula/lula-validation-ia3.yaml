    version: 1.0.0
    oscal-version: 1.1.2
    remarks: "Auto-converted from standalone lula validation format.\nRegion: US_FED. Posture: nist-sp800-53.\nNotes: NIST SP 800-53 Rev 5 IA-3: Device Identification and Authentication. POAM-007 CLOSED 2026-05-17 — Linkerd mTLS implemented. Namespace: governance-stack (confirmed from live cluster deployment snapshot).\nThis validation was updated from the previous compensating-control assertion (NetworkPolicy + OPA + intent annotation) to assert the actual Linkerd mTLS posture following POAM-007 closure.\nLinkerd provides per-pod cryptographic identity via SPIFFE/X.509 certificates issued by the Linkerd certificate authority.  The linkerd.io/inject: \"enabled\" annotation on pod templates causes the Linkerd admission webhook to inject the proxy sidecar, which transparently upgrades all intra-cluster TCP connections to mTLS.  This provides cryptographic device identity verification for all service-to-service communication within governance-stack.\nRetained controls (defence-in-depth):\n  - default-deny-ingress NetworkPolicy (L3/L4 isolation)\n  - OPA Deployment (policy-based access enforcement on every request)\n\nEvidence:\n  - Linkerd namespace existence confirms control-plane is deployed\n  - linkerd.io/inject: \"enabled\" on all pod templates confirms proxy injection\n  - NetworkPolicy and OPA assertions confirm defence-in-depth layers are live\n\nSee: docs/POAM.md — POAM-007 (IA-3: Linkerd mTLS — CLOSED 2026-05-17). See: compliance/continuous-monitoring/ISCM_STRATEGY.md — IA-3 monitoring cadence."
  components:
