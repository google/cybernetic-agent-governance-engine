  back-matter:
    resources:
    - uuid: 976c6d03-26a0-5071-86ec-98978bdc5a7e
      title: Lula Validation — IA3
      rlinks:
      - href: lula.dev
      description: "domain:\n  type: kubernetes\n  kubernetes-spec:\n    resources:\n    - name: cage-deployments\n      resource: deployments\n      namespace: governance-stack\n    - name: cage-network-policies\n      resource: networkpolicies\n      namespace: governance-stack\n    - name: opa-deployment\n      resource: deployments\n      namespace: governance-stack\n    - name: linkerd-namespaces\n      resource: namespaces\nprovider:\n  type: opa\n  opa-spec:\n    rego: \"package lula\\n\\nimport future.keywords.if\\nimport future.keywords.every\\n\\n# IA-3: Device Identification and Authentication — Linkerd mTLS (POAM-007 CLOSED)\\n#\\n# POAM-007 was closed 2026-05-17 after Linkerd mTLS was deployed across\\n# all intra-cluster service communication in governance-stack.\\n#\\n# This validation asserts the full mTLS posture:\\n#   (1) Linkerd control-plane namespace exists\\n#   (2) All governance-stack Deployments have Linkerd proxy injection enabled\\n#   (3) default-deny NetworkPolicy retained as defence-in-depth\\n#   (4) OPA Deployment running for policy-based access enforcement\\n\\n# Check 1: Linkerd control-plane namespace must exist.\\nlinkerd_namespace_exists if {\\n  some ns in input[\\\"linkerd-namespaces\\\"]\\n  ns.metadata.name == \\\"linkerd\\\"\\n}\\n\\n# Check 2: All Deployments in governance-stack must have Linkerd proxy\\n# injection enabled on their pod template spec.\\n# The annotation linkerd.io/inject: \\\"enabled\\\" on the pod template causes\\n# the Linkerd admission webhook to inject the proxy sidecar, establishing\\n# per-pod mTLS identity via SPIFFE/X.509 certificates.\\ndeployments_have_linkerd_injection if {\\n  every deploy in input[\\\"cage-deployments\\\"] {\\n    deploy.spec.template.metadata.annotations[\\\"linkerd.io/inject\\\"] == \\\"enabled\\\"\\n  }\\n}\\n\\n# Check 3: default-deny-ingress NetworkPolicy must still exist as\\n# defence-in-depth (L3/L4 isolation retained post-mTLS).\\ndefault_deny_exists if {\\n  some np in input[\\\"cage-network-policies\\\"]\\n  np.metadata.name == \\\"default-deny-ingress\\\"\\n  np.spec.policyTypes[_] == \\\"Ingress\\\"\\n}\\n\\n# Check 4: OPA Deployment must be running (policy-based access enforcement).\\nopa_running if {\\n  input[\\\"opa-deployment\\\"].status.readyReplicas >= 1\\n}\\n\\nvalidate if {\\n  linkerd_namespace_exists\\n  deployments_have_linkerd_injection\\n  default_deny_exists\\n  opa_running\\n}\\n\"\n"
