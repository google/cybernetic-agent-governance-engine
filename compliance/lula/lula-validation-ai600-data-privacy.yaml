component-definition:
  uuid: 3d1dbd6c-707c-5413-a028-f83477167fb3
  metadata:
    title: CAGE Validation — AI600 DATA PRIVACY
    last-modified: '2026-07-01T13:18:54Z'
    version: 1.0.0
    oscal-version: 1.1.2
    remarks: "Auto-converted from standalone lula validation format.\nRegion: US_FED. Posture: nist-ai-600-1.\nNotes: NIST AI 600-1 §2.2: Data Privacy controls. Phase 2 assertions:\n  (1) pii-sanitizer-config ConfigMap must exist in governance-stack namespace.\n      Confirms Presidio PII sanitizer configuration is deployed.\n  (2) PII_AUDIT_LOG_ENABLED=true in ConfigMap data.\n      Confirms all PII sanitization events are audited to the compliance\n      Langfuse project (ISO 42001 A.9.2 evidence trail).\n  (3) gateway Deployment must have PII_SANITIZER_ENABLED=true env var.\n      Confirms the Presidio sanitizer pipeline is active at runtime.\nPRESIDIO_SCORE_THRESHOLD is configurable via ConfigMap (default: 0.5). Remediates: AI600-002 (POAM_US_FED.md)."
  components:
  - uuid: eebb2ead-6958-546d-b49d-ad2735ccb790
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial advisor.
    control-implementations:
    - uuid: 46d8f22c-6c50-5867-8a49-72bee3cae8b0
      source: https://lula.dev
      description: 'Control implementation for AI600 DATA PRIVACY. Region: US_FED. Posture: nist-ai-600-1.'
      implemented-requirements:
      - uuid: 3764d453-c096-5bc5-88c0-68c00d20e32c
        control-id: ai600-data-privacy
        description: Automated lula validation for AI600 DATA PRIVACY.
        links:
        - href: '#1e6ac52b-5ff6-5958-969d-2c143edb592b'
          rel: lula
  back-matter:
    resources:
    - uuid: 1e6ac52b-5ff6-5958-969d-2c143edb592b
      title: Lula Validation — AI600 DATA PRIVACY
      rlinks:
      - href: lula.dev
      description: "domain:\n  type: kubernetes\n  kubernetes-spec:\n    resources:\n    - name: pii-sanitizer-config\n      resource: configmaps\n      namespace: governance-stack\n      filters:\n      - field: metadata.name\n        value: pii-sanitizer-config\n    - name: gateway-deployment\n      resource: deployments\n      namespace: governance-stack\n      filters:\n      - field: metadata.name\n        value: gateway\nprovider:\n  type: opa\n  opa-spec:\n    rego: \"package lula\\n\\nimport future.keywords.if\\n\\n# AI 600-1 §2.2 Data Privacy Controls\\n#\\n# Check 1: pii-sanitizer-config ConfigMap exists in governance-stack namespace\\n# Check 2: PII_AUDIT_LOG_ENABLED=true in ConfigMap data\\n# Check 3: gateway Deployment has PII_SANITIZER_ENABLED=true env var\\n\\npii_config_exists if {\\n  input[\\\"pii-sanitizer-config\\\"].metadata.name == \\\"pii-sanitizer-config\\\"\\n}\\n\\npii_audit_log_enabled if {\\n  input[\\\"pii-sanitizer-config\\\"].data.PII_AUDIT_LOG_ENABLED == \\\"true\\\"\\n}\\n\\ngateway_has_pii_sanitizer if {\\n  some container in input[\\\"gateway-deployment\\\"].spec.template.spec.containers\\n  container.name == \\\"gateway\\\"\\n  some env in container.env\\n  env.name == \\\"PII_SANITIZER_ENABLED\\\"\\n  env.value == \\\"true\\\"\\n}\\n\\nvalidate if {\\n  pii_config_exists\\n  pii_audit_log_enabled\\n  gateway_has_pii_sanitizer\\n}\\n\"\n"
