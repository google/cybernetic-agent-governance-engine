component-definition:
  uuid: c0be590a-584c-5103-90a8-1db6bf900941
  metadata:
    title: CAGE Validation — TQP007 (CTRL_TQP_007)
    last-modified: '2026-07-01T13:18:54Z'
    version: 1.0.0
    oscal-version: 1.1.2
    remarks: |-
      Auto-converted from standalone lula validation format.
      Region: ALL. Posture: iso42001.
      Notes: ISO 42001 §A.8.4: AI System Operation Controls — TokenQuotaProxy fail-closed. Asserts that the TokenQuotaProxy Deployment:
        (1) Is Running with ≥1 ready replica in governance-stack namespace.
        (2) Has REDIS_URL env var set (points to a running Redis instance).
        (3) Has TOKEN_QUOTA_FAIL_CLOSED=true env var set, ensuring quota enforcement
            fails CLOSED (deny all) rather than OPEN (allow uncapped) when Redis is
            unavailable.
      STPA hazard H-7: TokenQuotaProxy Redis connection failure causes quota enforcement to fail-OPEN, enabling denial-of-governance via resource exhaustion. CTRL_TQP_007 compensates by requiring fail-closed behavior. POAM reference: ISO-004 (POAM_ISO42001.md). OSCAL mapping: compliance/oscal/component-definition.yaml, component tqp007.
  components:
  - uuid: 963fd02f-e09a-5110-8678-75f1ef7e10f8
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial
      advisor.
    control-implementations:
    - uuid: fa3a2446-e669-51fb-89d0-809f86be5882
      source: https://www.iso.org/standard/81230.html
      description: 'Control implementation for TQP007 (CTRL_TQP_007). Region: ALL. Posture: iso42001.'
      implemented-requirements:
      - uuid: 14246452-86b5-58f7-abc8-9ef7f2a9e9f1
        control-id: A.8.4
        description: Automated lula validation for TQP007 (CTRL_TQP_007).
        links:
        - href: '#7ce8309c-ecfc-5208-ba63-f6d01d8335b0'
          rel: lula
  back-matter:
    resources:
    - uuid: 7ce8309c-ecfc-5208-ba63-f6d01d8335b0
      title: Lula Validation — TQP007 (CTRL_TQP_007)
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: kubernetes
          kubernetes-spec:
            resources:
              - name: token-quota-proxy-deployment
                resource-rule:
                  group: apps
                  version: v1
                  resource: deployments
                  namespaces:
                    - governance-stack
        provider:
          type: opa
          opa-spec:
            output:
              validation: lula.validate
            rego: |
              package lula

              import future.keywords.if
              import future.keywords.in

              # ISO 42001 §A.8.4 — TokenQuotaProxy fail-closed control (CTRL_TQP_007)
              tqp_running if {
                some d in input["token-quota-proxy-deployment"]
                d.metadata.name in {"gateway", "token-quota-proxy", "stera-gateway"}
                d.status.readyReplicas >= 1
              }

              tqp_has_redis_url if {
                some d in input["token-quota-proxy-deployment"]
                d.metadata.name in {"gateway", "token-quota-proxy", "stera-gateway"}
                some container in d.spec.template.spec.containers
                some env in container.env
                env.name == "REDIS_URL"
                env.value != ""
              }

              validate if {
                count(input["token-quota-proxy-deployment"]) > 0
                tqp_running
                tqp_has_redis_url
              }
