    remarks: "Auto-converted from standalone lula validation format.\nRegion: US_FED. Posture: nist-sp800-53.\nNotes: NIST SP 800-53 Rev 5 SC-8: Transmission Confidentiality and Integrity. Namespace: governance-stack (confirmed from live cluster deployment snapshot). Implements four transmission security assertions for the CAGE governance namespace:\n  (1) All Services must expose TLS ports (443 or 8443) or be named \"https\".\n      ClusterIP services annotated cage.io/internal-only: \"true\" are exempt\n      (they rely on NetworkPolicy L3/L4 isolation for confidentiality).\n  (2) default-deny-ingress NetworkPolicy must exist (enforces boundary isolation\n      per network-policy.yaml; prevents unencrypted lateral movement).\n  (3) All Ingress resources must have spec.tls blocks configured (no HTTP-only\n      ingress paths; TLS termination at the cluster edge required).\n  (4) All Deployments must have readOnlyRootFilesystem: true in container\n      securityContext OR carry the cage.io/tls-enforced: \"true\" annotation\n      (defense-in-depth: immutable filesystem prevents TLS config tampering).\nRemediates: POAM-011 (SC-8: no encryption-in-transit validation test). This Lula validation provides automated SC-8 evidence in lieu of the missing test assertion in tests/test_gateway_connectivity.py (see POAM-011). See: compliance/continuous-monitoring/ISCM_STRATEGY.md — SC-8 monitoring cadence. See: docs/POAM.md — POAM-011 (SC-8 remediation)."
