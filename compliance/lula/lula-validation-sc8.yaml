    - uuid: a4ff5a9e-3621-52c6-9c1f-157e6e432b5e
      title: Lula Validation — SC8
      rlinks:
      - href: lula.dev
      description: "domain:\n  type: kubernetes\n  kubernetes-spec:\n    resources:\n    - name: cage-services\n      resource: services\n      namespace: governance-stack\n    - name: cage-network-policies\n      resource: networkpolicies\n      namespace: governance-stack\n    - name: cage-ingresses\n      resource: ingresses\n      namespace: governance-stack\n    - name: cage-deployments\n      resource: deployments\n      namespace: governance-stack\nprovider:\n  type: opa\n  opa-spec:\n    rego: \"package lula\\n\\nimport future.keywords.if\\nimport future.keywords.every\\n\\n# SC-8: Transmission Confidentiality and Integrity\\n#\\n# Check 1: All Services must expose port 443, 8443, or use name \\\"https\\\".\\n#          ClusterIP internal-only services on other ports are allowed only\\n#          if they carry the cage.io/internal-only: \\\"true\\\" annotation.\\n# Check 2: default-deny-ingress NetworkPolicy must exist.\\n# Check 3: All Ingress resources must have TLS blocks configured.\\n# Check 4: Deployments must have readOnlyRootFilesystem: true\\n#          OR carry cage.io/tls-enforced: \\\"true\\\" annotation.\\n\\n# Allowed TLS port numbers for external-facing services\\nis_tls_port(port) if { port.port == 443 }\\nis_tls_port(port) if { port.port == 8443 }\\nis_tls_port(port) if { port.name == \\\"https\\\" }\\n\\n# Internal-only services (ClusterIP with annotation) are exempt from TLS port check\\nis_cluster_internal(svc) if {\\n  svc.spec.type == \\\"ClusterIP\\\"\\n  svc.metadata.annotations[\\\"cage.io/internal-only\\\"] == \\\"true\\\"\\n}\\n\\n# Check 1: Services expose TLS ports or are annotated as internal-only.\\nservices_use_tls if {\\n  every svc in input[\\\"cage-services\\\"] {\\n    svc.metadata.name != \\\"kubernetes\\\"\\n    is_cluster_internal(svc)\\n  }\\n}\\n\\nservices_use_tls if {\\n  non_internal_svcs := [s | s := input[\\\"cage-services\\\"][_]; s.metadata.name != \\\"kubernetes\\\"; not is_cluster_internal(s)]\\n  every svc in non_internal_svcs {\\n    some port in svc.spec.ports\\n    is_tls_port(port)\\n  }\\n}\\n\\n# Check 2: default-deny NetworkPolicy must exist.\\ndefault_deny_exists if {\\n  some np in input[\\\"cage-network-policies\\\"]\\n  np.metadata.name == \\\"default-deny-ingress\\\"\\n  np.spec.policyTypes[_] == \\\"Ingress\\\"\\n}\\n\\n# Check 3: All Ingress resources must have TLS configured.\\ningresses_have_tls if {\\n  count(input[\\\"cage-ingresses\\\"]) == 0  # No ingresses — acceptable for internal deployments\\n}\\n\\ningresses_have_tls if {\\n  count(input[\\\"cage-ingresses\\\"]) > 0\\n  every ingress in input[\\\"cage-ingresses\\\"] {\\n    count(ingress.spec.tls) > 0\\n  }\\n}\\n\\n# Check 4: Deployments have readOnlyRootFilesystem OR TLS annotation.\\ndeployment_tls_enforced(deploy) if {\\n  deploy.metadata.annotations[\\\"cage.io/tls-enforced\\\"] == \\\"true\\\"\\n}\\n\\ndeployment_tls_enforced(deploy) if {\\n  some container in deploy.spec.template.spec.containers\\n  container.securityContext.readOnlyRootFilesystem == true\\n}\\n\\ndeployments_secure if {\\n  every deploy in input[\\\"cage-deployments\\\"] {\\n    deployment_tls_enforced(deploy)\\n  }\\n}\\n\\nvalidate if {\\n  services_use_tls\\n  default_deny_exists\\n  ingresses_have_tls\\n  deployments_secure\\n}\\n\"\n"
