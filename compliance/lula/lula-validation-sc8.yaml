# lula-validation-sc8.yaml
# NIST SP 800-53 Rev 5 — SC-8: Transmission Confidentiality and Integrity
#
# Asserts that:
#   1. All Services in the governance-stack namespace use port 443 or 8443 or named "https"
#      (no cleartext HTTP-only services exposed externally)
#   2. A default-deny NetworkPolicy exists (enforcing ingress restrictions)
#   3. Ingress resources (if any) have TLS configured
#   4. Deployments have readOnlyRootFilesystem: true OR carry a TLS enforcement
#      annotation (cage.io/tls-enforced: "true")
#
# Domain: kubernetes → Services, NetworkPolicies, Ingresses, Deployments
# Provider: opa (inline Rego)
#
# References:
#   - deployment/k8s/network-policy.yaml — default-deny-ingress NetworkPolicy
#   - deployment/k8s/ingress.yaml — Ingress TLS configuration
#   - deployment/k8s/backend-deployment.yaml — container security context
#   - docs/POAM.md — POAM-011 (SC-8: no TLS assertion in test suite)
#
# OSCAL Mapping:
#   component: cage-gateway
#   control: sc-8
#
# Namespace: governance-stack (confirmed from live cluster deployment snapshot)

