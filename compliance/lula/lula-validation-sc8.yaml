# lula-validation-sc8.yaml
# NIST SP 800-53 Rev 5 — SC-8: Transmission Confidentiality and Integrity
#
# Asserts one thing, redis_ca_pinned: the gateway and compliance-bridge
# Deployments mount a *-redis-ca ConfigMap read-only at /etc/cage/tls/redis, set
# REDIS_CA_CERT_PATH=/etc/cage/tls/redis/ca.pem, and carry a non-empty
# cage.io/redis-ca-sha256 pod-template annotation (POAM-2026-086).
#
# It checks neither Linkerd mTLS nor Service, Ingress or NetworkPolicy TLS.
# Until 2026-11-14 this header listed four more checks: TLS Service ports, a
# default-deny NetworkPolicy, Ingress TLS, and readOnlyRootFilesystem or a TLS
# annotation on every Deployment. #664 (372daad2) removed them from the Rego and
# left the header claiming them (POAM-2026-219). POAM-011, the missing
# encryption-in-transit assertion, remains open.
#
# Domain: kubernetes → Deployments
# Provider: opa (inline Rego)
#
# References:
#   - infra/modules/gateway/main.tf — gateway-redis-ca ConfigMap & mount
#   - infra/modules/compliance_bridge/main.tf — compliance-bridge-redis-ca ConfigMap & mount
#   - docs/POAM.md — POAM-2026-086 (SC-8: Memorystore CA pinning), POAM-2026-219
#   - docs/compliance/us_fed/POAM_US_FED.md — POAM-011 (SC-8: no TLS assertion in test suite)
#
# OSCAL Mapping:
#   component: cage-gateway
#   control: sc-8
#
# Namespace: governance-stack (confirmed from live cluster deployment snapshot)

component-definition:
  uuid: 0625ad3c-dd04-5999-9bcd-2018ef7828b7
  metadata:
    title: CAGE Validation — SC8
    last-modified: '2026-11-14T00:00:00Z'
    version: 1.1.1
    oscal-version: 1.1.2
    remarks: |-
      Auto-converted from standalone lula validation format.
      Region: US_FED. Posture: nist-sp800-53.
      Notes: NIST SP 800-53 Rev 5 SC-8: Transmission Confidentiality and Integrity. Namespace: governance-stack (confirmed from live cluster deployment snapshot). Asserts redis_ca_pinned: the gateway and compliance-bridge Deployments mount a *-redis-ca ConfigMap read-only at /etc/cage/tls/redis, set REDIS_CA_CERT_PATH=/etc/cage/tls/redis/ca.pem, and carry a non-empty cage.io/redis-ca-sha256 pod-template annotation, which pins the Memorystore managed server CA and rolls pods on CA rotation.
      It checks neither Linkerd mTLS nor Service, Ingress or NetworkPolicy TLS. Until 2026-11-14 these Notes described four more assertions (TLS Service ports, a default-deny-ingress NetworkPolicy, Ingress TLS, and readOnlyRootFilesystem or a TLS annotation on every Deployment), which #664 (372daad2) had removed from the Rego (POAM-2026-219).
      Evidence for POAM-2026-086 (SC-8: Memorystore managed CA pinning in gateway and compliance-bridge). It does not remediate POAM-011 (SC-8: no encryption-in-transit validation test), which remains open. See: compliance/continuous-monitoring/ISCM_STRATEGY.md — SC-8 monitoring cadence. See: docs/POAM.md — POAM-2026-086, POAM-2026-219.
  components:
  - uuid: 6a1a452d-4510-5333-bfe5-d114471d57e5
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial
      advisor.
    control-implementations:
    - uuid: 2ddc6d0d-c35e-583b-b5bb-12a5a69cbca8
      source: https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final
      description: 'Control implementation for SC8. Region: US_FED. Posture: nist-sp800-53.'
      implemented-requirements:
      - uuid: 50796b20-07f7-5904-acae-cf0e2f117f15
        control-id: sc8
        description: Automated lula validation for SC8.
        links:
        - href: '#a4ff5a9e-3621-52c6-9c1f-157e6e432b5e'
          rel: lula
  back-matter:
    resources:
    - uuid: a4ff5a9e-3621-52c6-9c1f-157e6e432b5e
      title: Lula Validation — SC8
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: kubernetes
          kubernetes-spec:
            resources:
              - name: cage-deployments
                resource-rule:
                  group: apps
                  version: v1
                  resource: deployments
                  namespaces:
                    - governance-stack
        provider:
          type: opa
          opa-spec:
            output:
              validation: lula.validate
            rego: |
              package lula

              import future.keywords.if
              import future.keywords.every
              import future.keywords.in

              # SC-8: Transmission Confidentiality and Integrity (POAM-2026-086)
              redis_tls_deployments := {
                "gateway",
                "compliance-bridge",
              }

              deployment_pins_redis_ca(deploy) if {
                deploy.spec.template.metadata.annotations["cage.io/redis-ca-sha256"] != ""
                some vol in deploy.spec.template.spec.volumes
                endswith(vol.configMap.name, "-redis-ca")
                some container in deploy.spec.template.spec.containers
                some vm in container.volumeMounts
                vm.name == vol.name
                vm.mountPath == "/etc/cage/tls/redis"
                vm.readOnly == true
                some env in container.env
                env.name == "REDIS_CA_CERT_PATH"
                env.value == "/etc/cage/tls/redis/ca.pem"
              }

              redis_ca_pinned if {
                every req_name in redis_tls_deployments {
                  matching := [d | some d in input["cage-deployments"]; d.metadata.name == req_name]
                  count(matching) >= 1
                  every deploy in matching {
                    deployment_pins_redis_ca(deploy)
                  }
                }
              }

              validate if {
                count(input["cage-deployments"]) > 0
                redis_ca_pinned
              }
