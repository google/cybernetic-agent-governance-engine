# lula-validation-sc8.yaml
# NIST SP 800-53 Rev 5 — SC-8: Transmission Confidentiality and Integrity
#
# Asserts that:
#   1. All Services in the governance-stack namespace use port 443 or 8443 or named "https"
#      (no cleartext HTTP-only services exposed externally)
#   2. A default-deny NetworkPolicy exists (enforcing ingress restrictions)
#   3. Ingress resources (if any) have TLS configured
#   4. Deployments have readOnlyRootFilesystem: true OR carry a TLS enforcement
#      annotation (cage.io/tls-enforced: "true")
#   5. The gateway and compliance-bridge Deployments mount a *-redis-ca ConfigMap
#      read-only at /etc/cage/tls/redis, set REDIS_CA_CERT_PATH=/etc/cage/tls/redis/ca.pem,
#      and carry a non-empty cage.io/redis-ca-sha256 pod-template annotation (POAM-2026-086)
#
# Domain: kubernetes → Services, NetworkPolicies, Ingresses, Deployments
# Provider: opa (inline Rego)
#
# References:
#   - infra/targets/gcp-gke/network_policy.tf — default-deny and hardened NetworkPolicy definitions
#   - infra/targets/gcp-gke/perimeter.tf — GKE Ingress managed TLS & Cloud Armor BackendConfig
#   - infra/modules/governed_advisor/main.tf — container security context
#   - infra/modules/gateway/main.tf — gateway-redis-ca ConfigMap & mount
#   - infra/modules/compliance_bridge/main.tf — compliance-bridge-redis-ca ConfigMap & mount
#   - docs/POAM.md — POAM-011 (SC-8: no TLS assertion in test suite), POAM-2026-086 (SC-8: Memorystore CA pinning)
#
# OSCAL Mapping:
#   component: cage-gateway
#   control: sc-8
#
# Namespace: governance-stack (confirmed from live cluster deployment snapshot)

component-definition:
  uuid: 0625ad3c-dd04-5999-9bcd-2018ef7828b7
  metadata:
    title: CAGE Validation — SC8
    last-modified: '2026-10-01T00:00:00Z'
    version: 1.1.0
    oscal-version: 1.1.2
    remarks: |-
      Auto-converted from standalone lula validation format.
      Region: US_FED. Posture: nist-sp800-53.
      Notes: NIST SP 800-53 Rev 5 SC-8: Transmission Confidentiality and Integrity. Namespace: governance-stack (confirmed from live cluster deployment snapshot). Implements five transmission security assertions for the CAGE governance namespace:
        (1) All Services must expose TLS ports (443 or 8443) or be named "https".
            ClusterIP services annotated cage.io/internal-only: "true" are exempt
            (they rely on NetworkPolicy L3/L4 isolation for confidentiality).
        (2) default-deny-ingress NetworkPolicy must exist (enforces boundary isolation
            per network-policy.yaml; prevents unencrypted lateral movement).
        (3) All Ingress resources must have spec.tls blocks configured (no HTTP-only
            ingress paths; TLS termination at the cluster edge required).
        (4) All Deployments must have readOnlyRootFilesystem: true in container
            securityContext OR carry the cage.io/tls-enforced: "true" annotation
            (defense-in-depth: immutable filesystem prevents TLS config tampering).
        (5) The gateway and compliance-bridge Deployments must mount a *-redis-ca
            ConfigMap read-only at /etc/cage/tls/redis, set REDIS_CA_CERT_PATH=/etc/cage/tls/redis/ca.pem,
            and carry a non-empty cage.io/redis-ca-sha256 pod-template annotation
            (pins the Memorystore managed server CA and rolls pods on CA rotation).
      Remediates: POAM-011 (SC-8: no encryption-in-transit validation test) and POAM-2026-086 (SC-8: Memorystore managed CA pinning in gateway and compliance-bridge). See: compliance/continuous-monitoring/ISCM_STRATEGY.md — SC-8 monitoring cadence. See: docs/POAM.md — POAM-011, POAM-2026-086.
  components:
  - uuid: 6a1a452d-4510-5333-bfe5-d114471d57e5
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial
      advisor.
    control-implementations:
    - uuid: 2ddc6d0d-c35e-583b-b5bb-12a5a69cbca8
      source: https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final
      description: 'Control implementation for SC8. Region: US_FED. Posture: nist-sp800-53.'
      implemented-requirements:
      - uuid: 50796b20-07f7-5904-acae-cf0e2f117f15
        control-id: sc8
        description: Automated lula validation for SC8.
        links:
        - href: '#a4ff5a9e-3621-52c6-9c1f-157e6e432b5e'
          rel: lula
  back-matter:
    resources:
    - uuid: a4ff5a9e-3621-52c6-9c1f-157e6e432b5e
      title: Lula Validation — SC8
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: kubernetes
          kubernetes-spec:
            resources:
              - name: cage-deployments
                resource-rule:
                  group: apps
                  version: v1
                  resource: deployments
                  namespaces:
                    - governance-stack
        provider:
          type: opa
          opa-spec:
            rego: |
              package lula

              import future.keywords.if
              import future.keywords.every
              import future.keywords.in

              # SC-8: Transmission Confidentiality and Integrity (POAM-2026-086)
              redis_tls_deployments := {
                "gateway",
                "compliance-bridge",
              }

              deployment_pins_redis_ca(deploy) if {
                deploy.spec.template.metadata.annotations["cage.io/redis-ca-sha256"] != ""
                some vol in deploy.spec.template.spec.volumes
                endswith(vol.configMap.name, "-redis-ca")
                some container in deploy.spec.template.spec.containers
                some vm in container.volumeMounts
                vm.name == vol.name
                vm.mountPath == "/etc/cage/tls/redis"
                vm.readOnly == true
                some env in container.env
                env.name == "REDIS_CA_CERT_PATH"
                env.value == "/etc/cage/tls/redis/ca.pem"
              }

              redis_ca_pinned if {
                every req_name in redis_tls_deployments {
                  matching := [d | some d in input["cage-deployments"]; d.metadata.name == req_name]
                  count(matching) >= 1
                  every deploy in matching {
                    deployment_pins_redis_ca(deploy)
                  }
                }
              }

              validate if {
                count(input["cage-deployments"]) > 0
                redis_ca_pinned
              }
