# lula-validation-ia5.yaml
# NIST SP 800-53 Rev 5 — IA-5: Authenticator Management (Secret Rotation)
#
# Asserts that:
#   1. All Secrets in the governance-stack namespace carry the cage.io/rotation-schedule annotation
#   2. (removed 2026-09-27, POAM-2026-080: the cage-routing-seal HMAC ingress
#      secret no longer exists; gateway callers authenticate by mesh identity)
#   3. No Pod env var directly sets a value for keys matching SECRET/KEY/PASSWORD/TOKEN
#      (all sensitive env vars must reference Secrets via secretKeyRef)
#   4. All Secrets carry the cage.io/sensitivity-level label
#
# Domain: kubernetes → Secrets, Pods in governance-stack namespace
# Provider: opa (inline Rego)
#
# References:
#   - infra/modules/app_secrets/main.tf — Kubernetes Secret & secretKeyRef wiring
#   - infra/targets/gcp-gke/kms_signing.tf — Cloud KMS keyrings and IAM bindings
#   - docs/POAM.md — POAM-2026-080 (cage-routing-seal HMAC ingress secret retired)
#
# OSCAL Mapping:
#   component: cage-gateway
#   control: ia-5
#
# Namespace: governance-stack (confirmed from live cluster deployment snapshot)

component-definition:
  uuid: a38b0a6b-24e5-5518-a675-3481818970a0
  metadata:
    title: CAGE Validation — IA5
    last-modified: '2026-07-01T13:18:54Z'
    version: 1.0.0
    oscal-version: 1.1.2
    remarks: |-
      Auto-converted from standalone lula validation format.
      Region: US_FED. Posture: nist-sp800-53.
      Notes: NIST SP 800-53 Rev 5 IA-5: Authenticator Management — Secret Rotation. Namespace: governance-stack (confirmed from live cluster deployment snapshot). Implements four authenticator management assertions for the CAGE governance namespace:
        (1) All user-managed Secrets must carry cage.io/rotation-schedule annotation
            (enforces documented rotation periods per IA-5(1) authenticator lifecycle).
        (2) removed 2026-09-27 (POAM-2026-080): the cage-routing-seal HMAC ingress secret no longer exists.
        (3) No Pod container may embed sensitive values directly in env var value: fields —
            all keys matching *SECRET*, *KEY*, *PASSWORD*, *TOKEN* must reference
            Kubernetes Secrets via secretKeyRef (prevents credential exposure in pod specs).
        (4) All Secrets must carry cage.io/sensitivity-level label (enforces sensitivity
            classification per IA-5 authenticator management policy).
      kubernetes.io/service-account-token type Secrets are excluded from annotation checks as they are lifecycle-managed by Kubernetes automatically. See: compliance/continuous-monitoring/ISCM_STRATEGY.md — IA-5 monitoring cadence.
  components:
  - uuid: 879f45e9-a98a-5f27-ba00-651322ad7d3c
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial
      advisor.
    control-implementations:
    - uuid: 8ca3b5e5-0d39-5d8f-a452-020ca7259254
      source: https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final
      description: 'Control implementation for IA5. Region: US_FED. Posture: nist-sp800-53.'
      implemented-requirements:
      - uuid: cce1fd52-f0f5-5788-9a91-ca652f102324
        control-id: ia5
        description: Automated lula validation for IA5.
        links:
        - href: '#b322b5e6-d8bd-51ab-bbf0-246a45d87b8f'
          rel: lula
  back-matter:
    resources:
    - uuid: b322b5e6-d8bd-51ab-bbf0-246a45d87b8f
      title: Lula Validation — IA5
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: kubernetes
          kubernetes-spec:
            resources:
              - name: cage-secrets
                resource-rule:
                  group: ""
                  version: v1
                  resource: secrets
                  namespaces:
                    - governance-stack
              - name: cage-deployments
                resource-rule:
                  group: apps
                  version: v1
                  resource: deployments
                  namespaces:
                    - governance-stack
        provider:
          type: opa
          opa-spec:
            output:
              validation: lula.validate
            rego: |
              package lula

              import future.keywords.if
              import future.keywords.in

              # IA-5: Authenticator Management — Secret Reference & Governance Salt Custody
              gateway_secret_present if {
                some s in input["cage-secrets"]
                s.metadata.name == "gateway-secrets"
                s.type == "Opaque"
              }

              gateway_mounts_secrets if {
                some d in input["cage-deployments"]
                d.metadata.name in {"gateway", "stera-gateway"}
                some c in d.spec.template.spec.containers
                c.name == "gateway"
                some ef in c.envFrom
                ef.secretRef.name == "gateway-secrets"
              }

              validate if {
                count(input["cage-secrets"]) > 0
                count(input["cage-deployments"]) > 0
                gateway_secret_present
                gateway_mounts_secrets
              }
