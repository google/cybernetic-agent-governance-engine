    remarks: "Auto-converted from standalone lula validation format.\nRegion: US_FED. Posture: nist-sp800-53.\nNotes: NIST SP 800-53 Rev 5 IA-5: Authenticator Management — Secret Rotation. Namespace: governance-stack (confirmed from live cluster deployment snapshot). Implements four authenticator management assertions for the CAGE governance namespace:\n  (1) All user-managed Secrets must carry cage.io/rotation-schedule annotation\n      (enforces documented rotation periods per IA-5(1) authenticator lifecycle).\n  (2) cage-routing-seal Secret must exist (HMAC signing key for governance\n      routing seals per deployment/terraform/secrets.tf and POAM-012).\n  (3) No Pod container may embed sensitive values directly in env var value: fields —\n      all keys matching *SECRET*, *KEY*, *PASSWORD*, *TOKEN* must reference\n      Kubernetes Secrets via secretKeyRef (prevents credential exposure in pod specs).\n  (4) All Secrets must carry cage.io/sensitivity-level label (enforces sensitivity\n      classification per IA-5 authenticator management policy).\nkubernetes.io/service-account-token type Secrets are excluded from annotation checks as they are lifecycle-managed by Kubernetes automatically. Remediates: POAM-012 (SC-12: CAGE_ROUTING_SEAL_SECRET bypass) as supporting evidence that the secret is properly provisioned in the cluster. See: compliance/continuous-monitoring/ISCM_STRATEGY.md — IA-5 monitoring cadence. See: docs/POAM.md — POAM-012 (routing seal secret lifecycle)."
