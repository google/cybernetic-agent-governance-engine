component-definition:
  uuid: f771216b-9ccf-5751-9f2d-7562eb3cca25
  metadata:
    title: CAGE Validation — AI600 PROMPT INJECTION
    last-modified: '2026-07-01T13:18:54Z'
    version: 1.0.0
    oscal-version: 1.1.2
    remarks: "Auto-converted from standalone lula validation format.\nRegion: US_FED. Posture: nist-ai-600-1.\nNotes: NIST AI 600-1 §2.3: Data Poisoning and Prompt Injection controls. Phase 2 assertions:\n  (1) gateway Deployment must have PROMPT_INJECTION_DETECTION_ENABLED=true\n      env var, confirming the prompt_injection_detector.py module is active.\n  (2) CausalGatekeeper Deployment must be running with ≥1 ready replica,\n      confirming the causal-refutation safety lock is operational.\nPhase 4 addition (AI600-003): MCP tool response sanitization is enforced by detect_indirect_injection() in prompt_injection_detector.py, called from sanitize_mcp_tool_response() in governance_middleware.py. Remediates: AI600-003 (POAM_US_FED.md)."
  components:
  - uuid: ce35ad64-b66f-504c-8f14-f4a27ed9538c
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial advisor.
    control-implementations:
    - uuid: 4f819051-faec-511a-9fb2-8bca2e59c109
      source: https://lula.dev
      description: 'Control implementation for AI600 PROMPT INJECTION. Region: US_FED. Posture: nist-ai-600-1.'
      implemented-requirements:
      - uuid: 4ecec4d5-e3aa-5138-abe5-877a16d3ff30
        control-id: ai600-prompt-injection
        description: Automated lula validation for AI600 PROMPT INJECTION.
        links:
        - href: '#c9e70991-7e12-559d-a71c-41caeed35519'
          rel: lula
  back-matter:
    resources:
    - uuid: c9e70991-7e12-559d-a71c-41caeed35519
      title: Lula Validation — AI600 PROMPT INJECTION
      rlinks:
      - href: lula.dev
      description: "domain:\n  type: kubernetes\n  kubernetes-spec:\n    resources:\n    - name: gateway-deployment\n      resource: deployments\n      namespace: governance-stack\n      filters:\n      - field: metadata.name\n        value: gateway\n    - name: causal-gatekeeper-deployment\n      resource: deployments\n      namespace: governance-stack\n      filters:\n      - field: metadata.name\n        value: causal-gatekeeper\nprovider:\n  type: opa\n  opa-spec:\n    rego: \"package lula\\n\\nimport future.keywords.if\\nimport future.keywords.every\\n\\n# AI 600-1 §2.3 Prompt Injection Controls\\n#\\n# Check 1: gateway Deployment has PROMPT_INJECTION_DETECTION_ENABLED=true\\n# Check 2: CausalGatekeeper Deployment is Running (at least 1 ready replica)\\n\\n# Check 1: PROMPT_INJECTION_DETECTION_ENABLED env var must be set to \\\"true\\\"\\ngateway_has_injection_detection if {\\n  some container in input[\\\"gateway-deployment\\\"].spec.template.spec.containers\\n  container.name == \\\"gateway\\\"\\n  some env in container.env\\n  env.name == \\\"PROMPT_INJECTION_DETECTION_ENABLED\\\"\\n  env.value == \\\"true\\\"\\n}\\n\\n# Check 2: CausalGatekeeper Deployment must have at least 1 ready replica\\ncausal_gatekeeper_running if {\\n  input[\\\"causal-gatekeeper-deployment\\\"].status.readyReplicas >= 1\\n}\\n\\nvalidate if {\\n  gateway_has_injection_detection\\n  causal_gatekeeper_running\\n}\\n\"\n"
