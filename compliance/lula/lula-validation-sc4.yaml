# lula-validation-sc4.yaml
# System Constraint SC-4 — Fiscal Limits and RBAC
#
# Asserts that the OPA policy engine is actively deployed in the cluster
# with ISO 42001 compliance labels present on its ConfigMap.
# This is a CRITICAL control — verifies that the fiscal/RBAC enforcement
# layer is live, not just configured.
#
# Domain: kubernetes → OPA ConfigMap labels (cluster-internal, no HTTP)
# Provider: opa (inline Rego)
#
# Note: SC-4 uses a kubernetes domain (not api), so no service URL is needed.
# FAIL on this control triggers an immediate alert via compliance-bridge
# (Python FastAPI) audit_workflow.py — see src/compliance_bridge/audit_workflow.py

component-definition:
  uuid: c69e1b4c-8d52-5a8b-8e3b-9736eb9fbe23
  metadata:
    title: CAGE Validation — SC4
    last-modified: '2026-10-25T23:30:57Z'
    version: 1.0.0
    oscal-version: 1.1.2
    remarks: |-
      Auto-converted from standalone lula validation format.
      Region: US_FED. Posture: nist-sp800-53.
      Notes: System Constraint SC-4: Fiscal Limits and RBAC Enforcement. CRITICAL CONTROL — verified via Kubernetes ConfigMap label presence. The opa-compliance-status ConfigMap is created alongside the OPA Deployment during each deploy. Its absence or mislabelling indicates the enforcement layer was not correctly deployed. Any FAIL on this control triggers an immediate Slack/PagerDuty alert via compliance-bridge audit_workflow._step4_alert_on_critical_fail(). See: infra/modules/opa_policy/main.tf for label definitions. See: src/cage_finance/opa/trade_governance.rego
           for the Rego rules enforcing SC-4.
      See: src/compliance_bridge/audit_workflow.py for the alert pipeline.
  components:
  - uuid: 3c6ec14f-85af-5735-8a1b-dacc49e1abdc
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial
      advisor.
    control-implementations:
    - uuid: 71af40e7-a7a8-570a-a320-3c4154bea03a
      source: https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final
      description: 'Control implementation for SC4. Region: US_FED. Posture: nist-sp800-53.'
      implemented-requirements:
      - uuid: 57b3f09d-e367-5c5c-9876-82f5d837d78b
        control-id: sc4
        description: Automated lula validation for SC4.
        links:
        - href: '#9b6f9b2e-f19d-54a8-bd5f-47f1fbed0a22'
          rel: lula
  back-matter:
    resources:
    - uuid: 9b6f9b2e-f19d-54a8-bd5f-47f1fbed0a22
      title: Lula Validation — SC4
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: kubernetes
          kubernetes-spec:
            resources:
              - name: opa-deployment
                resource-rule:
                  group: apps
                  version: v1
                  resource: deployments
                  namespaces:
                    - governance-stack
              - name: opa-policies
                resource-rule:
                  group: ""
                  version: v1
                  resource: configmaps
                  namespaces:
                    - governance-stack
        provider:
          type: opa
          opa-spec:
            rego: |
              package lula

              import future.keywords.if
              import future.keywords.in

              # SC-4: Information in Shared Resources — Session Isolation & Fiscal Limits via OPA
              opa_service_ready if {
                some deploy in input["opa-deployment"]
                deploy.metadata.name == "opa-service"
                deploy.status.readyReplicas >= 1
              }

              session_isolation_policy_loaded if {
                some cm in input["opa-policies"]
                cm.metadata.name == "opa-policies"
                cm.data["session_isolation.rego"] != ""
              }

              validate if {
                count(input["opa-deployment"]) > 0
                count(input["opa-policies"]) > 0
                opa_service_ready
                session_isolation_policy_loaded
              }
