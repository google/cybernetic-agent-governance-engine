# lula-validation-sc4.yaml
# System Constraint SC-4 — Fiscal Limits and RBAC
#
# Asserts that the gateway Deployment runs the OPA Unix-socket sidecar with
# --authorization=basic and that ISO 42001 compliance labels and Rego bundles
# are present on ConfigMap/opa-policies and ConfigMap/opa-system-authz.
#
# References:
#   - infra/modules/opa_policy/main.tf — ISO 42001-labelled OPA ConfigMaps
#   - infra/modules/gateway/main.tf — Gateway UDS OPA sidecar
#   - src/cage_finance/opa/trade_governance.rego — Fiscal/RBAC Rego rules
#   - src/compliance_bridge/audit_workflow.py — Critical FAIL alert pipeline

component-definition:
  uuid: c69e1b4c-8d52-5a8b-8e3b-9736eb9fbe23
  metadata:
    title: CAGE Validation — SC4
    last-modified: '2026-11-08T00:00:00Z'
    version: 1.1.0
    oscal-version: 1.1.2
    remarks: |-
      Region: US_FED. Posture: nist-sp800-53.
      Notes: System Constraint SC-4: Fiscal Limits and RBAC Enforcement. CRITICAL CONTROL — verified via the gateway OPA UDS sidecar and ISO 42001-labelled opa-policies and opa-system-authz ConfigMaps in governance-stack. Any FAIL on this control triggers an immediate alert via compliance-bridge audit_workflow._step4_alert_on_critical_fail(). See: infra/modules/opa_policy/main.tf for label definitions. See: src/cage_finance/opa/trade_governance.rego for the Rego rules enforcing SC-4. See: src/compliance_bridge/audit_workflow.py for the alert pipeline.
  components:
  - uuid: 3c6ec14f-85af-5735-8a1b-dacc49e1abdc
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial
      advisor.
    control-implementations:
    - uuid: 71af40e7-a7a8-570a-a320-3c4154bea03a
      source: https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final
      description: 'Control implementation for SC4. Region: US_FED. Posture: nist-sp800-53.'
      implemented-requirements:
      - uuid: 57b3f09d-e367-5c5c-9876-82f5d837d78b
        control-id: sc4
        description: Automated lula validation for SC4.
        links:
        - href: '#9b6f9b2e-f19d-54a8-bd5f-47f1fbed0a22'
          rel: lula
  back-matter:
    resources:
    - uuid: 9b6f9b2e-f19d-54a8-bd5f-47f1fbed0a22
      title: Lula Validation — SC4
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: kubernetes
          kubernetes-spec:
            resources:
              - name: gateway-deployment
                resource-rule:
                  group: apps
                  version: v1
                  resource: deployments
                  namespaces:
                    - governance-stack
              - name: opa-configmaps
                resource-rule:
                  group: ""
                  version: v1
                  resource: configmaps
                  namespaces:
                    - governance-stack
        provider:
          type: opa
          opa-spec:
            output:
              validation: lula.validate
            rego: |
              package lula

              import future.keywords.if
              import future.keywords.in

              # SC-4: Information in Shared Resources — Session Isolation & Fiscal Limits via OPA UDS Sidecar
              gateway_opa_sidecar_ready if {
                some deploy in input["gateway-deployment"]
                deploy.metadata.name == "gateway"
                deploy.status.readyReplicas >= 1
                some opa in object.get(deploy.spec.template.spec, "initContainers", [])
                opa.name == "opa"
                opa.restartPolicy == "Always"
                "--addr=unix:///var/run/opa/opa.sock" in opa.args
                "--authorization=basic" in opa.args
              }

              session_isolation_policy_loaded if {
                some cm in input["opa-configmaps"]
                cm.metadata.name == "opa-policies"
                cm.metadata.labels["compliance.iso42001/enabled"] == "true"
                some policy_name, policy_rego in cm.data
                endswith(policy_name, ".rego")
                policy_rego != ""
              }

              system_authz_immutable if {
                some cm in input["opa-configmaps"]
                cm.metadata.name == "opa-system-authz"
                cm.metadata.labels["compliance.iso42001/enabled"] == "true"
                contains(cm.data["system_authz.rego"], "package system.authz")
              }

              validate if {
                count(input["gateway-deployment"]) > 0
                count(input["opa-configmaps"]) > 0
                gateway_opa_sidecar_ready
                session_isolation_policy_loaded
                system_authz_immutable
              }
