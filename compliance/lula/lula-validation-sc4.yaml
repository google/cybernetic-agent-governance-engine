    - uuid: 9b6f9b2e-f19d-54a8-bd5f-47f1fbed0a22
      title: Lula Validation — SC4
      rlinks:
      - href: lula.dev
      description: "domain:\n  type: kubernetes\n  kubernetes-spec:\n    resources:\n    - name: opa-compliance-status\n      resource: configmaps\n      namespace: governance-stack\nprovider:\n  type: opa\n  opa-spec:\n    rego: \"package lula\\n\\nimport future.keywords.if\\n\\n# SC-4: Fiscal Limits and RBAC\\n# Verifies the OPA ConfigMap is present and labelled as ISO 42001 enabled.\\n# This is a structural assertion — if the ConfigMap is missing or mislabelled,\\n# the enforcement layer is considered non-compliant regardless of traffic.\\nvalidate if {\\n  input[\\\"opa-compliance-status\\\"].metadata.labels[\\\"compliance.iso42001/enabled\\\"] == \\\"true\\\"\\n}\\n\"\n"
