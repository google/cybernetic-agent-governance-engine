# lula-validation-sc4.yaml
# System Constraint SC-4 — Fiscal Limits and RBAC
#
# Asserts that the OPA policy engine is actively deployed in the cluster
# with ISO 42001 compliance labels present on its ConfigMap.
# This is a CRITICAL control — verifies that the fiscal/RBAC enforcement
# layer is live, not just configured.
#
# Domain: kubernetes → OPA ConfigMap labels (cluster-internal, no HTTP)
# Provider: opa (inline Rego)
#
# Note: SC-4 uses a kubernetes domain (not api), so no service URL is needed.
# FAIL on this control triggers an immediate alert via compliance-bridge
# (Python FastAPI) audit_workflow.py — see src/compliance_bridge/audit_workflow.py

