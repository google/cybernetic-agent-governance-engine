# lula-validation-a53.yaml
# ISO 42001 Annex A.5.3 — Logging and Monitoring
#
# Asserts that the Cybernetic Governance Engine is actively logging AI activity
# and maintaining a safety rate >= 98% over the past 24 hours, with fresh evidence
# no older than 48 hours.
#
# Domain: api → compliance-bridge (Python FastAPI service)
# Provider: opa (inline Rego)

component-definition:
  uuid: 9f8895e0-79b7-59ca-b1bd-5f53b61ca24e
  metadata:
    title: CAGE Validation — A53
    last-modified: '2026-07-01T13:18:54Z'
    version: 1.0.0
    oscal-version: 1.1.2
    remarks: |-
      Auto-converted from standalone lula validation format.
      Region: ALL. Posture: iso-42001.
      Notes: ISO 42001 A.5.3: Logging and Monitoring. Automated verification via Langfuse observability bridge. Evidence: OTel spans tagged with iso42001.control_id=A.5.3 from the TypeScript Governance Gateway and Python LangGraph nodes. Staleness guard: 48 hours (4x the 6-hour CronJob interval).
  components:
  - uuid: dc15af28-a1da-5e9c-9149-5626a6dd4cce
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial
      advisor.
    control-implementations:
    - uuid: 1ece732e-9180-52e4-a04d-bb92f5e01929
      source: https://www.iso.org/standard/81230.html
      description: 'Control implementation for A53. Region: ALL. Posture: iso-42001.'
      implemented-requirements:
      - uuid: 76dea904-7d5c-53b3-b5d8-2c31702ff8ca
        control-id: a53
        description: Automated lula validation for A53.
        links:
        - href: '#eb760977-813f-5999-af3f-dcd76b48c7aa'
          rel: lula
  back-matter:
    resources:
    - uuid: eb760977-813f-5999-af3f-dcd76b48c7aa
      title: Lula Validation — A53
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: api
          api-spec:
            requests:
              - name: langfuse_metrics_a53
                url: http://compliance-bridge.governance-stack.svc.cluster.local/v1/metrics/A.5.3
                method: GET
        provider:
          type: opa
          opa-spec:
            output:
              validation: lula.validate
              observations:
                - lula.assessment_remark
            rego: |
              package lula

              import future.keywords.if

              metrics_doc := object.get(input.langfuse_metrics_a53, "response", input.langfuse_metrics_a53)
              total_traces := object.get(metrics_doc, "total_traces", 0)
              safety_rate := object.get(metrics_doc, "safety_rate", null)
              evidence_age_s := round(object.get(metrics_doc, "evidence_age_seconds", 0))
              grace_active := object.get(metrics_doc, "startup_grace_active", false)

              # A.5.3: Logging and Monitoring
              sample_size_or_grace_met if {
                metrics_doc.startup_grace_active == true
              }

              sample_size_or_grace_met if {
                metrics_doc.startup_grace_active == false
                metrics_doc.total_traces > 0
              }

              rate_or_grace_ok if {
                metrics_doc.startup_grace_active == true
                metrics_doc.total_traces == 0
                metrics_doc.safety_rate == null
              }

              rate_or_grace_ok if {
                metrics_doc.safety_rate >= 0.98
                sample_size_or_grace_met
              }

              validate if {
                count(input.langfuse_metrics_a53) > 0
                metrics_doc.evidence_age_seconds < 172800
                rate_or_grace_ok
              }

              safety_rate_str := "null" if {
                safety_rate == null
              } else := sprintf("%v", [safety_rate])

              assessment_status := "missing_metrics_response" if {
                count(input.langfuse_metrics_a53) == 0
              } else := "stale_evidence" if {
                object.get(metrics_doc, "evidence_age_seconds", 172800) >= 172800
              } else := "startup_grace" if {
                grace_active == true
                total_traces == 0
                safety_rate == null
              } else := "insufficient_traffic" if {
                grace_active == false
                total_traces == 0
                safety_rate == null
              } else := "satisfied" if {
                rate_or_grace_ok
              } else := "threshold_violation"

              assessment_remark := sprintf(
                "assessment_status=%s; control_id=A.5.3; total_traces=%d; safety_rate=%s; threshold=0.98; evidence_age_seconds=%d; startup_grace_active=%v",
                [assessment_status, total_traces, safety_rate_str, evidence_age_s, grace_active],
              )
