  back-matter:
    resources:
    - uuid: eb760977-813f-5999-af3f-dcd76b48c7aa
      title: Lula Validation — A53
      rlinks:
      - href: lula.dev
      description: "domain:\n  type: api\n  api-spec:\n    endpoints:\n    - name: langfuse_metrics_a53\n      url: http://compliance-bridge.governance-stack.svc.cluster.local/v1/metrics/A.5.3\n      method: GET\nprovider:\n  type: opa\n  opa-spec:\n    rego: \"package lula\\n\\nimport future.keywords.if\\n\\n# A.5.3: Logging and Monitoring\\n# Two rules: one for cold-start grace period, one for steady-state.\\n\\n# Rule 1: Cold-start grace period (< 6h after deployment)\\n# Skip sample-size check; only require safety rate and fresh evidence.\\nvalidate if {\\n  input.langfuse_metrics_a53.startup_grace_active == true\\n  input.langfuse_metrics_a53.safety_rate >= 0.98\\n  input.langfuse_metrics_a53.evidence_age_seconds < 172800\\n}\\n\\n# Rule 2: Steady-state (> 6h after deployment)\\n# Enforce full constraints: safety rate, sample size, and evidence freshness.\\nvalidate if {\\n  input.langfuse_metrics_a53.startup_grace_active == false\\n  input.langfuse_metrics_a53.safety_rate >= 0.98\\n  input.langfuse_metrics_a53.total_traces > 100\\n  input.langfuse_metrics_a53.evidence_age_seconds < 172800\\n}\\n\"\n"
