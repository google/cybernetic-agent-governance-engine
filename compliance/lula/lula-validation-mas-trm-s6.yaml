      rlinks:
      - href: lula.dev
      description: "domain:\n  type: api\n  api-spec:\n    endpoints:\n    - name: mas_trm_s6_status\n      url: http://compliance-bridge.governance-stack.svc.cluster.local/v1/compliance/mas/trm-s6\n      method: GET\nprovider:\n  type: opa\n  opa-spec:\n    rego: \"package lula\\n\\nimport future.keywords.if\\n\\n# MAS TRM §6.3: AI and Machine Learning Controls\\n# Asserts that:\\n#   1. AI governance framework is documented per §6.3.1\\n#   2. Model risk management controls are active per §6.3.2\\n#   3. Confidence threshold is documented and meets MAS expectations (>= 0.96)\\n#   4. Human-in-the-loop controls are active for high-impact decisions\\n#   5. Model performance monitoring is active with defined drift thresholds\\n#   6. Data residency is confirmed within asia-southeast1 per §4.2\\n\\n# Rule 1: AI governance framework and model risk controls active\\nvalidate if {\\n  input.mas_trm_s6_status.ai_governance_framework_documented == true\\n  input.mas_trm_s6_status.model_risk_management_active == true\\n  input.mas_trm_s6_status.confidence_threshold >= 0.96\\n  input.mas_trm_s6_status.hitl_controls_active == true\\n  input.mas_trm_s6_status.evidence_age_seconds < 172800\\n}\\n\\n# Rule 2: Model monitoring and data residency compliant\\nvalidate if {\\n  input.mas_trm_s6_status.ai_governance_framework_documented == true\\n  input.mas_trm_s6_status.model_performance_monitoring_active == true\\n  input.mas_trm_s6_status.data_residency_region == \\\"asia-southeast1\\\"\\n  input.mas_trm_s6_status.model_drift_threshold_defined == true\\n  input.mas_trm_s6_status.evidence_age_seconds < 172800\\n}\\n\"\n"
