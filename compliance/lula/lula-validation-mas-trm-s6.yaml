    remarks: "Auto-converted from standalone lula validation format.\nRegion: APAC_MAS. Posture: mas-trm.\nNotes: MAS TRM Guidelines §6.3: AI and Machine Learning Controls. The MAS Technology Risk Management (TRM) Guidelines §6.3 apply to financial institutions in Singapore that deploy AI and machine learning systems. CAGE is subject to TRM §6.3 as an AI-driven financial advisory system. Key TRM §6.3 requirements: - §6.3.1: AI governance framework documenting roles, responsibilities,\n  and accountability for AI system development and deployment\n- §6.3.2: Model risk management controls including human-in-the-loop\n  for high-impact AI decisions above the MAS consensus threshold\n  (SGD 11,500 / USD 8,500 per APAC_MAS_BASELINE.json)\n- §6.3.3: Model performance monitoring with defined drift thresholds\n  and automated alerting when performance degrades\n- §4.2: Data residency — all AI model inputs, outputs, and audit logs\n  must remain within asia-southeast1 (Singapore region)\nConfidence threshold: 0.96 (APAC_MAS_BASELINE.json min_trade_confidence) per MAS TRM §6.3 requirement for documented confidence thresholds. Latency SLA: 175ms maximum round-trip (APAC_MAS_BASELINE.json max_latency_ms) per MAS TRM §7.2 recovery time objectives for AI-driven trade execution. Evidence: GET /v1/compliance/mas/trm-s6 (compliance-bridge service). Staleness guard: 48 hours. Jurisdiction: APAC_MAS only (CAGE_DEPLOYMENT_REGION=APAC_MAS)."
