# Provider: opa (inline Rego)
#
# Regulatory basis: DORA Art. 10 — ICT Operational Resilience Testing
# Jurisdiction: EU_ECB (CAGE_DEPLOYMENT_REGION=EU_ECB)
# POAM: EU-DORA-001

component-definition:
  uuid: 994b41fa-b0a2-573a-8329-51ab60dcfdb5
  metadata:
    title: CAGE Validation — DORA ART10
    last-modified: '2026-07-01T13:18:54Z'
    version: 1.0.0
    oscal-version: 1.1.2
    remarks: 'Auto-converted from standalone lula validation format.

      Region: EU_ECB. Posture: dora.

      Notes: DORA Art. 10: ICT Operational Resilience Testing. The Digital Operational Resilience Act (DORA) applies to financial entities operating in the EU, including those supervised by the ECB under the SSM. Art. 10 requires financial entities to establish, maintain, and review a sound and comprehensive ICT operational resilience testing programme. Key requirements: - Art. 10(1): Testing programme covering all ICT systems and applications - Art. 10(2): Annual basic testing; advanced TLPT for significant entities - Art. 10(4): Audit logging of all ICT-related incidents - Art. 10(6): Log retention for at least 5 years for major ICT incidents CAGE implements DORA Art. 10 audit logging via the Compliance Bridge (src/compliance_bridge/audit_workflow.py) with OTel spans archived to GCS buckets in europe-west1 (GDPR Art. 44 data residency compliance). Evidence: GET /v1/compliance/dora/art10 (compliance-bridge service). Staleness guard: 48 hours. Jurisdiction: EU_ECB only (CAGE_DEPLOYMENT_REGION=EU_ECB).'
  components:
  - uuid: f7d56aa4-1a40-5b5b-aaf1-55546f8e1f6f
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial advisor.
    control-implementations:
    - uuid: b10dffbc-e2ac-5479-8b54-599f18925b3a
      source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554
      description: 'Control implementation for DORA ART10. Region: EU_ECB. Posture: dora.'
