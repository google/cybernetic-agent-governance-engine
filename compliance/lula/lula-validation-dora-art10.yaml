  back-matter:
    resources:
    - uuid: eaacb9e8-bb4f-5c67-a1f2-4adb59b47eaa
      title: Lula Validation — DORA ART10
      rlinks:
      - href: lula.dev
      description: "domain:\n  type: api\n  api-spec:\n    endpoints:\n    - name: dora_art10_status\n      url: http://compliance-bridge.governance-stack.svc.cluster.local/v1/compliance/dora/art10\n      method: GET\nprovider:\n  type: opa\n  opa-spec:\n    rego: \"package lula\\n\\nimport future.keywords.if\\n\\n# DORA Art. 10: ICT Operational Resilience and Audit Logging\\n# Asserts that:\\n#   1. ICT audit logging is active and capturing all required event types\\n#   2. Log retention meets DORA requirements (minimum 5 years for major incidents)\\n#   3. ICT incident classification system is operational\\n#   4. Operational resilience testing has been performed within the required cadence\\n#   5. Audit log integrity is maintained (tamper-evident storage)\\n\\n# Rule 1: ICT audit logging active with required event coverage\\nvalidate if {\\n  input.dora_art10_status.ict_audit_logging_active == true\\n  input.dora_art10_status.log_retention_years >= 5\\n  input.dora_art10_status.incident_classification_active == true\\n  input.dora_art10_status.tamper_evident_storage == true\\n  input.dora_art10_status.evidence_age_seconds < 172800\\n}\\n\\n# Rule 2: Operational resilience testing cadence met\\nvalidate if {\\n  input.dora_art10_status.ict_audit_logging_active == true\\n  input.dora_art10_status.resilience_testing_days_since_last <= 365\\n  input.dora_art10_status.threat_led_penetration_testing_active == true\\n  input.dora_art10_status.evidence_age_seconds < 172800\\n}\\n\"\n"
