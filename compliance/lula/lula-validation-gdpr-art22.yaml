# lula-validation-gdpr-art22.yaml
# GDPR Art. 22 — Human Oversight of Automated Individual Decision-Making
#
# Asserts that the CAGE system enforces human oversight for automated
# decisions with legal or similarly significant effects on individuals,
# as required by GDPR Art. 22(2)(b) (explicit consent) or Art. 22(2)(a)
# (contractual necessity with safeguards).
#
# Domain: api → compliance-bridge (Python FastAPI service)
# Provider: opa (inline Rego)
#
# Regulatory basis: GDPR Art. 22 — Automated Individual Decision-Making
# Jurisdiction: EU_ECB (CAGE_DEPLOYMENT_REGION=EU_ECB)
# POAM: EU-GDPR-001

metadata:
  annotations:
    cage.region: EU_ECB
    cage.compliance-posture: gdpr
    cage.posture-note: "GDPR Art. 22 is an EU_ECB posture requirement. This validation MUST NOT run for US_FED or APAC_MAS deployments."

domain:
  type: api
  api-spec:
    endpoints:
      - name: gdpr_art22_status
        url: "http://compliance-bridge.governance-stack.svc.cluster.local/v1/compliance/gdpr/art22"
        method: GET

provider:
  type: opa
  opa-spec:
    rego: |
      package lula

      import future.keywords.if

      # GDPR Art. 22: Human Oversight of Automated Decisions
      # Asserts that:
      #   1. Human-in-the-loop (HITL) is active for decisions above the EU_ECB
      #      consensus threshold (EUR 7,500 equivalent per EU_ECB_BASELINE.json)
      #   2. The DEFER queue SLA is enforced (human review within defined window)
      #   3. Data subject rights (Art. 22(3)) are implemented: right to obtain
      #      human intervention, express point of view, contest the decision
      #   4. Audit trail of automated decisions is present and not stale

      # Rule 1: HITL active and consensus threshold enforced
      validate if {
        input.gdpr_art22_status.hitl_active == true
        input.gdpr_art22_status.consensus_threshold_eur <= 7500
        input.gdpr_art22_status.human_review_sla_hours <= 24
        input.gdpr_art22_status.data_subject_rights_implemented == true
        input.gdpr_art22_status.evidence_age_seconds < 172800
      }

      # Rule 2: Automated decision audit trail present
      validate if {
        input.gdpr_art22_status.hitl_active == true
        input.gdpr_art22_status.automated_decision_audit_trail_active == true
        input.gdpr_art22_status.contest_mechanism_available == true
        input.gdpr_art22_status.evidence_age_seconds < 172800
      }

notes: >
  GDPR Art. 22: Human Oversight of Automated Individual Decision-Making.
  CAGE financial advisory decisions may constitute "automated individual
  decision-making" with "legal or similarly significant effects" under
  GDPR Art. 22(1) when they produce trade recommendations affecting
  individual investor portfolios. Art. 22(2)(b) permits such processing
  with explicit consent and Art. 22(3) safeguards: the data subject must
  have the right to obtain human intervention, express their point of view,
  and contest the decision.
  CAGE implements this via the DEFER State Machine (defer_queue.py) and
  the HITL escalator (hitl_escalator.py). The EU_ECB consensus threshold
  of EUR 7,500 (EU_ECB_BASELINE.json) ensures more decisions receive human
  review than the US_FED baseline (USD 10,000).
  Evidence: GET /v1/compliance/gdpr/art22 (compliance-bridge service).
  Staleness guard: 48 hours.
  Jurisdiction: EU_ECB only (CAGE_DEPLOYMENT_REGION=EU_ECB).
