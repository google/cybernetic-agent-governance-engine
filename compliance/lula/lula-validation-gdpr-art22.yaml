  back-matter:
    resources:
    - uuid: 877aaff1-86c0-5e6d-a9b9-2756af2e6889
      title: Lula Validation — GDPR ART22
      rlinks:
      - href: lula.dev
      description: "domain:\n  type: api\n  api-spec:\n    endpoints:\n    - name: gdpr_art22_status\n      url: http://compliance-bridge.governance-stack.svc.cluster.local/v1/compliance/gdpr/art22\n      method: GET\nprovider:\n  type: opa\n  opa-spec:\n    rego: \"package lula\\n\\nimport future.keywords.if\\n\\n# GDPR Art. 22: Human Oversight of Automated Decisions\\n# Asserts that:\\n#   1. Human-in-the-loop (HITL) is active for decisions above the EU_ECB\\n#      consensus threshold (EUR 7,500 equivalent per EU_ECB_BASELINE.json)\\n#   2. The DEFER queue SLA is enforced (human review within defined window)\\n#   3. Data subject rights (Art. 22(3)) are implemented: right to obtain\\n#      human intervention, express point of view, contest the decision\\n#   4. Audit trail of automated decisions is present and not stale\\n\\n# Rule 1: HITL active and consensus threshold enforced\\nvalidate if {\\n  input.gdpr_art22_status.hitl_active == true\\n  input.gdpr_art22_status.consensus_threshold_eur <= 7500\\n  input.gdpr_art22_status.human_review_sla_hours <= 24\\n  input.gdpr_art22_status.data_subject_rights_implemented == true\\n  input.gdpr_art22_status.evidence_age_seconds < 172800\\n}\\n\\n# Rule 2: Automated decision audit trail present\\nvalidate if {\\n  input.gdpr_art22_status.hitl_active == true\\n  input.gdpr_art22_status.automated_decision_audit_trail_active == true\\n  input.gdpr_art22_status.contest_mechanism_available == true\\n  input.gdpr_art22_status.evidence_age_seconds < 172800\\n}\\n\"\n"
