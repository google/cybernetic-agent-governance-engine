# lula-validation-gdpr-art22.yaml
# cage-status: planned
# GDPR Art. 22 — Human Oversight of Automated Individual Decision-Making
#
# Asserts that the CAGE system enforces human oversight for automated
# decisions with legal or similarly significant effects on individuals,
# as required by GDPR Art. 22(2)(b) (explicit consent) or Art. 22(2)(a)
# (contractual necessity with safeguards).
#
# Domain: api → compliance-bridge (Python FastAPI service)
# Provider: opa (inline Rego)
#
# System-triggered human oversight: REQUIRE_APPROVAL via consensus_tier.py
#   (>= EUR 7,500), confidence.py ([0.70, 0.95) universal), and
#   trade_confidence_tier.py ([0.70, 0.97) EU_ECB trade floor), parked in
#   defer_queue.py for distinct-principal dual-control quorum + POST_HITL
#   drift revalidation.
# Planned scope (POAM EU-006 in docs/compliance/eu_ecb/POAM_EU_ECB.md):
#   GDPR Art. 22(3) subject-initiated contest on request and
#   GET /v1/compliance/gdpr/art22 on compliance-bridge.
# Regulatory basis: GDPR Art. 22 — Automated Individual Decision-Making
# Jurisdiction: EU_ECB (CAGE_DEPLOYMENT_REGION=EU_ECB)
# POAM: EU-006

component-definition:
  uuid: 0cbf0c15-21b6-5763-b779-783b55c828f0
  metadata:
    title: CAGE Validation — GDPR ART22
    last-modified: '2026-07-01T13:18:54Z'
    version: 1.0.0
    oscal-version: 1.1.2
    remarks: |-
      Auto-converted from standalone lula validation format.
      Region: EU_ECB. Posture: gdpr.
      Notes: GDPR Art. 22: Human Oversight of Automated Individual Decision-Making. CAGE financial advisory decisions may constitute "automated individual decision-making" with "legal or similarly significant effects" under GDPR Art. 22(1) when they gate or execute trades affecting individual investor portfolios. Under Art. 22(2)(b) and Art. 22(3) safeguards, CAGE enforces system-triggered human intervention via REQUIRE_APPROVAL: trades at or above EUR 7,500 (domains.finance.consensus.threshold_usd = 7500.0 in src/cage_finance/tiers/consensus_tier.py, vs. USD 10,000 global) and medium-confidence actions in [0.70, 0.95) universally (src/gateway/governance/governor/stages/confidence.py) or [0.70, 0.97) on EU_ECB trade execution (src/cage_finance/tiers/trade_confidence_tier.py) park in DeferQueue (src/gateway/governance/defer_queue.py) for distinct-principal dual-control quorum (DeferQueue.approve() / POST /v1/defer/{id}/escalate) and single-use consumption with POST_HITL drift revalidation (DeferQueue.consume_approval(), SymbolicGovernor.revalidate_post_hitl()). Sub-0.70 DEFER and WARRANT_INELIGIBLE are turn-terminal epistemic/reliance holds rather than Art. 22 approval gates. Subject-initiated Art. 22(3) contest on request and the GET /v1/compliance/gdpr/art22 compliance-bridge endpoint remain planned (tracked under EU-006 in docs/compliance/eu_ecb/POAM_EU_ECB.md). Staleness guard: 48 hours. Jurisdiction: EU_ECB only (CAGE_DEPLOYMENT_REGION=EU_ECB).
  components:
  - uuid: 3d1d017f-b867-5b0e-9d2f-cbb649c8c7dc
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial
      advisor.
    control-implementations:
    - uuid: 64186a87-ffc0-514c-877e-41832df17e5c
      source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
      description: 'Control implementation for GDPR ART22. Region: EU_ECB. Posture: gdpr.'
      implemented-requirements:
      - uuid: c7b6e46e-eac7-5499-80aa-af4dba8e104d
        control-id: gdpr-art22
        description: Automated lula validation for GDPR ART22.
        links:
        - href: '#877aaff1-86c0-5e6d-a9b9-2756af2e6889'
          rel: lula
  back-matter:
    resources:
    - uuid: 877aaff1-86c0-5e6d-a9b9-2756af2e6889
      title: Lula Validation — GDPR ART22
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: api
          api-spec:
            requests:
              - name: gdpr_art22_status
                url: http://compliance-bridge.governance-stack.svc.cluster.local/v1/compliance/gdpr/art22
                method: GET
        provider:
          type: opa
          opa-spec:
            rego: |
              package lula

              import future.keywords.if

              validate if {
                count(input.gdpr_art22_status) > 0
                input.gdpr_art22_status.hitl_active == true
                input.gdpr_art22_status.consensus_threshold_eur <= 7500
                input.gdpr_art22_status.human_review_sla_hours <= 24
                input.gdpr_art22_status.data_subject_rights_implemented == true
                input.gdpr_art22_status.automated_decision_audit_trail_active == true
                input.gdpr_art22_status.contest_mechanism_available == true
                input.gdpr_art22_status.evidence_age_seconds < 172800
              }
