# lula-validation-gdpr-art22.yaml
# GDPR Art. 22 — Human Oversight of Automated Individual Decision-Making
#
# Asserts that the CAGE system enforces human oversight for automated
# decisions with legal or similarly significant effects on individuals,
# as required by GDPR Art. 22(2)(b) (explicit consent) or Art. 22(2)(a)
# (contractual necessity with safeguards).
#
# Domain: api → compliance-bridge (Python FastAPI service)
# Provider: opa (inline Rego)
#
# Regulatory basis: GDPR Art. 22 — Automated Individual Decision-Making
# Jurisdiction: EU_ECB (CAGE_DEPLOYMENT_REGION=EU_ECB)
# POAM: EU-GDPR-001

component-definition:
  uuid: 0cbf0c15-21b6-5763-b779-783b55c828f0
  metadata:
    title: CAGE Validation — GDPR ART22
    last-modified: '2026-07-01T13:18:54Z'
    version: 1.0.0
    oscal-version: 1.1.2
    remarks: 'Auto-converted from standalone lula validation format.

      Region: EU_ECB. Posture: gdpr.

      Notes: GDPR Art. 22: Human Oversight of Automated Individual Decision-Making. CAGE financial advisory decisions may constitute "automated individual decision-making" with "legal or similarly significant effects" under GDPR Art. 22(1) when they produce trade recommendations affecting individual investor portfolios. Art. 22(2)(b) permits such processing with explicit consent and Art. 22(3) safeguards: the data subject must have the right to obtain human intervention, express their point of view, and contest the decision. CAGE implements this via the DEFER State Machine (defer_queue.py) and the HITL escalator (hitl_escalator.py). The EU_ECB consensus threshold of EUR 7,500 (EU_ECB_BASELINE.json) ensures more decisions receive human review than the US_FED baseline (USD 10,000). Evidence: GET /v1/compliance/gdpr/art22 (compliance-bridge service). Staleness guard: 48 hours. Jurisdiction: EU_ECB only (CAGE_DEPLOYMENT_REGION=EU_ECB).'
  components:
  - uuid: 3d1d017f-b867-5b0e-9d2f-cbb649c8c7dc
