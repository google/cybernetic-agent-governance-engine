# lula-validation-ra5.yaml
# cage-status: planned
# NIST SP 800-53 Rev 5 — RA-5: Vulnerability Monitoring and Scanning
#
# Asserts that an in-cluster vulnerability scanning CronJob is present,
# non-suspended, and scheduled in governance-stack.
#
# Implementation status in compliance/oscal/system-security-plan.yaml: planned
# (POAM-010). CI/CD pipeline scanning is enforced on every build via
# .github/workflows/security-scan.yml and .github/workflows/sbom.yml; no
# in-cluster scanner CronJob is currently deployed by Terraform, so this
# validation truthfully evaluates to not-satisfied until an in-state scanner
# workload is provisioned.
#
# Domain: kubernetes → Security Scan CronJob
# Provider: opa (inline Rego)

component-definition:
  uuid: 2a8c1f51-012c-5939-9c55-ac9b8f185c2c
  metadata:
    title: CAGE Validation — RA5
    last-modified: '2026-11-06T00:00:00Z'
    version: 1.1.0
    oscal-version: 1.1.2
    remarks: |-
      Region: US_FED. Posture: nist-sp800-53. Status: planned (POAM-010).
      Notes: NIST SP 800-53 Rev 5 RA-5: Vulnerability Monitoring and Scanning. CI/CD image and dependency scanning runs in .github/workflows/security-scan.yml and .github/workflows/sbom.yml. Continuous in-cluster periodic scanning remains planned under POAM-010; this specification checks for an active CronJob/security-scanner in governance-stack rather than an empty NetworkPolicy shell.
  components:
  - uuid: aee40988-d903-59fe-abef-2e2d24a084fa
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial
      advisor.
    control-implementations:
    - uuid: 6957afe5-394b-5641-b059-4d210795dc00
      source: https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final
      description: 'Control implementation for RA5. Region: US_FED. Posture: nist-sp800-53.'
      implemented-requirements:
      - uuid: 4647ae49-b402-5fcd-919b-8a39244aa7f6
        control-id: ra5
        description: Automated lula validation for RA5 (planned under POAM-010).
        links:
        - href: '#7a32a7bb-2f37-54ce-a16f-1435d2607512'
          rel: lula
  back-matter:
    resources:
    - uuid: 7a32a7bb-2f37-54ce-a16f-1435d2607512
      title: Lula Validation — RA5
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: kubernetes
          kubernetes-spec:
            resources:
              - name: security-scanner-cronjob
                resource-rule:
                  group: batch
                  version: v1
                  resource: cronjobs
                  namespaces:
                    - governance-stack
        provider:
          type: opa
          opa-spec:
            output:
              validation: lula.validate
            rego: |
              package lula

              import future.keywords.if
              import future.keywords.in

              # RA-5: Vulnerability Monitoring and Scanning (status: planned, POAM-010)
              active_scanner_cronjob_present if {
                some cj in input["security-scanner-cronjob"]
                cj.metadata.name == "security-scanner"
                object.get(cj.spec, "suspend", false) == false
                cj.spec.schedule != ""
                count(cj.spec.jobTemplate.spec.template.spec.containers) > 0
              }

              validate if {
                count(input["security-scanner-cronjob"]) > 0
                active_scanner_cronjob_present
              }

