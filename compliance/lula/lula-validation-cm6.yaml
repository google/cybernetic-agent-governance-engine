      Notes: NIST SP 800-53 Rev 5 CM-6: Configuration Settings. Namespace: governance-stack (confirmed from live cluster deployment snapshot). Automated verification that the governance thresholds are deployed as a Kubernetes ConfigMap, ensuring the baseline security configuration is active and cluster-immutable (vs. local file edits). The governance thresholds (config/governance_thresholds.json) define the fiscal and risk limits enforced by OPA. The NeMo Guardrails configuration is no longer asserted: NeMo rails are opt-in, and their standalone server is off by default (W6). No manifest in this repository creates the thresholds ConfigMap, so this validation cannot pass as written (POAM-2026-151). This validation also addresses the CM-6/SI-7 POAM items flagged in docs/NIST_RMF_CHUNK1_CURRENT_STATE.md regarding deprecated Rego stub confusion. See: compliance/continuous-monitoring/ISCM_STRATEGY.md — CM-6 monitoring cadence. See: docs/POAM.md — CM-6 POAM remediation item.'
