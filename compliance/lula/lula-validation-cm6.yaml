# lula-validation-cm6.yaml
# NIST SP 800-53 Rev 5 — CM-6: Configuration Settings
#
# Queries compliance-bridge GET /v1/compliance/cm6 (backed by KMS-signed
# GOVERNANCE_THRESHOLDS_LOADED and GOVERNANCE_DECISION custody records in
# cage:evidence:stream) and asserts thresholds_loaded_valid:
#   1. A verified GOVERNANCE_THRESHOLDS_LOADED record is present with a valid
#      64-hex SHA-256 thresholds_digest, schema_version >= 1, non-empty
#      domain_sections, and region matching the active CAGE_DEPLOYMENT_REGION.
#   2. Zero thresholds_digest drift (digest_mismatches == 0) across subsequent
#      GOVERNANCE_DECISION records since that load.
#
# It does not assert a Kubernetes ConfigMap/governance-thresholds-config (no
# Terraform module creates one; config/governance_thresholds.json ships inside
# the digest-pinned gateway image) or the retired standalone NeMo Guardrails
# ConfigMap (opt-in in-process under W6).
#
# Rating status: remains rated Stub in compliance/lula/README.md under
# POAM-2026-151 pending a recorded live in-cluster Lula / Gate W run.
#
# Domain: api → compliance-bridge (GET /v1/compliance/cm6)
# Provider: opa (inline Rego)
#
# References:
#   - config/governance_thresholds.json — Governance threshold settings
#   - src/compliance_bridge/main.py — GET /v1/compliance/cm6 (alias: GET /v1/config/cm6)
#   - src/compliance_bridge/metrics.py — get_cm6_thresholds_posture()
#   - docs/POAM.md — POAM-2026-151 (CM-6 validation remediation)

component-definition:
  uuid: f1e70118-589f-520e-9ecf-d6783dfb5391
  metadata:
    title: CAGE Validation — CM6
    last-modified: '2026-11-21T23:15:00Z'
    version: 1.1.0
    oscal-version: 1.1.2
    remarks: |-
      Auto-converted from standalone lula validation format.
      Region: US_FED. Posture: nist-sp800-53.
      Notes: NIST SP 800-53 Rev 5 CM-6: Configuration Settings. Queries compliance-bridge GET /v1/compliance/cm6 (with GET /v1/config/cm6 alias) to verify that the active gateway emitted a KMS-signed GOVERNANCE_THRESHOLDS_LOADED custody record with a 64-hex SHA-256 thresholds_digest, region matching CAGE_DEPLOYMENT_REGION, schema_version >= 1, and non-empty domain_sections, and that zero subsequent GOVERNANCE_DECISION records drifted from that digest (digest_mismatches == 0). Replaces the vacuous ConfigMap/cage-deployment fallback (POAM-2026-151 Option 2 Step 2); remains rated Stub in compliance/lula/README.md pending a recorded live cluster Lula run. The NeMo Guardrails configuration is not asserted (opt-in under W6). See: compliance/continuous-monitoring/ISCM_STRATEGY.md — CM-6 monitoring cadence. See: docs/POAM.md — POAM-2026-151.
  components:
  - uuid: d5fa035a-4fb3-5485-88a4-347630f5fe50
    type: software
    title: CAGE Cybernetic Governance Engine
    description: The Cybernetic AI Governance Engine (CAGE) — AI governance gateway, compliance bridge, and governed financial
      advisor.
    control-implementations:
    - uuid: 9dec443c-138b-578d-9255-d6f67fc95c5b
      source: https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final
      description: 'Control implementation for CM6. Region: US_FED. Posture: nist-sp800-53.'
      implemented-requirements:
      - uuid: 7054ff11-50ab-5798-80b5-7f28c918da9a
        control-id: cm6
        description: Automated lula validation for CM6.
        links:
        - href: '#d3a42dd5-3cf9-5ee5-baae-5b72ebd497ab'
          rel: lula
  back-matter:
    resources:
    - uuid: d3a42dd5-3cf9-5ee5-baae-5b72ebd497ab
      title: Lula Validation — CM6
      rlinks:
      - href: lula.dev
      description: |
        domain:
          type: api
          api-spec:
            requests:
              - name: cm6_thresholds_posture
                url: http://compliance-bridge.governance-stack.svc.cluster.local/v1/compliance/cm6
                method: GET
        provider:
          type: opa
          opa-spec:
            output:
              validation: lula.validate
              observations:
                - lula.assessment_remark
            rego: |
              package lula

              import future.keywords.if

              posture_doc := object.get(input.cm6_thresholds_posture, "response", input.cm6_thresholds_posture)
              status := object.get(posture_doc, "assessment_status", "not_satisfied")
              thresholds_digest := object.get(posture_doc, "thresholds_digest", "")
              region := object.get(posture_doc, "region", "")
              active_region := object.get(posture_doc, "active_region", "")
              schema_version := object.get(posture_doc, "schema_version", 0)
              domain_sections := object.get(posture_doc, "domain_sections", [])
              decisions_checked := object.get(posture_doc, "decisions_checked", 0)
              digest_mismatches := object.get(posture_doc, "digest_mismatches", 0)

              # CM-6: Configuration Settings
              # Verifies KMS-signed GOVERNANCE_THRESHOLDS_LOADED digest posture and zero
              # digest drift across subsequent GOVERNANCE_DECISION records.
              thresholds_loaded_valid if {
                status == "satisfied"
                count(thresholds_digest) == 64
                regex.match("^[0-9a-f]{64}$", thresholds_digest)
                region != ""
                region == active_region
                schema_version >= 1
                count(domain_sections) > 0
                digest_mismatches == 0
              }

              validate if {
                count(input.cm6_thresholds_posture) > 0
                thresholds_loaded_valid
              }

              remark_status := "missing_metrics_response" if {
                count(input.cm6_thresholds_posture) == 0
              } else := "satisfied" if {
                thresholds_loaded_valid
              } else := "threshold_violation"

              assessment_remark := sprintf(
                "assessment_status=%s; control_id=CM-6; thresholds_digest=%s; region=%s; active_region=%s; schema_version=%d; decisions_checked=%d; digest_mismatches=%d",
                [remark_status, thresholds_digest, region, active_region, schema_version, decisions_checked, digest_mismatches],
              )
