      description: "domain:\n  type: kubernetes\n  kubernetes-spec:\n    resources:\n    - name: governance-thresholds-config\n      resource: configmaps\n      namespace: governance-stack\nprovider:\n  type: opa\n  opa-spec:\n    rego: \"package lula\\n\\nimport future.keywords.if\\n\\n# CM-6: Configuration Settings\\n# Verifies that the governance thresholds ConfigMap is present in the\\n# cluster, confirming that the baseline configuration settings are deployed\\n# and available to the governed services. The NeMo Guardrails ConfigMap is not\\n# asserted: NeMo rails are opt-in and their standalone server is off by\\n# default (W6).\\n# CM-6 requires that configuration settings are documented, applied, and\\n# monitored for unauthorized changes.\\nvalidate if {\\n  input[\\\"governance-thresholds-config\\\"].metadata.name != null\\n}\\n\"\n"
