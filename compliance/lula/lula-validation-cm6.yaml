# lula-validation-cm6.yaml
# NIST SP 800-53 Rev 5 — CM-6: Configuration Settings
#
# Asserts that the governance configuration is present and immutable in the
# cluster — specifically:
#   1. The governance-thresholds ConfigMap (from config/governance_thresholds.json)
#      is deployed and contains the expected keys.
#
# It no longer asserts the NeMo Guardrails ConfigMap. NeMo rails are opt-in
# (CAGE_NEMO_ENABLED=false by default), and the standalone server that created
# that ConfigMap is off unless inference_backend = "vllm" and
# enable_nemo_guardrails = true (W6).
#
# Known gaps, recorded rather than hidden:
#   - No Terraform module or manifest in this repository creates
#     governance-thresholds-config: the thresholds ship in the gateway image
#     (COPY config /app/config). As written, this validation cannot pass
#     (POAM-2026-151).
#   - Lula v0.16.0 rejected this manifest's schema (Kubernetes resources
#     without resource-rule) in every committed run (POAM-2026-150).
#
# Domain: kubernetes → ConfigMaps
# Provider: opa (inline Rego)
#
# References:
#   - config/governance_thresholds.json — Governance threshold settings
#   - deployment/k8s/financial-advisor.yaml — Financial advisor deployment (mounts config)
#   - docs/NIST_RMF_CHUNK1_CURRENT_STATE.md — CM-6 current state analysis
#
# Namespace: governance-stack (confirmed from live cluster deployment snapshot)

