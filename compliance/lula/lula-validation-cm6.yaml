# lula-validation-cm6.yaml
# NIST SP 800-53 Rev 5 — CM-6: Configuration Settings
#
# Asserts that the governance configuration is present and immutable in the
# cluster — specifically:
#   1. The governance-thresholds ConfigMap (from config/governance_thresholds.json)
#      is deployed and contains the expected keys.
#   2. The NeMo Guardrails ConfigMap or Secret exists, confirming the rail
#      configuration (config/rails/config.yml) is applied cluster-side.
#
# Domain: kubernetes → ConfigMaps
# Provider: opa (inline Rego)
#
# References:
#   - config/governance_thresholds.json — Governance threshold settings
#   - config/rails/config.yml — NeMo Guardrails configuration
#   - deployment/k8s/financial-advisor.yaml — Financial advisor deployment (mounts config)
#   - docs/NIST_RMF_CHUNK1_CURRENT_STATE.md — CM-6 current state analysis
#
# Namespace: governance-stack (confirmed from live cluster deployment snapshot)

metadata:
  annotations:
    cage.region: US_FED
    cage.compliance-posture: nist-sp800-53
    cage.posture-note: "NIST SP 800-53 is a US Federal posture requirement. This validation is skipped for EU_ECB and APAC_MAS deployments."

domain:
  type: kubernetes
  kubernetes-spec:
    resources:
      - name: governance-thresholds-config
        resource: configmaps
        namespace: governance-stack
      - name: nemo-guardrails-config
        resource: configmaps
        namespace: governance-stack

provider:
  type: opa
  opa-spec:
    rego: |
      package lula

      import future.keywords.if

      # CM-6: Configuration Settings
      # Verifies that the governance configuration ConfigMaps are present in the
      # cluster, confirming that the baseline configuration settings (thresholds,
      # NeMo Guardrails rules) are deployed and available to the governed services.
      # CM-6 requires that configuration settings are documented, applied, and
      # monitored for unauthorized changes.
      validate if {
        input["governance-thresholds-config"].metadata.name != null
        input["nemo-guardrails-config"].metadata.name != null
      }

notes: >
  NIST SP 800-53 Rev 5 CM-6: Configuration Settings.
  Namespace: governance-stack (confirmed from live cluster deployment snapshot).
  Automated verification that governance thresholds and NeMo Guardrails
  configuration are deployed as Kubernetes ConfigMaps, ensuring the baseline
  security configuration is active and cluster-immutable (vs. local file edits).
  The governance thresholds (config/governance_thresholds.json) define the fiscal
  and risk limits enforced by OPA; the NeMo Guardrails config (config/rails/)
  defines the output rail and content filtering rules.
  This validation also addresses the CM-6/SI-7 POAM items flagged in
  docs/NIST_RMF_CHUNK1_CURRENT_STATE.md regarding deprecated Rego stub confusion.
  See: compliance/continuous-monitoring/ISCM_STRATEGY.md — CM-6 monitoring cadence.
  See: docs/POAM.md — CM-6 POAM remediation item.
