      rlinks:
      - href: lula.dev
      description: "domain:\n  type: api\n  api-spec:\n    endpoints:\n    - name: langfuse_metrics_a52\n      url: http://compliance-bridge.governance-stack.svc.cluster.local/v1/metrics/A.5.2\n      method: GET\nprovider:\n  type: opa\n  opa-spec:\n    rego: \"package lula\\n\\nimport future.keywords.if\\n\\n# A.5.2: Social Impact Assessment — toxicity and prompt injection blocking\\n# Threshold: 99% (higher than A.5.3 because PII/social-harm failures are critical)\\n\\n# Rule 1: Cold-start grace period\\nvalidate if {\\n  input.langfuse_metrics_a52.startup_grace_active == true\\n  input.langfuse_metrics_a52.safety_rate >= 0.99\\n  input.langfuse_metrics_a52.evidence_age_seconds < 172800\\n}\\n\\n# Rule 2: Steady-state\\nvalidate if {\\n  input.langfuse_metrics_a52.startup_grace_active == false\\n  input.langfuse_metrics_a52.safety_rate >= 0.99\\n  input.langfuse_metrics_a52.total_traces > 100\\n  input.langfuse_metrics_a52.evidence_age_seconds < 172800\\n}\\n\"\n"
