# Local Development Overlay: LangGraph SDK Hot-Reload Posture
# Usage: docker compose -f docker-compose.yml -f docker-compose.local-dev.yml up --build
# Optional Redis checkpointer: --profile with-redis

version: "3.8"

services:
  # LangGraph SDK server with hot-reload source mounts
  graph-engine:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.local-dev
    ports:
      - "2024:2024"
    volumes:
      # Hot-reload mounts: changes to source files are reflected immediately
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./policies:/policies:ro
      - ./langgraph.json:/app/langgraph.json:ro
    env_file:
      - config/environments/local-dev.env
    extra_hosts:
      # Allow container to reach host services at localhost
      - "host.docker.internal:host-gateway"
    depends_on:
      gateway:
        condition: service_healthy
      opa:
        condition: service_healthy
    networks:
      - cage-network

  # Gateway: mount live source for parallel iteration
  gateway:
    volumes:
      - ./src:/app/src
      - ./config:/app/config
    env_file:
      - config/environments/local-dev.env

  # Checkpoint store (Redis): gated under profile for optional persistence
  checkpoint-store:
    image: redis:7.2-alpine
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - checkpoint-data:/data
    networks:
      - cage-network
    profiles:
      - with-redis

networks:
  cage-network:
    driver: bridge

volumes:
  checkpoint-data:
