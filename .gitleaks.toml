# Gitleaks configuration for CAGE (Cybernetic AI Governance Engine)
# Reference: docs/operations/GIT_WORKFLOW_STANDARDS.md, AGENTS.md § Secret Hygiene
#
# Extends the built-in Gitleaks ruleset (~150+ secret detection rules) and adds
# CAGE-specific credential patterns. Used by pre-commit hooks and the CI
# `secret-scan` job in `.github/workflows/security-scan.yml`.

title = "CAGE Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "cage-langfuse-key"
description = "Langfuse secret or public API key (sk-lf-* / pk-lf-*)"
regex = '''\b(?:sk|pk)-lf-[0-9a-wA-WyzYZ][0-9a-zA-Z_-]{19,}\b'''
tags = ["key", "langfuse", "cage"]

[[rules]]
id = "cage-huggingface-token"
description = "HuggingFace User Access Token (hf_*)"
regex = '''\bhf_[0-9A-Za-z]{20,}\b'''
tags = ["key", "huggingface", "cage"]

[[rules]]
id = "cage-google-credential"
description = "Google API key or GOOG credential token (GOOG* / AIza*)"
regex = '''\b(?:GOOG[0-9A-Za-z]{20,}|AIza[0-9A-Za-z_-]{35})\b'''
tags = ["key", "google", "cage"]

[[rules]]
id = "cage-aws-access-key-id"
description = "AWS Access Key ID (AKIA* / ASIA* / ABIA* / ACCA*)"
regex = '''\b(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}\b'''
tags = ["key", "aws", "cage"]

[[rules]]
id = "cage-private-key"
description = "PEM-encoded Private Key block"
regex = '''-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----'''
tags = ["key", "pem", "cage"]

[[rules.allowlists]]
description = "Historical implementation plan commit quoting the rg PEM regex pattern in prose"
commits = [
    "ad83b9c44fa272d21d970b5ef5d74aacf8409e8e",
]

[allowlist]
description = "Allowlist for non-secret identifiers, anchored synthetic test vectors, and rotated historical commits"

# Historical commits containing a dev-only Langfuse init password in
# infra/targets/gcp-gke/main.tf:411 that was removed from HCL in e5376b58 (#477)
# and rotated in live Cloud SQL Postgres on 2026-10-30 (tracked under
# POAM-2026-160 and POAM-2026-162). Allowlisted by commit SHA rather than path
# so active Terraform files under infra/ remain fully scanned.
commits = [
    "1902c92cc44ca6ef89450b57e9aa634486ab4148",
    "e608f3ac2488080762f6de93f9a932cb347c0fe1",
]

# Only .gitleaks.toml itself is path-excluded; docs/, plans/, tests/, contrib/,
# and .env.example remain fully scanned across HEAD and commit history (CIG-03).
paths = [
    '''^\.gitleaks\.toml$''',
]

# NOTE: `regexTarget` is intentionally omitted so Gitleaks tests `regexes`
# strictly against the extracted `Secret` capture group (never `line` or `match`).
# Every pattern below is anchored (`^...$`) so a real credential sharing a line
# with words like "example" or "placeholder" is never suppressed.
regexes = [
    # Exact environment-variable / template / redaction placeholders
    '''^\$\{[A-Z0-9_]+\}$''',
    '''^\{\{[^{}]+\}\}$''',
    '''^REDACTED_[A-Z_]+$''',
    '''^dev-only-insecure-placeholder$''',
    '''^(?:sk|pk)-lf-x{8,}$''',
    '''^hf_(?:x{8,}|abcdefghijklmnopqrstuvwxyz)$''',
    '''^"pk-lf-b055e6fe-\.\.\.:sk-lf-ba166771-\.\.\."$''',
    # Non-secret UUIDv4 identifiers (e.g. defer_token / trace IDs) and Python/CLI identifiers
    '''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''',
    '''^(?:ACTUATOR_01_SIGNING_KEYS_DIR|ACTUATOR_01_KMS_KEY|s3-reconciliation-bucket)$''',
    '''^(?:ed25519\.)?Ed25519PrivateKey$''',
    '''^(?:execution_verbs=healthcare_verbs|partner_slots=mismatched_slots|correlation_id=|cmd\+shift\+enter|S3-compatible)$''',
    # Anchored deterministic synthetic test fixtures (never real credentials)
    '''^(?:sk-lf-secret123456|nvapi-1234567890abcdef|def-tok-c91823ab|apr-9f1c2d3e|cbf_dose-reservation-001|lula-spoofed-ac3-insuff)$''',
    '''^(?:a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4|vk_test_0123456789abcdef0123456789abcdef|GOOG1E234567890ABCDEF)$''',
    '''^dGVzdC1hdXRoLWRhdGE(?:tYWxpY2U|tYm9i)?$''',
    '''^vfdKKZV6j8c6iDxKhlRqWiKsJ4tEA37-Sv41IVu_OM4FAAAAAQ$''',
    '''^eyJhbGciOiJSUzI1NiIs\.\.\.$''',
    '''^eyJhbGciOiJ(?:ub25lIn0|SUzI1Ni(?:Is|J9))[\w.-]*\.(?:e30\.?|c2lnX3BsYWNlaG9sZGVy[\w-]*|c2lnbmF0dXJlX3BsYWNlaG9sZGVy[\w-]*|cGFkZGVkX2Zha2Vfc2lnbmF0dXJl[\w-]*)$''',
]

