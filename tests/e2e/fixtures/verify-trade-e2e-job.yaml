# Live in-mesh trade-governance & inference-proxy E2E Job template.
#
# Runs inside the Linkerd mesh as `cage-advisor-sa` with label
# `app: governed-financial-advisor`, inheriting the advisor's exact
# peer-verified SPIFFE identity and per-workload NetworkPolicy egress to
# `gateway:8080` while keeping the short-lived Job pod out of
# `Service/governed-financial-advisor` endpoints (`readinessProbe` exits 1).
#
# Rendered and orchestrated by `tests/e2e/run_gke_e2e_suite.py` (`make test-gke-e2e`
# and `scripts/staging_lifecycle.sh --enable-e2e-advisor`).
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: governance-stack
  labels:
    app.kubernetes.io/name: ${JOB_NAME}
    app.kubernetes.io/part-of: cybernetic-governance-engine
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: governed-financial-advisor
        cage.io/e2e-job: ${JOB_NAME}
      annotations:
        linkerd.io/inject: enabled
        config.alpha.linkerd.io/proxy-wait-before-exit-seconds: "0"
    spec:
      restartPolicy: Never
      serviceAccountName: cage-advisor-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify-trade-e2e
          image: ${WORKLOAD_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["/app/.venv/bin/python", "/e2e/in_mesh_runner.py"]
          env:
            - name: CAGE_E2E_PHASE
              value: "${E2E_PHASE}"
            - name: CAGE_E2E_GATEWAY_URL
              value: "http://gateway.governance-stack.svc.cluster.local:8080"
            - name: CAGE_E2E_MODEL_NAME
              value: "${E2E_MODEL_NAME}"
            - name: CAGE_E2E_REQUIRE_INFERENCE_PROXY
              value: "${REQUIRE_INFERENCE_PROXY}"
            - name: CAGE_E2E_DEFERRED_IDS_JSON
              value: '${DEFERRED_IDS_JSON}'
            - name: LANGSMITH_TRACING
              value: "false"
            - name: LANGCHAIN_TRACING_V2
              value: "false"
          readinessProbe:
            exec:
              command: ["/app/.venv/bin/python", "-c", "raise SystemExit(1)"]
            initialDelaySeconds: 1
            periodSeconds: 30
          volumeMounts:
            - name: e2e-runner
              mountPath: /e2e
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: e2e-runner
          configMap:
            name: ${CONFIGMAP_NAME}
