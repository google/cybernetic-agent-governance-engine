[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-servers-infrastructure"
version = "0.1.0"
description = "MCP server for CAGE infrastructure management"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Cybernetic Governance Engine Authors"}
]
dependencies = [
    "mcp>=0.9.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_servers*"]

[tool.setuptools.package-data]
mcp_servers = ["py.typed"]
