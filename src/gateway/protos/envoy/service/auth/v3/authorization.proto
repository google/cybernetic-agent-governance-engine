// Vendored from envoy-api (Apache 2.0) — envoy.service.auth.v3.Authorization
// Source: https://github.com/envoyproxy/envoy/blob/main/api/envoy/service/auth/v3/authorization.proto
// Simplified subset sufficient for CAGE AgentGatewayAdapter (ext_authz Check).

syntax = "proto3";

package envoy.service.auth.v3;

import "envoy/service/auth/v3/attribute_context.proto";
import "envoy/config/core/v3/base.proto";
import "envoy/type/v3/http_status.proto";

option java_package = "io.envoyproxy.envoy.service.auth.v3";
option java_outer_classname = "AuthorizationProto";
option java_multiple_files = true;

// A generic interface for performing authorization check on incoming
// requests to a networked service.
service Authorization {
  // Performs authorization check based on the attributes associated with the
  // incoming request, and returns status ``OK`` or not ``OK``.
  rpc Check(CheckRequest) returns (CheckResponse) {}
}

message CheckRequest {
  // The request attributes.
  envoy.service.auth.v3.AttributeContext attributes = 1;
}

// HTTP attributes for a denied response.
message DeniedHttpResponse {
  // This field allows the authorization service to send an HTTP response status
  // code to the downstream client. If not set, Envoy sends ``403 Forbidden``
  // HTTP status code by default.
  envoy.type.v3.HttpStatus status = 1;

  // This field allows the authorization service to send HTTP response headers
  // to the downstream client. Note that the :ref:`append field in HeaderValueOption
  // <envoy_v3_api_field_config.core.v3.HeaderValueOption.append>` defaults to
  // false when used in this message.
  repeated envoy.config.core.v3.HeaderValueOption headers = 2;

  // This field allows the authorization service to send a response body data
  // to the downstream client.
  string body = 3;
}

// HTTP attributes for an OK response.
message OkHttpResponse {
  // HTTP entity headers in addition to the original request headers. This
  // allows the authorization service to append, to add or to override headers
  // from the original request before dispatching it to the upstream. Note that
  // the :ref:`append field in HeaderValueOption
  // <envoy_v3_api_field_config.core.v3.HeaderValueOption.append>` defaults to
  // false when used in this message. By setting the ``append`` field to ``true``,
  // the filter will append the correspondent header value to the matched
  // request header.
  repeated envoy.config.core.v3.HeaderValueOption headers = 2;

  // HTTP entity headers to remove from the original request before dispatching
  // it to the upstream. This allows the authorization service to act on auth
  // related headers (like ``Authorization``), process them, and consume them.
  // Under this model, the upstream will not see the original auth headers.
  repeated string headers_to_remove = 5;

  // This field allows the authorization service to send HTTP response body data
  // to the downstream client on ``OK`` response.
  string response_headers_to_add = 6;
}

// Intended for gRPC and Network Authorization servers ``only``.
message CheckResponse {
  // Status ``OK`` allows the request. Any other status indicates the request
  // should be denied, and for HTTP filter, if not overridden by
  // :ref:`denied HTTP response status <envoy_v3_api_field_service.auth.v3.DeniedHttpResponse.status>`
  // Envoy sends ``403 Forbidden`` HTTP status code by default.
  // [#comment: In the future, we plan to add support for a list of
  // temporary redirect HTTP status codes (3xx).]
  int32 status = 1;

  oneof http_response {
    // Supplies http attributes for a denied response.
    DeniedHttpResponse denied_response = 4;

    // Supplies http attributes for an ok response.
    OkHttpResponse ok_response = 5;
  }

  // Optional response metadata that will be emitted as dynamic metadata to be consumed by the
  // next filter. This metadata lives in a namespace specified by the canonical name of extension
  // filter that requires it:
  map<string, string> dynamic_metadata = 6;
}
