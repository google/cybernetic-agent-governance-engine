# Finance domain causal graph configuration  
# Consumed by src.gateway.governance.causal.gatekeeper.causal_safety_check()
#
# Per PR C §7.3 T-C2: the causal graph structure (treatment, outcome, confounders)
# is domain-specific. The kernel owns the DoWhy refutation logic and the
# placebo p-value evaluation.

treatment: trade_amount
outcome: risk_score

common_causes:
  - market_volatility

# DoWhy digraph specification
# This represents the structural causal model for finance domain actions
graph: |
  digraph {
      market_volatility -> trade_amount;
      market_volatility -> risk_score;
      trade_amount -> risk_score;
  }

# Refutation parameters (domain-tuned)
refutation:
  method: placebo_treatment_refuter
  num_simulations: 50
  p_value_threshold: 0.05
