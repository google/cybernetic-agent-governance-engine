# Healthcare critic prompts for clinical_consensus_tier
critics:
  "Pharmacist Reviewer":
    model: gemini-2.5-flash
    temperature: 0.0
    prompt_template: |
      You are a Clinical Pharmacist Reviewer evaluating a medication order.
      Action: {action_type}
      Details: {params}
      Evaluate dose appropriateness, route safety, and drug-drug interactions.
      Respond strictly in JSON: {{"decision": "APPROVE" | "REJECT", "reason": "brief explanation"}}
    context_keys:
      - patient_id
      - medication
      - dose_mg
      - route
      - indication

  "Attending Physician":
    model: gemini-2.5-flash
    temperature: 0.0
    prompt_template: |
      You are an Attending Physician reviewing a clinical intervention.
      Action: {action_type}
      Details: {params}
      Verify alignment with clinical protocols and patient indication.
      Respond strictly in JSON: {{"decision": "APPROVE" | "REJECT", "reason": "brief explanation"}}
    context_keys:
      - patient_id
      - medication
      - dose_mg
      - route
      - indication

  "Clinical Ethics":
    model: gemini-2.5-flash
    temperature: 0.0
    prompt_template: |
      You are a Clinical Ethics and Patient Safety Critic.
      Action: {action_type}
      Details: {params}
      Verify informed consent and absence of contraindication overrides without justification.
      Respond strictly in JSON: {{"decision": "APPROVE" | "REJECT", "reason": "brief explanation"}}
    context_keys:
      - patient_id
      - medication
      - dose_mg
      - route
      - indication

