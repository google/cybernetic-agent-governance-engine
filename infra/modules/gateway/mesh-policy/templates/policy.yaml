# Deny by default on the gateway HTTP port. Once a Server has HTTPRoutes,
# Linkerd refuses any request that matches no route, and a route with no
# AuthorizationPolicy admits nobody. Two routes cover the whole path space:
#   gateway-open   exact open paths                      → any client, incl. kubelet probes
#   gateway-gated  PathPrefix "/" (everything else)       → trusted mesh identities only
# Exact and longer-prefix matches win over "/", so the open paths never fall
# into the gated route. The gateway repeats the same check on l5d-client-id
# (WorkloadIdentityMiddleware), so deleting these objects does not open it.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: gateway-http
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: gateway
  port: http
---
apiVersion: policy.linkerd.io/v1beta3
kind: HTTPRoute
metadata:
  name: gateway-open
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: policy.linkerd.io
      kind: Server
      name: gateway-http
  rules:
    - matches:
{{- range .Values.openExactPaths }}
        - path:
            type: Exact
            value: {{ . | quote }}
{{- end }}
---
apiVersion: policy.linkerd.io/v1beta3
kind: HTTPRoute
metadata:
  name: gateway-gated
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: policy.linkerd.io
      kind: Server
      name: gateway-http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: policy.linkerd.io/v1alpha1
kind: NetworkAuthentication
metadata:
  name: gateway-any-network
  namespace: {{ .Release.Namespace }}
spec:
  networks:
    - cidr: 0.0.0.0/0
    - cidr: ::/0
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: gateway-open
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: gateway-open
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: NetworkAuthentication
      name: gateway-any-network
{{- if .Values.trustedIdentities }}
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: gateway-trusted-clients
  namespace: {{ .Release.Namespace }}
spec:
  identities:
{{- range .Values.trustedIdentities }}
    - {{ . | quote }}
{{- end }}
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: gateway-gated
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: gateway-gated
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: gateway-trusted-clients
{{- end }}
