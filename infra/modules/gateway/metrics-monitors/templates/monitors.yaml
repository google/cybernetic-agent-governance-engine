{{- if .Values.podMonitoring.enabled }}
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: gateway-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app: gateway
spec:
  selector:
    matchLabels:
      app: gateway
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.podMonitoring.interval | quote }}
      timeout: {{ .Values.podMonitoring.timeout | quote }}
{{- end }}
{{- if and .Values.podMonitoring.enabled .Values.serviceMonitor.enabled }}
---
{{- end }}
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: stera-gateway-monitor
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
    app: gateway
spec:
  selector:
    matchLabels:
      app: gateway
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval | quote }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout | quote }}
{{- end }}
