apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: compliance-bridge-http
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    cage.io/component: z3n-mtls
  annotations:
    compliance.nist.gov/control: "SC-8,IA-3,AC-3,AC-4,AU-9"
    cage.io/poam: "POAM-2026-080,POAM-2026-195"
spec:
  podSelector:
    matchLabels:
      app: compliance-bridge
  port: 3001
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1beta3
kind: HTTPRoute
metadata:
  name: compliance-bridge-probe
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: policy.linkerd.io
      kind: Server
      name: compliance-bridge-http
  rules:
    - matches:
        - method: GET
          path:
            type: Exact
            value: /health
---
apiVersion: policy.linkerd.io/v1beta3
kind: HTTPRoute
metadata:
  name: compliance-bridge-infra-events
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: policy.linkerd.io
      kind: Server
      name: compliance-bridge-http
  rules:
    - matches:
        - method: POST
          path:
            type: Exact
            value: /v1/infra/events
        - method: GET
          path:
            type: PathPrefix
            value: /v1/metrics/
        - method: GET
          path:
            type: PathPrefix
            value: /v1/compliance/
        - method: GET
          path:
            type: PathPrefix
            value: /v1/aarm/
---
apiVersion: policy.linkerd.io/v1beta3
kind: HTTPRoute
metadata:
  name: compliance-bridge-internal
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: policy.linkerd.io
      kind: Server
      name: compliance-bridge-http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: policy.linkerd.io/v1alpha1
kind: NetworkAuthentication
metadata:
  name: compliance-bridge-probe-network
  namespace: {{ .Release.Namespace }}
spec:
  networks:
    - cidr: 0.0.0.0/0
    - cidr: ::/0
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: compliance-bridge-probe
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: compliance-bridge-probe
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: NetworkAuthentication
      name: compliance-bridge-probe-network
{{- if .Values.trustedIdentities }}
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: compliance-bridge-trusted
  namespace: {{ .Release.Namespace }}
spec:
  identities:
{{- range .Values.trustedIdentities }}
    - {{ . | quote }}
{{- end }}
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: compliance-bridge-infra-events
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: compliance-bridge-infra-events
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: compliance-bridge-trusted
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: compliance-bridge-internal
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: compliance-bridge-internal
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: compliance-bridge-trusted
{{- end }}
{{- if .Values.auditorIdentity }}
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: compliance-bridge-auditor
  namespace: {{ .Release.Namespace }}
spec:
  identities:
    - {{ .Values.auditorIdentity | quote }}
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: compliance-bridge-infra-events-auditor
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: compliance-bridge-infra-events
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: compliance-bridge-auditor
{{- end }}
---
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: compliance-bridge-metrics
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: compliance-bridge
  port: 9090
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1beta3
kind: HTTPRoute
metadata:
  name: compliance-bridge-metrics-scrape
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: policy.linkerd.io
      kind: Server
      name: compliance-bridge-metrics
  rules:
    - matches:
        - path:
            type: Exact
            value: "/metrics"
          method: GET
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: compliance-bridge-metrics-scrape
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: compliance-bridge-metrics-scrape
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: NetworkAuthentication
      name: compliance-bridge-probe-network
