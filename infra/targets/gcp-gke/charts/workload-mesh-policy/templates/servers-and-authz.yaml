# ─── 9. Governed Financial Advisor (8080) — Deny-All Inbound ──────────────────
# Zero AuthorizationPolicy references governed-advisor-http; no in-mesh caller
# may reach the untrusted neural-plane pod inbound.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: governed-advisor-http
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    cage.io/component: z3n-mtls
spec:
  podSelector:
    matchLabels:
      app: governed-financial-advisor
  port: 8080
  proxyProtocol: HTTP/1
---
# ─── 10. AgentSight UI (8080) — Kubelet Exact "/" Probe Only ──────────────────
# L3/L4 default-deny-ingress drops non-kubelet pod traffic; Linkerd exposes
# only GET "/" so kubelet readiness/liveness succeeds without opening a mesh grant.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: agentsight-ui-http
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    cage.io/component: z3n-mtls
spec:
  podSelector:
    matchLabels:
      app: agentsight-ui
  port: 8080
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1beta3
kind: HTTPRoute
metadata:
  name: agentsight-ui-probe
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: policy.linkerd.io
      kind: Server
      name: agentsight-ui-http
  rules:
    - matches:
        - method: GET
          path:
            type: Exact
            value: /
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: agentsight-ui-probe
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: agentsight-ui-probe
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: NetworkAuthentication
      name: workload-probe-network
