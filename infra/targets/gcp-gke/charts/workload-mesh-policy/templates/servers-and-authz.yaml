  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    cage.io/component: z3n-mtls
  annotations:
    compliance.nist.gov/control: "SC-8,IA-3,AC-3,AC-4,AU-9"
    cage.io/poam: "POAM-2026-080,POAM-2026-195"
spec:
  podSelector:
    matchLabels:
      app: langfuse-web
  port: 3000
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1beta3
kind: HTTPRoute
metadata:
  name: langfuse-web-probe
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: policy.linkerd.io
      kind: Server
