# Deny-by-default Linkerd authorization across every non-gateway-HTTP workload
# port in governance-stack (POAM-2026-080, POAM-2026-195, F-17, F-19, R-16, F-103).
# Gateway HTTP port 8080 stays in infra/modules/gateway/mesh-policy/ (gateway-http).
#
# Kubelet HTTP health probes run unmeshed from the node IP (which GKE Dataplane V2
# permits automatically while L3/L4 NetworkPolicy denies non-kubelet pods). Each
# HTTP Server with a kubelet probe therefore splits its path space identically to
# infra/modules/gateway/mesh-policy/:
#   <workload>-probe   GET on the exact probe path ONLY -> NetworkAuthentication
#   <workload>-gated   PathPrefix "/" (everything else) -> MeshTLSAuthentication ONLY
---
apiVersion: policy.linkerd.io/v1alpha1
kind: NetworkAuthentication
metadata:
  name: workload-probe-network
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    cage.io/component: z3n-mtls
spec:
  networks:
    - cidr: 0.0.0.0/0
    - cidr: ::/0
---
# ─── 1. Gateway gRPC (50051) & Metrics (9090) ─────────────────────────────────
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: gateway-grpc
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    cage.io/component: z3n-mtls
  annotations:
    compliance.nist.gov/control: "SC-8,IA-3,AC-3,AC-4"
    cage.io/poam: "POAM-2026-080,POAM-2026-195"
spec:
  podSelector:
    matchLabels:
      app: gateway
  port: 50051
  proxyProtocol: gRPC
{{- if .Values.identities.gatewayGrpcClients }}
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: gateway-grpc-clients
  namespace: {{ .Release.Namespace }}
spec:
  identities:
{{- range .Values.identities.gatewayGrpcClients }}
    - {{ . | quote }}
{{- end }}
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: gateway-grpc
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: gateway-grpc
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: gateway-grpc-clients
{{- end }}
---
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: gateway-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    cage.io/component: z3n-mtls
spec:
  podSelector:
    matchLabels:
      app: gateway
  port: 9090
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1beta3
kind: HTTPRoute
metadata:
  name: gateway-metrics-scrape
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: policy.linkerd.io
      kind: Server
      name: gateway-metrics
  rules:
    - matches:
        - method: GET
          path:
            type: Exact
            value: /metrics
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: gateway-metrics-scrape
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: gateway-metrics-scrape
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: NetworkAuthentication
      name: workload-probe-network
---
# ─── 2. vLLM Model Backends (8000) — Strictly cage-gateway-sa ONLY (R-16, F-103) ─
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: model-backend-http
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    cage.io/component: z3n-mtls
  annotations:
    compliance.nist.gov/control: "SC-8,IA-3,AC-3,AC-4"
    cage.io/poam: "POAM-2026-080,POAM-2026-195"
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - vllm-inference
          - vllm-reasoning
          - inference-stub
  port: 8000
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1beta3
kind: HTTPRoute
metadata:
  name: vllm-probe
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: policy.linkerd.io
      kind: Server
      name: model-backend-http
  rules:
    - matches:
        - method: GET
          path:
            type: Exact
            value: /health
---
apiVersion: policy.linkerd.io/v1beta3
kind: HTTPRoute
metadata:
  name: vllm-gated
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: policy.linkerd.io
      kind: Server
      name: model-backend-http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: vllm-probe
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: vllm-probe
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: NetworkAuthentication
      name: workload-probe-network
{{- if .Values.identities.modelBackendClients }}
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: model-backend-clients
  namespace: {{ .Release.Namespace }}
spec:
  identities:
{{- range .Values.identities.modelBackendClients }}
    - {{ . | quote }}
{{- end }}
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: vllm-gated
  namespace: {{ .Release.Namespace }}
  annotations:
    compliance.nist.gov/control: "SC-8,IA-3,AC-3,AC-4"
    cage.io/poam: "POAM-2026-080,POAM-2026-195"
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: vllm-gated
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: model-backend-clients
{{- end }}
---
