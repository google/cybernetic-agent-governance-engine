name: build
# Cancel superseded runs for the same ref. Without this, the push +
# pull_request double-trigger consumes two identical sets of runners on
# every push to an open PR (measured: 23.3 duplicated job-minutes per push).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      # PR validation runs via the pull_request event. Pushing to a
      # feature branch no longer double-triggers this workflow.
      - main
  pull_request:
    branches:
      - main

# Default least-privilege permissions for every job in this workflow.
# zizmor's excessive-permissions audit flags jobs with no permissions:
# block because they inherit the (potentially broad) repository default.
# Individual jobs may still narrow further if they need write access.
permissions:
  contents: read

jobs:
  squash-merge-guard:
    name: "Squash Merge Guard"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Detect non-squash merge commits on main
        run: |
          parents=$(git cat-file -p HEAD | grep -c "^parent ")
          if [ "$parents" -gt 1 ]; then
            echo "::error::Non-squash merge commit detected on main ($(git rev-parse HEAD))."
            echo "::error::GIT_WORKFLOW_STANDARDS §4.5 requires squash merge for all PRs."
            echo "::error::Fix: Settings → General → Pull Requests → disable 'Allow merge commits'."
            exit 1
          fi
          echo "OK: HEAD is a single-parent commit (squash or direct push)."

  branch-name-validator:
    name: "Branch Name Validator"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          echo "Validating PR branch name: $BRANCH_NAME"
          
          # Pattern matches AGENTS.md enforcement rules.
          # Hotfix has different structure (version-desc), so use alternation:
          # Standard: (type)/(description)
          # Hotfix:   hotfix/(version)-(description)
          PATTERN='^(feat|fix|docs|refactor|ci|test|chore|spike)/[a-z0-9]([a-z0-9-]{0,28}[a-z0-9])?$|^hotfix/v?[0-9]+\.[0-9]+\.[0-9]+-[a-z0-9]([a-z0-9-]{0,28}[a-z0-9])?$'
          
          if ! echo "$BRANCH_NAME" | grep -qE "$PATTERN"; then
            echo "::error::Branch name '$BRANCH_NAME' does not follow the project's naming convention."
            echo "::error::See AGENTS.md § Branch Naming & Merge Strategy for rules."
            echo ""
            echo "Valid patterns:"
            echo "  feat/<description>     — new feature"
            echo "  fix/<description>      — bug fix"
            echo "  docs/<description>     — documentation"
            echo "  refactor/<description> — code restructuring"
            echo "  ci/<description>       — CI/CD changes"
            echo "  test/<description>     — test additions"
            echo "  chore/<description>    — maintenance"
            echo "  hotfix/<version>-<desc> — production hotfix"
            echo "  spike/<description>    — experiment"
            echo ""
            echo "Where <description>:"
            echo "  - lowercase kebab-case only (a-z, 0-9, hyphens)"
            echo "  - ≤ 30 characters"
            echo "  - no uppercase, no underscores, no trailing hyphens"
            echo ""
            echo "Rejected patterns:"
            echo "  ❌ feature/... (use feat/)"
            echo "  ❌ bugfix/...  (use fix/)"
            echo "  ❌ Feature/... (no uppercase)"
            echo "  ❌ feat_thing  (no underscores)"
            echo "  ❌ random-name (missing prefix)"
            exit 1
          fi
          
          echo "✅ Branch name is valid: $BRANCH_NAME"

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Apache 2.0 License Headers
        run: |
          # A simple check to ensure Apache 2.0 or Copyright 2026 Cybernetic Governance Engine is present
          echo "Validating Apache 2.0 licensing headers across all source files..."
          missing_headers=0
          for file in $(find src/ -name '*.py' -o -name '*.js' -o -name '*.ts' -o -name '*.tsx'); do
            if ! grep -q "Apache License" "$file" && ! grep -q "Copyright 2026" "$file"; then
              echo "Missing Apache 2.0 license header in: $file"
              missing_headers=1
            fi
          done
          
          if [ "$missing_headers" -eq 1 ]; then
            echo "License validation failed."
            exit 1
          fi
          echo "All source files have the required Apache 2.0 licensing headers."

  marker-contract-check:
    name: "Pytest Marker Contract"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      - name: Install Dependencies
        run: uv sync --all-groups --all-extras
      - name: Verify every collected test carries a selection marker
        env:
          CAGE_ENV: "test"
          OPENAI_API_KEY: "sk-dummy"
          REDIS_URL: "redis://localhost:6379/0"
          LANGFUSE_HOST: "http://localhost:3000"
          LANGFUSE_PUBLIC_KEY: "pk-dummy"
          LANGFUSE_SECRET_KEY: "sk-dummy"
        # No -m filter: the guard must see EVERY collected item.
        # -p no:xdist / -n0 keeps the failure message single-copy and readable.
        run: |
          uv run pytest tests/ --collect-only -q --no-cov -n0 \
            -p no:langsmith -p no:langsmith_plugin

  pytest-logic:
    # One job covers every region: tests/conftest.py pins hermetic sessions to
    # US_FED and runs each test marked us_fed / eu_ecb / apac_mas under its own
    # region (tests/fixtures/deployment_region.py), so no region matrix.
    name: "Pytest Logic Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      - name: Install Dependencies
        run: uv sync --all-groups --all-extras
      - name: Run Pytest (unit/local)
        env:
          CAGE_ENV: "test"
          OPENAI_API_KEY: "sk-dummy"
          MODEL_REASONING: "casperhansen/deepseek-r1-distill-qwen-14b-awq"
          MODEL_FAST: "Qwen/Qwen2.5-7B-Instruct"
          VLLM_API_KEY: "dummy"
          VLLM_GATEWAY_URL: "http://localhost:8081/v1"
          REDIS_URL: "redis://localhost:6379/0"
          OPA_URL: "http://localhost:8181"
          LANGFUSE_HOST: "http://localhost:3000"
          LANGFUSE_PUBLIC_KEY: "pk-dummy"
          LANGFUSE_SECRET_KEY: "sk-dummy"
        run: uv run pytest -p no:langsmith -p no:langsmith_plugin tests/ -m "local or unit" -n auto --dist=loadscope -v --cov-branch --cov=src --cov-fail-under=70
      - name: Run Bandit SAST (medium+ severity)
        run: uv run bandit -r src/ -c pyproject.toml -ll

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      - name: Check lockfile integrity
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --all-groups --all-extras
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy type check
        run: uv run mypy src/
      - name: Import boundary check (G3 - Layer 1 → Layer 2/3/4 + reverse scan)
        # PR B (domain extraction) established clean layer isolation.
        # This gate blocks any Layer 1 (gateway) → Layer 2 (cage_*) imports.
        # C7 added reverse scan: Layer 3 (integrations) must not import Layer 2 or Layer 4.
        # Violations indicate a regression in the plugin seam architecture.
        run: |
          uv run python scripts/check_import_boundaries.py --verbose
      - name: Domain literal check (G6 - No domain action names in kernel/integrations)
        # C7: kernel and integrations must be domain-agnostic.
        # Domain action names (execute_trade, reverse_trade) belong in domain plugins.
        # Violations indicate hardcoded domain coupling in vendor-neutral layers.
        run: |
          uv run python scripts/check_domain_literals.py --verbose
      - name: Telemetry literal check (G7 - No raw vendor literals in executable code)
        # AW-6: Gate G7 blocks any raw telemetry vendor string literals in executable code.
        # All telemetry attributes must be imported from src.gateway.observability.attributes.
        run: |
          uv run python scripts/check_telemetry_literals.py --verbose
      - name: Vendor brand check (G8 - No vendor brands in kernel executable code)
        # C7: kernel must be vendor-neutral. Vendor names in prose/docs are legitimate,
        # but executable literals (enum members, Redis keys, env vars) must use abstractions.
        # Empty brand list means gate is wired but not currently restrictive.
        run: |
          uv run python scripts/check_vendor_brands.py --verbose
      - name: Project-ID hygiene check
        # W1.8: Ensure no maintainer-specific cloud project identifiers are leaked in tracked files.
        run: |
          uv run python scripts/check_project_id_hygiene.py --verbose
      - name: Documentation reference check (G9 - No dangling paths or symbols in core docs)
        # Docs drift silently: a renamed module leaves the prose pointing at a file that
        # no longer exists. This gate fails the build on broken links, dangling file
        # paths, and stale Python symbol references.
        # Scoped to the reconciled tree; docs/partners/** carries a known backlog and is
        # excluded until it reaches zero. CHANGELOG.md is excluded by design — a
        # changelog must be free to name paths that were removed.
        run: |
          uv run python scripts/check_doc_references.py \
            --path README.md \
            --path AGENTS.md \
            --path COMPLIANCE.md \
            --path SECURITY.md \
            --path CONTRIBUTING.md \
            --path docs/architecture \
            --path compliance

  bare-kernel-smoke:
    name: "Bare-Kernel Smoke Test (Zero Cloud SDKs)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"
      - name: Install bare dependencies (no cloud extras)
        run: uv sync --extra gateway --group dev
      - name: Run bare-kernel portability tests
        run: |
          uv run pytest tests/test_bare_kernel_portability.py -v -p no:langsmith -p no:langsmith_plugin

  eu-ecb-bias-eval:
    name: EU_ECB LLM Bias Evaluation
    runs-on: ubuntu-latest
    # Previously gated on `vars.CAGE_DEPLOYMENT_REGION == 'EU_ECB'`. That
    # repository variable is not set, so the condition was always false and
    # this EU AI Act / GDPR Art.9 gate never executed — it reported "skipped"
    # on every commit. The suite is hermetic (14 tests, no live vLLM needed),
    # so it now runs unconditionally with the region pinned in the step env.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --all-groups --all-extras
      - name: Run EU_ECB bias metrics tests
        env:
          CAGE_DEPLOYMENT_REGION: EU_ECB
          VLLM_FAST_API_BASE: ${{ vars.VLLM_FAST_API_BASE || 'http://localhost:8001/v1' }}
        run: |
          uv run pytest -p no:langsmith -p no:langsmith_plugin compliance/postures/eu_ecb/llm_eval/ -v --timeout=300

  agent-state-schema-check:
    name: "Agent State Schema Freshness Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      - name: Install dependencies
        run: uv sync --all-groups --all-extras
      - name: Check agent_state_schema.json is synchronized
        run: |
          uv run python scripts/generate_agent_state_schema.py --check

  stpa-freshness-check:
    name: "STPA Artifact Freshness Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml pydantic ruff
      - name: Check generated STPA artifacts are current
        run: |
          python scripts/check_stpa_freshness.py --verbose

  nemo-freshness-check:
    name: "NeMo Rail Actions Freshness Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check nemo-rails-configmap actions.py snapshot is current
        run: |
          python3 - <<'EOF'
          import sys

          CONFIGMAP = "deployment/k8s/nemo-rails-configmap.yaml"
          CANONICAL = "config/rails/actions.py"

          # Extract the actions.py block from the ConfigMap YAML.
          # The block starts at the line containing "actions.py: |" (or "actions.py: |-")
          # and ends when the indentation drops back to the data: level.
          try:
              with open(CONFIGMAP) as f:
                  lines = f.readlines()
          except FileNotFoundError:
              print(f"ERROR: {CONFIGMAP} not found — add the configmap snapshot or update this check.")
              sys.exit(1)

          snapshot_lines = []
          in_block = False
          block_indent = None
          for line in lines:
              stripped = line.lstrip()
              indent = len(line) - len(stripped)
              if not in_block:
                  if stripped.startswith("actions.py:"):
                      in_block = True
                      # block_indent is the indentation of the content lines (one level deeper)
                      block_indent = indent + 2
                  continue
              # Inside the block: collect lines that are indented at block_indent or deeper
              if stripped == "" or indent >= block_indent:
                  snapshot_lines.append(line[block_indent:] if stripped else "\n")
              else:
                  break  # dedented back — end of block

          if not snapshot_lines:
              print(f"ERROR: Could not extract actions.py content from {CONFIGMAP}.")
              print("Ensure the ConfigMap has a 'actions.py:' key under 'data:'.")
              sys.exit(1)

          snapshot = "".join(snapshot_lines).rstrip("\n") + "\n"

          try:
              with open(CANONICAL) as f:
                  canonical = f.read()
          except FileNotFoundError:
              print(f"ERROR: {CANONICAL} not found.")
              sys.exit(1)

          if snapshot == canonical:
              print(f"OK: {CONFIGMAP} actions.py snapshot matches {CANONICAL}.")
          else:
              import difflib
              diff = list(difflib.unified_diff(
                  snapshot.splitlines(keepends=True),
                  canonical.splitlines(keepends=True),
                  fromfile=f"{CONFIGMAP}:actions.py",
                  tofile=CANONICAL,
              ))
              print("ERROR: ConfigMap actions.py snapshot is stale relative to config/rails/actions.py.")
              print("Regenerate the snapshot: copy config/rails/actions.py into the ConfigMap data block.")
              print("".join(diff[:80]))
              sys.exit(1)
          EOF

  no-direct-bind-proof:
    name: "NoDirectBind State-Space Proof"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      - name: Install Dependencies
        run: uv sync --all-groups --all-extras
      - name: Run exhaustive NoDirectBind enumeration
        run: |
          uv run python proof/model.py
      - name: Run pinned NoDirectBind regression tests
        run: |
          uv run pytest -p no:langsmith -p no:langsmith_plugin tests/test_no_direct_bind_proof.py -m local -v -o addopts=""

  langfuse-posture-check:
    name: "Langfuse Posture Dry-Run Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Langfuse posture dry-run check
        run: |
          export GOOGLE_CLOUD_PROJECT="mock-dev-project"
          # DEP-24: GOOGLE_CLOUD_LOCATION is derived from CAGE_DEPLOYMENT_REGION.
          # US_FED → us-central1 | EU_ECB → europe-west1 | APAC_MAS → asia-southeast1
          # Defaults to us-central1 for CI dry-run (no live cluster).
          _region="${CAGE_DEPLOYMENT_REGION:-US_FED}"
          case "$_region" in
            EU_ECB)    export GOOGLE_CLOUD_LOCATION="europe-west1" ;;
            APAC_MAS)  export GOOGLE_CLOUD_LOCATION="asia-southeast1" ;;
            *)         export GOOGLE_CLOUD_LOCATION="us-central1" ;;
          esac
          export LANGFUSE_HOST="http://localhost:3000"
          export LANGFUSE_PUBLIC_KEY="pk-lf-mock"
          export LANGFUSE_SECRET_KEY="sk-lf-mock"
          export LANGFUSE_COMPLIANCE_HOST="http://localhost:3001"
          export LANGFUSE_COMPLIANCE_PUBLIC_KEY="pk-lf-comp-mock"
          export LANGFUSE_COMPLIANCE_SECRET_KEY="sk-lf-comp-mock"
          python3 scripts/verify_langfuse_posture.py --dry-run --posture development

  # ── AI 600-1 Compliance Gates ──────────────────────────────────────────────

  lula-ai600-validation:
    name: "Lula AI 600-1 Validation"
    runs-on: ubuntu-latest
    needs: [pytest-logic]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate AI 600-1 Lula manifest structure (stub syntax check)
        # Stub manifests use OSCAL component-definition structure (not standalone domain/provider).
        # The domain/provider are embedded inside back-matter.resources[].description.
        # Full live lula validate runs post-cluster-provisioning per Phase 3 §7.5.
        run: python3 scripts/check_ai600_lula_manifests.py
      - name: Assert lula manifest count matches README
        run: |
          DISK_COUNT=$(ls compliance/lula/lula-validation-*.yaml 2>/dev/null | wc -l | tr -d ' ')
          # Count unique filenames referenced in README (grep -c counts lines, not unique names).
          README_COUNT=$(grep -o 'lula-validation-[a-z0-9_-]*\.yaml' compliance/lula/README.md | sort -u | wc -l | tr -d ' ')
          echo "Manifests on disk (compliance/lula/): $DISK_COUNT"
          echo "Unique manifests referenced in README: $README_COUNT"
          if [ "$DISK_COUNT" != "$README_COUNT" ]; then
            echo "ERROR: Manifest count mismatch. Add new manifests to compliance/lula/README.md or move drafts to compliance/lula/drafts/."
            exit 1
          fi
          echo "OK: manifest count consistent ($DISK_COUNT)"

  sbom-generate:
    name: "Generate and Validate SBOM"
    runs-on: ubuntu-latest
    needs: [license-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install cyclonedx-py
        run: pip install cyclonedx-py
      - name: Generate SBOM
        run: python -m cyclonedx_py environment > sbom.json
      - name: Validate SBOM schema
        run: |
          python -c "
          import json
          d = json.load(open('sbom.json'))
          assert d.get('bomFormat') == 'CycloneDX', \
            f'Unexpected bomFormat: {d.get(\"bomFormat\")!r}'
          print(f'SBOM validated: {d.get(\"bomFormat\")} v{d.get(\"specVersion\")}')
          "
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 90

  integration-smoke:
    name: "Integration Smoke Tests"
    runs-on: ubuntu-latest
    # Hard gate: requires live GKE cluster (GOOGLE_CREDENTIALS secret + kubeconfig).
    # Move to ci-integration.yml nightly workflow when cluster access is unavailable.
    # Fork PRs never have access to repository secrets, so skip the job entirely to
    # prevent spurious failures and avoid leaking the absence of secrets in log output.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [pytest-logic]
    steps:
