name: Dependency Review
# Cancel superseded runs for the same ref. Without this, the push +
# pull_request double-trigger consumes two identical sets of runners on
# every push to an open PR (measured: 23.3 duplicated job-minutes per push).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# POAM-013 / NIST SP 800-53 SI-2 / ISO 42001 §A.8.3
# Reviews dependency changes on every pull request.
# Blocks PRs that introduce new dependencies with known vulnerabilities,
# or that introduce CRITICAL/HIGH severity OSS license risks.

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "**/requirements*.txt"

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review (POAM-013)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Verify lockfile synchronization (POAM-013)
        run: |
          uv lock --check
          python scripts/check_locked_yanks.py uv.lock

      - name: Audit locked dependencies for CVEs (POAM-013)
        run: |
          uv sync --frozen --all-groups --all-extras
          uv pip install "pip-audit>=2.7.0"
          uv run pip-audit
