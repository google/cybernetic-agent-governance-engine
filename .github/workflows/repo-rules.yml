# Compares the protection GitHub enforces on this repository with the
# configuration .github/branch-protection-rules.md documents: the rules on
# main (review, required checks pinned to GitHub Actions, no force push, no
# deletion) and the release-tag ruleset. It reads the live configuration, not
# anything in the pull request, so it runs on a schedule as well: a ruleset
# disabled or edited between pushes turns this red the next morning
# (POAM-2026-169, POAM-2026-170).
name: repo-rules

on:
  push:
    branches:
      # PR validation runs via the pull_request event. Pushing to a
      # feature branch does not double-trigger this workflow.
      - main
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-rules:
    name: "Repository rules match the documented configuration"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      # Standard library only. The token raises the API rate limit; the
      # endpoints are readable without one on a public repository.
      - name: Compare live rules with the documented configuration
        run: python scripts/check_repo_rules.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
