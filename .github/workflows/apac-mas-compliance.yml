# DEP-13: APAC_MAS compliance gate workflow.
# Runs MAS FEAT, MAS Notice 655, and MAS TRM §4.2 compliance checks.
# This workflow is SCOPED TO APAC_MAS ONLY — it must not gate US_FED or EU_ECB releases.
#
# Jurisdictional Hierarchy:
#   Universal: ISO 42001 (ci.yml)
#   EU_ECB:    EU AI Act / GDPR / DORA (eu-ecb-compliance.yml)
#   US_FED:    NIST SP 800-53 / AI 600-1 / FedRAMP (security-scan.yml + ci.yml)
#   APAC_MAS:  MAS FEAT / Notice 655 / TRM (this workflow)

name: "APAC_MAS Compliance Gate — MAS FEAT / Notice 655 / TRM"

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "refactor/**"
      - "release/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Only run this workflow for APAC_MAS deployments.
# If CAGE_DEPLOYMENT_REGION is not set, skip gracefully (not an APAC_MAS deployment).

jobs:
  mas-feat-posture:
    name: "MAS FEAT Compliance Posture (APAC_MAS only)"
    runs-on: ubuntu-latest
    env:
      CAGE_DEPLOYMENT_REGION: APAC_MAS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: APAC_MAS compliance posture checks
        # Validates MAS FEAT Lula manifest structure, MAS TRM §4.2 data residency,
        # MAS Notice 655 audit logging, SR 26-2 sentinel, and ISO 42001 universal manifests.
        # Full live lula validate runs post-cluster-provisioning.
        run: python3 scripts/check_apac_mas_posture.py

  apac-mas-iso42001-lula:
    name: "ISO 42001 Universal Lula Validation (APAC_MAS context)"
    runs-on: ubuntu-latest
    needs: [mas-feat-posture]
    env:
      CAGE_DEPLOYMENT_REGION: APAC_MAS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate ISO 42001 universal Lula manifests (APAC_MAS context)
        # ISO 42001 is a universal standard — applies to ALL regions including APAC_MAS.
        # Only ISO 42001 and AARM (CSA) manifests are validated here.
        # NIST SP 800-53 (ac*, au*, cm*, ia*, ir*, ra*, sc*, si*) and
        # NIST AI 600-1 (ai600-*) are US_FED-scoped and must NOT be validated here.
        run: python3 scripts/check_apac_mas_posture.py
