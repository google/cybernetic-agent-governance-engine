name: Hermetic Test (No ML Dependencies)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/gateway/**'
      - 'src/compliance_bridge/**'
      - 'tests/test_symbolic_governor.py'
      - 'tests/test_cbf_*.py'
      - 'tests/test_routing_seal.py'
      - 'tests/test_governance_*.py'
      - 'pyproject.toml'
      - '.github/workflows/test-hermetic.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermetic-test:
    name: Hermetic Governance Pipeline Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CAGE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install ONLY core governance dependencies (no ML)
        run: |
          # Install ONLY [gateway] and [compliance_bridge] extras
          # Explicitly EXCLUDE [advisor] which pulls sentence-transformers
          uv pip install --system -e ".[gateway,compliance_bridge]"
          uv pip install --system pytest pytest-asyncio pytest-xdist pytest-timeout "fakeredis[lua]" respx httpx pandas freezegun

      - name: Verify ML packages are NOT installed
        run: |
          echo "::group::Verify torch is NOT installed"
          if python -c "import torch" 2>/dev/null; then
            echo "❌ FAIL: torch is installed (should be absent in hermetic mode)"
            exit 1
          fi
          echo "✅ PASS: torch is NOT installed"
          echo "::endgroup::"

          echo "::group::Verify sentence-transformers is NOT installed"
          if python -c "import sentence_transformers" 2>/dev/null; then
            echo "❌ FAIL: sentence-transformers is installed (should be absent in hermetic mode)"
            exit 1
          fi
          echo "✅ PASS: sentence-transformers is NOT installed"
          echo "::endgroup::"

      - name: Run hermetic governance pipeline tests
        env:
          CAGE_ACTIVE_PLUGINS: "finance"
        run: |
          # Run core governance tests WITHOUT any ML dependencies
          # This proves Stage 2.5 is truly optional
          pytest \
            tests/test_cbf_*.py \
            tests/test_symbolic_governor*.py \
            tests/test_routing_seal*.py \
            tests/test_governance_envelope.py \
            tests/test_consequence_gateway*.py \
            -m "local or unit" \
            --tb=short \
            -v \
            --no-cov \
            -p no:langsmith

      - name: Verify governance imports work without ML
        run: |
          # Ensure core governance modules import cleanly without torch/transformers
          python -c "
          from src.gateway.governance.symbolic_governor import SymbolicGovernor
          from src.gateway.governance.safety.cbf_engine import ControlBarrierFunction
          from src.gateway.governance.routing_seal import generate_seal, verify_seal
          from src.gateway.governance.consequence_gateway import ConsequenceGateway
          from src.gateway.governance.governance_envelope import GovernanceEnvelopeBuilder
          from src.compliance_bridge.context_accumulator import ContextAccumulator
          print('✅ All core governance imports successful (hermetic mode)')
          "

      - name: Summary
        if: success()
        run: |
          echo "::notice::✅ Hermetic test suite PASSED — governance pipeline operates without ML dependencies"
