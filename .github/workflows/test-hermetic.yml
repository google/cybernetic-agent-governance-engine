name: Hermetic Test (No ML Dependencies)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/gateway/**'
      - 'src/compliance_bridge/**'
      - 'tests/test_symbolic_governor.py'
      - 'tests/test_cbf_*.py'
      - 'tests/test_routing_seal.py'
      - 'tests/test_governance_*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test-hermetic.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermetic-test:
    name: Hermetic Governance Pipeline Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CAGE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # Every package comes from uv.lock: --frozen installs the locked versions
      # without re-resolving, and uv sync refuses an extra or group that
      # pyproject.toml does not define. Only the gateway and compliance extras
      # and the test group are installed, not the advisor extra or the dev group.
      # No extra or group in uv.lock pulls an ML framework today; the next step
      # keeps it that way for this environment.
      - name: Install core governance dependencies from uv.lock (no ML)
        run: uv sync --frozen --no-default-groups --group test --extra gateway --extra compliance

      - name: Verify the environment holds what this job claims
        run: |
          uv run --frozen --no-sync python - <<'EOF'
          import importlib.util
          import os
          import pathlib
          import sys

          venv = pathlib.Path(os.environ.get("UV_PROJECT_ENVIRONMENT", ".venv")).resolve()
          if pathlib.Path(sys.prefix).resolve() != venv:
              sys.exit(f"FAIL: running in {sys.prefix}, not the locked environment {venv}")

          ml = ["torch", "sentence_transformers", "transformers", "tensorflow", "jax"]
          installed = [name for name in ml if importlib.util.find_spec(name)]
          if installed:
              sys.exit(f"FAIL: ML packages installed in hermetic mode: {installed}")

          # dowhy comes from the compliance extra; fakeredis and pytest_asyncio
          # from the test group. Their absence means the install was not what
          # this job claims.
          expected = ["dowhy", "fakeredis", "pytest_asyncio"]
          missing = [name for name in expected if not importlib.util.find_spec(name)]
          if missing:
              sys.exit(f"FAIL: expected packages missing: {missing}")

          print(f"PASS: {venv} has no {', '.join(ml)}; has {', '.join(expected)}")
          EOF

      - name: Run hermetic governance pipeline tests
        env:
          CAGE_DOMAIN: "finance"
        run: |
          # Run core governance tests WITHOUT any ML dependencies
          # This proves Stage 2.5 is truly optional
          uv run --frozen --no-sync pytest \
            tests/test_cbf_*.py \
            tests/test_symbolic_governor*.py \
            tests/test_routing_seal*.py \
            tests/test_governance_envelope.py \
            tests/test_consequence_gateway*.py \
            -m "local or unit" \
            --tb=short \
            -v \
            --no-cov \
            -p no:langsmith

      - name: Verify governance imports work without ML
        run: |
          # Ensure core governance modules import cleanly without torch/transformers
          uv run --frozen --no-sync python -c "
          from src.gateway.governance.governor.governor import SymbolicGovernor
          from src.gateway.governance.governor.assembly import assemble_governor
          from src.gateway.governance.safety.cbf_engine import ControlBarrierFunction
          from src.gateway.governance.routing_seal import generate_seal, verify_seal
          from src.gateway.governance.consequence_gateway import ConsequenceGateway
          from src.gateway.governance.governance_envelope import GovernanceEnvelopeBuilder
          from src.compliance_bridge.context_accumulator import ContextAccumulator
          print('✅ All core governance imports successful (hermetic mode)')
          "

      - name: Summary
        if: success()
        run: |
          echo "::notice::✅ Hermetic test suite PASSED — governance pipeline operates without ML dependencies"
