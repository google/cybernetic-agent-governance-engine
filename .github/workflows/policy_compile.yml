name: Policy Compile & Drift Gate

on:
  push:
    branches: [main]
    paths:
      - 'config/stpa_control_structure.yaml'
      - 'src/gateway/governance/stpa_compiler.py'
      - 'src/gateway/governance/ingress/**'
      - '.github/workflows/policy_compile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'config/stpa_control_structure.yaml'
      - 'src/gateway/governance/stpa_compiler.py'
      - 'src/gateway/governance/ingress/**'
      - '.github/workflows/policy_compile.yml'
  workflow_dispatch:
    inputs:
      spec_path:
        description: 'Path to external policy spec (ACS/AAIF/OSCAL/Lula) to ingest'
        required: false
        default: ''
      targets:
        description: 'Compiler targets (space-separated: opa nemo python langgraph agp)'
        required: false
        default: 'opa nemo python langgraph agp'

jobs:
  policy-compile:
    name: Compile & Drift Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pydantic pyyaml

      - name: Validate STPA control structure
        run: |
          python -m src.gateway.governance.stpa_compiler validate \
            --input config/stpa_control_structure.yaml

      - name: Ingest external policy spec (if provided)
        if: ${{ github.event.inputs.spec_path != '' }}
        run: |
          python -c "
          import yaml, json, sys
          from src.gateway.governance.ingress.policy_translator import translate_policy

          spec_path = '${{ github.event.inputs.spec_path }}'
          with open(spec_path) as f:
              spec = yaml.safe_load(f)

          bundle = translate_policy(spec)
          print(f'Format detected: {bundle.format_detected}')
          print(f'Policy version ID: {bundle.policy_version_id}')
          if bundle.errors:
              print('ERRORS:', bundle.errors, file=sys.stderr)
              sys.exit(1)
          if bundle.warnings:
              print('Warnings:', bundle.warnings)
          print('Translation successful.')
          "

      - name: Compile OPA / NeMo / Python / LangGraph targets
        run: |
          TARGETS="${{ github.event.inputs.targets || 'opa nemo python langgraph agp' }}"
          python -m src.gateway.governance.stpa_compiler compile \
            --input config/stpa_control_structure.yaml \
            --targets $TARGETS

      - name: Validate AGP character budget
        run: |
          AGP_FILE="config/agp/generated_semantic_policy.txt"
          if [ -f "$AGP_FILE" ]; then
            CHAR_COUNT=$(wc -c < "$AGP_FILE")
            echo "AGP policy size: ${CHAR_COUNT} characters"
            if [ "$CHAR_COUNT" -gt 5000 ]; then
              echo "ERROR: AGP policy exceeds 5,000-character budget (${CHAR_COUNT} chars)" >&2
              exit 1
            fi
            if grep -q "# TRUNCATED" "$AGP_FILE"; then
              echo "ERROR: AGP policy contains TRUNCATED sentinel" >&2
              exit 1
            fi
            echo "AGP budget OK: ${CHAR_COUNT}/5000 chars"
          else
            echo "AGP policy file not found — skipping budget check"
          fi

      - name: Policy drift detection gate
        run: |
          python scripts/check_policy_drift.py \
            --input config/stpa_control_structure.yaml \
            --opa-file config/opa/generated_stpa_policy.rego \
            --hash-file config/opa/.policy_hash \
            --agp-file config/agp/generated_semantic_policy.txt

      - name: Validate agent_catalog.json schema
        run: |
          if [ -f "config/agent_catalog.json" ]; then
            python -c "
          import json, sys
          with open('config/agent_catalog.json') as f:
              catalog = json.load(f)
          agents = catalog.get('agents', {})
          if not isinstance(agents, dict):
              print('ERROR: agent_catalog.json: agents must be a dict', file=sys.stderr)
              sys.exit(1)
          for sub, entry in agents.items():
              if 'allowed_tools' not in entry:
                  print(f'ERROR: agent {sub!r} missing allowed_tools', file=sys.stderr)
                  sys.exit(1)
              if not isinstance(entry['allowed_tools'], list):
                  print(f'ERROR: agent {sub!r} allowed_tools must be a list', file=sys.stderr)
                  sys.exit(1)
          print(f'agent_catalog.json valid: {len(agents)} agents registered.')
          "
          else
            echo "config/agent_catalog.json not found — skipping schema check"
          fi

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiled-policy-artifacts
          path: |
            config/opa/generated_stpa_policy.rego
            config/rails/generated_stpa_rails.co
            config/agp/generated_semantic_policy.txt
            src/gateway/governance/generated_stpa_validator.py
            src/gateway/governance/generated_saga_nodes.py
          retention-days: 30
