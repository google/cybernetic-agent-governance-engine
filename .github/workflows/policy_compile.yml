name: Policy Compile
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "config/stpa/**"
      - "src/cage_*/config/stpa/**"
      - "src/gateway/governance/stpa_compiler.py"
  pull_request:
    paths:
      - "config/stpa/**"
      - "src/cage_*/config/stpa/**"
      - "src/gateway/governance/stpa_compiler.py"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  compile-policies:
    name: Compile STPA → Governance Artifacts
    runs-on: ubuntu-latest
    env:
      CAGE_ENV: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Validate core and domain STPA control structures
        run: |
          uv run python -m src.gateway.governance.stpa_compiler validate --input-dir config/stpa
          for d_yaml in src/cage_*/config/stpa/*.yaml; do
            uv run python -m src.gateway.governance.stpa_compiler validate --domain-yaml "${d_yaml}"
          done

      - name: Compile core STPA → NeMo + FTRA + Sandbox
        run: |
          uv run python -m src.gateway.governance.stpa_compiler compile \
            --input-dir config/stpa \
            --targets nemo ftra sandbox

      - name: Compile domain STPA → Python + LangGraph + FTRA
        run: |
          for d_yaml in src/cage_*/config/stpa/*.yaml; do
            d_root="$(dirname "$(dirname "$(dirname "${d_yaml}")")")"
            uv run python -m src.gateway.governance.stpa_compiler compile \
              --domain-yaml "${d_yaml}" \
              --out-dir "${d_root}/stpa"
          done

      - name: Check STPA freshness
        run: |
          uv run python scripts/check_stpa_freshness.py

      - name: Upload generated artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stpa-compiled-artifacts
          path: |
            config/rails/generated_stpa_rails.co
            config/sandbox/generated_sandbox_policy.yaml
            src/gateway/governance/terminal_action_registry.json
            src/cage_*/stpa/uca_rules.py
            src/cage_*/stpa/saga_nodes.py
            src/cage_*/stpa/terminal_registry.json
          retention-days: 30
