name: "Security Scanning — Vulnerability & SBOM (Universal) + NIST RMF Gate (US_FED only)"
# Cancel superseded runs for the same ref. Without this, the push +
# pull_request double-trigger consumes two identical sets of runners on
# every push to an open PR (measured: 23.3 duplicated job-minutes per push).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true


# Regional Compliance Posture:
# - US_FED: NIST SP 800-53 Rev 5 HIGH (this workflow's NIST gate)
# - EU_ECB: EU AI Act / GDPR (separate workflow)
# - APAC_MAS: MAS FEAT / MAS Notice 655 (separate workflow)
# Universal: Vulnerability scanning, SBOM, secret detection (all regions)

on:
  push:
    branches:
      # PR validation runs via the pull_request event. Pushing to a
      # feature branch no longer double-triggers this workflow.
      - main
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# Least-privilege default. `security-events: write` is NOT granted here — only
# container-image-scan uploads SARIF, so that scope is granted at the job level
# instead of to every job in the workflow.
permissions:
  contents: read
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Python Dependency Vulnerability Scan
  # Universal security hygiene — runs for ALL regions (US_FED, EU_ECB, APAC_MAS)
  # NIST SP 800-53: RA-5 (Vulnerability Scanning), SI-2 (Flaw Remediation) — US_FED reporting only
  # Addresses POAM-010 and POAM-013
  # ---------------------------------------------------------------------------
  python-dependency-audit:
    name: "Python Dependency Vulnerability Scan (Universal — NIST RA-5/SI-2 reporting: US_FED only)"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install project dependencies (locked)
        # Use uv sync --frozen so the exact versions in uv.lock are installed.
        # This ensures pip-audit scans the same dependency tree that was audited
        # locally, not a fresh pip-resolved tree that may differ.
        run: uv sync --frozen --all-groups --all-extras

      - name: Install pip-audit into uv venv
        run: uv pip install "pip-audit>=2.7.0"

      - name: Run pip-audit
        # Audits the venv synced above, which holds every group and extra,
        # compliance included. An --ignore-vuln <ID> added here needs a comment
        # in this run: block naming that ID and why it is suppressed;
        # tests/test_workflow_vuln_suppressions.py fails otherwise (POAM-2026-161).
        # The runner's shell is `bash -e`, so the exit code is captured with ||
        # and the results are printed before the step fails.
        run: |
          EXIT_CODE=0
          uv run pip-audit --format json --output pip-audit-results.json || EXIT_CODE=$?
          cat pip-audit-results.json
          exit $EXIT_CODE

      - name: Upload pip-audit results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit-results.json

  # ---------------------------------------------------------------------------
  # Job 2: Container Image Vulnerability Scan + SBOM
  # Universal security hygiene — runs for ALL regions (US_FED, EU_ECB, APAC_MAS)
  # NIST SP 800-53: RA-5 (Vulnerability Scanning), CM-8 (Component Inventory) — US_FED reporting only
  # Addresses POAM-010 and POAM-006
  # ---------------------------------------------------------------------------
  container-image-scan:
    name: "Container Image Vulnerability Scan — Trivy (Universal — NIST RA-5/CM-8 reporting: US_FED only)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Scoped here rather than workflow-wide: this is the only job that
      # uploads a SARIF report to code scanning.
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - Dockerfile
          - src/compliance_bridge/Dockerfile
          - src/gateway/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Docker image
        env:
          MATRIX_DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker build -f "${MATRIX_DOCKERFILE}" \
            -t "scan-target:${IMAGE_SHA}" .

      - name: Run Trivy container image scan
        # Pinned to v0.36.0 — Node 20 deprecation fix (was @master, unpinned).
        # Scans the built container image (`scan-target:<sha>`), not repo filesystem (CIG-01).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "image"
          image-ref: "scan-target:${{ github.sha }}"
          trivyignores: ".trivyignore"
          format: "sarif"
          output: "trivy-results-${{ strategy.job-index }}.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: "trivy-results-${{ strategy.job-index }}.sarif"
          category: "trivy-${{ matrix.dockerfile }}"

      - name: Generate SBOM with Trivy (CycloneDX — POAM-006)
        # Pinned to v0.36.0 — generates CycloneDX SBOM from the built container image.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "image"
          image-ref: "scan-target:${{ github.sha }}"
          format: "cyclonedx"
          output: "sbom-${{ strategy.job-index }}.cdx.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom-${{ strategy.job-index }}
          path: sbom-*.cdx.json

  # ---------------------------------------------------------------------------
  # Job 3: OPA Rego Policy Lint and Test
  # Universal security hygiene — runs for ALL regions (US_FED, EU_ECB, APAC_MAS)
  # NIST SP 800-53: CM-6 (Configuration Settings), SI-7 (Software Integrity) — US_FED reporting only
  # ---------------------------------------------------------------------------
  rego-policy-lint:
    name: "OPA Rego Policy Lint and Test (Universal — NIST CM-6/SI-7 reporting: US_FED only)"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OPA
        run: |
          OPA_VERSION="0.70.0"
          OPA_SHA256="00d114b94fdb1606a48cccdfc73c9ccdc62c38721150131ae578d5ff3df5c084"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 5 --retry-connrefused \
            -o "${RUNNER_TEMP}/opa" \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  ${RUNNER_TEMP}/opa" | sha256sum -c -
          chmod 0755 "${RUNNER_TEMP}/opa"
          sudo mv "${RUNNER_TEMP}/opa" /usr/local/bin/opa

      - name: Check Rego formatting
        run: |
          find . -name "*.rego" -not -path "*/node_modules/*" -print0 \
            | xargs -0 opa fmt --fail

      - name: OPA check all Rego files
        run: |
          shopt -s nullglob
          domain_opa_dirs=(src/cage_*/opa)
          if [[ ${#domain_opa_dirs[@]} -eq 0 ]]; then
            echo "::error::No domain OPA directories found under src/cage_*/opa"
            exit 1
          fi
          opa check compliance/postures/us_fed/opa/ "${domain_opa_dirs[@]}"

      - name: Run OPA tests
        run: |
          shopt -s nullglob
          domain_opa_dirs=(src/cage_*/opa)
          if [[ -n "$(find . -name "*_test.rego" -not -path "*/node_modules/*" -print -quit)" ]]; then
            # Pass compliance posture tests together with every domain plugin's
            # src/cage_*/opa/ bundle so all domain packages (e.g.
            # trade.governance and dosing.governance) and their *_test.rego
            # suites are evaluated in CI.
            opa test compliance/postures/us_fed/opa/ "${domain_opa_dirs[@]}" -v
          else
            echo "::error::No OPA test files found"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Job 4: SBOM Generation and Validation
  # Universal security hygiene — runs for ALL regions (US_FED, EU_ECB, APAC_MAS)
  # NIST SP 800-53: CM-8 (System Component Inventory), RA-5 (Vulnerability Scanning) — US_FED reporting only
  # Addresses POAM-006 (No SBOM) and POAM-010 (No container scanning)
  # Tools: Syft (CycloneDX SBOM generation), Grype (CVE enrichment)
  # ---------------------------------------------------------------------------
  sbom-generation:
    name: "Generate and Validate SBOM (Universal — NIST CM-8/POAM-006 reporting: US_FED only)"
    runs-on: ubuntu-latest
    needs: [python-dependency-audit]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install Syft (SBOM generator — anchore/syft)
        run: |
          SYFT_VERSION="1.33.0"
          SYFT_SHA256="adc1b944a827ed3432bcd9f1dbdbc8fa3c0dca7d3d449e7084c90248c2c6cb50"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 5 --retry-connrefused --retry-delay 2 \
            -o "${RUNNER_TEMP}/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  ${RUNNER_TEMP}/syft.tar.gz" | sha256sum -c -
          sudo tar -xzf "${RUNNER_TEMP}/syft.tar.gz" -C /usr/local/bin syft
          rm -f "${RUNNER_TEMP}/syft.tar.gz"
          syft version

      - name: Install Grype (vulnerability scanner — anchore/grype)
        run: |
          GRYPE_VERSION="0.99.1"
          GRYPE_SHA256="7fde4d45fe097daa2554078cd9e81faa43e51266a888337f5446c1ffc42d451f"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 5 --retry-connrefused --retry-delay 2 \
            -o "${RUNNER_TEMP}/grype.tar.gz" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  ${RUNNER_TEMP}/grype.tar.gz" | sha256sum -c -
          sudo tar -xzf "${RUNNER_TEMP}/grype.tar.gz" -C /usr/local/bin grype
          rm -f "${RUNNER_TEMP}/grype.tar.gz"
          grype version

      - name: Sync locked project dependencies and install cyclonedx-bom (Python SBOM)
        run: |
          uv sync --frozen --all-groups --all-extras
          uv pip install cyclonedx-bom

      - name: Generate Python SBOM (CycloneDX JSON — CM-8 / POAM-006 / POAM-2026-221)
        run: |
          mkdir -p compliance/sbom
          uv run --no-sync python scripts/generate_sbom.py \
            --type python \
            --output-dir compliance/sbom

      - name: Generate filesystem SBOM with Syft
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          syft dir:. \
            -o cyclonedx-json \
            --file "compliance/sbom/filesystem-${COMMIT_SHA}.cdx.json"

      - name: Upload SBOM artifacts (90-day retention — POAM-006 evidence)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom-${{ github.sha }}
          path: compliance/sbom/
          retention-days: 90

      - name: Check for critical CVEs with Grype (RA-5 / POAM-010)
        run: |
          SBOM_FILES=$(find compliance/sbom -name "*.json" -not -name "SBOM_SUMMARY*" 2>/dev/null | head -5)
          if [ -z "$SBOM_FILES" ]; then
            echo "::error::No SBOM JSON files found — failing Grype CVE scan"
            exit 1
          fi
          EXIT_CODE=0
          for SBOM_FILE in $SBOM_FILES; do
            echo "Scanning $SBOM_FILE with Grype..."
            grype "sbom:${SBOM_FILE}" \
              --fail-on critical \
              --only-fixed \
              --quiet \
              || { echo "::error::Critical fixed CVEs found in ${SBOM_FILE} — see POAM-010"; EXIT_CODE=1; }
          done
          exit $EXIT_CODE

  # ---------------------------------------------------------------------------
  # Job 5: Dependency Lockfile Validation
  # Universal security hygiene — runs for ALL regions (US_FED, EU_ECB, APAC_MAS)
  # NIST SP 800-53: SI-2 (Flaw Remediation), CM-8 (Component Inventory) — US_FED reporting only
  # Addresses POAM-013 — unpinned Python dependencies
  # ---------------------------------------------------------------------------
  dependency-lockfile-check:
    name: "Dependency Lockfile Validation (Universal — NIST SI-2/CM-8 reporting: US_FED only)"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Check lockfile integrity
        run: uv lock --check

      - name: Validate dependency lockfile is up to date
        run: |
          uv lock --check || {
            echo "::error::uv.lock is out of sync with pyproject.toml. Run 'uv lock' locally and commit the result."
            exit 1
          }

      # `uv lock --check` does not report yanked releases, and a release yanked
      # after it was locked stays pinned until upgraded (scs 3.3.0 sat in the
      # lock that way). The daily schedule catches yanks that happen later.
      - name: Refuse yanked releases in uv.lock
        run: python scripts/check_locked_yanks.py uv.lock

      - name: Check for dependency lockfile
        run: |
          if [ ! -f "requirements.txt" ] && \
             [ ! -f "uv.lock" ] && \
             [ ! -f "poetry.lock" ] && \
             [ ! -f "pdm.lock" ]; then
            echo "::error::POAM-013 (SI-2/CM-8): No dependency lockfile found at project root."
            exit 1
          else
            echo "Lockfile found — dependency pinning is in place."
          fi

      - name: Generate dependency snapshot
        run: |
          uv sync --frozen --all-groups --all-extras
          uv pip freeze > dependency-snapshot.txt
          echo "Dependency snapshot generated:"
          wc -l dependency-snapshot.txt

      - name: Upload dependency snapshot artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-snapshot
          path: dependency-snapshot.txt

  # ---------------------------------------------------------------------------
  # Job 6: NIST SP 800-53 Compliance Gate
  # US_FED ONLY — does not run for EU_ECB or APAC_MAS deployments
  # This job only runs for US_FED deployments. EU_ECB uses EU AI Act gates. APAC_MAS uses MAS FEAT gates.
  # ---------------------------------------------------------------------------
  nist-compliance-gate:
    name: "NIST SP 800-53 Compliance Gate (US_FED only)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Previously gated on `vars.CAGE_DEPLOYMENT_REGION == 'US_FED'`. That
    # repository variable is not set, so this aggregate gate never executed.
    # It is a pure fan-in over the four universal scan jobs below and carries
    # no region-specific work, so it now always runs and genuinely enforces
    # that those four upstream jobs succeeded.
    needs:
      - python-dependency-audit
      - container-image-scan
      - sbom-generation
      - dependency-lockfile-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: NIST RMF gate
        run: echo "NIST RMF gate active for US_FED deployment"

  # ---------------------------------------------------------------------------
  # Job 7: Secret Scanning (Gitleaks)
  # Universal security hygiene — runs for ALL regions (US_FED, EU_ECB, APAC_MAS)
  # Scans full commit history for accidentally committed secrets, credentials,
  # or API keys. Addresses the "secret detection" coverage gap noted in the
  # workflow header comment.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: "Secret Scanning (Gitleaks)"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.27.2"
          GITLEAKS_SHA256="141c3b2dede46d8b3a53b47116da756bd223decc0374797559a6b50ecba5590c"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 5 --retry-connrefused \
            -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C /usr/local/bin gitleaks
          rm -f "${RUNNER_TEMP}/gitleaks.tar.gz"
          gitleaks version

      - name: Run Gitleaks secret scan
        # gitleaks/gitleaks-action@v3 requires a paid org license (gitleaks.io).
        # Using the free OSS CLI directly instead — identical detection capability.
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --exit-code 1

  # ---------------------------------------------------------------------------
  # Job 8: Semgrep Static Analysis
  # Universal security hygiene — runs for ALL regions (US_FED, EU_ECB, APAC_MAS)
  # Detects common vulnerability patterns, insecure API usage, and logic flaws.
  # ---------------------------------------------------------------------------
  semgrep-scan:
    name: "Semgrep Static Analysis (Universal)"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run Semgrep static analysis
        run: |
          uv run --with semgrep semgrep scan --config=auto --error src/

  bandit-sast-scan:
    name: "Bandit SAST Scan (Universal)"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run Bandit SAST (medium+ severity, fail on error)
        run: |
          uv run --with bandit bandit -r src/ scripts/ -c pyproject.toml -ll -ii

