# TLC model check of every pinned proof/*.cfg: DistributedCBF*.cfg against
# the Python BFS in proof/distributed_cbf_model.py (POAM-2026-090), and
# FtraBoundary*.cfg / LangGraphHarness*.cfg against the state counts and
# violated invariants pinned in proof/tla_pins.py (POAM-2026-091). The BFS
# and the cfg/spec parity run on every PR in pytest-logic
# (tests/test_distributed_cbf_proof.py, tests/test_tla_specs_proof.py); this
# job adds the TLC runs.
name: tlc-model-check

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TLA_TOOLS_VERSION: v1.7.4
  TLA_TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88

jobs:
  tlc-model-check:
    name: "TLC: DistributedCBF, FtraBoundary, LangGraphHarness"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      - name: Install Dependencies
        run: uv sync --all-groups --all-extras
      - name: Fetch tla2tools.jar (sha256-pinned)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA_TOOLS_VERSION}/tla2tools.jar"
          echo "${TLA_TOOLS_SHA256}  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
      - name: TLC vs Python BFS and pinned results
        run: |
          JAVA="$JAVA_HOME_21_X64/bin/java" TLA_TOOLS_JAR="$RUNNER_TEMP/tla2tools.jar" make verify-tla
