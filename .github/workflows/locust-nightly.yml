# Nightly load test of a CI-local gateway (review round 2, WS-G G3).
# Never runs on pull requests: schedule and manual dispatch only.
name: locust-nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Mesh identity the gateway trusts and locustfile.py sends as l5d-client-id
  # (unmeshed run: the header stands in for the Linkerd proxy, POAM-2026-080).
  CLIENT_ID: "cage-advisor-sa.governance-stack.serviceaccount.identity.linkerd.cluster.local"

jobs:
  locust-load-test:
    name: "Nightly Load Test (Locust)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.2-alpine@sha256:29e8589c3f9ba699b5f7aa4b3c7733c58852a3626439e619aa0ee78de08c6ca0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      - name: Install dependencies
        run: uv sync --all-groups --all-extras
      # Started after checkout (service containers start before it) so the
      # finance domain policy can be mounted. Same allowlist as
      # deployment/k8s/opa.yaml: only trade_governance.rego is served.
      - name: Start OPA with the finance domain policy
        run: |
          docker run -d --name opa -p 8181:8181 \
            -v "${GITHUB_WORKSPACE}/src/cage_finance/opa:/policies:ro" \
            openpolicyagent/opa:0.70.0-static@sha256:5679cbbedd1908063b7a68e8af28e662dce4ae3e069b4b5459531b141c6b6ff0 \
            run --server --addr=:8181 /policies
          ok=0
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8181/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            docker logs opa
            echo "::error::OPA did not become healthy within 30 s"
            exit 1
          fi
      - name: Start gateway under test (background)
        env:
          CAGE_ENV: "ci"
          CAGE_DOMAIN: "finance"
          OPA_CACHE_ENABLED: "false"
          OPA_URL: "http://localhost:8181"
          REDIS_URL: "redis://localhost:6379/0"
          EVIDENCE_STREAM_ENABLED: "true"
          OPENAI_API_KEY: "sk-dummy"
          MODEL_FAST: "Qwen/Qwen2.5-7B-Instruct"
          VLLM_API_KEY: "dummy"
          VLLM_BASE_URL: "http://localhost:8081/v1"
          GOVERNANCE_SALT: "ci-only-insecure-placeholder-salt-not-for-production-use"
          CAGE_TRUSTED_CLIENT_IDENTITIES: ${{ env.CLIENT_ID }}
          LANGSMITH_TRACING: "false"
          LANGCHAIN_TRACING_V2: "false"
        run: |
          uv run python -m uvicorn src.gateway.server.hybrid_server:root_app \
            --host 127.0.0.1 --port 8080 > /tmp/gateway.log 2>&1 &
          ok=0
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            tail -n 100 /tmp/gateway.log
            echo "::error::Gateway did not become healthy within 30 s"
            exit 1
          fi
          echo "Gateway ready."
      - name: Run Locust headless (10 users, 30 s)
        run: |
          # Locust is not a project dependency (it would pull gevent into every
          # --all-groups job); pin it here, for this workflow only.
          uv run --with "locust==2.46.6" locust -f tests/load/locustfile.py \
            --headless -u 10 -r 5 -t 30s \
            --host http://localhost:8080 \
            --html /tmp/locust-report.html \
            --csv /tmp/locust-stats \
            --exit-code-on-error 1
      - name: Assert p95 latency regression gate
        run: |
          uv run python scripts/check_locust_baseline.py \
            --stats-csv /tmp/locust-stats_stats.csv \
            --p95-baseline-ms 2000
      - name: Upload Locust report and gateway log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: locust-report-${{ github.sha }}
          path: |
            /tmp/locust-*.html
            /tmp/gateway.log
          retention-days: 30
