name: Partner Integration Tests

# This workflow runs live integration tests against external partner sandboxes.
# It is decoupled from standard CI to prevent partner API failures from blocking
# internal development.
#
# Trigger: Manual dispatch only (workflow_dispatch)
# Secrets: Partner credentials must be configured in GitHub Secrets

on:
  workflow_dispatch:
    inputs:
      partner_filter:
        description: 'Partner to test (provider_01, provider_02, provider_03, provider_05, actuator_01, or "all")'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - provider_01
          - provider_02
          - provider_03
          - provider_05
          - actuator_01

permissions:
  contents: read

jobs:
  partner-integration:
    name: Partner Integration Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras

      - name: Configure partner credentials
        env:
          PARTNER_FILTER: ${{ inputs.partner_filter }}
          # Provider 01 (FlowSignal / EU ECB)
          PROVIDER_01_ENDPOINT: ${{ secrets.PROVIDER_01_ENDPOINT }}
          PROVIDER_01_API_KEY: ${{ secrets.PROVIDER_01_API_KEY }}
          
          # Provider 02 (CER Attestation)
          PROVIDER_02_API_ENDPOINT: ${{ secrets.PROVIDER_02_API_ENDPOINT }}
          PROVIDER_02_JWK_ENDPOINT: ${{ secrets.PROVIDER_02_JWK_ENDPOINT }}
          PROVIDER_02_API_KEY_SECRET: ${{ secrets.PROVIDER_02_API_KEY_SECRET }}
          PROVIDER_02_TEST_CERT_HASH: ${{ secrets.PROVIDER_02_TEST_CERT_HASH }}
          
          # Provider 03 (Normative Baseline)
          PROVIDER_03_ENDPOINT: ${{ secrets.PROVIDER_03_ENDPOINT }}
          PROVIDER_03_API_KEY: ${{ secrets.PROVIDER_03_API_KEY }}
          
          # Provider 05 (AO Warrant / Blueprint)
          PROVIDER_05_BLUEPRINT_REGISTRY_URL: ${{ secrets.PROVIDER_05_BLUEPRINT_REGISTRY_URL }}
          PROVIDER_05_API_KEY: ${{ secrets.PROVIDER_05_API_KEY }}
          
          # Actuator 01 (Execution Gateway)
          ACTUATOR_01_ENDPOINT: ${{ secrets.ACTUATOR_01_ENDPOINT }}
          ACTUATOR_01_CLIENT_CERT: ${{ secrets.ACTUATOR_01_CLIENT_CERT }}
          ACTUATOR_01_CLIENT_KEY: ${{ secrets.ACTUATOR_01_CLIENT_KEY }}
          
          # KMS (for Actuator 01 quorum signatures)
          KMS_GOVERNANCE_KEY: ${{ secrets.KMS_GOVERNANCE_KEY }}
          CAGE_OPERATOR_URNS: ${{ secrets.CAGE_OPERATOR_URNS }}
          
          # Disable LangSmith tracing
          LANGSMITH_TRACING: "false"
          LANGCHAIN_TRACING_V2: "false"
        run: |
          echo "Partner credentials configured via GitHub Secrets"
          echo "Filter: ${PARTNER_FILTER}"

      - name: Run partner integration tests
        env:
          FILTER: ${{ inputs.partner_filter }}
        run: |
          case "$FILTER" in
            all)
              echo "Running all partner integration tests..."
              uv run pytest tests/ -m partner_integration --run-partner-integration -v --tb=short
              ;;
            provider_01|provider_02|provider_03|provider_05|actuator_01)
              echo "Running $FILTER partner integration tests..."
              uv run pytest "tests/test_${FILTER}_live.py" -m partner_integration --run-partner-integration -v --tb=short
              ;;
            *)
              echo "Invalid partner_filter: $FILTER" >&2
              exit 1
              ;;
          esac

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: partner-integration-results
          path: |
            .pytest_cache/
            *.log
          retention-days: 7

  summary:
    name: Partner Integration Summary
    runs-on: ubuntu-22.04
    needs: partner-integration
    if: always()
    
    steps:
      - name: Report status
        env:
          PARTNER_RESULT: ${{ needs.partner-integration.result }}
        run: |
          if [ "$PARTNER_RESULT" = "success" ]; then
            echo "✅ Partner integration tests passed"
          elif [ "$PARTNER_RESULT" = "skipped" ]; then
            echo "⏭️  Partner integration tests skipped (credentials not configured)"
          else
            echo "❌ Partner integration tests failed"
            exit 1
          fi
