name: Partner Integration Tests

# Live, over-the-wire conformance runs against partner sandboxes (AGENTS.md,
# Tier 1). Kept out of pull-request CI so a partner outage never blocks a merge.
# Runs on dispatch and weekly.
#
# A partner's job passes only if every selected live test ran and passed
# (tests/fixtures/require_live.py). A skip fails the job: a skipped test
# verified nothing, and pytest reports an all-skipped run as a success.
#
# Each job receives only its own partner's secrets. scripts/partner_harness.py
# is the single source for the partner list, the pytest targets and the secret
# names; tests/test_partner_harness.py checks this file against it and against
# the live tests on every pull request.

on:
  workflow_dispatch:
    inputs:
      partner_filter:
        description: 'Partner to verify, or "all" for one job per partner'
        required: true
        default: all
        type: choice
        options:
          - all
          - provider_01
          - provider_02
          - provider_03
          - provider_05
          - provider_07
          - provider_08
          - actuator_01
  schedule:
    # Mondays 06:17 UTC: a live check that runs only on request decays.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: partner-integration
  cancel-in-progress: false

jobs:
  select:
    name: Select partners
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      partners: ${{ steps.select.outputs.partners }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the partner matrix
        id: select
        env:
          # Empty on the weekly schedule, which runs every partner.
          SELECTION: ${{ inputs.partner_filter }}
        run: |
          partners="$(python3 scripts/partner_harness.py matrix "${SELECTION:-all}")"
          echo "partners=${partners}" >> "$GITHUB_OUTPUT"

  live:
    name: Live (${{ matrix.partner }})
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        partner: ${{ fromJSON(needs.select.outputs.partners) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Authenticate to GCP for actuator_01 KMS signing
        if: matrix.partner == 'actuator_01' && vars.ACTUATOR_01_WIF_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.ACTUATOR_01_WIF_PROVIDER }}
          service_account: ${{ vars.ACTUATOR_01_WIF_SERVICE_ACCOUNT }}

      - name: Stage actuator_01 mTLS material
        if: matrix.partner == 'actuator_01'
        env:
          ACTUATOR_01_CLIENT_CERT: ${{ secrets.ACTUATOR_01_CLIENT_CERT }}
          ACTUATOR_01_CLIENT_KEY: ${{ secrets.ACTUATOR_01_CLIENT_KEY }}
          ACTUATOR_01_CA_CERT: ${{ secrets.ACTUATOR_01_CA_CERT }}
        run: |
          # The adapter reads file paths. Write a PEM only when its secret is
          # set: a missing secret then leaves the path unset, and the test
          # names it instead of failing later on an empty file.
          umask 077
          dir="${RUNNER_TEMP}/actuator_01"
          mkdir -p "$dir"
          stage() {  # <secret variable> <path variable> <file name>
            local pem="${!1}"
            [ -n "$pem" ] || return 0
            printf '%s\n' "$pem" > "${dir}/$3"
            echo "$2=${dir}/$3" >> "$GITHUB_ENV"
          }
          stage ACTUATOR_01_CLIENT_CERT ACTUATOR_01_CERT_PATH client.crt
          stage ACTUATOR_01_CLIENT_KEY ACTUATOR_01_KEY_PATH client.key
          stage ACTUATOR_01_CA_CERT ACTUATOR_01_CA_PATH ca.crt

      - name: Run live tests
        env:
          PARTNER: ${{ matrix.partner }}
          LANGSMITH_TRACING: "false"
          LANGCHAIN_TRACING_V2: "false"
          KMS_GOVERNANCE_KEY: ${{ matrix.partner == 'actuator_01' && vars.ACTUATOR_01_KMS_KEY || '' }}
          # Each secret reaches only its own partner's job.
          PROVIDER_01_ENDPOINT: ${{ matrix.partner == 'provider_01' && secrets.PROVIDER_01_ENDPOINT || '' }}
          PROVIDER_01_API_KEY: ${{ matrix.partner == 'provider_01' && secrets.PROVIDER_01_API_KEY || '' }}
          PROVIDER_02_API_ENDPOINT: ${{ matrix.partner == 'provider_02' && secrets.PROVIDER_02_API_ENDPOINT || '' }}
          PROVIDER_02_JWK_ENDPOINT: ${{ matrix.partner == 'provider_02' && secrets.PROVIDER_02_JWK_ENDPOINT || '' }}
          PROVIDER_02_API_KEY_SECRET: ${{ matrix.partner == 'provider_02' && secrets.PROVIDER_02_API_KEY_SECRET || '' }}
          PROVIDER_02_TEST_CERT_HASH: ${{ matrix.partner == 'provider_02' && secrets.PROVIDER_02_TEST_CERT_HASH || '' }}
          PROVIDER_03_ENDPOINT: ${{ matrix.partner == 'provider_03' && secrets.PROVIDER_03_ENDPOINT || '' }}
          PROVIDER_03_API_KEY: ${{ matrix.partner == 'provider_03' && secrets.PROVIDER_03_API_KEY || '' }}
          PROVIDER_05_BLUEPRINT_REGISTRY_URL: ${{ matrix.partner == 'provider_05' && secrets.PROVIDER_05_BLUEPRINT_REGISTRY_URL || '' }}
          PROVIDER_05_API_KEY: ${{ matrix.partner == 'provider_05' && secrets.PROVIDER_05_API_KEY || '' }}
          PROVIDER_05_ATTESTATION_ENDPOINT: ${{ matrix.partner == 'provider_05' && secrets.PROVIDER_05_ATTESTATION_ENDPOINT || '' }}
          PROVIDER_07_ENDPOINT: ${{ matrix.partner == 'provider_07' && secrets.PROVIDER_07_ENDPOINT || '' }}
          PROVIDER_07_API_KEY: ${{ matrix.partner == 'provider_07' && secrets.PROVIDER_07_API_KEY || '' }}
          PROVIDER_07_JWKS_URL: ${{ matrix.partner == 'provider_07' && secrets.PROVIDER_07_JWKS_URL || '' }}
          PROVIDER_07_EXPECTED_KID: ${{ matrix.partner == 'provider_07' && secrets.PROVIDER_07_EXPECTED_KID || '' }}
          PROVIDER_08_ENDPOINT: ${{ matrix.partner == 'provider_08' && secrets.PROVIDER_08_ENDPOINT || '' }}
          PROVIDER_08_API_KEY: ${{ matrix.partner == 'provider_08' && secrets.PROVIDER_08_API_KEY || '' }}
          ACTUATOR_01_ENDPOINT: ${{ matrix.partner == 'actuator_01' && secrets.ACTUATOR_01_ENDPOINT || '' }}
          ACTUATOR_01_TENANT_ID: ${{ matrix.partner == 'actuator_01' && secrets.ACTUATOR_01_TENANT_ID || '' }}
          ACTUATOR_01_RECEIPT_KEY_MANIFEST_URL: ${{ matrix.partner == 'actuator_01' && secrets.ACTUATOR_01_RECEIPT_KEY_MANIFEST_URL || '' }}
          CAGE_OPERATOR_URNS: ${{ matrix.partner == 'actuator_01' && secrets.CAGE_OPERATOR_URNS || '' }}
        run: |
          target="$(python3 scripts/partner_harness.py target "$PARTNER")"
          uv run pytest "$target" -m partner_integration --run-partner-integration \
            -p tests.fixtures.require_live -n 0 -v --tb=short \
            --junitxml="partner-results/${PARTNER}.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: partner-results-${{ matrix.partner }}
          path: partner-results/
          if-no-files-found: warn
          retention-days: 90

  verdict:
    name: Partner Integration Verdict
    needs: live
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every partner job to pass
        env:
          LIVE_RESULT: ${{ needs.live.result }}
        run: |
          if [ "$LIVE_RESULT" != "success" ]; then
            echo "At least one partner job did not pass (result: ${LIVE_RESULT})." >&2
            exit 1
          fi
          echo "Every selected partner's live tests ran and passed."
