name: SBOM Generation
# Cancel superseded runs for the same ref. Without this, the push +
# pull_request double-trigger consumes two identical sets of runners on
# every push to an open PR (measured: 23.3 duplicated job-minutes per push).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# POAM-006 / NIST SP 800-53 CM-8 / ISO 42001 §A.8.3
# Generates CycloneDX SBOMs for all CAGE container images after each build.
# Uploads SBOM artifacts to object storage and fails the build if CRITICAL
# CVEs are found (except allowlisted items in .trivyignore).
#
# Storage backend — technology-agnostic via the S3-compatible API:
#   AWS S3      → set SBOM_S3_BUCKET + SBOM_S3_ACCESS_KEY + SBOM_S3_SECRET_KEY
#                 leave SBOM_S3_ENDPOINT unset (defaults to AWS)
#   GCS         → set SBOM_S3_BUCKET + SBOM_S3_ACCESS_KEY + SBOM_S3_SECRET_KEY
#                 (use a GCS HMAC key pair — Cloud Storage > Settings > Interoperability)
#                 set SBOM_S3_ENDPOINT=https://storage.googleapis.com
#   MinIO/R2    → set all four secrets with your endpoint URL
#
# If none of the SBOM_S3_* secrets are configured the upload step is skipped;
# the SBOM is still generated and uploaded as a GitHub Actions artifact.

on:
  push:
    # PR validation runs via the pull_request event. Pushing to a feature
    # branch no longer double-triggers this workflow.
    branches: [main]
    paths:
      - "src/**"
      - "packages/cage-client/**"
      - "config/**"
      - "compliance/**"
      - "Dockerfile*"
      - "deployment/docker/**"
      - ".trivyignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/sbom.yml"
  pull_request:
    paths:
      - "src/**"
      - "packages/cage-client/**"
      - "config/**"
      - "compliance/**"
      - "Dockerfile*"
      - "deployment/docker/**"
      - ".trivyignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/sbom.yml"
  workflow_dispatch:

env:
  REGISTRY: gcr.io
  # Fallback to a placeholder when GCP_PROJECT_ID is not configured (e.g. PRs
  # from forks or CI contexts without GCP secrets). Without this, the
  # interpolated value is an empty string, producing "gcr.io//<image>:<tag>"
  # — an invalid Docker reference ("invalid reference format") that fails
  # `docker build` before the image can even be built for SBOM/CVE scanning.
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'cage-ci-placeholder' }}

permissions:
  contents: read
  # id-token: write is NOT required — no Workload Identity Federation used here.
  # SBOM upload uses the S3-compatible API with HMAC/access-key credentials.

jobs:
  sbom-scan:
    name: Generate SBOM and Scan for CVEs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # One leg per shipped Wolfi container image, mirroring scripts/build_images.sh.
        # The repo-root Dockerfile is the advisor, not the gateway.
        service:
          - name: governed-financial-advisor
            dockerfile: Dockerfile
            image_suffix: governed-financial-advisor
          - name: gateway
            dockerfile: src/gateway/Dockerfile
            image_suffix: gateway
          - name: compliance-bridge
            dockerfile: src/compliance_bridge/Dockerfile
            image_suffix: compliance-bridge
          - name: nemo-guardrails
            dockerfile: deployment/docker/Dockerfile.nemo
            image_suffix: nemo-guardrails
          - name: lula
            dockerfile: deployment/docker/Dockerfile.lula
            image_suffix: lula
          - name: inference-stub
            dockerfile: src/integrations/inference_stub/Dockerfile
            image_suffix: inference-stub
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        run: |
          TRIVY_VERSION="0.69.3"
          TRIVY_SHA256="1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 5 --retry-connrefused \
            -o "${RUNNER_TEMP}/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${RUNNER_TEMP}/trivy.tar.gz" | sha256sum -c -
          sudo tar -xzf "${RUNNER_TEMP}/trivy.tar.gz" -C /usr/local/bin trivy
          rm -f "${RUNNER_TEMP}/trivy.tar.gz"
          trivy --version

      - name: Set image tag
        id: tag
        env:
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_SUFFIX: ${{ matrix.service.image_suffix }}
        run: |
          echo "IMAGE_TAG=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REF=${REGISTRY}/${PROJECT_ID}/${IMAGE_SUFFIX}:${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build container image
        env:
          MATRIX_DOCKERFILE: ${{ matrix.service.dockerfile }}
          STEPS_TAG_OUTPUTS_IMAGE_REF: ${{ steps.tag.outputs.IMAGE_REF }}
        run: |
          docker build \
            -f "${MATRIX_DOCKERFILE}" \
            -t "${STEPS_TAG_OUTPUTS_IMAGE_REF}" \
            .

      # POAM-006: Generate CycloneDX SBOM for this container image
      - name: Generate CycloneDX SBOM
        env:
          SERVICE_NAME: ${{ matrix.service.name }}
          STEPS_TAG_OUTPUTS_IMAGE_REF: ${{ steps.tag.outputs.IMAGE_REF }}
        run: |
          trivy image \
            --format cyclonedx \
            --output "sbom-${SERVICE_NAME}.cdx.json" \
            "${STEPS_TAG_OUTPUTS_IMAGE_REF}"
          echo "✅ SBOM generated: sbom-${SERVICE_NAME}.cdx.json"

      # POAM-006: Fail if CRITICAL/HIGH CVEs are found (except .trivyignore allowlist)
      # --show-suppressed lists every .trivyignore match in the log, so stale
      # suppressions are auditable; it does not change the exit status.
      - name: Scan for CRITICAL CVEs
        env:
          STEPS_TAG_OUTPUTS_IMAGE_REF: ${{ steps.tag.outputs.IMAGE_REF }}
        run: |
          trivy image \
            --format table \
            --severity CRITICAL,HIGH \
            --ignorefile .trivyignore \
            --show-suppressed \
            --exit-code 1 \
            "${STEPS_TAG_OUTPUTS_IMAGE_REF}"
        continue-on-error: false  # Hard fail on CRITICAL CVEs

      - name: Upload SBOM as GitHub Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.service.name }}-${{ github.sha }}
          path: sbom-${{ matrix.service.name }}.cdx.json
          retention-days: 90

      # Upload SBOM to object storage via the S3-compatible API.
      # Storage credentials are scoped strictly to this single step (never job-wide)
      # so earlier build/scanner steps never execute with S3 secrets in env (CIG-04).
      - name: Upload SBOM to object storage (S3-compatible)
        id: s3_upload
        env:
          COMMIT_SHA: ${{ github.sha }}
          SERVICE_NAME: ${{ matrix.service.name }}
          SBOM_S3_BUCKET: ${{ secrets.SBOM_S3_BUCKET }}
          SBOM_S3_ENDPOINT: ${{ secrets.SBOM_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SBOM_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SBOM_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.SBOM_S3_REGION || 'auto' }}
        run: |
          if [ -z "${SBOM_S3_BUCKET}" ] || [ -z "${AWS_ACCESS_KEY_ID}" ]; then
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            echo "Skipping S3 upload (SBOM_S3_BUCKET / SBOM_S3_ACCESS_KEY not configured)."
          else
            DEST="s3://${SBOM_S3_BUCKET}/sboms/${COMMIT_SHA}/sbom-${SERVICE_NAME}.cdx.json"

            if [ -n "${SBOM_S3_ENDPOINT}" ]; then
              aws s3 cp \
                "sbom-${SERVICE_NAME}.cdx.json" \
                "$DEST" \
                --endpoint-url "${SBOM_S3_ENDPOINT}" \
                --no-progress
            else
              aws s3 cp \
                "sbom-${SERVICE_NAME}.cdx.json" \
                "$DEST" \
                --no-progress
            fi

            BACKEND="${SBOM_S3_ENDPOINT:-AWS S3}"
            echo "uploaded=true" >> "$GITHUB_OUTPUT"
            echo "backend=${BACKEND}" >> "$GITHUB_OUTPUT"
            echo "storage_prefix=s3://${SBOM_S3_BUCKET}/sboms/${COMMIT_SHA}/" >> "$GITHUB_OUTPUT"
            echo "✅ SBOM uploaded to $DEST"
          fi

      - name: Summary
        env:
          SERVICE_NAME: ${{ matrix.service.name }}
          STEPS_TAG_OUTPUTS_IMAGE_REF: ${{ steps.tag.outputs.IMAGE_REF }}
          S3_UPLOADED: ${{ steps.s3_upload.outputs.uploaded }}
          S3_BACKEND: ${{ steps.s3_upload.outputs.backend }}
          S3_STORAGE_PREFIX: ${{ steps.s3_upload.outputs.storage_prefix }}
        run: |
          echo "## SBOM Generation Summary — ${SERVICE_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${STEPS_TAG_OUTPUTS_IMAGE_REF}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SBOM Format | CycloneDX |" >> "$GITHUB_STEP_SUMMARY"
          echo "| POAM Reference | POAM-006 (CM-8 / ISO 42001 §A.8.3) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | \`sbom-${SERVICE_NAME}.cdx.json\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${S3_UPLOADED}" = "true" ]; then
            echo "| Storage backend | \`${S3_BACKEND}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Storage path | \`${S3_STORAGE_PREFIX}\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Storage backend | GitHub Artifact only (SBOM_S3_BUCKET not configured) |" >> "$GITHUB_STEP_SUMMARY"
          fi

