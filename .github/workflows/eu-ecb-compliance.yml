# DEP-13: EU_ECB compliance gate workflow.
# Runs EU AI Act, GDPR Art. 44, and DORA Art. 10 compliance checks.
# This workflow is SCOPED TO EU_ECB ONLY — it must not gate US_FED or APAC_MAS releases.
#
# Jurisdictional Hierarchy:
#   Universal: ISO 42001 (ci.yml)
#   EU_ECB:    EU AI Act / GDPR / DORA (this workflow)
#   US_FED:    NIST SP 800-53 / AI 600-1 / FedRAMP (security-scan.yml + ci.yml)
#   APAC_MAS:  MAS FEAT / Notice 655 / TRM (apac-mas-compliance.yml)

name: "EU_ECB Compliance Gate — EU AI Act / GDPR / DORA"

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "refactor/**"
      - "release/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Only run this workflow for EU_ECB deployments.
# If CAGE_DEPLOYMENT_REGION is not set, skip gracefully (not an EU_ECB deployment).

jobs:
  eu-ai-act-posture:
    name: "EU AI Act Compliance Posture (EU_ECB only)"
    runs-on: ubuntu-latest
    env:
      CAGE_DEPLOYMENT_REGION: EU_ECB

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: EU_ECB compliance posture checks
        # Validates EU AI Act Lula manifest structure, GDPR Art. 44 data residency,
        # DORA Art. 10 audit logging, SR 26-2 sentinel, and ISO 42001 universal manifests.
        # Full live lula validate runs post-cluster-provisioning.
        run: python3 scripts/check_eu_ecb_posture.py

  eu-ecb-iso42001-lula:
    name: "ISO 42001 Universal Lula Validation (EU_ECB context)"
    runs-on: ubuntu-latest
    needs: [eu-ai-act-posture]
    env:
      CAGE_DEPLOYMENT_REGION: EU_ECB

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate ISO 42001 universal Lula manifests (EU_ECB context)
        # ISO 42001 is a universal standard — applies to ALL regions including EU_ECB.
        # Only ISO 42001 and AARM (CSA) manifests are validated here.
        # NIST SP 800-53 (ac*, au*, cm*, ia*, ir*, ra*, sc*, si*) and
        # NIST AI 600-1 (ai600-*) are US_FED-scoped and must NOT be validated here.
        run: python3 scripts/check_eu_ecb_posture.py
