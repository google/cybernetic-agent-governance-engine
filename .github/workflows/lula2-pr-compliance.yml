name: Lula2 PR Compliance Crawler
# Cancel superseded runs for the same ref. Without this, the push +
# pull_request double-trigger consumes two identical sets of runners on
# every push to an open PR (measured: 23.3 duplicated job-minutes per push).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true


on:
  pull_request:
    # Only run when compliance-relevant paths change
    paths:
      - "compliance/**"
      - "src/gateway/governance/**"
      - "src/compliance_bridge/**"
      - "config/compliance/**"
      - "config/thresholds/**"
      - "config/oscal/**"
      - "deployment/k8s/**"
      - "infra/**"
      - ".github/workflows/**"

# Minimal permissions — only needs PR read + write for comments
permissions:
  contents: read
  pull-requests: write

jobs:
  lula2-crawl:
    name: "Lula2 Compliance Impact Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Verify compliance manifest and POAM integrity
        run: |
          python3 scripts/check_ai600_lula_manifests.py
          python3 scripts/check_poam_lula_divergence.py

      - name: Summarise compliance-impacting paths
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" | \
            grep -E "^(compliance/|src/gateway/governance/|src/compliance_bridge/|config/compliance/|config/thresholds/|config/oscal/|deployment/k8s/|infra/|\.github/workflows/)" || test $? -eq 1)
          if [ -n "$CHANGED" ]; then
            echo "Compliance-relevant files changed in this PR:"
            echo "$CHANGED"
          else
            echo "No compliance-relevant files changed."
          fi
