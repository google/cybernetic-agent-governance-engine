name: POAM Drift Check
# Cancel superseded runs for the same ref. Without this, the push +
# pull_request double-trigger consumes two identical sets of runners on
# every push to an open PR (measured: 23.3 duplicated job-minutes per push).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true


on:
  pull_request:
    paths:
      - 'docs/POAM.md'
      - 'docs/compliance/**'
      - 'compliance/lula/**'
      - 'compliance/oscal/**'
      - 'scripts/check_poam_lula_divergence.py'
      - 'scripts/check_oscal_claim_census.py'
      - 'tests/test_check_poam_lula_divergence.py'
      - 'tests/test_check_oscal_claim_census.py'
      - '.github/workflows/poam-drift.yml'
  push:
    branches: [main]
    paths:
      - 'docs/POAM.md'
      - 'docs/compliance/**'
      - 'compliance/lula/**'
      - 'compliance/oscal/**'
      - 'scripts/check_poam_lula_divergence.py'
      - 'scripts/check_oscal_claim_census.py'
      - 'tests/test_check_poam_lula_divergence.py'
      - 'tests/test_check_oscal_claim_census.py'
      - '.github/workflows/poam-drift.yml'

# Default least-privilege permissions for every job in this workflow.
permissions:
  contents: read

jobs:
  poam-drift:
    name: POAM vs Lula divergence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: 'pyproject.toml'
      - name: Sync dependencies
        run: uv sync --locked --group test --no-install-project
      - name: Run four-check POA&M closure & OSCAL claim gate (CE-1)
        run: |
          uv run python scripts/check_poam_lula_divergence.py
          uv run python scripts/check_oscal_claim_census.py --verify-rendered docs/compliance/OSCAL_EVIDENCE_CLAIM_REGISTER.md
      - name: Run gate contract & bypass-closure unit tests
        run: |
          uv run pytest --noconftest tests/test_check_poam_lula_divergence.py tests/test_check_oscal_claim_census.py -q --no-cov -p no:langsmith -p no:langsmith_plugin
