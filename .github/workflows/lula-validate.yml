name: Lula Validate
# Cancel superseded runs for the same ref. Without this, the push +
# pull_request double-trigger consumes two identical sets of runners on
# every push to an open PR (measured: 23.3 duplicated job-minutes per push).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true


on:
  push:
    paths:
      - 'src/**'
      - 'deployment/k8s/**'
      - 'compliance/lula/**'
  pull_request:
    paths:
      - 'src/**'
      - 'deployment/k8s/**'
      - 'compliance/lula/**'

# Default least-privilege permissions for every job in this workflow.
permissions:
  contents: read

jobs:
  lula-validate:
    name: Lula Compliance Assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate Lula manifest structure and POAM alignment
        run: |
          python3 scripts/check_ai600_lula_manifests.py
          python3 scripts/check_poam_lula_divergence.py
