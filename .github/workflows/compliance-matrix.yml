name: Compliance Matrix

# A live-deployment suite (POAM-2026-169, instance 6). Every Lula gate in
# scripts/run_matrix_tests.sh reads a running deployment: 23 manifests use
# Lula's Kubernetes domain and 10 call in-cluster service URLs, so none can be
# satisfied without one. Gate 0.3 queries the deployment's Langfuse instances,
# and EU_ECB's prod Gate 1.2 reads its cage-deployment ConfigMap. The script's
# hermetic phases are run on every pull request by other workflows
# (regional-posture.yml, the required OPA job in security-scan.yml, and ci.yml's
# EU_ECB bias evaluation and STPA freshness check).
#
# So this runs only on demand, against the deployment named by `deployment`: a
# GitHub Environment whose secrets hold that deployment's kubeconfig and
# Langfuse credentials. Without them the job fails before any gate runs. The
# API-domain manifests call in-cluster service URLs, which a GitHub-hosted
# runner cannot reach, so from one those gates fail too.
on:
  workflow_dispatch:
    inputs:
      deployment:
        description: "GitHub Environment holding the target deployment's credentials"
        type: string
        required: true
      region:
        description: "Jurisdiction the deployment must satisfy"
        type: choice
        options: [US_FED, EU_ECB, APAC_MAS]
        required: true
      cage_env:
        description: "Environment posture the deployment must satisfy"
        type: choice
        options: [dev, prod]
        required: true
      lula_version:
        description: "Lula binary version to install (defenseunicorns-labs/lula1)"
        type: string
        required: false
        default: "v0.16.0"

  workflow_call:
    inputs:
      deployment:
        type: string
        required: true
      region:
        type: string
        required: true
      cage_env:
        type: string
        required: true
      lula_version:
        type: string
        required: false
        default: "v0.16.0"

# One run at a time per deployment; a verification run is never cancelled.
concurrency:
  group: compliance-matrix-${{ inputs.deployment }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  # Lula (defenseunicorns-labs/lula1) is the Go CLI OSCAL compliance validator.
  # Binary releases: https://github.com/defenseunicorns-labs/lula1/releases
  # NOTE: github.com/defenseunicorns/lula is a separate TypeScript npm package (lula2).
  LULA_VERSION: ${{ inputs.lula_version || 'v0.16.0' }}

# Default least-privilege permissions for every job in this workflow.
# Without this block jobs inherit the (potentially broad) repository default,
# which zizmor flags as an excessive-permissions finding.
permissions:
  contents: read

jobs:
  live-posture:
    name: "Live Regional Posture (${{ inputs.region }} / ${{ inputs.cage_env }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The deployment's credentials are this Environment's secrets. GitHub
    # creates a missing Environment empty, and the next step then fails.
    environment: ${{ inputs.deployment }}

    env:
      CAGE_ENV: ${{ inputs.cage_env }}
      CAGE_REGION: ${{ inputs.region }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gate 0.2 compares `git log` commit times of STPA sources and artifacts.
          fetch-depth: 0
          persist-credentials: false

      - name: Require the deployment's credentials
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PROJECT_ID: ${{ vars.LANGFUSE_PROJECT_ID }}
          LANGFUSE_COMPLIANCE_HOST: ${{ secrets.LANGFUSE_COMPLIANCE_HOST }}
          LANGFUSE_COMPLIANCE_PUBLIC_KEY: ${{ secrets.LANGFUSE_COMPLIANCE_PUBLIC_KEY }}
          LANGFUSE_COMPLIANCE_SECRET_KEY: ${{ secrets.LANGFUSE_COMPLIANCE_SECRET_KEY }}
          LANGFUSE_COMPLIANCE_PROJECT_ID: ${{ vars.LANGFUSE_COMPLIANCE_PROJECT_ID }}
        run: |
          missing=()
          for name in KUBECONFIG_DATA GOOGLE_CLOUD_PROJECT \
              LANGFUSE_HOST LANGFUSE_PUBLIC_KEY LANGFUSE_SECRET_KEY LANGFUSE_PROJECT_ID \
              LANGFUSE_COMPLIANCE_HOST LANGFUSE_COMPLIANCE_PUBLIC_KEY \
              LANGFUSE_COMPLIANCE_SECRET_KEY LANGFUSE_COMPLIANCE_PROJECT_ID; do
            [ -n "${!name:-}" ] || missing+=("${name}")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Environment '${DEPLOYMENT}' does not provide ${missing[*]}. The suite checks a live deployment; nothing was checked."
            exit 1
          fi
          kubeconfig="${RUNNER_TEMP}/kubeconfig"
          ( umask 077 && printf '%s\n' "${KUBECONFIG_DATA}" > "${kubeconfig}" )
          echo "KUBECONFIG=${kubeconfig}" >> "${GITHUB_ENV}"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # scripts/run_matrix_tests.sh runs every Python step with `uv run`.
      # Until #636 the workflow never installed uv, so from 2026-07-08 every
      # regional run stopped at `uv: command not found` (POAM-2026-169).
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install project dependencies from uv.lock
        run: uv sync --frozen --all-groups --all-extras

      - name: Install Lula binary
        # Official Lula Go CLI (OSCAL validator): https://github.com/defenseunicorns-labs/lula1
        # NOTE: github.com/defenseunicorns/lula is a TypeScript npm package (lula2), not this tool.
        env:
          # Passed via env rather than interpolated directly into the script:
          # a `${{ }}` expansion is substituted before the shell runs, so a
          # value containing shell metacharacters would execute as code.
          LULA_VERSION: ${{ env.LULA_VERSION }}
        run: |
          LULA_URL="https://github.com/defenseunicorns-labs/lula1/releases/download/${LULA_VERSION}/lula_${LULA_VERSION}_Linux_amd64"
          echo "Installing lula ${LULA_VERSION} from defenseunicorns-labs/lula1..."
          curl -fsSL \
            -H "Authorization: token ${{ github.token }}" \
            "${LULA_URL}" -o /usr/local/bin/lula
          chmod +x /usr/local/bin/lula
          lula version

      - name: Install OPA binary (US_FED only)
        if: inputs.region == 'US_FED'
        env:
          # The version security-scan.yml's required OPA job runs the same
          # `opa test` with, so the two gates share one parser. `latest`
          # floats across major versions: it once resolved to OPA 1.x, which
          # rejected v0 rego that the required job accepted.
          OPA_VERSION: v0.61.0
          OPA_SHA256: 24a15b66a054b9e836a5dc1e07dff622999470eeb0c6e746340b4ccabde5663c
        run: |
          curl -fsSL \
            "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static" \
            -o /usr/local/bin/opa
          echo "${OPA_SHA256}  /usr/local/bin/opa" | sha256sum -c -
          chmod +x /usr/local/bin/opa
          opa version

      - name: Run the live posture suite
        run: bash scripts/run_matrix_tests.sh "${CAGE_ENV}" "${CAGE_REGION}"
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PROJECT_ID: ${{ vars.LANGFUSE_PROJECT_ID }}
          LANGFUSE_COMPLIANCE_HOST: ${{ secrets.LANGFUSE_COMPLIANCE_HOST }}
          LANGFUSE_COMPLIANCE_PUBLIC_KEY: ${{ secrets.LANGFUSE_COMPLIANCE_PUBLIC_KEY }}
          LANGFUSE_COMPLIANCE_SECRET_KEY: ${{ secrets.LANGFUSE_COMPLIANCE_SECRET_KEY }}
          LANGFUSE_COMPLIANCE_PROJECT_ID: ${{ vars.LANGFUSE_COMPLIANCE_PROJECT_ID }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compliance-results-${{ inputs.region }}-${{ inputs.cage_env }}
          path: |
            compliance-results/
            pytest-results/
          if-no-files-found: ignore
          retention-days: 30
