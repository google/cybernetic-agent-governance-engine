# Healthcare domain STPA hazards (PR D)
# Illustrative dosing hazards for the healthcare plugin

domain: healthcare
version: "1.0"

hazards:
  - id: H-HEALTH-1
    description: "Toxic dose administered (overdose)"
    severity: critical
    consequence: "Patient harm from excessive medication"

  - id: H-HEALTH-2
    description: "Subtherapeutic dose administered (underdose)"
    severity: high
    consequence: "Ineffective treatment, disease progression"

  - id: H-HEALTH-3
    description: "Contraindicated medication administered"
    severity: critical
    consequence: "Adverse drug reaction, patient harm"

unsafe_control_actions:
  - id: UCA-HEALTH-1
    hazard_link: H-HEALTH-1
    description: "Administer dose when serum concentration exceeds safe threshold"
    detection_pattern: "action='administer_dose' AND dose_mg > max_safe_concentration"
    control_action: "Block dosing when barrier violated"

  - id: UCA-HEALTH-2
    hazard_link: H-HEALTH-2
    description: "Administer dose when serum concentration below therapeutic minimum"
    detection_pattern: "action='administer_dose' AND dose_mg < min_therapeutic_concentration"
    control_action: "Alert clinician, recommend adjustment"

  - id: UCA-HEALTH-3
    hazard_link: H-HEALTH-3
    description: "Administer contraindicated medication"
    detection_pattern: "action='administer_dose' AND contraindication_detected=true"
    control_action: "Block and escalate to clinical review"
