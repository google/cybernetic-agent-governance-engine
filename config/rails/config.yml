models:
  - type: main
    engine: vllm_llama
    # NOTE: This model name is overridden at runtime by create_nemo_manager()
    # using the GUARDRAILS_MODEL_NAME environment variable. Do not rely on this value.
    model: ${GUARDRAILS_MODEL_NAME:-deepseek-ai/DeepSeek-R1-Distill-Llama-8B}

colang_version: "2.x"

instructions:
  - type: general
    content: |
      You are a helpful financial advisor assistant.
      You must adhere to strict safety guidelines.

# Sensitive data detection (PII masking) entity list.
# mask_sensitive_data() in the NeMo library short-circuits and returns the
# original text unchanged when entities is empty, so we must declare them here.
rails:
  input:
    flows:
      - self check input
  output:
    flows: []
  config:
    sensitive_data_detection:
      input:
        entities:
          - PERSON
          - EMAIL_ADDRESS
          - PHONE_NUMBER
          - CREDIT_CARD
          - US_SSN
          - US_BANK_NUMBER
          - IBAN_CODE
          - IP_ADDRESS
          - DATE_TIME
          - LOCATION
        score_threshold: 0.3
      output:
        entities:
          - PERSON
          - EMAIL_ADDRESS
          - PHONE_NUMBER
          - CREDIT_CARD
          - US_SSN
          - US_BANK_NUMBER
          - IBAN_CODE
          - IP_ADDRESS
          - DATE_TIME
          - LOCATION
        score_threshold: 0.3
