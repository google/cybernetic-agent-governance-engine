version: "3.8"

services:
  # OPA: Policy Engine
  opa:
    image: openpolicyagent/opa:0.70.0-static
    command:
      - "run"
      - "--server"
      - "--log-level=info"
      - "--addr=:8181"
      - "--ignore=.*"
      - "/policies"
    volumes:
      # Mount ONLY the active domain's Rego bundle (single-domain-per-process
      # isolation matching deployment/k8s/opa.yaml: finance mounts
      # cage_finance/opa, healthcare mounts cage_healthcare/opa).
      - ./src/cage_${CAGE_DOMAIN:-finance}/opa:/policies:ro
    ports:
      # HIGH-01 FIX: Restrict OPA to localhost only — prevents unauthenticated
      # access from external processes on the host. Inter-service communication
      # within the Docker network uses the internal port directly (no host binding needed).
      - "127.0.0.1:8181:8181"
    healthcheck:
      test: [ "CMD", "/opa", "check", "--ignore=.*", "/policies" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Gateway (Hybrid Server with NeMo) — immutable baked image
  gateway:
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    command: [ "python", "src/gateway/server/hybrid_server.py" ]
    ports:
      # GHSA-4x3x-w2m3-8mfh: Restrict gateway host binding to localhost only.
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - OPA_URL=http://opa:8181
      - OPA_AUTH_TOKEN=${OPA_AUTH_TOKEN:-dev-opa-token}
      - CAGE_DOMAIN=${CAGE_DOMAIN:-finance}
      - CAGE_ENV=${CAGE_ENV:-development}
      - EVIDENCE_STREAM_ENABLED=${EVIDENCE_STREAM_ENABLED:-false}
      - EVIDENCE_CHAIN_BLOCKING=${EVIDENCE_CHAIN_BLOCKING:-false}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://vllm-fast:8000/v1}
      - VLLM_API_KEY=${VLLM_API_KEY:-dev-local}
      - CAGE_TRUSTED_CLIENT_IDENTITIES=${CAGE_TRUSTED_CLIENT_IDENTITIES:-cage-advisor-sa.governance-stack.serviceaccount.identity.linkerd.cluster.local}
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-none}
      # v0.1.0 REQUIRED: ControlRegistry regional compliance profile selector.
      # Override in .env: CAGE_DEPLOYMENT_REGION=EU_ECB
      # Supported values: US_FED | EU_ECB | APAC_MAS
      - CAGE_DEPLOYMENT_REGION=${CAGE_DEPLOYMENT_REGION:-US_FED}
    # No live src mount — image must be rebuilt on code change (Phase 6.2).
    # HIGH-03 FIX: Use env_file instead of mounting .env as a volume. Mounting
    # .env as a volume exposes all secrets to any process that can read the
    # container filesystem; env_file injects only the declared env vars.
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      opa:
        condition: service_healthy

  # Main Agent Service — optional finance reference application (`--profile advisor`)
  app:
    profiles: ["advisor"]
    build: .
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-us-central1}
      - OPA_URL=http://opa:8181
      - OPA_AUTH_TOKEN=${OPA_AUTH_TOKEN:-dev-opa-token}
      - MODEL_FAST=${MODEL_FAST:?MODEL_FAST must be set in the environment}
      - MODEL_REASONING=${MODEL_REASONING:?MODEL_REASONING must be set in the environment}
      - VLLM_FAST_API_BASE=http://vllm-fast:8000/v1
      - GATEWAY_HOST=gateway
      - GATEWAY_PORT=8080
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-none}
      # v0.1.0 REQUIRED: must match the gateway service's CAGE_DEPLOYMENT_REGION.
      - CAGE_DEPLOYMENT_REGION=${CAGE_DEPLOYMENT_REGION:-US_FED}
    # No live src mount — image must be rebuilt on code change (Phase 6.2).
    # HIGH-03 FIX: Use env_file instead of mounting .env as a volume. Mounting
    # .env as a volume exposes all secrets to any process that can read the
    # container filesystem; env_file injects only the declared env vars.
    env_file:
      - .env
    depends_on:
      gateway:
        condition: service_healthy
