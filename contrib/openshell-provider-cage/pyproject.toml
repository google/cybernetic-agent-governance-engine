[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openshell-provider-cage"
version = "0.1.0"
description = "NVIDIA OpenShell PolicyProvider SPI plugin for CAGE (Cybernetic Agent Governance Engine)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "CAGE Contributors", email = "cage-governance@google.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
]

[project.entry-points."openshell.policy_providers"]
cage = "openshell_provider_cage.provider:CagePolicyProvider"

[tool.hatch.build.targets.wheel]
packages = ["src/openshell_provider_cage"]
