[project]
name = "cybernetic-governance-engine"
version = "0.2.0"
description = "CAGE — Cybernetic AI Governance Engine"
authors = [{ name = "OSS Maintainer", email = "oss-maintainer@example.com" }]
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    # Core: truly universal deps used across all services
    "pydantic>=2.10.6",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "python-json-logger>=2.0.7",
    "cachetools>=5.5.0",
    "nest-asyncio>=1.6.0",
    "redis>=5.0.0",
    "litellm>=1.0.0",
    # Core OTEL — shared across gateway, advisor, compliance
    "opentelemetry-api>=1.38.0",
    "opentelemetry-sdk>=1.38.0",
    "opentelemetry-exporter-otlp>=1.38.0",
    "opentelemetry-semantic-conventions-ai>=0.4.0",
    # HTTP serving — used by gateway AND compliance_bridge
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sse-starlette>=1.0.0",
    "openai>=1.0.0",
    "cryptography>=48.0.1",
    "pytest-cov>=7.1.0",
]

requires-python = ">=3.10,<3.13"

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.7",
    "nest-asyncio>=1.6.0",
    "respx>=0.22.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "pip-licenses>=5.0.0",
    "pip-audit>=2.10.0",
    "fakeredis[lua]>=2.35.1",
    "pytest-timeout>=2.4.0",
    "bcrypt>=5.0.0",
    # kfp: Kubeflow Pipelines SDK — required by test_pipeline_compilation.py
    "kfp>=2.0,<3.0",
]

deployment = [
    "absl-py>=2.2.1",
]

[project.optional-dependencies]

gateway = [
    "grpcio>=1.78.0",
    "protobuf>=5.26.1,<7.0.0",
    "mcp>=0.1.0",
    "nemoguardrails>=0.20.0,<1.0.0",
    # NOTE: 'outlines' was removed — CVE-2025-69872 (diskcache pickle RCE).
    # The guided_json FSM decoder runs server-side inside vLLM, not client-side.
    # CAGE never imports the outlines package; vLLM bundles its own copy.
    "presidio-analyzer>=2.2.361",
    "presidio-anonymizer>=2.2.361",
    "spacy>=3.8.11",
    "en-core-web-sm",
    "opentelemetry-instrumentation-fastapi>=0.58b0",
    "opentelemetry-instrumentation-requests>=0.58b0",
]

advisor = [
    "langgraph>=1.1.0",
    "langgraph-checkpoint-redis",
    # langchain>=1.3.9: fixes GHSA-gr75-jv2w-4656 (prompt injection via
    # tool-call message deserialization). Minimum bumped from 1.1.0.
    "langchain>=1.3.9",
    "langchain-core>=1.1.0",
    "langchain-openai>=0.1.0",
    "langchain-mcp-adapters>=0.2.0",
    "yfinance>=0.2.0",
    "tabulate>=0.9.0",
    "opentelemetry-instrumentation-langchain>=0.52.0",
    # Previously pip-installed outside uv in root Dockerfile — now declared here
    "opentelemetry-exporter-gcp-trace",
    "google-adk>=1.28.1",
]

compliance = [
    # From src/compliance_bridge/requirements.txt — previously pip-only
    # google-cloud-storage: native GCS SDK for GCP/GKE deployments (ADC / Workload Identity)
    "google-cloud-storage>=2.0.0",
    # boto3: retained as S3-compat fallback for AWS / MinIO / Cloudflare R2 targets
    # (activated via STORAGE_BACKEND=s3 env var; not used in GCP/GKE posture)
    "boto3>=1.35.0",
    "PyYAML>=6.0.0",
    # dowhy: causal gatekeeper (Tier 6) — required by compliance-bridge defer queue
    # (No-Direct-Bind Gap 4). Moved from gateway extras so the compliance-bridge
    # image picks it up via --extra compliance without pulling all gateway deps.
    "dowhy>=0.12",
]

langfuse = [
    # From src/compliance_bridge/requirements.txt — previously pip-only
    "langfuse>=2.0.0",
]

slm = [
    # SLM Flask sidecar — moved from core mandatory deps
    "flask>=3.0.0",
    "sentence-transformers>=3.0.0",
]

lint = [
    "ruff>=0.4.6",
    "mypy>=1.15.0",
    "codespell>=2.2.0",
    "types-pyyaml>=6.0.12.20240917",
    "types-requests>=2.32.0.20240914",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "local: safe to run with no live services (CI default)",
    "unit: pure unit test, no I/O",
    "integration: requires live services via port-forward",
    "gke: requires live GKE cluster",
    "slow: long-running test (timeout >= 300s)",
    "regression: regression guard",
    "us_fed: US_FED region-specific test",
    "eu_ecb: EU_ECB region-specific test",
    "apac_mas: APAC_MAS region-specific test",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901"] # ignore line too long, too complex

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
disallow_subclassing_any = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
follow_imports = "silent"
ignore_missing_imports = true
explicit_package_bases = true
disable_error_code = ["misc", "no-untyped-call", "no-any-return"]

exclude = [".venv"]

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/*.ipynb"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
