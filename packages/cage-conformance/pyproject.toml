[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cage-conformance"
version = "0.4.2"
description = "Standalone conformance verifier for CAGE governance traces, evidence streams, and live endpoints"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Google LLC" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
# Standard library only: an auditor can verify without trusting third-party code.
dependencies = []

[project.optional-dependencies]
# Checking an attestation's RS256 signature is the one step that needs it.
attest = ["cryptography>=42"]

[project.scripts]
cage-conformance = "cage_conformance.cli:main"

[project.urls]
Repository = "https://github.com/google/cybernetic-agent-governance-engine"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cage_conformance = ["py.typed", "parties.json", "vectors/*.json"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.cage.release]
# Enforced by scripts/check_conformance_sync.py:
#   - "unreleased": version must be strictly newer than the latest conformance-v* tag,
#     and tag conformance-v<version> must not yet exist.
#   - "published": tag conformance-v<version> must exist and match
#     packages/cage-conformance/src/cage_conformance/ byte-for-byte (zero post-tag drift).
status = "unreleased"
