[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cage-client"
version = "0.2.0"
description = "Lightweight LangGraph / LangChain PEP Client for CAGE Governance Gateway"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Google LLC" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
]
http2 = [
    "h2>=4.1.0",
]
all = [
    "cage-client[langgraph,http2]",
]

[project.urls]
Homepage = "https://github.com/google/cybernetic-agent-governance-engine"
Repository = "https://github.com/google/cybernetic-agent-governance-engine"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cage_client = ["py.typed"]

