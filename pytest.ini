[pytest]
testpaths = tests src/integrations
addopts = --strict-markers -v --tb=short
markers =
    local: Unit tests and logic checks that require no external infrastructure.
    unit: Alias for local — pure logic, no I/O or network calls.
    integration: Tests requiring live external services (backend, vLLM, Langfuse). Pass --run-integration to enable.
    regression: Factual "Golden Questions" to verify model behavior after updates.
    slow: Tests that take a significant amount of time (>30 s). May be excluded with -m "not slow".
    red_team: Adversarial / prompt-injection tests for red-teaming the governance layer.
    load: Load and stress tests — typically run in CI with dedicated infra.
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:langchain.*
    ignore::DeprecationWarning:opentelemetry.*
    ignore::PendingDeprecationWarning
    ignore::UserWarning:pydantic.*
