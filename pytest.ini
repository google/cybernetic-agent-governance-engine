[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
addopts = -n auto --dist=loadfile --strict-markers --tb=short --timeout=30 --timeout-method=thread -p no:warnings --cov=src --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=70
markers =
    local: local-only tests
    unit: unit tests
    integration: integration tests requiring live services
    regression: regression tests
    slow: slow tests (>10s)
    chaos: chaos tests for failover scenarios (use --run-chaos to enable)
    red_team: adversarial/red-team tests
    load: load tests (use locust)
    eu_ecb: EU_ECB region-specific tests
    us_fed: US_FED region-specific tests
    apac_mas: APAC_MAS region-specific tests
