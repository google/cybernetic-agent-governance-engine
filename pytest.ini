[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = module
asyncio_default_test_loop_scope = module
addopts = -n auto --dist loadscope --strict-markers --tb=short --timeout=120 --timeout-method=thread -p no:warnings -p no:langsmith
markers =
    local: local-only tests
    unit: unit tests
    integration: integration tests requiring live services
    live_external: tests that hit external partner APIs (use --run-live-external to enable)
    regression: regression tests
    slow: slow tests (>10s)
    chaos: chaos tests for failover scenarios (use --run-chaos to enable)
    red_team: adversarial/red-team tests
    load: load tests (use locust)
    eu_ecb: EU_ECB region-specific tests
    us_fed: US_FED region-specific tests
    apac_mas: APAC_MAS region-specific tests
    layer_isolation: layer isolation tests (PR B, gate G3)
    healthcare: healthcare domain plugin tests
    financial: financial domain plugin tests
