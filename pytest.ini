[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
addopts = --strict-markers --tb=short --timeout=90 --timeout-method=thread -p no:warnings
markers =
    local: local-only tests
    unit: unit tests
    integration: integration tests requiring live services
    regression: regression tests
    slow: slow tests (>10s)
    red_team: adversarial/red-team tests
    load: load tests (use locust)
